    for(var j=0;j<pk.length;j++){try{var s=await fbDb.ref(mod.p[pk[j]].r).once('value');var v=s.val();if(v!==null)md[pk[j]]=v;}catch(e){}}
    var h=sH(JSON.stringify(md));if(h===lastH[n]&&trig!=='Forcée'){mS[n]='ok';renderM();continue;}lastH[n]=h;
    try{var mf=await root.getDirectoryHandle(n,{create:true});var fn=day+'_'+ts+'.json';var c=JSON.stringify({module:n,backup:{date:day,heure:ts,trigger:trig,user:fbUser?fbUser.email:'?'},data:md},null,2);var fh=await mf.getFileHandle(fn,{create:true});var w=await fh.createWritable();await w.write(new Blob([c],{type:'application/json'}));await w.close();var mb=(c.length/(1024*1024)).toFixed(1);tf++;tb+=c.length;mS[n]='ok';mZ[n]=mb+'M';lg('  ✅ '+n+' '+mb+'M','ok');}catch(e){mS[n]='err';hasError=true;lg('  ❌ '+n,'err');}renderM();
  }
  if(tf>0){localStorage.setItem('bk_last',new Date().toISOString());lg('✅ '+tf+' mod ('+(tb/(1024*1024)).toFixed(1)+'M)','ok');toast('✅ '+tf+' sauvegardés','ok');var tk='bk_td_'+day;var td=JSON.parse(localStorage.getItem(tk)||'[]');td.push(ts);localStorage.setItem(tk,JSON.stringify(td));}else{lg('— Aucun chang.','t');}upUI();upS();
}
function sH(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(36);}

async function doRestore(){if(!confirm('⚠️ RESTAURER?\nÉcrasera Firebase.'))return;if(!window.showDirectoryPicker)return;try{var dir=await window.showDirectoryPicker({id:'pr',mode:'read'});var bD;try{bD=await dir.getDirectoryHandle('PhysiPro_Backups');}catch(e){bD=dir;}lg('📥 Restauration','info');var c=0;for await(var en of bD.values()){if(en.kind!=='directory')continue;var mod=M[en.name];if(!mod)continue;var la=null,ln='';for await(var f of en.values()){if(f.kind==='file'&&f.name.endsWith('.json')&&f.name>ln){la=f;ln=f.name;}}if(!la)continue;var o=await la.getFile();var d=JSON.parse(await o.text()).data||{};for(var k of Object.keys(mod.p)){if(d[k]!==undefined){await fbDb.ref(mod.p[k].r).set(d[k]);c++;}}lg('  ✅ '+en.name,'ok');}lg('📥 '+c+' sections','ok');toast('📥 Restauré','ok');}catch(e){lg('❌ '+e.message,'err');}}

function upUI(){
  var btn=document.getElementById('onoff');
  if(isOn&&hasError){btn.className='onoff-btn warn';btn.textContent='ON ⚠️';}
  else if(isOn){btn.className='onoff-btn on';btn.textContent='ON';}
  else{btn.className='onoff-btn off';btn.textContent='OFF';}
  var fn=document.getElementById('fN'),fb=document.querySelector('.fb');
  if(dirH){fn.textContent=dirH.name;fn.className='fn';fb.textContent='Changer';}else{fn.textContent='Aucun dossier';fn.className='fn e';fb.textContent='Choisir';}
  var last=localStorage.getItem('bk_last'),sl=document.getElementById('slD');
  if(last){var d=new Date(last);sl.textContent=d.toLocaleDateString('fr-CA')+' '+d.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});}else{sl.textContent='Jamais';}
}
function upS(){var day=new Date().toISOString().substring(0,10),done=JSON.parse(localStorage.getItem('bk_td_'+day)||'[]'),h=new Date().getHours();document.getElementById('sdO').className='sd '+(done.length>0?'done':(isOn?'next':'wait'));document.getElementById('sd11').className='sd '+(done.some(function(t){return t.startsWith('11');})?'done':(isOn&&h<11?'next':'wait'));document.getElementById('sd14').className='sd '+(done.some(function(t){return t.startsWith('14');})?'done':(isOn&&h<14?'next':'wait'));}
window.addEventListener('online',function(){document.getElementById('offBar').style.display='none';});
window.addEventListener('offline',function(){document.getElementById('offBar').style.display='block';});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeNav();});
upS();
</script>
