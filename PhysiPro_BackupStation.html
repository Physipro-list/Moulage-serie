  var day=new Date().toISOString().substring(0,10),ts=new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}).replace(':','h');
  lg('═ ['+trig+'] ═','info');hasError=false;
  var root=dirH; // les modules vont directement dans le dossier choisi (ex: "Back up logiciel")
  var tf=0,tb=0,mk=Object.keys(M);
  for(var i=0;i<mk.length;i++){
    var n=mk[i],mod=M[n],md={},pk=Object.keys(mod.p);mS[n]='run';renderM();
    for(var j=0;j<pk.length;j++){try{var s=await fbDb.ref(mod.p[pk[j]].r).once('value');var v=s.val();if(v!==null)md[pk[j]]=v;}catch(e){}}
    var h=sH(JSON.stringify(md));if(h===lastH[n]&&trig!=='Forcée'){mS[n]='ok';renderM();continue;}lastH[n]=h;
    try{if(n==='Moulages'){/* Pas de JSON pour Moulages: l'archive Fiche.html (archiveMoulages) fait le travail */mS[n]='ok';mZ[n]='fiches';lg('  ✅ Moulages → fiches seulement (pas de JSON)','ok');}else{var mf=await root.getDirectoryHandle(n,{create:true});var fn=day+'_'+ts+'.json';var c=JSON.stringify({module:n,backup:{date:day,heure:ts,trigger:trig,user:fbUser?fbUser.email:'?'},data:md},null,2);var fh=await mf.getFileHandle(fn,{create:true});var w=await fh.createWritable();await w.write(new Blob([c],{type:'application/json'}));await w.close();try{await xlsWriteModule(mf,n,md);}catch(_x){console.error('xlsx '+n,_x);}var mb=(c.length/(1024*1024)).toFixed(1);tf++;tb+=c.length;mS[n]='ok';mZ[n]=mb+'M';lg('  ✅ '+n+' '+mb+'M','ok');}}catch(e){mS[n]='err';hasError=true;lg('  ❌ '+n,'err');}renderM();
  }
  if(tf>0){localStorage.setItem('bk_last',new Date().toISOString());lg('✅ '+tf+' mod ('+(tb/(1024*1024)).toFixed(1)+'M)','ok');toast('✅ '+tf+' sauvegardés','ok');var tk='bk_td_'+day;var td=JSON.parse(localStorage.getItem(tk)||'[]');td.push(ts);localStorage.setItem(tk,JSON.stringify(td));}else{lg('— Aucun chang.','t');}
  try{await archiveMoulages(trig);}catch(e){lg('  ⚠️ Archive Moulage: '+e.message,'err');hasError=true;}
  try{await archiveQuestionnements(trig);}catch(e){lg('  ⚠️ Archive Questionnements: '+e.message,'err');hasError=true;}
  upUI();upS();
}
function sH(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(36);}

async function doRestore(){if(!confirm('⚠️ RESTAURER?\nÉcrasera Firebase.'))return;if(!window.showDirectoryPicker)return;try{var dir=await window.showDirectoryPicker({id:'pr',mode:'read'});var bD=dir;lg('📥 Restauration','info');var c=0;for await(var en of bD.values()){if(en.kind!=='directory')continue;var mod=M[en.name];if(!mod)continue;var la=null,ln='';for await(var f of en.values()){if(f.kind==='file'&&f.name.endsWith('.json')&&f.name>ln){la=f;ln=f.name;}}if(!la)continue;var o=await la.getFile();var d=JSON.parse(await o.text()).data||{};for(var k of Object.keys(mod.p)){if(d[k]!==undefined){await fbDb.ref(mod.p[k].r).set(d[k]);c++;}}lg('  ✅ '+en.name,'ok');}lg('📥 '+c+' sections','ok');toast('📥 Restauré','ok');}catch(e){lg('❌ '+e.message,'err');}}

/* ═══════════════════════════════════════════════════════════════════
   ARCHIVAGE MOULAGE → ONEDRIVE  (v2)
   Pour CHAQUE moulage : un dossier "Commande - Nom" contenant
   Fiche.html (toutes les infos + discussions + galerie photos) et un
   sous-dossier Photos/ avec les VRAIES photos :
     • sidebar  (téléchargées de Firebase Storage)
     • chat     (base64 collées dans les discussions)
     • archive  (envoyées du mobile, nœud photoArchives)
   Maintenu par la station à chaque cycle. NON destructif : n'efface
   jamais rien dans Firebase.
   ═══════════════════════════════════════════════════════════════════ */
function mlgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mlgSanFolder(s){return (String(s==null?'':s).replace(/[\\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().substring(0,120))||'sans-nom';}
function mlgSanFile(s){return (String(s==null?'':s).replace(/[^a-zA-Z0-9._-]/g,'_').substring(0,80))||'photo.jpg';}
function mlgColName(id){var c={colRobot:'⚙️ Robot',colDegauchage:'🪚 Dégauchage',colEssayage:'👔 Essayage',colAtelier:'🔧 Atelier',colCouture:'🧵 Couture',colPeinture:'🎨 Peinture',colExpedition:'📦 Expédition',colAttente:'⏳ En attente'};return c[id]||id||'—';}
function mlgB64ToBlob(d){try{var p=String(d).split(',');var m=(p[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';var bin=atob(p[1]);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m});}catch(e){return null;}}
function mlgBlobToDataURL(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error('read'));};r.readAsDataURL(blob);});}
function mlgPad(n){return (n<10?'00':n<100?'0':'')+n;}

  var seen={},uniq=[];(gallery||[]).forEach(function(f){var n=(f&&f.n)?f.n:f;if(!seen[n]){seen[n]=1;uniq.push(f);}});
  var gal=uniq.length?'<div class="gal">'+uniq.map(function(f){var src=(f&&f.src)?f.src:f;return '<img class="z" src="'+src+'" loading="lazy">';}).join('')+'</div>':'<div class="empty">Aucune photo</div>';
  var title=esc((card.order||'')+(card.name?' — '+card.name:''));

async function archiveMoulages(trig){
  if(!dirH)return;
  var mlgCorsHint=false;
  var moulages={},pArch={};
  try{moulages=(await fbDb.ref('moulages').once('value')).val()||{};}catch(e){return;}
  try{pArch=(await fbDb.ref('photoArchives').once('value')).val()||{};}catch(e){}
  // Regrouper les photos d'archive mobile par cardId
  var archByCard={};
  Object.keys(pArch).forEach(function(k){var d=pArch[k];if(!d||!d.cardId)return;(d.photos||[]).forEach(function(p){if(p&&p.data){(archByCard[d.cardId]=archByCard[d.cardId]||[]).push(p.data);}});});
  var aroot;
  try{aroot=await dirH.getDirectoryHandle('Moulages',{create:true});}catch(e){lg('  ⚠️ Dossier Moulages: '+e.message,'err');return;}
  var ids=Object.keys(moulages),done=0;
  for(var i=0;i<ids.length;i++){
    var cid=ids[i],card=moulages[cid];
    if(!card||card.isNote)continue;
    if(!card.order&&!card.name)continue;
    try{
      var folder=mlgSanFolder((card.order||'SANS-NUM')+' - '+(card.name||'Sans nom'));
      var mf=await aroot.getDirectoryHandle(folder,{create:true});

      // ── Étape légère : noms des photos sidebar + comptage chat/archive (pas de téléchargement) ──
      var order=card.order||'',sbItems=[],sbNames=[];
      if(order){
        try{var res=await fbStorage.ref('photos/moulages/'+order).listAll();sbItems=res.items;}catch(e){lg('  ⚠️ Liste photos '+order+': '+e.message,'warn');}
        sbItems.forEach(function(it){var fn=mlgSanFile(it.name);if(!/\.(jpg|jpeg|png|webp|gif|heic)$/i.test(fn))fn+='.jpg';sbNames.push(fn);});
      }
      // Photos collées dans les discussions (déjà en base64, en mémoire)
      var extra=[],ci=0,msgs=card.messages||[];
      for(var m=0;m<msgs.length;m++){
        var msg=msgs[m];var imgs=[];
        if(msg.image)imgs.push(msg.image);
        if(msg.images&&msg.images.length)imgs=imgs.concat(msg.images);
        msg.__photos=[];
        for(var x=0;x<imgs.length;x++){
          if(typeof imgs[x]!=='string'||imgs[x].indexOf('data:')!==0)continue;
          ci++;msg.__photos.push(imgs[x]);extra.push({n:'chat_'+mlgPad(ci),src:imgs[x]});
        }
      }
      // Photos d'archive mobile (déjà en base64)
      var ai=0,arr=archByCard[cid]||[];
      for(var a=0;a<arr.length;a++){
        if(typeof arr[a]!=='string'||arr[a].indexOf('data:')!==0)continue;
        ai++;extra.push({n:'archive_'+mlgPad(ai),src:arr[a]});
      }

      // ── Signature : ne régénère que si quelque chose a changé ──
      var sig='v16|'+sH(JSON.stringify(card))+'|'+sbNames.slice().sort().join(',')+'|c'+ci+'|a'+ai;
      var hk='mlg_h_'+cid;
      if(localStorage.getItem(hk)===sig&&trig!=='Forcée')continue;

      // ── Étape lourde (seulement si changé) : télécharger les photos sidebar → base64 ──
      var sbGallery=[],sbFail=0;
      for(var s=0;s<sbItems.length;s++){
        var it=sbItems[s];
        try{
          var bl=null;
          if(it.getBlob){try{bl=await it.getBlob();}catch(_g){bl=null;}}
          if(!bl){var url=await it.getDownloadURL();var rp=await fetch(url);if(!rp.ok)throw new Error('HTTP '+rp.status);bl=await rp.blob();}
          var durl=await mlgBlobToDataURL(bl);
          sbGallery.push({n:sbNames[s],src:durl});
        }catch(e){
          sbFail++;mlgCorsHint=mlgCorsHint||/cors|failed to fetch|network/i.test(e.message);
          try{var ru=await it.getDownloadURL();sbGallery.push({n:sbNames[s],src:ru});}catch(_u){}
        }
      }
      if(sbFail>0)lg('  ⚠️ '+order+': '+sbFail+' photo(s) sidebar non récupérée(s)','warn');

      // ── Fiche.html (photos intégrées) ──
      var gallery=sbGallery.concat(extra);
      var html=mlgBuildFiche(card,gallery);
      var fhF=await mf.getFileHandle('Fiche.html',{create:true});var wF=await fhF.createWritable();await wF.write(new Blob([html],{type:'text/html'}));await wF.close();

      // ── Nettoyage : retirer l'ancien sous-dossier Photos (photos désormais dans la fiche) ──
      try{await mf.removeEntry('Photos',{recursive:true});}catch(_e){}

      // ── Drapeau de confirmation dans Firebase → marque "archivé" côté Moulage (Expédition) ──
      // complete = toutes les photos sidebar intégrées (sbFail===0) → archive permanente fiable.
      try{
        await fbDb.ref('moulages/'+cid+'/oneDrive').set({
          archived:true,
          complete:(sbFail===0),
          nbPhotos:gallery.length,
          nbManquantes:sbFail,
          folder:folder,
          date:new Date().toISOString().substring(0,10),
          at:Date.now()
        });
      }catch(e){lg('  ⚠️ Drapeau OneDrive '+(card.order||cid)+': '+e.message,'warn');}

      localStorage.setItem(hk,sig);done++;
    }catch(e){lg('  ⚠️ '+(card.order||cid)+': '+e.message,'err');}
  }
  if(done>0)lg('  🏭 '+done+' moulage(s) → OneDrive','ok');
  if(mlgCorsHint)lg('  ℹ️ Certaines photos sidebar via lien (déblocage Firebase requis)','warn');
}

/* ═══════════════════════════════════════════════════════════════════
   ARCHIVAGE QUESTIONNEMENTS → ONEDRIVE  (v15)
   Lit questHistory/<agent>/<id> (conversation + photos déjà intégrées par
   le module Questionnements) et écrit dans le dossier OneDrive :
     Questionnements_Historique/
       _TOUS_les_questionnements.html   ← tableau global (tout voir d'un coup)
       _questHistory_complet.json       ← sauvegarde brute (restauration)
       <Agent>/<commande - client>.html ← une fiche par questionnement
   NON destructif : n'efface jamais rien dans Firebase.
   ═══════════════════════════════════════════════════════════════════ */
function qhEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function qhSan(s){return (String(s==null?'':s).replace(/[\\\/:*?"<>|#]/g,'-').replace(/\s+/g,' ').trim().substring(0,120))||'sans-nom';}
function qhArr(x){if(!x)return [];if(Array.isArray(x))return x;return Object.keys(x).map(function(k){return x[k];});}
function qhStatusLabel(s){return s==='resolved'?'✅ Réglé':(s==='purged'?'📦 Archivé':(s==='deleted'?'🗑️ Supprimé':'—'));}

function qhLbScript(){
  return '<scr'+'ipt>document.addEventListener("click",function(e){var t=e.target,lb=document.getElementById("lb");if(t&&t.classList&&t.classList.contains("z")){document.getElementById("lbi").src=t.src;lb.classList.add("show");return;}if(lb&&lb.classList.contains("show"))lb.classList.remove("show");});document.addEventListener("keydown",function(e){if(e.key==="Escape"){var lb=document.getElementById("lb");if(lb)lb.classList.remove("show");}});</scr'+'ipt>';

function qhBuildFiche(rec){
  var esc=qhEsc;
  var infos=[['N° Commande',rec.order],['Destinataire (agent)',rec.assignee],['Client',rec.client],['PO',rec.numeroPO],['Soumission',rec.soumission],['Représentant',rec.representant],['Date reçue',(rec.dateRecue||'').split('T')[0]],['Date livraison',(rec.dateLivraison||'').split('T')[0]],['Créé par',rec.createdByName],['Réglé par',rec.resolvedBy],['Réglé le',(rec.resolvedAt||'').split('T')[0]],['Statut',qhStatusLabel(rec.status)],['Archivé le',(rec.archivedAt||'').split('T')[0]]];
  var rows=infos.filter(function(r){return r[1]!==undefined&&r[1]!==null&&r[1]!=='';}).map(function(r){return '<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';}).join('');
  var msgs=qhArr(rec.messages);
  var TL={problem:'❓ Question',reply:'✅ Réponse',pinned:'📌 Épinglé','quest-resolved':'✅ Réglé',conversation:'💬 Discussion'};
  var TC={problem:'q',reply:'s','quest-resolved':'s',pinned:'p',conversation:'n'};
  var disc=msgs.length?msgs.map(function(m){
    var t=m.type||'conversation';
    var imgs=qhArr(m.images).map(function(src){return '<img class="z" src="'+src+'" loading="lazy">';}).join('');
    var who=(m.author||'')+(m.target?' → '+m.target:'');
    var when=m.timestamp?new Date(m.timestamp).toLocaleString('fr-CA'):'';
    var body=m.contentHtml?m.contentHtml:esc(m.content||'').replace(/\n/g,'<br>');
    return '<div class="msg '+(TC[t]||'n')+'"><div class="mh"><span class="ty">'+(TL[t]||'💬')+'</span><span class="wh">'+esc(who)+'</span><span class="dt">'+esc(when)+'</span></div>'+(body?'<div class="bd">'+body+'</div>':'')+(imgs?'<div class="ph">'+imgs+'</div>':'')+'</div>';
  }).join(''):'<div class="empty">Aucune discussion</div>';
  var photos=qhArr(rec.photos);
  var gal=photos.length?'<div class="gal">'+photos.map(function(src){return '<img class="z" src="'+src+'" loading="lazy">';}).join('')+'</div>':'<div class="empty">Aucune photo</div>';
  var title=esc('#'+(rec.order||'')+(rec.client?' — '+rec.client:''));
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+title+'</title><style>'+qhFicheCss()+'</style></head><body><div class="wrap">'
    +'<h1>'+title+'</h1><div class="sub">Archive PhysiPro — Questionnement · '+esc(rec.assignee||'')+(rec.archivedAt?' · archivé le '+esc(String(rec.archivedAt).substring(0,10)):'')+'</div>'
    +'<h2>Informations</h2><table class="info">'+rows+'</table>'
    +'<h2>Conversation ('+msgs.length+')</h2>'+disc
    +'<h2>Photos ('+photos.length+')</h2>'+gal
    +'<div class="foot">Généré par PhysiPro BackupStation — '+new Date().toLocaleString('fr-CA')+'</div>'
    +'</div><div class="lb" id="lb"><img id="lbi" alt=""></div>'+qhLbScript()+'</body></html>';
}

function qhBuildIndex(rows){
  var esc=qhEsc;
  rows.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var trs=rows.map(function(r){
    return '<tr onclick="location.href=\''+r.href+'\'">'
      +'<td class="num">#'+esc(r.order||'---')+'</td>'
      +'<td>'+esc(r.agent||'')+'</td>'
      +'<td>'+esc(r.client||'')+'</td>'
      +'<td>'+esc(r.po||'')+'</td>'
      +'<td>'+esc(qhStatusLabel(r.status))+'</td>'
      +'<td>'+esc(r.date||'')+'</td>'
      +'<td class="op">↗</td></tr>';
  }).join('');
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionnements — Historique complet</title><style>'
    +'*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;line-height:1.5}'
    +'.wrap{max-width:1100px;margin:0 auto}h1{font-size:22px;color:#fff;margin-bottom:2px}.sub{color:#94a3b8;font-size:13px;margin-bottom:14px}'
    +'#q{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;margin-bottom:12px}'
    +'table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden}'
    +'thead th{background:#0b1220;color:#93c5fd;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;text-align:left}'
    +'tbody tr{cursor:pointer;border-top:1px solid #0f172a}tbody tr:hover{background:#243049}'
    +'td{padding:8px 10px;font-size:13px}td.num{font-weight:700;color:#fff}td.op{text-align:center;color:#60a5fa}'
    +'.foot{margin-top:16px;color:#475569;font-size:11px;text-align:center}'
    +'</style></head><body><div class="wrap">'
    +'<h1>🎧 Questionnements — Historique complet</h1><div class="sub">'+rows.length+' questionnement(s) · cliquer une ligne pour ouvrir la fiche · généré le '+new Date().toLocaleString('fr-CA')+'</div>'
    +'<input id="q" type="text" placeholder="🔍 Rechercher (commande, agent, client, PO…)" oninput="var v=this.value.toLowerCase();document.querySelectorAll(\'tbody tr\').forEach(function(tr){tr.style.display=tr.textContent.toLowerCase().indexOf(v)>-1?\'\':\'none\';});">'
    +'<table><thead><tr><th>N° Commande</th><th>Destinataire</th><th>Client</th><th>PO</th><th>Statut</th><th>Date</th><th></th></tr></thead><tbody>'+trs+'</tbody></table>'
    +'<div class="foot">Généré par PhysiPro BackupStation</div>'
    +'</div></body></html>';
}

async function archiveQuestionnements(trig){
  if(!dirH)return;
  var qh={};
  try{qh=(await fbDb.ref('questHistory').once('value')).val()||{};}catch(e){lg('  ⚠️ Lecture questHistory: '+e.message,'warn');return;}
  var agents=Object.keys(qh);
  if(agents.length===0){lg('  🎧 Questionnements : aucun historique','t');return;}
  var root;
  try{root=await dirH.getDirectoryHandle('Questionnements_Historique',{create:true});}catch(e){lg('  ⚠️ Dossier Questionnements_Historique: '+e.message,'err');return;}
  var allRows=[],done=0;
  for(var ai=0;ai<agents.length;ai++){
    var agent=agents[ai];
    var recs=qh[agent]||{};
    var ids=Object.keys(recs);
    if(ids.length===0)continue;
    var af;
    try{af=await root.getDirectoryHandle(qhSan(agent),{create:true});}catch(e){lg('  ⚠️ '+agent+': '+e.message,'warn');continue;}
    for(var ri=0;ri<ids.length;ri++){
      var id=ids[ri],rec=recs[id];if(!rec)continue;
      var fileName=qhSan((rec.order||'SANS')+' - '+(rec.client||'')).substring(0,110)+'.html';
      allRows.push({agent:agent,order:rec.order||'',client:rec.client||'',po:rec.numeroPO||'',status:rec.status||'',date:(rec.archivedAt||rec.resolvedAt||rec.createdAt||'').split('T')[0],href:encodeURIComponent(qhSan(agent))+'/'+encodeURIComponent(fileName)});
      var sig='qh1|'+sH(JSON.stringify(rec));
      var hk='qh_h_'+agent+'_'+id;
      if(localStorage.getItem(hk)===sig&&trig!=='Forcée')continue;
      try{
        var html=qhBuildFiche(rec);
        var fh=await af.getFileHandle(fileName,{create:true});var w=await fh.createWritable();await w.write(new Blob([html],{type:'text/html'}));await w.close();
        localStorage.setItem(hk,sig);done++;
      }catch(e){lg('  ⚠️ Fiche '+(rec.order||id)+': '+e.message,'warn');}
    }
  }
  try{
    var fhI=await root.getFileHandle('_TOUS_les_questionnements.html',{create:true});var wI=await fhI.createWritable();await wI.write(new Blob([qhBuildIndex(allRows)],{type:'text/html'}));await wI.close();
  }catch(e){lg('  ⚠️ Index questionnements: '+e.message,'warn');}
  try{
    var fhJ=await root.getFileHandle('_questHistory_complet.json',{create:true});var wJ=await fhJ.createWritable();await wJ.write(new Blob([JSON.stringify(qh)],{type:'application/json'}));await wJ.close();
  }catch(e){}
  if(done>0)lg('  🎧 '+done+' questionnement(s) → OneDrive','ok');
  else lg('  🎧 Questionnements à jour','t');
}

/* ═══ EXPORT EXCEL (.xlsx) — Insp.Atelier / Prod.Couture / Insp.Finale ═══
   En PLUS du JSON (qui sert à restaurer). Un fichier "{Module}_actuel.xlsx"
   écrasé à chaque sauvegarde, un onglet par type de données, une ligne par
   enregistrement, cherchable dans Excel. Aplatissement automatique :
   aucune colonne n'est devinée, donc rien n'est oublié. */
function xlsFlat(obj,prefix,out){
  out=out||{};prefix=prefix||'';
  if(obj===null||obj===undefined){out[prefix||'valeur']='';return out;}
  if(typeof obj!=='object'){out[prefix||'valeur']=obj;return out;}
  if(Array.isArray(obj)){
    var allPrim=obj.every(function(x){return x===null||typeof x!=='object';});
    out[prefix||'valeur']=allPrim?obj.join(', '):JSON.stringify(obj);
    return out;
  }
  var keys=Object.keys(obj);
  if(keys.length===0){out[prefix||'valeur']='';return out;}
  keys.forEach(function(k){xlsFlat(obj[k],prefix?prefix+'.'+k:k,out);});
  return out;
}
function xlsRows(node){
  if(node===null||node===undefined)return [{valeur:''}];
  if(typeof node!=='object')return [{valeur:node}];
  if(Array.isArray(node))return node.map(function(v,i){var r=(v&&typeof v==='object'&&!Array.isArray(v))?xlsFlat(v):{valeur:(v&&typeof v==='object')?JSON.stringify(v):v};r._index=i;return r;});
  var keys=Object.keys(node);
  if(!keys.length)return [{info:'(vide)'}];
  var objVals=keys.filter(function(k){return node[k]&&typeof node[k]==='object'&&!Array.isArray(node[k]);}).length;
  if(objVals>=keys.length*0.5){
    return keys.map(function(id){var r=xlsFlat(node[id]);r._id=id;return r;});
  }
  return keys.map(function(k){var v=node[k];return {cle:k,valeur:(v&&typeof v==='object')?JSON.stringify(v):v};});
}
async function xlsWriteModule(modDir,n,md){
  if(typeof XLSX==='undefined'){lg('  ⚠️ Excel: librairie non chargée','warn');return;}
  var wb=XLSX.utils.book_new(),added=0;
  Object.keys(md).forEach(function(key){
    var rows=xlsRows(md[key]);
    if(!rows||!rows.length)return;
    var ws=XLSX.utils.json_to_sheet(rows);
    var sn=key.substring(0,31).replace(/[\\\/?*\[\]:]/g,'_');
    XLSX.utils.book_append_sheet(wb,ws,sn);added++;
  });
  if(!added)return;
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  var fh=await modDir.getFileHandle(n+'_actuel.xlsx',{create:true});
  var w=await fh.createWritable();await w.write(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));await w.close();
}
