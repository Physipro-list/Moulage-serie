html,body{height:100%;overflow:hidden;}

.topbar{height:75px;background:linear-gradient(to bottom,#04152c 0%,#4a8ef5 100%);display:flex;align-items:center;padding:0 16px;box-shadow:inset 0 1px 2px rgba(255,255,255,0.16),0 2px 6px rgba(0,0,0,0.45);}

.topbar-user{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.8);}
.topbar-badge{background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:12px;font-weight:500;}
.status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;}
.sync-badge{font-size:10px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.1);}

.toolbar{height:50px;background:linear-gradient(to bottom,#4a8ef5 0%,#3b82f6 100%);display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:1px solid rgba(255,255,255,0.2);}
.toolbar select,.toolbar input{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 12px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,0.25);}
.toolbar input[type="text"]{width:200px;}
.toolbar input::placeholder{color:rgba(255,255,255,0.6);}
.toolbar-btn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:none;color:#000;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;transition:all 0.2s;}
.toolbar-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,0.4);}
.toolbar-btn.secondary{background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;}
.zoom-control{display:flex;align-items:center;gap:6px;}
.zoom-btn{width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-size:16px;}
.zoom-btn:hover{background:rgba(255,255,255,0.3);}
.zoom-value{font-size:12px;color:#fff;min-width:40px;text-align:center;}

.table-container{flex:1;overflow:auto;padding:12px;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:linear-gradient(to bottom,#04152c 0%,#4a8ef5 100%);color:#fff;padding:10px 8px;text-align:left;font-weight:600;position:sticky;top:0;z-index:10;white-space:nowrap;border-right:1px solid rgba(255,255,255,0.1);}
.data-table th:last-child{border-right:none;}
.data-table th .gear{cursor:pointer;opacity:0.7;margin-left:4px;font-size:12px;}
.data-table th .gear:hover{opacity:1;}
.data-table td{padding:6px 8px;border-bottom:1px solid rgba(74,142,245,0.2);background:rgba(4,21,44,0.6);vertical-align:middle;}
.data-table tr:hover td{background:rgba(74,142,245,0.15);}
.data-table input,.data-table select{width:100%;background:transparent;border:1px solid transparent;color:#e2e8f0;padding:6px 8px;border-radius:4px;font-family:'Outfit',sans-serif;font-size:13px;}
.data-table input:focus,.data-table select:focus{outline:none;border-color:#4a8ef5;background:rgba(74,142,245,0.1);}
.data-table select{cursor:pointer;background:rgba(4,21,44,0.8);}
.data-table select option{background:#0a2a5c;color:#fff;}
.row-delete{background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;opacity:0.6;transition:opacity 0.2s;}
.row-delete:hover{opacity:1;}

.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#04152c 0%,#0a2a5c 50%,#1a4a8a 100%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-overlay.hidden{display:none;}
.login-panel{background:rgba(10,42,92,0.9);border:1px solid rgba(74,142,245,0.3);border-radius:20px;padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.login-logo{height:80px;margin-bottom:20px;}
.login-title{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px;}
.login-subtitle{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.login-author{font-size:13px;color:rgba(255,255,255,0.4);font-style:italic;margin-bottom:24px;}
.login-input{width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(74,142,245,0.3);color:#fff;padding:14px 16px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;margin-bottom:12px;text-align:center;}
.login-input::placeholder{color:rgba(255,255,255,0.4);}
.login-input:focus{outline:none;border-color:#4a8ef5;}
.login-remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;font-size:13px;color:rgba(255,255,255,0.6);}
.login-remember input{accent-color:#4a8ef5;}
.login-btn{width:100%;background:linear-gradient(135deg,#3b82f6,#60a5fa);border:none;color:#fff;padding:14px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,0.4);}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.login-error{color:#f87171;font-size:12px;margin-top:12px;min-height:20px;}

.nav-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:9998;}
.nav-modal-overlay.active{display:flex;}
.nav-modal{background:linear-gradient(145deg,#0a2a5c,#04152c);border:1px solid rgba(74,142,245,0.3);border-radius:20px;padding:30px;width:90%;max-width:700px;}
.nav-modal-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.nav-modal-subtitle{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:20px;}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.nav-tile{background:rgba(255,255,255,0.05);border:1px solid rgba(74,142,245,0.2);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:all 0.2s;text-decoration:none;color:#fff;position:relative;}
.nav-tile:hover{background:rgba(74,142,245,0.2);border-color:rgba(74,142,245,0.5);transform:translateY(-2px);}
.nav-tile-icon{font-size:32px;margin-bottom:8px;}
.nav-tile-label{font-size:13px;font-weight:500;}
.nav-tile.current{border-color:#60a5fa;background:rgba(74,142,245,0.3);}
.nav-tile.current::after{content:'ACTUEL';position:absolute;top:6px;right:6px;font-size:8px;background:#60a5fa;color:#fff;padding:2px 6px;border-radius:4px;}

.list-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;}

.list-modal-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}

.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:#22c55e;}
.toast.error{border-color:#ef4444;}

.app-container{display:flex;flex-direction:column;height:100vh;}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}

</head>

function getList(k){var s=localStorage.getItem('physipro_couture_'+k);if(s)try{return JSON.parse(s);}catch(e){}return DEFAULT_LISTS[k].slice();}
function saveList(k,v){localStorage.setItem('physipro_couture_'+k,JSON.stringify(v));renderTable();}

function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(function(){t.classList.remove('show');},3000);}

function setSyncBadge(s){var b=document.getElementById('syncBadge');if(s==='online'){b.textContent='● Sync';b.style.color='#22c55e';}else if(s==='saving'){b.textContent='⏳...';b.style.color='#fbbf24';}else{b.textContent='○ Offline';b.style.color='#ef4444';}}
function generateId(){return 'row_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
function todayStr(){return new Date().toISOString().split('T')[0];}

function initMonthSelector(){
  var sel=document.getElementById('monthSelect');
  var now=new Date();
  var html='';
  for(var i=-3;i<=6;i++){
    var d=new Date(now.getFullYear(),now.getMonth()+i,1);
    var val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var label=d.toLocaleDateString('fr-CA',{year:'numeric',month:'long'});
    html+='<option value="'+val+'"'+(i===0?' selected':'')+'>'+label+'</option>';
  }
  sel.innerHTML=html;
  currentMonth=sel.value;
}
function changeMonth(){currentMonth=document.getElementById('monthSelect').value;loadData();}

function renderTable(){
  var tbody=document.getElementById('tableBody');
  var rows=data[currentMonth]||[];
  var search=(document.getElementById('searchInput').value||'').toLowerCase();
  var clients=getList('clients');
  var noms=getList('noms');
  var items=getList('items');
  var html='';
  var num=0;
  rows.forEach(function(row,idx){
    var searchStr=(row.bonCmd||'')+(row.fauteuil||'')+(row.client||'')+(row.items||'')+(row.nom||'')+(row.autreNo||'');
    if(search&&searchStr.toLowerCase().indexOf(search)===-1)return;
    num++;
    var isRush=row.rush;
    html+='<tr data-idx="'+idx+'">';
    html+='<td>'+num+(isRush?' 🚩':'')+'</td>';
    html+='<td><input type="text" value="'+(row.bonCmd||'')+'" onchange="updateCell('+idx+',\'bonCmd\',this.value)"></td>';
    html+='<td><input type="text" value="'+(row.fauteuil||'')+'" onchange="updateCell('+idx+',\'fauteuil\',this.value)"></td>';
    html+='<td><select onchange="updateCell('+idx+',\'client\',this.value)"><option value="">—</option>'+clients.map(function(c){return '<option'+(row.client===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></td>';
    html+='<td><input type="date" value="'+(row.dateLiv||'')+'" onchange="updateCell('+idx+',\'dateLiv\',this.value)"></td>';
    html+='<td><input type="date" value="'+(row.dateEntree||'')+'" onchange="updateCell('+idx+',\'dateEntree\',this.value)"></td>';
    html+='<td><select onchange="updateCell('+idx+',\'items\',this.value)"><option value="">—</option>'+items.map(function(i){return '<option'+(row.items===i?' selected':'')+'>'+i+'</option>';}).join('')+'</select></td>';
    html+='<td><select onchange="updateCell('+idx+',\'nom\',this.value)"><option value="">—</option>'+noms.map(function(n){return '<option'+(row.nom===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></td>';
    html+='<td><input type="date" value="'+(row.dateSortie||'')+'" onchange="updateCell('+idx+',\'dateSortie\',this.value)"></td>';
    html+='<td><input type="text" value="'+(row.autreNo||'')+'" onchange="updateCell('+idx+',\'autreNo\',this.value)"></td>';
    html+='<td><button class="row-delete" onclick="deleteRow('+idx+')">🗑️</button></td>';
    html+='</tr>';
  });
  tbody.innerHTML=html||'<tr><td colspan="11" style="text-align:center;padding:40px;color:#60a5fa;">Aucune donnée. Cliquez sur "+ Ajouter".</td></tr>';
}
function filterTable(){renderTable();}

function addRow(){
  if(!data[currentMonth])data[currentMonth]=[];
  data[currentMonth].push({id:generateId(),bonCmd:'',fauteuil:'',rush:false,client:'',dateLiv:'',dateEntree:todayStr(),items:'',nom:'',dateSortie:'',autreNo:''});
  saveData();renderTable();showToast('Ligne ajoutée','success');
}
function updateCell(idx,field,value){
  if(!data[currentMonth]||!data[currentMonth][idx])return;
  data[currentMonth][idx][field]=value;
  saveData();
}
function deleteRow(idx){
  if(!confirm('Supprimer?'))return;
  data[currentMonth].splice(idx,1);
  saveData();renderTable();showToast('Supprimé','success');
}

function saveData(){
  if(!fbDb||!fbUser)return;
  setSyncBadge('saving');
  fbDb.ref('inspectionCoutureData/'+currentMonth).set(data[currentMonth]||[]).then(function(){setSyncBadge('online');}).catch(function(){setSyncBadge('offline');showToast('Erreur','error');});
}
function loadData(){
  if(!fbDb||!fbUser){renderTable();return;}
  fbDb.ref('inspectionCoutureData/'+currentMonth).once('value').then(function(snap){data[currentMonth]=snap.val()||[];renderTable();});
}

function adjustZoom(d){zoom=Math.max(50,Math.min(150,zoom+d));document.getElementById('zoomValue').textContent=zoom+'%';document.getElementById('tableContainer').style.fontSize=(zoom/100)+'em';}

function exportCSV(){
  var rows=data[currentMonth]||[];
  if(!rows.length){showToast('Aucune donnée','error');return;}
  var csv=['# BON CMD;# FAUTEUIL;CLIENT;DATE LIV;DATE ENTREE;ITEMS;NOM;DATE SORTIE;AUTRE NO'];
  rows.forEach(function(r){csv.push([r.bonCmd||'',r.fauteuil||'',r.client||'',r.dateLiv||'',r.dateEntree||'',r.items||'',r.nom||'',r.dateSortie||'',r.autreNo||''].join(';'));});
  var blob=new Blob(['\ufeff'+csv.join('\n')],{type:'text/csv'});
  var link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='inspection_couture_'+currentMonth+'.csv';link.click();
  showToast('Export OK','success');
}

// LIST MANAGER
function openListModal(key,title){
  currentListKey=key;
  document.getElementById('listModalTitle').textContent='⚙️ '+title;
  renderListItems();
  document.getElementById('listModalOverlay').classList.add('active');
}
function closeListModal(e){if(!e||e.target.id==='listModalOverlay')document.getElementById('listModalOverlay').classList.remove('active');}
function renderListItems(){
  var items=getList(currentListKey);
  var html=items.map(function(v,i){return '<div class="list-item"><span>'+v+'</span><button class="list-item-del" onclick="removeListValue('+i+')">🗑️</button></div>';}).join('');
  document.getElementById('listItems').innerHTML=html||'<div style="color:#60a5fa;text-align:center;padding:20px;">Liste vide</div>';
}
function addListValue(){
  var input=document.getElementById('listNewValue');
  var val=input.value.trim();
  if(!val)return;
  var items=getList(currentListKey);
  if(items.indexOf(val)===-1){items.push(val);saveList(currentListKey,items);}
  input.value='';
  renderListItems();
  showToast('Ajouté','success');
}
function removeListValue(idx){
  var items=getList(currentListKey);
  items.splice(idx,1);
  saveList(currentListKey,items);
  renderListItems();
  showToast('Supprimé','success');
}

}
function closeNavModal(e){if(e.target.id==='navModalOverlay')document.getElementById('navModalOverlay').classList.remove('active');}

// LOGIN
function doLogin(event){
  if(event)event.preventDefault();
  var email=document.getElementById('loginEmail').value.trim();
  var password=document.getElementById('loginPassword').value;
  var btn=document.getElementById('loginBtn');
  var err=document.getElementById('loginError');
  err.textContent='';
  if(!email){err.textContent='Email requis';return;}
  if(!password){err.textContent='Mot de passe requis';return;}
  btn.disabled=true;btn.textContent='Connexion...';
  var remember=document.getElementById('loginRemember').checked;
  var persistence=remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
  firebase.auth().setPersistence(persistence).then(function(){
    return firebase.auth().signInWithEmailAndPassword(email,password);
  }).catch(function(error){
    var msg='Erreur de connexion';
    if(error.code==='auth/user-not-found')msg='Compte non trouvé';
    else if(error.code==='auth/wrong-password')msg='Mot de passe incorrect';
    else if(error.code==='auth/invalid-credential')msg='Email ou mot de passe incorrect';
    else if(error.code==='auth/too-many-requests')msg='Trop de tentatives';
    err.textContent=msg;
    btn.disabled=false;btn.textContent='Se connecter';
  });
}

fbAuth.onAuthStateChanged(function(user){
  fbUser=user;
  var overlay=document.getElementById('loginOverlay');
  if(user){
    overlay.classList.add('hidden');
    document.getElementById('userBadge').textContent=getDisplayName(user.email);
    document.getElementById('statusDot').style.background='#22c55e';
    localStorage.setItem('physipro_last_email',user.email);
    setSyncBadge('online');
    initMonthSelector();
    loadData();
  }else{
    var saved=localStorage.getItem('physipro_last_email');
    if(saved)document.getElementById('loginEmail').value=saved;
    overlay.classList.remove('hidden');
    document.getElementById('userBadge').textContent='—';
    document.getElementById('statusDot').style.background='#ef4444';
    setSyncBadge('offline');
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='Se connecter';
  }
});
