<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0a1628;--blue:#3b82f6;--green:#22c55e;--gold:#fbbf24;}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;}

/* ═══ LOGIN ═══ */
.login-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,#0b1d36,#3f6eb8);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;}
.login-overlay.hidden{display:none;}
.login-box{background:linear-gradient(to bottom,#0b2343,#06315a);border-radius:16px;border:1px solid rgba(255,255,255,0.25);box-shadow:0 8px 30px rgba(0,0,0,0.85);padding:28px 32px;max-width:400px;width:100%;text-align:center;color:#fff;}
.login-box img{height:80px;margin-bottom:12px;}
.login-box h2{font-size:16px;font-weight:700;margin-bottom:4px;}
.login-box .sub{font-size:12px;opacity:0.7;margin-bottom:16px;}
.login-box input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);color:#fff;font-size:14px;text-align:center;margin-bottom:10px;}
.login-box input::placeholder{color:rgba(255,255,255,0.4);}
.login-box input:focus{outline:none;border-color:#00aaff;}
.login-box button{width:100%;padding:12px;border-radius:999px;border:none;background:linear-gradient(to bottom,#00aaff,#0077cc);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.login-box .err{color:#ff6666;font-size:11px;margin-top:6px;min-height:16px;}

/* ═══ TOPBAR ═══ */
.topbar{height:62px;background:linear-gradient(to bottom,#04152c 0%,#4a8ef5 100%);display:flex;align-items:center;padding:0 16px;flex-shrink:0;box-shadow:inset 0 1px 2px rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.45);}
.topbar-logo{height:36px;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));transition:transform .2s;}
.topbar-logo:hover{transform:scale(1.05);}
.topbar-center{flex:1;text-align:left;font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px;padding-left:14px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-user{font-size:11px;color:rgba(255,255,255,.7);}
.topbar-user strong{color:#fff;}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;}
.btn-logout:hover{background:rgba(239,68,68,.2);color:#fca5a5;border-color:rgba(239,68,68,.4);}

/* ═══ MAIN ═══ */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.search-bar{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;font-size:13px;margin-bottom:10px;font-family:'Outfit',sans-serif;}
.search-bar:focus{outline:none;border-color:var(--blue);}
.search-bar::placeholder{color:rgba(255,255,255,0.35);}

.columns{flex:1;display:flex;gap:10px;overflow:hidden;}
.col{flex:1;background:linear-gradient(to bottom,#1e3a5f,#0f172a);border:1px solid rgba(59,130,246,0.25);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.col-header{padding:12px 16px;font-size:16px;font-weight:800;border-bottom:2px solid rgba(59,130,246,0.3);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.col-header .icon{font-size:22px;}
.col-header .count{margin-left:auto;font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);}
.col-scroll{flex:1;overflow-y:auto;padding:8px 12px 12px;}
.col-scroll::-webkit-scrollbar{width:5px;}
.col-scroll::-webkit-scrollbar-thumb{background:rgba(59,130,246,0.3);border-radius:3px;}

.group-title{font-size:17px;font-weight:700;color:#60a5fa;padding:10px 4px 4px;border-bottom:1px solid rgba(96,165,250,0.15);margin-top:10px;text-transform:uppercase;letter-spacing:.4px;}
.group-title:first-child{margin-top:0;}
.mat-row{display:flex;align-items:center;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:18px;transition:background .15s;gap:6px;}
.mat-row:hover{background:rgba(255,255,255,0.05);border-radius:4px;}
.mat-code{font-family:'Courier New',monospace;color:var(--gold);min-width:100px;font-size:17px;font-weight:600;flex-shrink:0;}
.mat-name{flex:1;color:#cbd5e1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mat-calc{width:28px;height:28px;border-radius:6px;border:1px solid rgba(59,130,246,0.3);background:rgba(59,130,246,0.1);color:#60a5fa;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.mat-calc:hover{background:rgba(59,130,246,0.3);border-color:#3b82f6;}

/* ═══ SHEET CALC MODAL ═══ */
.sc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10001;align-items:center;justify-content:center;}
.sc-overlay.open{display:flex;}
.sc-panel{background:#0d1b2a;border:1px solid rgba(59,130,246,0.3);border-radius:14px;width:380px;max-width:94vw;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.sc-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sc-head span{font-size:14px;font-weight:700;color:#fff;}
.sc-close{background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;}
.sc-close:hover{color:#ef4444;}
.sc-mat{padding:10px 16px 2px;font-size:12px;color:#93c5fd;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-info{padding:2px 16px;font-size:14px;color:#cbd5e1;font-weight:700;}
.sc-area{padding:2px 16px 8px;font-size:11px;color:#94a3b8;}
.sc-input-row{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,0.03);}
.sc-input-row label{font-size:12px;color:#e2e8f0;flex:1;}
.sc-input-row input{width:100px;padding:8px 10px;border-radius:6px;border:1px solid rgba(59,130,246,0.3);background:#1e293b;color:#fff;font-size:16px;font-weight:700;text-align:center;font-family:'Outfit',sans-serif;}
.sc-input-row input:focus{border-color:#3b82f6;outline:none;}
.sc-input-row span{font-size:12px;color:#94a3b8;}
.sc-results{padding:12px 16px 16px;}
.sc-bar-bg{height:22px;background:#1e293b;border-radius:11px;position:relative;overflow:hidden;margin-bottom:12px;}
.sc-bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6);border-radius:11px;transition:width .3s;width:0%;}
.sc-bar-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);}
.sc-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:#cbd5e1;}
.sc-row strong{color:#fff;}
.sc-qty{padding:8px 0 4px;font-size:13px;border-top:1px solid rgba(255,255,255,0.06);margin-top:4px;display:flex;justify-content:space-between;align-items:center;}
.sc-qty strong{color:#60a5fa;font-size:18px;}
.sc-toggle-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px 14px;}
.sc-toggle-label{font-size:12px;color:#94a3b8;font-weight:600;min-width:60px;}
.sc-toggle-label:first-child{text-align:right;}
.sc-toggle-label.active{color:#60a5fa;}
.sc-toggle{cursor:pointer;width:44px;height:24px;background:#1e293b;border:2px solid #3d5474;border-radius:12px;position:relative;transition:all .2s;flex-shrink:0;}
.sc-toggle.on{background:rgba(59,130,246,0.3);border-color:#3b82f6;}
.sc-toggle-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#94a3b8;border-radius:50%;transition:all .2s;}
.sc-toggle.on .sc-toggle-knob{left:22px;background:#60a5fa;}

/* ═══ RESPONSIVE MOBILE ═══ */
@media(max-width:700px){
  .topbar{height:50px;padding:0 10px;}
  .topbar-center{font-size:13px;}
  .topbar-logo{height:28px;}
  .columns{flex-direction:column;gap:8px;}
  .col{min-height:0;flex:none;}
  .col-scroll{max-height:45vh;}
  .search-bar{font-size:14px;padding:12px;}
}

/* ═══ PRINT ═══ */
@media print{
  .login-overlay,.topbar,.search-bar,.mat-calc,.sc-overlay{display:none!important;}
  body{background:#fff!important;color:#000!important;}
  .main{padding:0;}
  .columns{flex-direction:column;}
  .col{border:1px solid #ccc!important;background:#fff!important;break-inside:avoid;}
  .col-header{background:#e5e7eb!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .mat-code{color:#92400e!important;}
  .mat-name{color:#000!important;}
  .group-title{color:#1e40af!important;border-color:#ccc!important;}
}

<!-- MAIN -->

<!-- SHEET CALC MODAL -->
<div class="sc-overlay" id="scOverlay" onclick="if(event.target===this)closeSC()">

    <div class="sc-mat" id="scMat">—</div>
    <div class="sc-info" id="scInfo">Feuille: — × —</div>
    <div class="sc-area" id="scArea">Surface totale: —</div>

      <label>Pieds carrés utilisés:</label>
      <input type="number" id="scInput" min="0" step="0.25" value="0" oninput="calcSC()">
      <span>pi²</span>

    <div class="sc-results">
      <div class="sc-bar-bg"><div class="sc-bar-fill" id="scFill"></div><span class="sc-bar-label" id="scPct">0%</span></div>

      <div class="sc-qty"><span>Fraction de feuille:</span><strong id="scQty">—</strong></div>
      <div class="sc-toggle-row">
        <span class="sc-toggle-label active" id="scLabelDec">Décimal</span>
        <div class="sc-toggle" id="scToggle" onclick="toggleMode()"><div class="sc-toggle-knob"></div></div>
        <span class="sc-toggle-label" id="scLabelFrac">Fraction</span>
      </div>
    </div>
  </div>
</div>

function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pwd = document.getElementById('loginPassword').value;
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginError');
  err.textContent = '';
  if (!email || !pwd) { err.textContent = 'Email et mot de passe requis'; return; }
  btn.disabled = true; btn.textContent = 'Connexion...';
  firebase.auth().signInWithEmailAndPassword(email, pwd).catch(function(error) {
    var msg = 'Erreur de connexion';
    if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = 'Mot de passe incorrect';
    else if (error.code === 'auth/user-not-found') msg = 'Compte non trouvé';
    else if (error.code === 'auth/too-many-requests') msg = 'Trop de tentatives';
    err.textContent = msg;
    btn.disabled = false; btn.textContent = 'Se connecter';
  });
}
function doLogout() { firebase.auth().signOut(); location.reload(); }

// Seuil minimum pour afficher le bouton 📐 (surface > 22×24 = 528)
var MIN_SHEET_AREA = 529;

function render() {
  var q = (document.getElementById('searchBar').value || '').toLowerCase().trim();
  renderCol(LEFT, 'colLeft', 'countLeft', q);
  renderCol(RIGHT, 'colRight', 'countRight', q);
}
function renderCol(groups, colId, countId, q) {
  var el = document.getElementById(colId);
  var html = '', total = 0;
  groups.forEach(function(g) {
    var filtered = g.items.filter(function(item) { return !q || item.toLowerCase().indexOf(q) !== -1; });
    if (!filtered.length) return;
    html += '<div class="group-title">' + g.title + ' (' + filtered.length + ')</div>';
    filtered.forEach(function(item) {
      var d = item.indexOf(' - ');
      var code = d > -1 ? item.substring(0, d) : item;
      var name = d > -1 ? item.substring(d + 3) : '';
      var sheet = SHEETS[code];
      var isBigSheet = sheet && (sheet.w * sheet.h) >= MIN_SHEET_AREA;
      var calcBtn = isBigSheet ? '<button class="mat-calc" onclick="openSC(\'' + code + '\',\'' + esc(name) + '\')" title="Calculer la feuille">📐</button>' : '';
      html += '<div class="mat-row"><span class="mat-code">' + code + '</span><span class="mat-name" title="' + esc(name) + '">' + name + '</span>' + calcBtn + '</div>';
      total++;
    });
  });
  if (!total) html = '<div style="text-align:center;padding:20px;color:#64748b;font-size:13px;">Aucun résultat</div>';
  el.innerHTML = html;
  document.getElementById(countId).textContent = total;
}
function esc(s) { return s ? s.replace(/'/g, '&#39;').replace(/"/g, '&quot;') : ''; }

// ═══ SHEET CALCULATOR ═══
var _sc = null;
var _fracMode = false;

function openSC(code, name) {
  var s = SHEETS[code]; if (!s) return;
  _sc = { w: s.w, h: s.h, sqin: s.w * s.h };
  document.getElementById('scMat').textContent = code + ' — ' + name;
  document.getElementById('scInfo').textContent = 'Feuille: ' + s.w + '″ × ' + s.h + '″';
  document.getElementById('scArea').textContent = 'Surface totale: ' + _sc.sqin + ' po² (' + (_sc.sqin / 144).toFixed(2) + ' pi²)';
  document.getElementById('scInput').value = 0;
  updateToggleUI();
  calcSC();
  document.getElementById('scOverlay').classList.add('open');
  setTimeout(function(){ document.getElementById('scInput').focus(); document.getElementById('scInput').select(); }, 100);
}
function closeSC() { document.getElementById('scOverlay').classList.remove('open'); _sc = null; }

function toggleMode() {
  _fracMode = !_fracMode;
  updateToggleUI();
  calcSC();
}
function updateToggleUI() {
  var tog = document.getElementById('scToggle');
  var lblD = document.getElementById('scLabelDec');
  var lblF = document.getElementById('scLabelFrac');
  if (_fracMode) { tog.classList.add('on'); lblD.classList.remove('active'); lblF.classList.add('active'); }
  else { tog.classList.remove('on'); lblD.classList.add('active'); lblF.classList.remove('active'); }
}

function calcSC() {
  if (!_sc) return;
  var sqft = parseFloat(document.getElementById('scInput').value) || 0;
  var used = sqft * 144, total = _sc.sqin, remain = Math.max(0, total - used);
  var pct = Math.min(100, (used / total) * 100), frac = used / total;
  var bar = document.getElementById('scFill');
  bar.style.width = pct + '%';
  bar.style.background = pct > 90 ? 'linear-gradient(90deg,#ef4444,#dc2626)' : pct > 70 ? 'linear-gradient(90deg,#f59e0b,#f97316)' : 'linear-gradient(90deg,#22c55e,#3b82f6)';
  document.getElementById('scPct').textContent = pct.toFixed(1) + '%';
  document.getElementById('scUsed').textContent = used.toFixed(0) + ' po² (' + sqft.toFixed(2) + ' pi²)';
  document.getElementById('scRemain').textContent = remain.toFixed(0) + ' po² (' + (remain / 144).toFixed(2) + ' pi²)';
  document.getElementById('scQty').textContent = frac > 0 ? (_fracMode ? decToFrac(frac) : frac.toFixed(2)) : '—';
}

// Conversion décimal → fraction
function decToFrac(dec) {
  if (dec <= 0) return '0';
  var whole = Math.floor(dec);
  var rem = dec - whole;
  if (rem < 0.01) return whole.toString();
  var fracPart = findFrac(rem);
  return whole > 0 ? whole + ' ' + fracPart : fracPart;
}
function findFrac(dec) {
  if (dec <= 0.01) return '0';
  var fracs = [[1,8],[1,6],[1,5],[1,4],[1,3],[3,8],[2,5],[1,2],[3,5],[5,8],[2,3],[3,4],[4,5],[5,6],[7,8]];
  for (var i = 0; i < fracs.length; i++) {
    if (Math.abs(dec - fracs[i][0]/fracs[i][1]) < 0.02) return fracs[i][0] + '/' + fracs[i][1];
  }
  var bestN = 1, bestD = 2, bestDiff = 999;
  for (var d = 2; d <= 16; d++) {
    var n = Math.round(dec * d);
    if (n > 0 && n < d) {
      var diff = Math.abs(dec - n/d);
      if (diff < bestDiff) { bestDiff = diff; bestN = n; bestD = d; }
    }
  }
  return bestN + '/' + bestD;
}
