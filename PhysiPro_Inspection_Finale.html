<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Inspection Finale</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bdr:#334155;--gold:#c9a227;--goldL:#fbbf24;--txt:#e2e8f0;--mutd:#94a3b8;--ok:#22c55e;--err:#ef4444;--info:#3b82f6;--purp:#7c3aed;--tbl-zoom:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
select{color-scheme:dark;background-color:#1e293b !important;color:#e2e8f0 !important;}
select option{background:#1e293b !important;color:#e2e8f0 !important;font-size:12px;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:12px;display:flex;flex-direction:column;min-width:320px;}

/* ═══ TOPBAR — compact ═══ */ /* NE JAMAIS MODIFIER */
.topbar{width:100%;height:48px;min-height:48px;padding:0 10px;display:flex;align-items:center;background:linear-gradient(to bottom,#04152c,#4a8ef5);box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;z-index:100;gap:6px;flex-shrink:0;}
.tb-left{display:flex;align-items:center;flex-shrink:0;}
.logo-main{display:flex;align-items:center;gap:6px;}
.logo-main img{height:28px;width:auto;filter:brightness(1.1) drop-shadow(0 1px 3px rgba(0,0,0,.3));}
.logo-bottom-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
.tb-center{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.top-title{font-size:clamp(11px,2vw,18px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fdfdfd;text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.user-name{font-size:9px;color:rgba(255,255,255,.8);font-weight:600;}
.tb-logout-btn{font-size:7px;padding:1px 3px;border:1px solid rgba(255,255,255,.15);border-radius:3px;color:rgba(255,255,255,.5);text-decoration:none;line-height:1;}
.tb-logout-btn:hover{background:rgba(255,255,255,.15);color:#fff;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;}
.status-dot.connected{background:#22c55e;box-shadow:0 0 3px rgba(34,197,94,.6);}
.sync-indicator{font-size:8px;padding:1px 4px;border-radius:3px;white-space:nowrap;}
.sync-indicator.online{background:rgba(34,197,94,.15);color:var(--ok);}
.sync-indicator.offline{background:rgba(239,68,68,.15);color:var(--err);}
.sync-indicator.syncing{background:rgba(251,191,36,.15);color:var(--goldL);}

/* ═══ TOOLBAR ═══ */ /* NE JAMAIS MODIFIER */
.toolbar{display:flex;gap:4px;align-items:center;padding:4px 8px;background:linear-gradient(to bottom,#04152c,#4a8ef5);flex-wrap:wrap;flex-shrink:0;min-height:32px;}
.toolbar label{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.toolbar .divider{width:1px;height:18px;background:rgba(255,255,255,.2);flex-shrink:0;}
.tb-btn{padding:2px 7px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.7);background:none;transition:all .15s;white-space:nowrap;}
.tb-btn:hover{border-color:var(--goldL);color:var(--goldL);background:rgba(255,255,255,.06);}
.month-select{background:rgba(255,255,255,.12) !important;border:1px solid rgba(255,255,255,.2) !important;color:#fff !important;font-weight:700;font-size:10px;padding:1px 4px;border-radius:3px;cursor:pointer;}
.month-select option{background:#0f172a !important;color:#fbbf24 !important;font-weight:700;}
.search-sm{background:rgba(255,255,255,.9);border:1px solid #3b82f6;border-radius:10px;padding:1px 6px;color:#1e3a5f;font-size:10px;outline:none;width:120px;height:20px;}
.search-sm::placeholder{color:#64748b;}

/* ═══ TABLE AREA — fills remaining space ═══ */ /* NE JAMAIS MODIFIER */
.table-area{flex:1;overflow:auto;border:1px solid #cbd5e1;border-top:none;margin:0 4px 4px 4px;border-radius:0 0 6px 6px;background:#ffffff;}
table{border-collapse:collapse;font-size:var(--tbl-zoom);width:100%;table-layout:fixed;}
thead{position:sticky;top:0;z-index:5;}
th{background:linear-gradient(to bottom,#04152c,#4a8ef5);color:var(--goldL);padding:3px 4px;text-align:center;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--gold);border-right:1px solid rgba(255,255,255,.12);white-space:nowrap;user-select:none;position:relative;}
th:last-child{border-right:none;}
.resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:6;background:rgba(59,130,246,.25);transition:background .15s;border-radius:1px;}
.resize-handle:hover,.resize-handle.active{background:rgba(59,130,246,.7);}
body.col-resizing{cursor:col-resize!important;user-select:none!important;}
body.col-resizing *{cursor:col-resize!important;}
td{padding:1px 3px;border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;vertical-align:middle;text-align:center;font-size:var(--tbl-zoom);height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b;}
td:last-child{border-right:none;}
td.td-edit{cursor:pointer;padding:2px 4px;min-height:22px;}
td.td-edit:hover{background:#eef2ff;}
tr:hover td{background:#f8fafc;}
/* Date row */
tr.date-row td{background:#fef3c7;color:#92400e;font-weight:700;font-size:12px;padding:4px 8px;text-align:left;height:auto;border-bottom:1px solid #fcd34d;}
tr.date-row:hover td{background:#fde68a;}
.date-inner{display:flex;align-items:center;gap:6px;}
.date-lbl{cursor:pointer;padding:1px 4px;border-radius:3px;}
.date-lbl:hover{background:rgba(251,191,36,.3);}
.date-del{cursor:pointer;opacity:.3;font-size:9px;transition:opacity .15s;}
.date-del:hover{opacity:1;color:var(--err);}
.date-inp{background:#fff;border:1px solid var(--gold);color:#92400e;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;width:110px;text-align:center;}

/* Editable cells */
.c-cmd{font-weight:700;color:#1d4ed8;font-family:'Consolas',monospace;}
.c-po{font-weight:600;color:#6d28d9;}
.c-item{font-weight:500;color:#1e293b;text-align:left;white-space:normal;word-wrap:break-word;line-height:1.2;}
.c-client{font-weight:600;}
.c-empty{color:#cbd5e1;}
/* Serie star */
.serie-star{color:var(--goldL);font-size:14px;cursor:pointer;margin-right:2px;vertical-align:middle;filter:drop-shadow(0 0 2px rgba(251,191,36,.5));}
.serie-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;}
.row-x{cursor:pointer;opacity:0;font-size:10px;color:#94a3b8;transition:opacity .15s;padding:0 2px;}
tr:hover .row-x{opacity:.5;}
.row-x:hover{opacity:1 !important;color:#ef4444;}
/* Edit input */
.e-inp{width:100%;background:#fff;border:1px solid #3b82f6;color:#1e293b;padding:1px 4px;border-radius:2px;font-size:var(--tbl-zoom);outline:none;font-family:inherit;}
.e-inp:focus{border-color:#2563eb;background:#f0f9ff;}

/* ═══ DROPDOWN PICKER ═══ */
.dd-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:260;align-items:center;justify-content:center;padding:16px;}
.dd-overlay.show{display:flex;}
.dd-panel{background:#fff;border:2px solid #3b82f6;border-radius:10px;width:340px;max-width:95vw;max-height:70vh;overflow:hidden;animation:modalIn .12s ease;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.dd-header{padding:8px 12px;background:linear-gradient(to right,#04152c,#2563eb);display:flex;justify-content:space-between;align-items:center;}
.dd-header span{font-size:12px;font-weight:700;color:#fff;}
.dd-header button{background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;}
.dd-header button:hover{color:#fff;}
.dd-search{width:100%;padding:6px 10px;border:none;border-bottom:1px solid #e2e8f0;font-size:12px;outline:none;color:#1e293b;}
.dd-search:focus{background:#f0f9ff;}
.dd-list{max-height:50vh;overflow-y:auto;padding:4px 0;}
.dd-item{padding:8px 14px;cursor:pointer;font-size:12px;color:#1e293b;transition:background .1s;border-bottom:1px solid #f1f5f9;}
.dd-item:hover{background:#eef2ff;}
.dd-item.selected{background:#dbeafe;color:#1d4ed8;font-weight:700;}
.dd-item.clear{color:#ef4444;font-style:italic;}

/* ═══ COLUMN SETTINGS PANEL — horizontal cards ═══ */
.col-panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding-top:90px;}
.col-panel-overlay.show{display:flex;}
.col-panel{background:var(--bg2);border:2px solid var(--info);border-radius:8px;max-width:95vw;overflow:hidden;animation:modalIn .15s ease;}
.col-panel-h{padding:6px 12px;font-size:10px;font-weight:800;color:var(--info);background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);display:flex;justify-content:space-between;align-items:center;}
.col-panel-h button{background:none;border:1px solid var(--bdr);color:var(--mutd);font-size:8px;padding:2px 6px;border-radius:3px;cursor:pointer;}
.col-panel-h button:hover{color:var(--txt);border-color:var(--txt);}
.col-panel-body{display:flex;flex-direction:row;gap:0;padding:6px 8px;overflow-x:auto;align-items:stretch;}
.col-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;min-width:70px;border:1px solid rgba(255,255,255,.08);border-radius:5px;background:rgba(255,255,255,.02);cursor:grab;user-select:none;transition:all .15s;flex-shrink:0;}
.col-card:hover{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.2);}
.col-card.dragging{opacity:.3;background:rgba(59,130,246,.1);}
.col-card.drag-over{border-left:3px solid var(--info);padding-left:5px;}
.col-card .cc-handle{font-size:8px;color:var(--mutd);line-height:1;letter-spacing:1px;}
.col-card .cc-label{font-size:10px;font-weight:700;color:var(--txt);text-align:center;white-space:nowrap;}
.col-card .cc-label.off{color:var(--mutd);opacity:.5;text-decoration:line-through;}
.col-card input[type="checkbox"]{width:13px;height:13px;accent-color:var(--info);cursor:pointer;}
.gear-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;cursor:pointer;font-size:10px;transition:all .2s;flex-shrink:0;padding:0;}
.gear-btn:hover{background:rgba(255,255,255,.2);transform:rotate(45deg);}

/* ═══ SERIE+ MODAL ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:2px solid var(--info);border-radius:10px;width:420px;max-width:95vw;max-height:85vh;overflow:hidden;animation:modalIn .15s ease;}
.modal-header{padding:10px 14px;background:linear-gradient(to right,#04152c,#1e293b);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--info);}
.modal-header h3{font-size:13px;color:var(--txt);font-weight:700;}
.modal-close{background:none;border:none;color:var(--mutd);font-size:16px;cursor:pointer;}
.modal-close:hover{color:#fff;}
.modal-body{padding:12px;overflow-y:auto;max-height:calc(85vh - 50px);}
.serie-match-info{border:1px solid var(--info);border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.serie-match-info .smi-label{font-size:9px;font-weight:800;color:var(--info);}
.serie-match-info .smi-value{font-size:12px;font-weight:600;color:var(--txt);}
.item-choice{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.item-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:5px;background:rgba(255,255,255,.03);color:var(--txt);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.item-btn:hover{border-color:var(--info);background:rgba(59,130,246,.08);}
.item-btn.selected{border-color:var(--info);background:rgba(59,130,246,.15);color:#93c5fd;}
.item-btn.done{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok);cursor:default;opacity:.8;}
.grandeur-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--bdr);border-radius:5px;margin-bottom:4px;transition:all .15s;}
.grandeur-row:hover{background:rgba(255,255,255,.03);}
.grandeur-row.checked{background:rgba(34,197,94,.15);border-color:var(--ok);}
.grandeur-row .g-name{font-weight:700;font-size:12px;min-width:60px;color:#e2e8f0;}
.grandeur-row .g-qty{font-size:10px;color:var(--mutd);}
.grandeur-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--ok);cursor:pointer;}

/* ═══ TOAST ═══ */
.toast-box{position:fixed;top:6px;right:6px;z-index:300;}
.toast{padding:4px 10px;border-radius:3px;font-size:10px;font-weight:600;margin-bottom:3px;animation:toastIn .25s ease;color:#fff;}
.toast.ok{background:var(--ok);}.toast.info{background:var(--info);}.toast.err{background:var(--err);}
@keyframes toastIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ═══ LOGIN ═══ */
.login-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,#0b1d36,#3f6eb8);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;}
.login-overlay.hidden{display:none;}
.login-panel{background:linear-gradient(to bottom,#0b2343,#06315a);border-radius:14px;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 30px rgba(0,0,0,.85);padding:20px 24px;max-width:380px;width:100%;color:#fff;text-align:center;}
.login-panel img{height:70px;margin:8px auto 10px;}
.login-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.login-author{font-family:'Brush Script MT','Segoe Script',cursive;font-size:16px;color:rgba(255,255,255,.7);font-style:italic;}
.login-sub{font-size:11px;opacity:.8;margin:8px 0 12px;}
.login-inp{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;font-size:14px;text-align:center;margin-bottom:10px;}
.login-inp::placeholder{color:rgba(255,255,255,.5);font-size:12px;}
.login-inp:focus{outline:none;border-color:#00aaff;box-shadow:0 0 8px rgba(0,170,255,.3);}
.login-btn{width:100%;padding:10px;border-radius:999px;border:none;background:linear-gradient(to bottom,#00aaff,#0077cc);color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-bottom:8px;}
.login-btn:hover{background:linear-gradient(to bottom,#00bbff,#0088dd);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{color:#ff6666;font-size:10px;min-height:16px;}
.login-rem{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 8px;font-size:11px;color:rgba(255,255,255,.8);}
.login-rem input{width:14px;height:14px;accent-color:#00aaff;cursor:pointer;}

/* ═══ LOGO NAV ═══ */
.logo-flip-container{position:relative;cursor:pointer;z-index:99995;}

/* ═══ PRINT ═══ */
@media print{
  .topbar,.toolbar,.row-x,.date-del{display:none !important;}
  body{background:#fff;color:#000;overflow:visible;height:auto;}
  .table-area{border:none;margin:0;overflow:visible;max-height:none;flex:none;}
  table{font-size:10px;}
  th{background:#4a8ef5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  tr.date-row td{background:#fef3c7 !important;color:#92400e !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<script>if(localStorage.getItem('physipro_last_email')){document.write('<style id="preauth-hide">.login-overlay{display:none !important;}</style>');}</script>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-panel">
    <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
    <div class="login-title">Outil de gestion simplifiée</div>
    <div class="login-author">par Daniel Charest</div>
    <div class="login-sub">Connectez-vous avec votre email d'entreprise</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="tb-left">
    <div class="logo-flip-container" id="logoFlipContainer">
      <div class="logo-main">
        <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
        <span class="logo-bottom-text">Insp. Finale</span>
      </div>

    <span class="status-dot" id="statusDot"></span>
    <span class="user-name" id="userBadge"></span>

<!-- TOOLBAR -->
<div class="toolbar">
  <label>📋</label>
  <input type="text" id="insp-bon" placeholder="# commande + Entrée" onkeydown="if(event.key==='Enter')addBon()" style="width:150px;background:rgba(255,255,255,.95);border:2px solid #fbbf24;color:#1e293b;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;">

</div>

<!-- COLUMN SETTINGS MODAL -->

  </div>
</div>

<!-- TABLE -->
<div class="table-area" id="tableArea">
  <table id="mainTable">
    <colgroup id="cg"></colgroup>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="toast-box" id="toastBox"></div>

<!-- SERIE+ MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">

    <div class="modal-header"><h3 id="modalTitle">Série+</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- DROPDOWN PICKER -->
<div class="dd-overlay" id="ddOverlay" onclick="if(event.target===this)closeDd()">
  <div class="dd-panel">
    <div class="dd-header"><span id="ddTitle">Sélectionner</span><button onclick="closeDd()">✕</button></div>
    <input type="text" class="dd-search" id="ddSearch" placeholder="🔍 Filtrer..." oninput="filterDd()">

</div>

<script>
/* ═══════════════════════════════════════════════════════
 * INSPECTION FINALE — PhysiPro
 * Firebase path: inspectionFinaleData
 * ~400 lignes pré-générées, colonnes: # Commande PO Item
 * ═══════════════════════════════════════════════════════ */

/* ═══ FIREBASE ═══ */
var _k=['AIza','SyCk','7bqV','nx08','Kz1f','Vq1W','24Au','W854','KY9j','Pno'];
firebase.initializeApp({

function colDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function colDrop(e){
  e.preventDefault();
  var target=e.currentTarget;target.classList.remove('drag-over');
  if(!_dragSrc||target===_dragSrc)return;
  var srcId=_dragSrc.getAttribute('data-colid');
  var tgtId=target.getAttribute('data-colid');
  var cfg=getColCfg();
  var order=cfg.order.slice();
  var si=order.indexOf(srcId),ti=order.indexOf(tgtId);

  var newTi=order.indexOf(tgtId);

  cfg.order=order;
  saveColCfg(cfg);_lastColSig='';
  openColPanel();
  renderTable();
}
function colDragEnd(e){

  for(var i=0;i<rows.length;i++){if(rows[i].type==='entry')entryCount++;}
  var need=EMPTY_ROWS-entryCount;

  for(var j=0;j<need;j++){

}

/* ═══ FIREBASE SYNC ═══ */
function pushFB(){
  if(!fbUser){setSB('offline');return;}
  var data=load();
  // Ne pusher que les données utiles (lignes non-vides + dates)
  var clean={};
  Object.keys(data).forEach(function(m){
    var rows=data[m]||[];
    var filtered=rows.filter(function(r){
      if(r.type==='date')return true;
      if(r.type==='entry')return(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.comment);
      return false;
    });
    if(filtered.length>0)clean[m]=filtered;
  });
  _fbW=true;setSB('syncing');
  fbDb.ref(FB).set(clean).then(function(){setTimeout(function(){_fbW=false;setSB('online');},1200);})
  .catch(function(e){_fbW=false;setSB('offline');console.error('FB err:',e.message);});
}
function debPush(){clearTimeout(_syncT);_syncT=setTimeout(pushFB,800);}

function _merge(fb,loc){
  var m={};
  if(fb)Object.keys(fb).forEach(function(k){m[k]=(fb[k]||[]).slice();});
  if(loc)Object.keys(loc).forEach(function(k){
    if(!m[k]){m[k]=(loc[k]||[]).slice();return;}
    var ids={};m[k].forEach(function(r){if(r.id)ids[r.id]=true;});
    (loc[k]||[]).forEach(function(r){if(r.id&&!ids[r.id])m[k].push(r);});
  });
  return m;
}

function startSync(){
  if(_syncPhase!=='idle')return;_syncPhase='syncing';
  fbDb.ref(FB).once('value').then(function(s){
    var fb=s.val(),loc=load();
    if(fb){var merged=_merge(fb,loc);localStorage.setItem(LK,JSON.stringify(merged));}
    _syncPhase='live';renderTable();
    setTimeout(listenFB,1500);
    loadSerieCards();
  }).catch(function(){_syncPhase='live';renderTable();});
  setTimeout(function(){if(_syncPhase==='syncing'){_syncPhase='live';renderTable();}},8000);
}
function listenFB(){
  if(_fbL)fbDb.ref(FB).off('value',_fbL);
  _fbL=fbDb.ref(FB).on('value',function(s){
    if(_fbW||_syncPhase==='syncing')return;
    var fb=s.val();if(!fb)return;
    var loc=load();var merged=_merge(fb,loc);
    localStorage.setItem(LK,JSON.stringify(merged));renderTable();
  });
}
function stopSync(){if(_fbL){fbDb.ref(FB).off('value',_fbL);_fbL=null;}_syncPhase='idle';}
function doRefresh(){
  if(!fbDb||!fbUser){renderTable();toast('🔄 Local','info');return;}
  setSB('syncing');
  fbDb.ref(FB).once('value').then(function(s){
    var fb=s.val();if(fb){var loc=load();var m=_merge(fb,loc);localStorage.setItem(LK,JSON.stringify(m));}
    renderTable();setSB('online');toast('🔄 OK','ok');

function confirmSerie(){
  var ctx=window._serieCtx;if(!ctx)return;
  var checked=[];
  document.querySelectorAll('[id^="gc_"]').forEach(function(chk){
    if(chk.checked){
      var parts=chk.id.replace('gc_','').split('-');
      checked.push({ii:parseInt(parts[0]),gi:parseInt(parts[1])});
    }
  });
  if(!checked.length){toast('Sélectionnez au moins un item','err');return;}
  var card=ctx.card;var itemLines=[];var totalQty=0;
  checked.forEach(function(c){
    var item=card.items[c.ii];if(!item)return;
    var g=item.grandeurs[c.gi];if(!g)return;
    var tQ=parseInt(g.qty)||0;
    var gName=g.name||'STD';var iName=item.name||'';
    itemLines.push((iName?iName+'|':'')+gName+' '+tQ+'x');
    totalQty+=tQ;
  });
  var md=gmd();
  var targetIdx=window._serieTargetRow;
  window._serieTargetRow=null;

  // Si on a une ligne cible (tapé dans une cellule Commande ou clic étoile), remplir cette ligne

      var rr=md.rows[ri];
      if(rr.type==='entry'&&!rr.cmd&&!rr.po&&!rr.client&&!rr.desc&&!rr.item&&!rr.qty&&!rr.comment){
        rr.cmd=ctx.bon;rr.po=card.numeroPO||'';rr.client=ctx.clientLabel;
        rr.item=itemLines.join(', ');rr.qty=String(totalQty);rr.serieLinked=true;
        filled=true;break;
      }
    }
    if(!filled){
      md.rows.push({
        id:'e-'+Date.now()+'-'+Math.random().toString(36).substr(2,4),
        type:'entry',cmd:ctx.bon,po:card.numeroPO||'',
        client:ctx.clientLabel,desc:'',
        item:itemLines.join(', '),qty:String(totalQty),
        comment:'',serieLinked:true
      });
    }
  }
  md.data[md.month]=md.rows;save(md.data);
  closeModal();_serieCache={};renderTable();
  toast('✅ #'+ctx.bon+' Série+ ajouté','ok');
}

  document.addEventListener('mousemove',onResize);
  document.addEventListener('mouseup',stopResize);

  if(!_resize)return;
  var diff=e.clientX-_resize.startX;
  _resize.col.style.width=Math.max(30,_resize.startW+diff)+'px';
}
function stopResize(e){
  if(!_resize)return;
  var nw=Math.max(30,_resize.startW+(e.clientX-_resize.startX));
  _resize.col.style.width=nw+'px';
  var w=getColWidths();w[_resize.colId]=nw;saveColWidths(w);
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.resize-handle').forEach(function(h){h.classList.remove('active');});
  document.removeEventListener('mousemove',onResize);
  document.removeEventListener('mouseup',stopResize);

    cgH+='<col data-colid="'+c.id+'" style="width:'+(c.id==='item'||c.id==='desc'||c.id==='comment'?'auto':w+'px')+';">';
  });
  cg.innerHTML=cgH;
  // Thead
  var thH='<tr>';
  vis.forEach(function(c){
    var align=(c.id==='desc'||c.id==='item'||c.id==='comment')?' style="text-align:left;padding-left:6px;"':'';
    var resizer=(!c.fixed)?'<div class="resize-handle" onmousedown="startResize(event,\''+c.id+'\')"></div>':'';
    thH+='<th'+align+'>'+c.label+resizer+'</th>';
  });
  thH+='</tr>';
  thead.innerHTML=thH;
  return vis;
}

/* ═══ RENDER ═══ */
function renderTable(){
  if(_syncPhase==='syncing')return;
  var md=gmd();
  var added=ensureRows(md);
  if(added){md.data[md.month]=md.rows;localStorage.setItem(LK,JSON.stringify(md.data));}

  var vis=buildHead();
  var nc=vis.length;
  _serieCache={}; /* reset per render */
  var rows=md.rows;
  var f=getSF();
  var tb=document.getElementById('tbody');if(!tb)return;
  var h='';var num=0;

  for(var i=0;i<rows.length;i++){
    var r=rows[i];if(!r)continue;

    if(r.type==='date'){
      if(f)continue;
      h+='<tr class="date-row"><td colspan="'+nc+'"><div class="date-inner">';
      h+='<span class="date-lbl" onclick="editDateSep(event,'+i+')">📅 '+esc(r.dateLabel)+'</span>';
      h+='<span class="date-del" onclick="delRow('+i+')" title="Supprimer">✕</span>';
      h+='</div></td></tr>';
      continue;
    }

    if(r.type!=='entry')continue;

    if(f){
      var hay=((r.cmd||'')+(r.po||'')+(r.client||'')+(r.desc||'')+(r.item||'')+(r.qty||'')+(r.comment||'')).toLowerCase();
      if(hay.indexOf(f)<0)continue;
    }

    num++;
    var hasData=(r.cmd||'')+(r.po||'')+(r.client||'')+(r.desc||'')+(r.item||'')+(r.qty||'')+(r.comment||'');
    var isSerie=r.serieLinked||false;
    // Auto-detect serie if cmd matches
    if(!isSerie&&r.cmd){var _sf=_cachedFind(r.cmd);if(_sf)isSerie=true;}

    h+='<tr data-idx="'+i+'">';
    vis.forEach(function(c){
      if(c.id==='num'){
        h+='<td style="color:#94a3b8;font-size:9px;">'+(isSerie?'<span class="serie-star" title="Cliquer pour ouvrir Série+" onclick="reopenSerie(\''+esc(r.cmd).replace(/'/g,"\\'")+'\','+i+')">⭐</span>':num)+'</td>';
      }else if(c.id==='del'){
        h+='<td>'+(hasData?'<span class="row-x" onclick="delRow('+i+')">✕</span>':'')+'</td>';
      }else if(c.id==='client'){
        var cv=r.client||'';
        if(!cv&&r.cmd){var _sc=_cachedFind(r.cmd);if(_sc){cv=getSerieAutoClient(_sc.card)||_sc.card.client||'';}}
        var clColor='';var cvL=(cv||'').toLowerCase();
        if(cvL.indexOf('france')>=0)clColor='#b45309';
        else if(cvL.indexOf('vermeiren')>=0)clColor='#15803d';
        else if(cvL.indexOf('hme')>=0)clColor='#92400e';
        else if(cvL.indexOf('c1south')>=0)clColor='#7c3aed';
        else if(cvL.indexOf('cubro')>=0)clColor='#0e7490';
        else if(cvL.indexOf('inventaire')>=0)clColor='#c2410c';
        var cStyle=clColor?'color:'+clColor+';font-weight:800;':'';
        h+='<td class="td-edit c-client'+(cv?'':' c-empty')+'" style="'+cStyle+'cursor:pointer;" data-field="client" data-idx="'+i+'">'+(cv?esc(cv):'')+'</td>';
      }else{
        var val=r[c.field]||'';
        var cls=c.cls||'c-item';
        var align=(c.align==='center')?'text-align:center;':'text-align:left;';
        h+='<td class="td-edit '+cls+(val?'':' c-empty')+'" style="'+align+'cursor:pointer;" data-field="'+c.field+'" data-idx="'+i+'">'+(val?esc(val):'')+'</td>';
      }
    });
    h+='</tr>';
  }

  tb.innerHTML=h;
}

/* ═══ EVENT DELEGATION — clic sur tout le td ═══ */
document.addEventListener('DOMContentLoaded',function(){
  var tb=document.getElementById('tbody');
  if(tb)tb.addEventListener('click',function(e){
    // Ignore si on clique sur un input déjà ouvert
    if(e.target.tagName==='INPUT')return;
    var td=e.target.closest('td[data-field][data-idx]');
    if(!td)return;
    var idx=parseInt(td.getAttribute('data-idx'));
    var field=td.getAttribute('data-field');
    var colDef=ALL_COLS.find(function(c){return c.field===field;});
    editCell(idx,field,td,{ph:colDef?colDef.ph:'',align:colDef?colDef.align:''});
  });
});

/* ═══ DOM READY ═══ */
document.addEventListener('DOMContentLoaded',function(){
  mkOffB();initMonths();
  var se=localStorage.getItem('physipro_last_email');
  if(se){var ei=document.getElementById('loginEmail');if(ei&&!ei.value)ei.value=se;}
  var loc=load();var cnt=0;Object.keys(loc).forEach(function(m){if(Array.isArray(loc[m]))loc[m].forEach(function(r){if(r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.comment))cnt++;});});
  // Always render on load — shows 400 empty rows even first time
  _syncPhase='live';renderTable();_syncPhase='idle';
});
