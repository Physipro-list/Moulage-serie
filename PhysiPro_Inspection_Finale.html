<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Inspection Finale</title>
<meta name="theme-color" content="#04152c">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bdr:#334155;--gold:#c9a227;--goldL:#fbbf24;--txt:#e2e8f0;--mutd:#94a3b8;--ok:#22c55e;--err:#ef4444;--info:#3b82f6;--purp:#7c3aed;--tbl-zoom:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
select{color-scheme:dark;background-color:#1e293b !important;color:#e2e8f0 !important;}
select option{background:#1e293b !important;color:#e2e8f0 !important;font-size:12px;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:12px;display:flex;flex-direction:column;min-width:320px;}

/* ═══ TOPBAR ═══ */
.topbar{width:100%;height:48px;min-height:48px;padding:0 10px;display:flex;align-items:center;background:linear-gradient(to bottom,#04152c,#4a8ef5);box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;z-index:100;gap:6px;flex-shrink:0;}
.tb-left{display:flex;align-items:center;flex-shrink:0;}
.logo-main{display:flex;align-items:center;gap:6px;}
.logo-main img{height:28px;width:auto;filter:brightness(1.1) drop-shadow(0 1px 3px rgba(0,0,0,.3));}
.logo-bottom-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
.tb-center{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.top-title{font-size:clamp(11px,2vw,18px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fdfdfd;text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.user-name{font-size:9px;color:rgba(255,255,255,.8);font-weight:600;}
.tb-logout-btn{font-size:7px;padding:1px 3px;border:1px solid rgba(255,255,255,.15);border-radius:3px;color:rgba(255,255,255,.5);text-decoration:none;line-height:1;}
.tb-logout-btn:hover{background:rgba(255,255,255,.15);color:#fff;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;}
.status-dot.connected{background:#22c55e;box-shadow:0 0 3px rgba(34,197,94,.6);}
.sync-indicator{font-size:8px;padding:1px 4px;border-radius:3px;white-space:nowrap;}
.sync-indicator.online{background:rgba(34,197,94,.15);color:var(--ok);}
.sync-indicator.offline{background:rgba(239,68,68,.15);color:var(--err);}
.sync-indicator.syncing{background:rgba(251,191,36,.15);color:var(--goldL);}

/* ═══ TOOLBAR ═══ */
.toolbar{display:flex;gap:4px;align-items:center;padding:4px 8px;background:linear-gradient(to bottom,#04152c,#4a8ef5);flex-wrap:wrap;flex-shrink:0;min-height:32px;}
.toolbar label{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.toolbar .divider{width:1px;height:18px;background:rgba(255,255,255,.2);flex-shrink:0;}
.tb-btn{padding:2px 7px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.7);background:none;transition:all .15s;white-space:nowrap;}
.tb-btn:hover{border-color:var(--goldL);color:var(--goldL);background:rgba(255,255,255,.06);}
.month-select{background:rgba(255,255,255,.12) !important;border:1px solid rgba(255,255,255,.2) !important;color:#fff !important;font-weight:700;font-size:10px;padding:1px 4px;border-radius:3px;cursor:pointer;}
.month-select option{background:#0f172a !important;color:#fbbf24 !important;font-weight:700;}
.search-sm{background:rgba(255,255,255,.9);border:1px solid #3b82f6;border-radius:10px;padding:1px 6px;color:#1e3a5f;font-size:10px;outline:none;width:120px;height:20px;}
.search-sm::placeholder{color:#64748b;}

/* ═══ TABLE AREA ═══ */
.table-area{flex:1;overflow:auto;border:1px solid #cbd5e1;border-top:none;margin:0 4px 4px 4px;border-radius:0 0 6px 6px;background:#ffffff;}
table{border-collapse:collapse;font-size:var(--tbl-zoom);width:auto;table-layout:fixed;}
thead{position:sticky;top:0;z-index:5;}
th{background:linear-gradient(to bottom,#04152c,#4a8ef5);color:var(--goldL);padding:3px 4px;text-align:center;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--gold);border-right:1px solid rgba(255,255,255,.12);white-space:nowrap;user-select:none;position:relative;}
th:last-child{border-right:none;}
body.col-resizing{cursor:col-resize!important;user-select:none!important;}
body.col-resizing *{cursor:col-resize!important;}
td{padding:1px 3px;border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;vertical-align:middle;text-align:center;font-size:var(--tbl-zoom);min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b;}
td:last-child{border-right:none;}
td.td-edit{cursor:pointer;padding:2px 4px;min-height:22px;}
td.td-edit:hover{background:#eef2ff;}
td.td-chk{width:24px;text-align:center;padding:0;}
td.td-chk input{width:15px;height:15px;accent-color:#ef4444;cursor:pointer;}
tr.del-selected td{background:#fef2f2 !important;}
tr.del-selected td.td-chk{background:#fee2e2 !important;}
.tb-btn.del-active{background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444;}
tr:hover td{background:#f8fafc;}
tr.date-row td{background:#fef3c7;color:#92400e;font-weight:700;font-size:12px;padding:4px 8px;text-align:left;height:auto;border-bottom:1px solid #fcd34d;}
tr.date-row:hover td{background:#fde68a;}
.date-inner{display:flex;align-items:center;gap:6px;}
.date-lbl{cursor:pointer;padding:1px 4px;border-radius:3px;}
.date-lbl:hover{background:rgba(251,191,36,.3);}
.date-del{cursor:pointer;opacity:.3;font-size:9px;transition:opacity .15s;}
.date-del:hover{opacity:1;color:var(--err);}
.date-inp{background:#fff;border:1px solid var(--gold);color:#92400e;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;width:110px;text-align:center;}
.c-cmd{font-weight:700;color:#1d4ed8;font-family:'Consolas',monospace;}
.c-po{font-weight:600;color:#6d28d9;}
.c-item{font-weight:500;color:#1e293b;text-align:left;word-wrap:break-word;line-height:1.25;overflow:hidden;height:auto;white-space:normal;max-height:2.5em;word-break:break-word;}
.si-cell{text-align:left;line-height:1.1;white-space:normal;overflow:hidden;}
.si-row{display:flex;align-items:flex-start;white-space:normal;line-height:1.25;overflow:hidden;}
.si-badge{display:inline-block;width:22px;min-width:22px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.3);border-radius:3px;color:#7c3aed;font-weight:700;font-size:9px;padding:0 2px;text-align:right;box-sizing:border-box;flex-shrink:0;margin-top:1px;}
.si-badge.part{background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.4);color:#b45309;}
.si-name{font-size:9px;color:#1e293b;padding-left:3px;font-weight:600;overflow:hidden;word-break:break-word;line-height:1.2;flex:1;min-width:0;max-height:2.4em;}
.c-client{font-weight:600;}
.c-empty{color:#cbd5e1;}
.serie-star{color:#f59e0b;font-size:18px;cursor:pointer;margin-right:3px;vertical-align:middle;text-shadow:0 0 2px #fff,0 0 4px #fff,0 1px 2px rgba(180,83,9,.6);filter:drop-shadow(0 0 3px rgba(245,158,11,.7));transition:transform .12s,color .12s;line-height:1;}
.serie-star:hover{transform:scale(1.25);color:#d97706;}
/* Cellule date sur chaque ligne (remplace la colonne #) */
.td-date{background:#fff;color:#334155;font-weight:600;font-size:11px;text-align:center;cursor:pointer;font-family:Consolas,monospace;letter-spacing:.3px;padding:1px 2px;}
.td-date:hover{background:#f1f5f9;}
.td-date input{width:100%;background:#fff;border:1px solid #3b82f6;color:#1e293b;padding:1px 2px;border-radius:2px;font-size:11px;outline:none;font-family:inherit;}
.serie-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;}
.row-x{cursor:pointer;opacity:0;font-size:10px;color:#94a3b8;transition:opacity .15s;padding:0 2px;}
tr:hover .row-x{opacity:.5;}
.row-x:hover{opacity:1 !important;color:#ef4444;}
.e-inp{width:100%;background:#fff;border:1px solid #3b82f6;color:#1e293b;padding:1px 4px;border-radius:2px;font-size:var(--tbl-zoom);outline:none;font-family:inherit;}
.e-inp:focus{border-color:#2563eb;background:#f0f9ff;}

/* ═══ DROPDOWN PICKER ═══ */
.dd-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:260;align-items:center;justify-content:center;padding:16px;}
.dd-overlay.show{display:flex;}
.dd-panel{background:#fff;border:2px solid #3b82f6;border-radius:10px;width:340px;max-width:95vw;max-height:70vh;overflow:hidden;animation:modalIn .12s ease;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.dd-header{padding:8px 12px;background:linear-gradient(to right,#04152c,#2563eb);display:flex;justify-content:space-between;align-items:center;}
.dd-header span{font-size:12px;font-weight:700;color:#fff;}
.dd-header button{background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;}
.dd-header button:hover{color:#fff;}
.dd-search{width:100%;padding:6px 10px;border:none;border-bottom:1px solid #e2e8f0;font-size:12px;outline:none;color:#1e293b;}
.dd-search:focus{background:#f0f9ff;}
.dd-list{max-height:50vh;overflow-y:auto;padding:4px 0;}
.dd-item{padding:8px 14px;cursor:pointer;font-size:12px;color:#1e293b;transition:background .1s;border-bottom:1px solid #f1f5f9;}
.dd-item:hover{background:#eef2ff;}
.dd-item.selected{background:#dbeafe;color:#1d4ed8;font-weight:700;}
.dd-item.clear{color:#ef4444;font-style:italic;}

/* ═══ PRINT MODAL ═══ */
.print-option{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.print-option:hover{background:#eef2ff;border-color:#3b82f6;}
.print-option.selected{background:#dbeafe;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2);}
.print-option input[type="radio"]{width:16px;height:16px;accent-color:#2563eb;cursor:pointer;}
.print-option .po-label{font-size:12px;font-weight:600;color:#1e293b;}
.print-option .po-sub{font-size:10px;color:#64748b;}
.print-dates{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.print-dates select{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;color:#1e293b;background:#fff;cursor:pointer;}
.print-dates select:focus{border-color:#2563eb;outline:none;}
.print-dates span{font-size:11px;color:#64748b;font-weight:600;}
.print-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.print-actions button{padding:8px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.print-btn-main{background:#2563eb;border:none;color:#fff;}
.print-btn-main:hover{background:#1d4ed8;}
.print-btn-sec{background:none;border:1px solid #cbd5e1;color:#64748b;}
.print-btn-sec:hover{border-color:#2563eb;color:#2563eb;}
.print-preview-count{font-size:11px;color:#64748b;margin-top:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;text-align:center;}

/* ═══ COLUMN SETTINGS PANEL ═══ */
.col-panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding-top:90px;}
.col-panel-overlay.show{display:flex;}
.col-panel{background:var(--bg2);border:2px solid var(--info);border-radius:8px;max-width:95vw;overflow:hidden;animation:modalIn .15s ease;}
.col-panel-h{padding:6px 12px;font-size:10px;font-weight:800;color:var(--info);background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);display:flex;justify-content:space-between;align-items:center;}
.col-panel-h button{background:none;border:1px solid var(--bdr);color:var(--mutd);font-size:8px;padding:2px 6px;border-radius:3px;cursor:pointer;}
.col-panel-h button:hover{color:var(--txt);border-color:var(--txt);}
.col-panel-body{display:flex;flex-direction:row;gap:0;padding:6px 8px;overflow-x:auto;align-items:stretch;}
.col-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;min-width:70px;border:1px solid rgba(255,255,255,.08);border-radius:5px;background:rgba(255,255,255,.02);cursor:grab;user-select:none;transition:all .15s;flex-shrink:0;}
.col-card:hover{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.2);}
.col-card.dragging{opacity:.3;background:rgba(59,130,246,.1);}
.col-card.drag-over{border-left:3px solid var(--info);padding-left:5px;}
.col-card .cc-handle{font-size:8px;color:var(--mutd);line-height:1;letter-spacing:1px;}
.col-card .cc-label{font-size:10px;font-weight:700;color:var(--txt);text-align:center;white-space:nowrap;}
.col-card .cc-label.off{color:var(--mutd);opacity:.5;text-decoration:line-through;}
.col-card input[type="checkbox"]{width:13px;height:13px;accent-color:var(--info);cursor:pointer;}
.gear-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;cursor:pointer;font-size:10px;transition:all .2s;flex-shrink:0;padding:0;}
.gear-btn:hover{background:rgba(255,255,255,.2);transform:rotate(45deg);}

/* ═══ SERIE+ MODAL ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:2px solid var(--info);border-radius:10px;width:420px;max-width:95vw;max-height:85vh;overflow:hidden;animation:modalIn .15s ease;}
.modal-header{padding:10px 14px;background:linear-gradient(to right,#04152c,#1e293b);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--info);}
.modal-header h3{font-size:13px;color:var(--txt);font-weight:700;}
.modal-close{background:none;border:none;color:var(--mutd);font-size:16px;cursor:pointer;}
.modal-close:hover{color:#fff;}
.modal-body{padding:12px;overflow-y:auto;max-height:calc(85vh - 50px);}
.serie-match-info{border:1px solid var(--info);border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.serie-match-info .smi-label{font-size:9px;font-weight:800;color:var(--info);}
.serie-match-info .smi-value{font-size:12px;font-weight:600;color:var(--txt);}
.item-choice{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.item-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:5px;background:rgba(255,255,255,.03);color:var(--txt);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.item-btn:hover{border-color:var(--info);background:rgba(59,130,246,.08);}
.item-btn.selected{border-color:var(--info);background:rgba(59,130,246,.15);color:#93c5fd;}
.item-btn.done{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok);cursor:default;opacity:.8;}
.grandeur-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--bdr);border-radius:5px;margin-bottom:4px;transition:all .15s;}
.grandeur-row:hover{background:rgba(255,255,255,.03);}
.grandeur-row.checked{background:rgba(34,197,94,.15);border-color:var(--ok);}
.grandeur-row .g-name{font-weight:700;font-size:12px;min-width:60px;color:#e2e8f0;}
.grandeur-row .g-qty{font-size:10px;color:var(--mutd);}
.grandeur-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--ok);cursor:pointer;}

/* ═══ TOAST ═══ */
.toast-box{position:fixed;top:6px;right:6px;z-index:300;}
.toast{padding:4px 10px;border-radius:3px;font-size:10px;font-weight:600;margin-bottom:3px;animation:toastIn .25s ease;color:#fff;}
.toast.ok{background:var(--ok);}.toast.info{background:var(--info);}.toast.err{background:var(--err);}
@keyframes toastIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes modalIn{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ═══ LOGIN ═══ */
.login-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,#0b1d36,#3f6eb8);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;}
.login-overlay.hidden{display:none;}
.login-panel{background:linear-gradient(to bottom,#0b2343,#06315a);border-radius:14px;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 30px rgba(0,0,0,.85);padding:20px 24px;max-width:380px;width:100%;color:#fff;text-align:center;}
.login-panel img{height:70px;margin:8px auto 10px;}
.login-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.login-author{font-family:'Brush Script MT','Segoe Script',cursive;font-size:16px;color:rgba(255,255,255,.7);font-style:italic;}
.login-sub{font-size:11px;opacity:.8;margin:8px 0 12px;}
.login-inp{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;font-size:14px;text-align:center;margin-bottom:10px;}
.login-inp::placeholder{color:rgba(255,255,255,.5);font-size:12px;}
.login-inp:focus{outline:none;border-color:#00aaff;box-shadow:0 0 8px rgba(0,170,255,.3);}
.login-btn{width:100%;padding:10px;border-radius:999px;border:none;background:linear-gradient(to bottom,#00aaff,#0077cc);color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-bottom:8px;}
.login-btn:hover{background:linear-gradient(to bottom,#00bbff,#0088dd);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{color:#ff6666;font-size:10px;min-height:16px;}
.login-rem{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 8px;font-size:11px;color:rgba(255,255,255,.8);}
.login-rem input{width:14px;height:14px;accent-color:#00aaff;cursor:pointer;}
.logo-flip-container{position:relative;cursor:pointer;z-index:99995;}

/* ═══ PRINT ═══ */
@media print{
  .topbar,.toolbar,.row-x,.date-del{display:none !important;}
  body{background:#fff;color:#000;overflow:visible;height:auto;}
  .table-area{border:none;margin:0;overflow:visible;max-height:none;flex:none;}
  table{font-size:10px;}
  th{background:#4a8ef5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  tr.date-row td{background:#fef3c7 !important;color:#92400e !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
<script>if(localStorage.getItem('physipro_last_email')){document.write('<style id="preauth-hide">.login-overlay{display:none !important;}</style>');}</script>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-panel">
    <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
    <div class="login-title">Outil de gestion simplifiée</div>
    <div class="login-author">par Daniel Charest</div>
    <div class="login-sub">Connectez-vous avec votre email d'entreprise</div>
    <form id="loginForm" autocomplete="on" onsubmit="doLogin(event)">
      <input type="email" id="loginEmail" name="email" class="login-inp" placeholder="Email d'entreprise" autocomplete="username">
      <input type="password" id="loginPassword" name="password" class="login-inp" placeholder="Mot de passe" maxlength="50" autocomplete="current-password">
      <div class="login-rem"><input type="checkbox" id="loginRemember" checked><label for="loginRemember">Rester connecté</label></div>
      <button type="submit" class="login-btn" id="loginBtn">Se connecter</button>
    </form>
    <div class="login-err" id="loginError"></div>
  </div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="tb-left">
    <div class="logo-flip-container" id="logoFlipContainer">
      <div class="logo-main">
        <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
        <span class="logo-bottom-text">Insp. Finale</span>
      </div>
    </div>
  </div>
  <div class="tb-center"><span class="top-title">🔍 Inspection Finale</span></div>
  <div class="tb-right">

/* ═══ ENSURE EMPTY ROWS ═══ */
/* Garantit toujours 20 lignes vides APRÈS la dernière ligne remplie */
function ensureRows(md){
  var rows=md.rows;
  // Trouver l'index de la dernière ligne remplie (entry avec au moins un champ)
  var lastFilledIdx=-1;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.type==='date'){lastFilledIdx=i;continue;}
    if(r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment)){lastFilledIdx=i;}
  }
  // Compter les lignes vides existantes après lastFilledIdx
  var emptyAfter=0;
  for(var k=lastFilledIdx+1;k<rows.length;k++){
    var rr=rows[k];
    if(rr.type==='entry'&&!rr.cmd&&!rr.po&&!rr.client&&!rr.desc&&!rr.item&&!rr.qty&&!rr.noboite&&!rr.comment){emptyAfter++;}
  }
  var need=EMPTY_ROWS-emptyAfter;
  if(need<=0)return false;
  for(var j=0;j<need;j++){
    rows.push({id:'e-'+Date.now()+'-'+j+'-'+Math.random().toString(36).substr(2,4),type:'entry',cmd:'',po:'',client:'',desc:'',item:'',qty:'',noboite:'',comment:''});
  }
  return true;
}

/* ═══ PUSH TO FIREBASE (from Inspection Atelier) ═══ */
function pushFB(){
  if(!fbUser){setSB('offline');return;}
  var data=load();

  Object.keys(data).forEach(function(m){
    var rows=data[m]||[];
    var filtered=rows.filter(function(r){
      if(r.type==='date')return true;
      if(r.type==='entry')return(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
      return false;
    });
    if(filtered.length>0){clean[m]=filtered;filtered.forEach(function(r){if(r.type==='entry')totalEntries++;});}
  });
  if(totalEntries===0&&Object.keys(clean).length===0){
    console.error('🛡️ [pushFB] BLOQUÉ: données vides');return;
  }
  // Protection: vérifier que FB n'a pas plus d'entrées
  fbDb.ref(FB).once('value').then(function(fbSnap){
    var fbData=fbSnap.val();
    var fbCount=fbData?_countEntries(fbData):0;
    if(fbCount>5&&totalEntries<fbCount*0.5){
      console.error('🛡️ [pushFB] BLOQUÉ: FB='+fbCount+' → Local='+totalEntries);
      toast('🛡️ Écriture bloquée','err');return;
    }
    _autoBackup();
    setFbWriting(true);setSB('syncing');
    fbDb.ref(FB).set(clean).then(function(){
      setTimeout(function(){setFbWriting(false);setSB('online');},1500);
      _retryCount=0;
      console.log('✅ Firebase saved: '+totalEntries+' entries');
    }).catch(function(err){
      console.error('❌ Firebase error:',err.message);
      _retryCount++;
      if(_retryCount<=_maxRetries){
        var delay=_retryCount*2000;
        setTimeout(function(){pushFB();},delay);
      }else{
        setFbWriting(false);_retryCount=0;setSB('offline');
        toast('⚠️ Firebase: '+err.message,'err');
      }
    });
  }).catch(function(){
    // FB unreachable — push if valid
    if(totalEntries>0){
      setFbWriting(true);setSB('syncing');
      fbDb.ref(FB).set(clean).then(function(){
        setTimeout(function(){setFbWriting(false);setSB('online');},1500);
      }).catch(function(){setFbWriting(false);setSB('offline');});
    }
  });
}

/* ═══ LISTEN FB (from Inspection Atelier) ═══ */
function listenFB(){
  if(_fbListener)fbDb.ref(FB).off('value',_fbListener);

    if(_fbWriting||_merging||_syncPhase==='syncing')return;

    if(fbCount<=2&&localCount>5){pushFB();return;}

    var cleanedLocal=JSON.parse(JSON.stringify(localData));

      cleanedLocal[month]=(cleanedLocal[month]||[]).filter(function(r){return !r.id||!isIdDeleted(r.id);});
    });
    var cleanedCount=_countEntries(cleanedLocal);
    var merged=_safeMerge(fbData,cleanedLocal);

      _merging=true;debPush();

  });
}

/* ═══ START FIREBASE SYNC (from Inspection Atelier) ═══ */
/* ═══ MIGRATION ONE-SHOT : remplir r.date depuis les séparateurs 📅 ═══
   Parcourt chaque mois ; pour chaque entry, si r.date est vide, prend la date
   du dernier séparateur 📅 qui la précède.
   Si aucun séparateur précédent → laisse vide (Daniel mettra manuellement).
   Marqué comme fait dans Firebase pour ne s'exécuter qu'UNE FOIS (cross-utilisateurs).
   Le flag n'est marqué que si AU MOINS 1 entry a été remplie OU si force=true. */
var FB_DATES_BACKFILL_FLAG='inspFinaleDatesBackfilled_v1';

function _doBackfillCore(force){
  var data=load();var totalFilled=0;var totalEntries=0;var totalSep=0;
  Object.keys(data||{}).forEach(function(m){
    var rows=data[m]||[];if(!Array.isArray(rows))return;
    var currentDate='';
    rows.forEach(function(r){
      if(!r||typeof r!=='object')return;
      if(r.type==='date'&&r.dateLabel){
        totalSep++;
        var lbl=String(r.dateLabel).trim();
        var mm=lbl.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if(mm)currentDate=mm[1].padStart(2,'0')+'/'+mm[2].padStart(2,'0')+'/'+mm[3];
        else currentDate=lbl;
      }else if(r.type==='entry'){
        totalEntries++;
        var hasContent=(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
        if(hasContent&&!r.date&&currentDate){
          r.date=currentDate;
          totalFilled++;
        }
      }
    });
  });
  console.log('[BACKFILL DATES] Stats: séparateurs='+totalSep+' entries='+totalEntries+' filled='+totalFilled);
  return {data:data,totalFilled:totalFilled,totalEntries:totalEntries,totalSep:totalSep};
}

function _backfillDatesFromSeparators(force){
  if(!fbDb||!fbUser){console.warn('[BACKFILL DATES] Firebase non prêt');return Promise.resolve(false);}
  var checkFlag=force?Promise.resolve({val:function(){return null;}}):fbDb.ref(FB_DATES_BACKFILL_FLAG).once('value');
  return checkFlag.then(function(snap){
    if(!force&&snap.val()===true){console.log('[BACKFILL DATES] flag=true, déjà fait, skip');return false;}
    console.log('[BACKFILL DATES] ═══ Démarrage migration'+(force?' (FORCE)':'')+' ═══');
    var result=_doBackfillCore(force);
    if(result.totalFilled===0){
      console.log('[BACKFILL DATES] Aucune date à remplir (séparateurs='+result.totalSep+', entries='+result.totalEntries+')');
      // Ne PAS marquer le flag : permet à un futur run de réessayer
      // (au cas où Firebase n'a pas encore livré les données au moment du check)
      toast('📅 Aucune date à remplir','info');
      return false;
    }
    save(result.data);
    return new Promise(function(resolve){
      try{
        var clean={};
        Object.keys(result.data).forEach(function(m){
          var filtered=(result.data[m]||[]).filter(function(r){
            if(r.type==='date')return true;
            if(r.type==='entry')return(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
            return false;
          });
          if(filtered.length>0)clean[m]=filtered;
        });
        setFbWriting(true);
        fbDb.ref(FB).set(clean).then(function(){
          setFbWriting(false);
          return fbDb.ref(FB_DATES_BACKFILL_FLAG).set(true);
        }).then(function(){
          console.log('[BACKFILL DATES] ✅ Push + flag OK ('+result.totalFilled+' dates)');
          toast('📅 '+result.totalFilled+' dates remplies','ok');
          renderTable();
          resolve(true);
        }).catch(function(e){
          setFbWriting(false);
          console.error('[BACKFILL DATES] ❌ Erreur push:',e&&e.message);
          toast('❌ Erreur sync dates: '+(e&&e.message||''),'err');
          resolve(false);
        });
      }catch(e){
        console.error('[BACKFILL DATES] ❌ Erreur:',e&&e.message);resolve(false);
      }
    });
  }).catch(function(e){console.warn('[BACKFILL DATES] Erreur flag:',e&&e.message);return false;});
}

/* Fonction manuelle exposée : taper forceMigrateDatesNow() dans la console F12 pour forcer */
window.forceMigrateDatesNow=function(){

function startFirebaseSync(){
  if(_syncPhase!=='idle')return;
  _syncPhase='syncing';
  cleanOldDeletedIds();
  console.log('[SYNC] ═══ Starting Firebase sync ═══');
  // Step 1: Load deleted IDs
  fbDb.ref(FB_DELETED_PATH).once('value').then(function(snap){
    _deletedIdsCache=snap.val()||{};
    var local={};try{local=JSON.parse(localStorage.getItem(DELETED_IDS_KEY))||{};}catch(e){}
    for(var k in _deletedIdsCache){if(!local[k])local[k]=_deletedIdsCache[k];}
    localStorage.setItem(DELETED_IDS_KEY,JSON.stringify(local));
    console.log('[SYNC] Deleted IDs: '+Object.keys(_deletedIdsCache).length);
    return true;
  }).catch(function(){console.warn('[SYNC] DeletedIds error (continuing)');}).then(function(){
    // Step 2: Load serie cards
    return fbDb.ref('serieCommandes').once('value').then(function(snap){
      var fbCards=snap.val();
      if(fbCards){
        var local=getSerieCards();
        Object.keys(fbCards).forEach(function(id){
          if(!local[id]){local[id]=fbCards[id];return;}
          var l=local[id],f=fbCards[id];
          if(f.client)l.client=f.client;if(f.order)l.order=f.order;
          if(f.numeroPO)l.numeroPO=f.numeroPO;if(f.targetColumn)l.targetColumn=f.targetColumn;
          if(f._typeManuel!==undefined)l._typeManuel=f._typeManuel;
          if(f._manualStatus)l._manualStatus=f._manualStatus;
          if(f.items){
            if(!l.items)l.items=[];
            f.items.forEach(function(fi,ii){
              if(!l.items[ii]){l.items[ii]=fi;return;}
              if(fi.name)l.items[ii].name=fi.name;
              if(!l.items[ii].grandeurs)l.items[ii].grandeurs=[];
              (fi.grandeurs||[]).forEach(function(fg,gi){
                if(!l.items[ii].grandeurs[gi]){l.items[ii].grandeurs[gi]=fg;return;}
                var lg=l.items[ii].grandeurs[gi];
                if(fg.qty)lg.qty=fg.qty;if(fg.name)lg.name=fg.name;
                if(fg._status)lg._status=fg._status;
              });
            });
          }
        });
        safeLSSet(SK,JSON.stringify(local));
        console.log('[SYNC] Serie cards: '+Object.keys(local).length);
      }
    }).catch(function(e){console.warn('[SYNC] Serie error:',e.message);});
  }).then(function(){
    // Step 3: Load main data
    return fbDb.ref(FB).once('value').then(function(snap){
      var fbData=snap.val();
      var localData=load();
      var localCount=_countEntries(localData);
      var fbCount=_countEntries(fbData);
      console.log('[SYNC] FB='+fbCount+' Local='+localCount);
      if(fbData){
        var cleanedLocal=JSON.parse(JSON.stringify(localData));
        Object.keys(cleanedLocal).forEach(function(month){
          cleanedLocal[month]=(cleanedLocal[month]||[]).filter(function(r){return !r.id||!isIdDeleted(r.id);});
        });
        var merged=_safeMerge(fbData,cleanedLocal);
        var mergedCount=_countEntries(merged);
        console.log('[SYNC] Merged='+mergedCount);
        safeLSSet(LK,JSON.stringify(merged));
        if(mergedCount>fbCount)pushFB();
      }else if(localCount>0){
        console.log('[SYNC] Firebase empty, pushing local');
        pushFB();
      }
    }).catch(function(e){console.error('[SYNC] Main data error:',e);});
  }).then(function(){
    // Step 3.5: Backfill dates from separators (one-shot migration)
    return _backfillDatesFromSeparators().catch(function(e){
      console.warn('[SYNC] Backfill dates error (continuing):',e&&e.message);
      return false;
    });
  }).then(function(){
    // FINAL: Go live
    _syncPhase='live';
    renderTable();
    console.log('[SYNC] ✅ Sync complete — phase LIVE');
    setTimeout(function(){
      listenFB();
      listenDeletedIds();
      listenSerieCards();
      console.log('[SYNC] Realtime listeners attached');
    },2000);
  }).catch(function(err){
    console.error('[SYNC] Fatal error:',err);
    _syncPhase='live';renderTable();
    toast('⚠️ Erreur sync','err');
  });
  // Safety timeout
  setTimeout(function(){
    if(_syncPhase==='syncing'){console.warn('[SYNC] Safety timeout');_syncPhase='live';renderTable();}
  },10000);
}

/* ═══ LISTEN SERIE CARDS (from Inspection Atelier) ═══ */
function listenSerieCards(){
  if(_serieListener||!fbDb)return;
  _serieListener=fbDb.ref('serieCommandes').on('value',function(snap){
    var fbCards=snap.val();if(!fbCards)return;
    var local=getSerieCards();var changed=false;
    Object.keys(fbCards).forEach(function(id){
      if(!local[id]){local[id]=fbCards[id];changed=true;return;}
      var l=local[id],f=fbCards[id];
      if(f.client&&f.client!==l.client){l.client=f.client;changed=true;}
      if(f.order&&f.order!==l.order){l.order=f.order;changed=true;}
      if(f.numeroPO&&f.numeroPO!==l.numeroPO){l.numeroPO=f.numeroPO;changed=true;}
      if(f._typeManuel!==undefined&&f._typeManuel!==l._typeManuel){l._typeManuel=f._typeManuel;changed=true;}
      if(f.targetColumn&&f.targetColumn!==l.targetColumn){l.targetColumn=f.targetColumn;changed=true;}
      if(f._manualStatus&&f._manualStatus!==l._manualStatus){l._manualStatus=f._manualStatus;changed=true;}
      // ITEMS: prendre Firebase tel quel (source de vérité)
      if(f.items){
        l.items=JSON.parse(JSON.stringify(f.items));
        changed=true;
      }
    });
    if(changed){safeLSSet(SK,JSON.stringify(local));_serieCache={};renderTable();}
  });
}

  }
  var has=(row.cmd||'')+(row.po||'')+(row.client||'')+(row.desc||'')+(row.item||'')+(row.qty||'')+(row.comment||'');

    if(row.id)markIdDeleted(row.id);

  if(!confirm('Supprimer?'))return;

function getSerieCards(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};}}
function findSerie(num){
  var cards=getSerieCards();var n=String(num).trim();if(!n)return null;
  var nStrip=n.replace(/^0+/,'');var nL6=nStrip.slice(-6);
  for(var id in cards){
    var o=String(cards[id].order||'').trim();var p=String(cards[id].numeroPO||'').trim();
    var oS=o.replace(/^0+/,'');var pS=p.replace(/^0+/,'');
    if(o===n||p===n)return{cardId:id,card:cards[id]};
    if(oS===nStrip||pS===nStrip)return{cardId:id,card:cards[id]};
    if(oS.slice(-6)===nL6&&nL6.length>=4)return{cardId:id,card:cards[id]};
    if(pS.slice(-6)===nL6&&nL6.length>=4)return{cardId:id,card:cards[id]};
  }
  return null;
}
function _cachedFind(bon){var k=String(bon).trim();if(!k)return null;if(_serieCache.hasOwnProperty(k))return _serieCache[k];var r=findSerie(k);_serieCache[k]=r;return r;}
function _isClientCard(card){if(!card)return false;if(card._typeManuel==='client')return true;if(card._typeManuel==='serie')return false;var items=card.items||[];if(!items.length)return true;for(var i=0;i<items.length;i++){var gs=items[i].grandeurs||[];if(gs.length>1)return false;for(var g=0;g<gs.length;g++){if((parseInt(gs[g].qty)||0)>1)return false;}}return true;}
function getSerieAutoClient(card){
  if(!card)return'';var tc=card.targetColumn||'';var isCl=_isClientCard(card);var suf=isCl?' client':' série';
  if(tc==='serieCollapsableCards')return'Vermeiren série';if(tc==='serieBoList')return'Vermeiren client';
  if(tc==='serieFranceSerieList')return'France série';if(tc==='serieFranceClientList')return'France client';
  if(tc==='serieC1southList')return'C1South'+suf;if(tc==='serieHmeList')return'HME'+suf;
  if(tc==='serieCubroList')return(card._customColName||'Autre 1')+suf;if(tc==='serieAutreList')return(card._customColName||'Autre 2')+suf;
  var cl=(card.client||'').trim();if(!cl)return'';var clL=cl.toLowerCase().replace(/[^a-z0-9]/g,'');
  var nm={france:'France',vermeiren:'Vermeiren',hme:'HME',c1south:'C1South',cubro:'Cubro',inventaire:'Inventaire'};
  var dn=nm[clL]||cl;if(clL==='inventaire')return'Inventaire';return dn+suf;
}

function confirmSerie(){

        rr.cmd=ctx.bon;rr.po=card.numeroPO||'';rr.client=ctx.clientLabel;
        rr.item=itemLines.join('\n');rr.qty=String(totalQty);rr.serieLinked=true;

      if(allStatuses.length>0){
        if(allStatuses.every(function(s){return s==='emballe';}))fbCard._manualStatus='emballe';
        else if(allStatuses.every(function(s){return s==='complete'||s==='emballe';}))fbCard._manualStatus='complete';
        else if(allStatuses.some(function(s){return s!=='produire';}))fbCard._manualStatus='partiel';
        else fbCard._manualStatus='produire';
      }
      fbDb.ref('serieCommandes/'+cid).update({items:fbCard.items,_manualStatus:fbCard._manualStatus}).then(function(){
        console.log('[EMBALLE] ✅ '+cid+' → '+fbCard._manualStatus);
      }).catch(function(e){console.error('[EMBALLE] ❌',e.message);});
      var local=getSerieCards();
      if(local[cid]){
        checked.forEach(function(c){if(local[cid].items&&local[cid].items[c.ii]&&local[cid].items[c.ii].grandeurs&&local[cid].items[c.ii].grandeurs[c.gi])local[cid].items[c.ii].grandeurs[c.gi]._status='emballe';});
        local[cid]._manualStatus=fbCard._manualStatus;

  }
  closeModal();_serieCache={};renderTable();
  toast('✅ #'+ctx.bon+' emballé','ok');
}

function reVerifyAllSerieRows(callback){
  if(!fbDb){if(callback)callback();return;}
  fbDb.ref('serieCommandes').once('value').then(function(snap){
    var fbCards=snap.val()||{};
    var localCards=getSerieCards();
    Object.keys(fbCards).forEach(function(cid){
      if(!localCards[cid]){localCards[cid]=fbCards[cid];return;}
      var l=localCards[cid],f=fbCards[cid];
      if(f.client)l.client=f.client;if(f.order)l.order=f.order;if(f.numeroPO)l.numeroPO=f.numeroPO;
      if(f.targetColumn)l.targetColumn=f.targetColumn;if(f._typeManuel!==undefined)l._typeManuel=f._typeManuel;
      if(f._manualStatus)l._manualStatus=f._manualStatus;
      if(f.items){if(!l.items)l.items=[];f.items.forEach(function(fi,ii){if(!l.items[ii]){l.items[ii]=fi;return;}if(fi.name)l.items[ii].name=fi.name;if(!l.items[ii].grandeurs)l.items[ii].grandeurs=[];(fi.grandeurs||[]).forEach(function(fg,gi){if(!l.items[ii].grandeurs[gi]){l.items[ii].grandeurs[gi]=fg;return;}var lg=l.items[ii].grandeurs[gi];if(fg.qty)lg.qty=fg.qty;if(fg.name)lg.name=fg.name;if(fg._status)lg._status=fg._status;});});}
    });
    safeLSSet(SK,JSON.stringify(localCards));_serieCache={};
    var allData=load();var anyChanged=false;var stats={linked:0,labelsFixed:0};
    Object.keys(allData).forEach(function(month){
      var rows=allData[month]||[];var monthChanged=false;
      rows.forEach(function(row){
        if(!row||row.type!=='entry')return;
        var cmd=(row.cmd||'').trim();if(!cmd)return;
        var n=cmd;var nStrip=n.replace(/^0+/,'');var nL6=nStrip.slice(-6);var found=null;
        for(var cid in fbCards){
          var c=fbCards[cid];var o=String(c.order||'').trim();var p=String(c.numeroPO||'').trim();
          var os=o.replace(/^0+/,'');var ps=p.replace(/^0+/,'');
          if(o===n||p===n||os===nStrip||ps===nStrip||(os.slice(-6)===nL6&&nL6.length>=4)||(ps.slice(-6)===nL6&&nL6.length>=4)){found={cardId:cid,card:c};break;}
        }
        if(!found)return;
        stats.linked++;row.serieLinked=true;
        var correctLabel=getSerieAutoClient(found.card);
        if(correctLabel&&row.client!==correctLabel){row.client=correctLabel;monthChanged=true;stats.labelsFixed++;}
        if(found.card.numeroPO&&!row.po){row.po=found.card.numeroPO;monthChanged=true;}
      });
      if(monthChanged){allData[month]=rows;anyChanged=true;}
    });
    if(anyChanged){safeLSSet(LK,JSON.stringify(allData));debPush();}
    console.log('[VERIFY] ✅ '+stats.linked+' Série+, '+stats.labelsFixed+' labels');
    if(callback)callback(stats);
  }).catch(function(e){console.error('[VERIFY] Error:',e.message||e);if(callback)callback(null);});
}

/* ═══ COLUMN RESIZE ═══
   Détection par proximité du bord droit du <th>.
   Curseur change automatiquement. Pas de handle HTML.
   Chaque colonne indépendante : pas de compression des autres. */
function getColWidths(){try{return JSON.parse(localStorage.getItem(COL_W_KEY))||{};}catch(e){return {};}}
function saveColWidths(w){try{localStorage.setItem(COL_W_KEY,JSON.stringify(w));}catch(e){}}
function _syncTableWidth(){
  var cg=document.getElementById('cg');if(!cg)return;
  var total=0;
  cg.querySelectorAll('col').forEach(function(col){
    var wv=parseInt(col.style.width)||0;
    total+=wv;
  });
  var tbl=document.querySelector('.table-area table');
  if(tbl&&total>0)tbl.style.width=total+'px';
}
var _colResize={active:false,colId:null,startX:0,startW:0,th:null,col:null};
var _colResizeInit=false;
var COL_EDGE_PX=8;

function _onTheadMove(e){
  if(_colResize.active)return;
  var th=e.target.closest('th');
  if(!th)return;
  var rect=th.getBoundingClientRect();
  var nearEdge=e.clientX>rect.right-COL_EDGE_PX;
  th.style.cursor=nearEdge?'col-resize':'';
}

function _onTheadDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  var th=e.target.closest('th');
  if(!th)return;
  var rect=th.getBoundingClientRect();
  if(e.clientX<=rect.right-COL_EDGE_PX)return; // Pas sur le bord
  // Trouver la colonne correspondante dans le colgroup
  var thead=document.getElementById('thead');
  var allThs=thead.querySelectorAll('th');
  var thIdx=-1;
  for(var i=0;i<allThs.length;i++){if(allThs[i]===th){thIdx=i;break;}}
  if(thIdx<0)return;
  var cg=document.getElementById('cg');
  var cols=cg?cg.querySelectorAll('col'):[];
  if(thIdx>=cols.length)return;
  var col=cols[thIdx];
  var colId=col.getAttribute('data-colid');
  if(!colId)return;
  var curW=parseInt(col.style.width)||th.offsetWidth||80;
  _colResize={active:true,colId:colId,startX:e.clientX,startW:curW,th:th,col:col};
  document.body.classList.add('col-resizing');
  e.preventDefault();
  e.stopPropagation();
}

function _onDocMove(e){
  if(!_colResize.active)return;
  if(e.buttons!==undefined&&e.buttons===0){_colResizeEnd(e);return;}
  var diff=e.clientX-_colResize.startX;
  var newW=Math.max(30,_colResize.startW+diff);
  _colResize.col.style.width=newW+'px';
  _syncTableWidth();
}

function _colResizeEnd(e){
  if(!_colResize.active)return;
  try{
    if(e&&e.clientX!==undefined){
      var diff=e.clientX-_colResize.startX;
      var newW=Math.max(30,_colResize.startW+diff);
      _colResize.col.style.width=newW+'px';
      _syncTableWidth();
      var w=getColWidths();
      w[_colResize.colId]=newW;
      saveColWidths(w);
    }
  }catch(err){console.warn('[resize] save error:',err);}
  finally{
    document.body.classList.remove('col-resizing');
    if(_colResize.th){try{_colResize.th.style.cursor='';}catch(e){}}
    var thead=document.getElementById('thead');
    if(thead){thead.querySelectorAll('th').forEach(function(t){try{t.style.cursor='';}catch(e){}});}
    _colResize={active:false,colId:null,startX:0,startW:0,th:null,col:null};
  }
}

function _onDocUp(e){_colResizeEnd(e);}
function _onWinBlur(){_colResizeEnd(null);}
function _onKeyEsc(e){if(e.key==='Escape')_colResizeEnd(null);}

function initColumnResize(){
  if(_colResizeInit)return;
  _colResizeInit=true;
  var thead=document.getElementById('thead');
  if(!thead)return;
  thead.addEventListener('mousemove',_onTheadMove);
  thead.addEventListener('mousedown',_onTheadDown);
  document.addEventListener('mousemove',_onDocMove);
  document.addEventListener('mouseup',_onDocUp);
  window.addEventListener('blur',_onWinBlur);
  document.addEventListener('keydown',_onKeyEsc);
}

/* ═══ ITEM CELL RENDERING ═══ */
function parseItemLine(str){
  str=str.trim();var partial=false;
  if(str.charAt(0)==='~'){partial=true;str=str.substring(1);}
  var pipeIdx=str.indexOf('|');
  var iName='',rest=str;
  if(pipeIdx>=0){iName=str.substring(0,pipeIdx).trim();rest=str.substring(pipeIdx+1).trim();}
  // Détecter format quantité
  var mf=rest.match(/^(.+?)\s+(\d+)\/(\d+)$/);
  var mx=rest.match(/^(.+?)\s+(\d+)x$/)||rest.match(/^(.+?)\s*x(\d+)$/);
  var qty=1;
  if(mf){qty=parseInt(mf[2])||0;partial=true;}
  else if(mx){qty=parseInt(mx[2])||0;}
  // Nom d'item = iName si présent, sinon le reste (grandeur seule comme fallback)
  var displayName=iName||(mf?mf[1]:(mx?mx[1]:rest));
  return{name:displayName,qty:qty,partial:partial};
}
function renderSerieItemCell(val){
  if(!val)return'';
  if(val.indexOf('|')<0&&!val.match(/\d+x/)&&!val.match(/\d+\/\d+/))return esc(val);
  var lines;
  if(val.indexOf('\n')>=0)lines=val.split('\n').filter(function(x){return x.trim();});
  else lines=val.split(/,\s*(?=[A-ZÀ-Ü~])/i).filter(function(x){return x.trim();});
  if(!lines.length)return esc(val);
  // Agréger par nom d'item (insensible à la casse), additionner les quantités
  var agg={};var order=[];
  lines.forEach(function(l){
    var p=parseItemLine(l);
    var key=p.name.toUpperCase();
    if(!agg[key]){agg[key]={name:p.name,qty:0,partial:false};order.push(key);}
    agg[key].qty+=p.qty;
    if(p.partial)agg[key].partial=true;
  });
  // Tri alphabétique
  order.sort(function(a,b){return a.localeCompare(b);});
  var h='<div style="display:flex;flex-direction:column;gap:0;width:100%;">';
  order.forEach(function(key){
    var a=agg[key];
    var displayName=a.name.toUpperCase();
    h+='<div class="si-row"><span class="'+(a.partial?'si-badge part':'si-badge')+'">'+a.qty+'x</span><span class="si-name">'+esc(displayName)+'</span></div>';
  });
  h+='</div>';return h;
}

function selectPrintMode(mode,el){
  window._printMode=mode;
  document.querySelectorAll('.print-option').forEach(function(o){o.classList.remove('selected');o.querySelector('input[type=radio]').checked=false;});
  el.classList.add('selected');el.querySelector('input[type=radio]').checked=true;
  var dayEl=document.getElementById('printDaySelect');var rangeEl=document.getElementById('printRangeSelect');
  if(dayEl)dayEl.style.display=(mode==='day')?'flex':'none';
  if(rangeEl)rangeEl.style.display=(mode==='range')?'flex':'none';
  updatePrintCount();
}
function getPrintRows(){
  var el=document.getElementById('insp-month');var m=el?el.value:gmk();
  var data=load();var rows=data[m]||[];var mode=window._printMode||'all';
  if(mode==='all')return rows.filter(function(r){if(r.type==='date')return true;return r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);});
  if(mode==='day'){var dayIdx=parseInt(document.getElementById('printDay1').value);var nextDateIdx=rows.length;for(var i=dayIdx+1;i<rows.length;i++){if(rows[i].type==='date'){nextDateIdx=i;break;}}var result=[];for(var j=dayIdx;j<nextDateIdx;j++){var r=rows[j];if(r.type==='date')result.push(r);else if(r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment))result.push(r);}return result;}
  if(mode==='range'){var fromIdx=parseInt(document.getElementById('printFrom').value);var toIdx=parseInt(document.getElementById('printTo').value);if(fromIdx>toIdx){var tmp=fromIdx;fromIdx=toIdx;toIdx=tmp;}var endIdx=rows.length;for(var k=toIdx+1;k<rows.length;k++){if(rows[k].type==='date'){endIdx=k;break;}}var result2=[];for(var l=fromIdx;l<endIdx;l++){var r2=rows[l];if(r2.type==='date')result2.push(r2);else if(r2.type==='entry'&&(r2.cmd||r2.po||r2.client||r2.desc||r2.item||r2.qty||r2.comment))result2.push(r2);}return result2;}
  return [];
}
function updatePrintCount(){var rows=getPrintRows();var entries=rows.filter(function(r){return r.type==='entry';}).length;var el=document.getElementById('printCount');if(el)el.textContent='📊 '+entries+' ligne(s)';}
function buildPrintHTML(){
  var rows=getPrintRows();if(!rows.length)return null;
  var vis=getVisCols().filter(function(c){return c.id!=='del';});
  var el=document.getElementById('insp-month');var m=el?el.value:gmk();
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Inspection Finale — '+gml(m)+'</title>';
  html+='<style>body{font-family:Segoe UI,Tahoma,sans-serif;margin:20px;color:#000;}.print-header{text-align:center;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #2563eb;}.print-header h1{font-size:18px;color:#1e293b;margin:0;}.print-header .sub{font-size:12px;color:#64748b;margin-top:2px;}table{border-collapse:collapse;width:100%;font-size:11px;}th{background:#2563eb;color:#fff;padding:6px 8px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;border:1px solid #1d4ed8;-webkit-print-color-adjust:exact;print-color-adjust:exact;}td{padding:4px 6px;border:1px solid #cbd5e1;vertical-align:middle;}tr:nth-child(even){background:#f8fafc;}.date-row td{background:#fef3c7;color:#92400e;font-weight:700;font-size:12px;text-align:left;border-color:#fcd34d;-webkit-print-color-adjust:exact;print-color-adjust:exact;}.c-cmd{font-weight:700;color:#1d4ed8;font-family:Consolas,monospace;text-align:center;}.c-po{font-weight:600;color:#6d28d9;text-align:center;}.c-client{font-weight:600;}.footer{text-align:center;margin-top:12px;font-size:9px;color:#94a3b8;}@page{margin:15mm 10mm;}</style></head><body>';
  html+='<div class="print-header"><h1>🔍 PhysiPro — Inspection Finale</h1><div class="sub">'+gml(m)+' — '+todayStr()+'</div></div>';
  html+='<table><thead><tr><th>Date</th>';
  vis.forEach(function(c){if(c.id!=='num')html+='<th>'+c.label+'</th>';});
  html+='</tr></thead><tbody>';
  var num=0;
  rows.forEach(function(r){
    if(r.type==='date'){html+='<tr class="date-row"><td colspan="'+vis.length+'">📅 '+esc(r.dateLabel)+'</td></tr>';return;}
    num++;
    var dt=r.date||'';
    var starP=r.serieLinked?'⭐ ':'';
    html+='<tr><td style="text-align:center;color:#334155;font-size:10px;font-weight:600;font-family:Consolas,monospace;background:#fff;">'+starP+esc(dt)+'</td>';
    vis.forEach(function(c){if(c.id==='num')return;html+='<td class="'+(c.cls||'')+'">'+escNl(r[c.field]||'')+'</td>';});
    html+='</tr>';
  });
  html+='</tbody></table><div class="footer">PhysiPro © '+new Date().getFullYear()+' — Inspection Finale</div></body></html>';
  return{html:html,month:m,count:num};
}
function doPrint(){var result=buildPrintHTML();if(!result){toast('Aucune donnée','err');return;}var frame=document.getElementById('printFrame');frame.srcdoc=result.html;frame.onload=function(){frame.contentWindow.print();};closePrintModal();}
function savePDF(){var result=buildPrintHTML();if(!result){toast('Aucune donnée','err');return;}var blob=new Blob([result.html],{type:'text/html;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='InspFinale_'+gml(result.month).replace(/ /g,'_')+'_'+todayStr().replace(/\//g,'-')+'.html';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);closePrintModal();toast('💾 Fichier sauvegardé','ok');}

// ═══ DÉTECTION JOBS EN ATTENTE ═══
// Quand un bon est ajouté dans Inspection Finale, vérifier s'il existe dans jobsEnAttente
// Si oui : retirer de Jobs Attente, retirer de ServiceClient, et dans Série+ mettre en "Emballé"

function _checkJobsAttente(bon){
  if(!bon || !fbDb) return;
  var numStr = String(bon).trim();
  if(!numStr) return;
  
  fbDb.ref('jobsEnAttente').once('value', function(snap){
    var entries = snap.val() || {};
    var found = false;
    Object.keys(entries).forEach(function(jaId){
      var e = entries[jaId];
      if(!e || e.resolved) return;
      if(String(e.numero||'').trim() === numStr){
        found = true;
        console.log('[InspFinale→JA] 🔍 Détecté #'+numStr+' dans Jobs Attente, nettoyage...');
        
        // 1. Marquer comme résolu dans Jobs Attente
        fbDb.ref('jobsEnAttente/' + jaId).update({
          resolved: true,
          resolvedAt: Date.now(),
          resolvedBy: fbUser ? fbUser.email : 'inspection_finale',
          _resolvedByApp: 'inspection_finale'
        }).then(function(){
          console.log('[InspFinale→JA] ✅ #'+numStr+' résolu dans Jobs Attente');
        });
        
        // 2. Retirer de ServiceClient (seulement si créé par Jobs Attente)
        fbDb.ref('jobs').orderByChild('order').equalTo(numStr).once('value', function(scSnap){
          if(!scSnap.exists()) return;
          scSnap.forEach(function(child){
            var job = child.val();
            if(job && job._fromJobsAttente){
              fbDb.ref('jobs/' + child.key).remove().then(function(){
                console.log('[InspFinale→SC] 🗑️ Job #'+numStr+' retiré de ServiceClient');
              });
            }
          });
        });
        
        // 3. Dans Série+ : mettre en "Emballé" puisque détecté en Inspection Finale
        fbDb.ref('serieCommandes').once('value', function(serieSnap){
          var cards = serieSnap.val() || {};
          for(var cid in cards){
            var c = cards[cid];
            if(!c) continue;
            var o = String(c.order||'').trim();
            var p = String(c.numeroPO||c.po||'').trim();
            var oStrip = o.replace(/^0+/,'');
            var nStrip = numStr.replace(/^0+/,'');
            if(o === numStr || p === numStr || oStrip === nStrip){
              var updates = {};
              updates['serieCommandes/' + cid + '/_manualStatus'] = 'emballe';
              updates['serieCommandes/' + cid + '/_fromJobsAttente'] = null;
              updates['serieCommandes/' + cid + '/_jaResolvedAt'] = new Date().toISOString();
              updates['serieCommandes/' + cid + '/_jaResolvedBy'] = 'inspection_finale';
              fbDb.ref().update(updates).then(function(){
                console.log('[InspFinale→Série] ✅ Carte #'+numStr+' mise en "Emballé"');
              });
              break;
            }
          }
        });
      }
    });
    if(found) toast('📋 #'+numStr+' retiré des Commandes en attente','ok');
  });
}
