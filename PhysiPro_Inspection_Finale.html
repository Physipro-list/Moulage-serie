<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Inspection Finale</title>
<link rel="manifest" href="inspfinale_manifest.json">
<meta name="theme-color" content="#04152c">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bdr:#334155;--gold:#c9a227;--goldL:#fbbf24;--txt:#e2e8f0;--mutd:#94a3b8;--ok:#22c55e;--err:#ef4444;--info:#3b82f6;--purp:#7c3aed;--tbl-zoom:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
select{color-scheme:dark;background-color:#1e293b !important;color:#e2e8f0 !important;}
select option{background:#1e293b !important;color:#e2e8f0 !important;font-size:12px;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:12px;display:flex;flex-direction:column;min-width:320px;}

/* ═══ TOPBAR — compact ═══ */ /* NE JAMAIS MODIFIER */
.topbar{width:100%;height:48px;min-height:48px;padding:0 10px;display:flex;align-items:center;background:linear-gradient(to bottom,#04152c,#4a8ef5);box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;z-index:100;gap:6px;flex-shrink:0;}
.tb-left{display:flex;align-items:center;flex-shrink:0;}
.logo-main{display:flex;align-items:center;gap:6px;}
.logo-main img{height:28px;width:auto;filter:brightness(1.1) drop-shadow(0 1px 3px rgba(0,0,0,.3));}
.logo-bottom-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
.tb-center{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.top-title{font-size:clamp(11px,2vw,18px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fdfdfd;text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.user-name{font-size:9px;color:rgba(255,255,255,.8);font-weight:600;}
.tb-logout-btn{font-size:7px;padding:1px 3px;border:1px solid rgba(255,255,255,.15);border-radius:3px;color:rgba(255,255,255,.5);text-decoration:none;line-height:1;}
.tb-logout-btn:hover{background:rgba(255,255,255,.15);color:#fff;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;}
.status-dot.connected{background:#22c55e;box-shadow:0 0 3px rgba(34,197,94,.6);}
.sync-indicator{font-size:8px;padding:1px 4px;border-radius:3px;white-space:nowrap;}
.sync-indicator.online{background:rgba(34,197,94,.15);color:var(--ok);}
.sync-indicator.offline{background:rgba(239,68,68,.15);color:var(--err);}
.sync-indicator.syncing{background:rgba(251,191,36,.15);color:var(--goldL);}

/* ═══ TOOLBAR ═══ */ /* NE JAMAIS MODIFIER */
.toolbar{display:flex;gap:4px;align-items:center;padding:4px 8px;background:linear-gradient(to bottom,#04152c,#4a8ef5);flex-wrap:wrap;flex-shrink:0;min-height:32px;}
.toolbar label{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.toolbar .divider{width:1px;height:18px;background:rgba(255,255,255,.2);flex-shrink:0;}
.tb-btn{padding:2px 7px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.7);background:none;transition:all .15s;white-space:nowrap;}
.tb-btn:hover{border-color:var(--goldL);color:var(--goldL);background:rgba(255,255,255,.06);}
.month-select{background:rgba(255,255,255,.12) !important;border:1px solid rgba(255,255,255,.2) !important;color:#fff !important;font-weight:700;font-size:10px;padding:1px 4px;border-radius:3px;cursor:pointer;}
.month-select option{background:#0f172a !important;color:#fbbf24 !important;font-weight:700;}
.search-sm{background:rgba(255,255,255,.9);border:1px solid #3b82f6;border-radius:10px;padding:1px 6px;color:#1e3a5f;font-size:10px;outline:none;width:120px;height:20px;}
.search-sm::placeholder{color:#64748b;}

/* ═══ TABLE AREA — fills remaining space ═══ */ /* NE JAMAIS MODIFIER */
.table-area{flex:1;overflow:auto;border:1px solid #cbd5e1;border-top:none;margin:0 4px 4px 4px;border-radius:0 0 6px 6px;background:#ffffff;}
table{border-collapse:collapse;font-size:var(--tbl-zoom);width:100%;table-layout:fixed;}
thead{position:sticky;top:0;z-index:5;}
th{background:linear-gradient(to bottom,#04152c,#4a8ef5);color:var(--goldL);padding:3px 4px;text-align:center;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--gold);border-right:1px solid rgba(255,255,255,.12);white-space:nowrap;user-select:none;position:relative;}
th:last-child{border-right:none;}
.resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:6;background:rgba(59,130,246,.25);transition:background .15s;border-radius:1px;}
.resize-handle:hover,.resize-handle.active{background:rgba(59,130,246,.7);}
body.col-resizing{cursor:col-resize!important;user-select:none!important;}
body.col-resizing *{cursor:col-resize!important;}
td{padding:1px 3px;border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;vertical-align:middle;text-align:center;font-size:var(--tbl-zoom);min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b;}
td:last-child{border-right:none;}
td.td-edit{cursor:pointer;padding:2px 4px;min-height:22px;}
td.td-edit:hover{background:#eef2ff;}
/* Delete mode */
td.td-chk{width:24px;text-align:center;padding:0;}
td.td-chk input{width:15px;height:15px;accent-color:#ef4444;cursor:pointer;}
tr.del-selected td{background:#fef2f2 !important;}
tr.del-selected td.td-chk{background:#fee2e2 !important;}
.tb-btn.del-active{background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444;}
tr:hover td{background:#f8fafc;}
/* Date row */
tr.date-row td{background:#fef3c7;color:#92400e;font-weight:700;font-size:12px;padding:4px 8px;text-align:left;height:auto;border-bottom:1px solid #fcd34d;}
tr.date-row:hover td{background:#fde68a;}
.date-inner{display:flex;align-items:center;gap:6px;}
.date-lbl{cursor:pointer;padding:1px 4px;border-radius:3px;}
.date-lbl:hover{background:rgba(251,191,36,.3);}
.date-del{cursor:pointer;opacity:.3;font-size:9px;transition:opacity .15s;}
.date-del:hover{opacity:1;color:var(--err);}
.date-inp{background:#fff;border:1px solid var(--gold);color:#92400e;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;width:110px;text-align:center;}

/* Editable cells */
.c-cmd{font-weight:700;color:#1d4ed8;font-family:'Consolas',monospace;}
.c-po{font-weight:600;color:#6d28d9;}
.c-item{font-weight:500;color:#1e293b;text-align:left;word-wrap:break-word;line-height:1.4;overflow:visible !important;height:auto !important;white-space:normal !important;}
/* ═══ SI-CELL — structured item display (Production Couture style) ═══ */
.si-cell{text-align:left;line-height:1.1;white-space:normal;}
.si-row{display:flex;align-items:center;white-space:nowrap;line-height:1.4;}
.si-badge{display:inline-block;width:24px;min-width:24px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.3);border-radius:3px;color:#7c3aed;font-weight:700;font-size:8px;padding:0 2px;text-align:right;box-sizing:border-box;}
.si-badge.part{background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.4);color:#b45309;}
.si-name{font-size:8px;color:#1e293b;padding-left:3px;font-weight:500;}
.c-client{font-weight:600;}
.c-empty{color:#cbd5e1;}
/* Serie star */
.serie-star{color:var(--goldL);font-size:14px;cursor:pointer;margin-right:2px;vertical-align:middle;filter:drop-shadow(0 0 2px rgba(251,191,36,.5));}
.serie-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;}
.row-x{cursor:pointer;opacity:0;font-size:10px;color:#94a3b8;transition:opacity .15s;padding:0 2px;}
tr:hover .row-x{opacity:.5;}
.row-x:hover{opacity:1 !important;color:#ef4444;}
/* Edit input */
.e-inp{width:100%;background:#fff;border:1px solid #3b82f6;color:#1e293b;padding:1px 4px;border-radius:2px;font-size:var(--tbl-zoom);outline:none;font-family:inherit;}
.e-inp:focus{border-color:#2563eb;background:#f0f9ff;}

/* ═══ DROPDOWN PICKER ═══ */
.dd-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:260;align-items:center;justify-content:center;padding:16px;}
.dd-overlay.show{display:flex;}
.dd-panel{background:#fff;border:2px solid #3b82f6;border-radius:10px;width:340px;max-width:95vw;max-height:70vh;overflow:hidden;animation:modalIn .12s ease;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.dd-header{padding:8px 12px;background:linear-gradient(to right,#04152c,#2563eb);display:flex;justify-content:space-between;align-items:center;}
.dd-header span{font-size:12px;font-weight:700;color:#fff;}
.dd-header button{background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;}
.dd-header button:hover{color:#fff;}
.dd-search{width:100%;padding:6px 10px;border:none;border-bottom:1px solid #e2e8f0;font-size:12px;outline:none;color:#1e293b;}
.dd-search:focus{background:#f0f9ff;}
.dd-list{max-height:50vh;overflow-y:auto;padding:4px 0;}
.dd-item{padding:8px 14px;cursor:pointer;font-size:12px;color:#1e293b;transition:background .1s;border-bottom:1px solid #f1f5f9;}
.dd-item:hover{background:#eef2ff;}
.dd-item.selected{background:#dbeafe;color:#1d4ed8;font-weight:700;}
.dd-item.clear{color:#ef4444;font-style:italic;}

/* ═══ PRINT MODAL ═══ */
.print-option{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.print-option:hover{background:#eef2ff;border-color:#3b82f6;}
.print-option.selected{background:#dbeafe;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2);}
.print-option input[type="radio"]{width:16px;height:16px;accent-color:#2563eb;cursor:pointer;}
.print-option .po-label{font-size:12px;font-weight:600;color:#1e293b;}
.print-option .po-sub{font-size:10px;color:#64748b;}
.print-dates{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.print-dates select{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;color:#1e293b;background:#fff;cursor:pointer;}
.print-dates select:focus{border-color:#2563eb;outline:none;}
.print-dates span{font-size:11px;color:#64748b;font-weight:600;}
.print-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.print-actions button{padding:8px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.print-btn-main{background:#2563eb;border:none;color:#fff;}
.print-btn-main:hover{background:#1d4ed8;}
.print-btn-sec{background:none;border:1px solid #cbd5e1;color:#64748b;}
.print-btn-sec:hover{border-color:#2563eb;color:#2563eb;}
.print-preview-count{font-size:11px;color:#64748b;margin-top:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;text-align:center;}

/* ═══ COLUMN SETTINGS PANEL — horizontal cards ═══ */
.col-panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding-top:90px;}
.col-panel-overlay.show{display:flex;}
.col-panel{background:var(--bg2);border:2px solid var(--info);border-radius:8px;max-width:95vw;overflow:hidden;animation:modalIn .15s ease;}
.col-panel-h{padding:6px 12px;font-size:10px;font-weight:800;color:var(--info);background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);display:flex;justify-content:space-between;align-items:center;}
.col-panel-h button{background:none;border:1px solid var(--bdr);color:var(--mutd);font-size:8px;padding:2px 6px;border-radius:3px;cursor:pointer;}
.col-panel-h button:hover{color:var(--txt);border-color:var(--txt);}
.col-panel-body{display:flex;flex-direction:row;gap:0;padding:6px 8px;overflow-x:auto;align-items:stretch;}
.col-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;min-width:70px;border:1px solid rgba(255,255,255,.08);border-radius:5px;background:rgba(255,255,255,.02);cursor:grab;user-select:none;transition:all .15s;flex-shrink:0;}
.col-card:hover{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.2);}
.col-card.dragging{opacity:.3;background:rgba(59,130,246,.1);}
.col-card.drag-over{border-left:3px solid var(--info);padding-left:5px;}
.col-card .cc-handle{font-size:8px;color:var(--mutd);line-height:1;letter-spacing:1px;}
.col-card .cc-label{font-size:10px;font-weight:700;color:var(--txt);text-align:center;white-space:nowrap;}
.col-card .cc-label.off{color:var(--mutd);opacity:.5;text-decoration:line-through;}
.col-card input[type="checkbox"]{width:13px;height:13px;accent-color:var(--info);cursor:pointer;}
.gear-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;cursor:pointer;font-size:10px;transition:all .2s;flex-shrink:0;padding:0;}
.gear-btn:hover{background:rgba(255,255,255,.2);transform:rotate(45deg);}

/* ═══ SERIE+ MODAL ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:2px solid var(--info);border-radius:10px;width:420px;max-width:95vw;max-height:85vh;overflow:hidden;animation:modalIn .15s ease;}
.modal-header{padding:10px 14px;background:linear-gradient(to right,#04152c,#1e293b);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--info);}
.modal-header h3{font-size:13px;color:var(--txt);font-weight:700;}
.modal-close{background:none;border:none;color:var(--mutd);font-size:16px;cursor:pointer;}
.modal-close:hover{color:#fff;}
.modal-body{padding:12px;overflow-y:auto;max-height:calc(85vh - 50px);}
.serie-match-info{border:1px solid var(--info);border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.serie-match-info .smi-label{font-size:9px;font-weight:800;color:var(--info);}
.serie-match-info .smi-value{font-size:12px;font-weight:600;color:var(--txt);}
.item-choice{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.item-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:5px;background:rgba(255,255,255,.03);color:var(--txt);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.item-btn:hover{border-color:var(--info);background:rgba(59,130,246,.08);}
.item-btn.selected{border-color:var(--info);background:rgba(59,130,246,.15);color:#93c5fd;}
.item-btn.done{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok);cursor:default;opacity:.8;}
.grandeur-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--bdr);border-radius:5px;margin-bottom:4px;transition:all .15s;}
.grandeur-row:hover{background:rgba(255,255,255,.03);}
.grandeur-row.checked{background:rgba(34,197,94,.15);border-color:var(--ok);}
.grandeur-row .g-name{font-weight:700;font-size:12px;min-width:60px;color:#e2e8f0;}
.grandeur-row .g-qty{font-size:10px;color:var(--mutd);}
.grandeur-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--ok);cursor:pointer;}

/* ═══ TOAST ═══ */
.toast-box{position:fixed;top:6px;right:6px;z-index:300;}
.toast{padding:4px 10px;border-radius:3px;font-size:10px;font-weight:600;margin-bottom:3px;animation:toastIn .25s ease;color:#fff;}
.toast.ok{background:var(--ok);}.toast.info{background:var(--info);}.toast.err{background:var(--err);}
@keyframes toastIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ═══ LOGIN ═══ */
.login-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,#0b1d36,#3f6eb8);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;}
.login-overlay.hidden{display:none;}
.login-panel{background:linear-gradient(to bottom,#0b2343,#06315a);border-radius:14px;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 30px rgba(0,0,0,.85);padding:20px 24px;max-width:380px;width:100%;color:#fff;text-align:center;}
.login-panel img{height:70px;margin:8px auto 10px;}
.login-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.login-author{font-family:'Brush Script MT','Segoe Script',cursive;font-size:16px;color:rgba(255,255,255,.7);font-style:italic;}
.login-sub{font-size:11px;opacity:.8;margin:8px 0 12px;}
.login-inp{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;font-size:14px;text-align:center;margin-bottom:10px;}
.login-inp::placeholder{color:rgba(255,255,255,.5);font-size:12px;}
.login-inp:focus{outline:none;border-color:#00aaff;box-shadow:0 0 8px rgba(0,170,255,.3);}
.login-btn{width:100%;padding:10px;border-radius:999px;border:none;background:linear-gradient(to bottom,#00aaff,#0077cc);color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-bottom:8px;}
.login-btn:hover{background:linear-gradient(to bottom,#00bbff,#0088dd);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{color:#ff6666;font-size:10px;min-height:16px;}
.login-rem{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 8px;font-size:11px;color:rgba(255,255,255,.8);}
.login-rem input{width:14px;height:14px;accent-color:#00aaff;cursor:pointer;}

/* ═══ LOGO NAV ═══ */
.logo-flip-container{position:relative;cursor:pointer;z-index:99995;}

/* ═══ PRINT ═══ */
@media print{
  .topbar,.toolbar,.row-x,.date-del{display:none !important;}
  body{background:#fff;color:#000;overflow:visible;height:auto;}
  .table-area{border:none;margin:0;overflow:visible;max-height:none;flex:none;}
  table{font-size:10px;}
  th{background:#4a8ef5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  tr.date-row td{background:#fef3c7 !important;color:#92400e !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<body>
<script>if(localStorage.getItem('physipro_last_email')){document.write('<style id="preauth-hide">.login-overlay{display:none !important;}</style>');}</script>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-panel">
    <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
    <div class="login-title">Outil de gestion simplifiée</div>
    <div class="login-author">par Daniel Charest</div>
    <div class="login-sub">Connectez-vous avec votre email d'entreprise</div>
    <form id="loginForm" autocomplete="on" onsubmit="doLogin(event)">
      <input type="email" id="loginEmail" name="email" class="login-inp" placeholder="Email d'entreprise" autocomplete="username">
      <input type="password" id="loginPassword" name="password" class="login-inp" placeholder="Mot de passe" maxlength="50" autocomplete="current-password">
      <div class="login-rem"><input type="checkbox" id="loginRemember" checked><label for="loginRemember">Rester connecté</label></div>
      <button type="submit" class="login-btn" id="loginBtn">Se connecter</button>
    </form>
    <div class="login-err" id="loginError"></div>
  </div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="tb-left">
    <div class="logo-flip-container" id="logoFlipContainer">
      <div class="logo-main">
        <img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
        <span class="logo-bottom-text">Insp. Finale</span>
      </div>
    </div>
  </div>
  <div class="tb-center"><span class="top-title">🔍 Inspection Finale</span></div>
  <div class="tb-right">
    <span class="status-dot" id="statusDot"></span>
    <span class="user-name" id="userBadge"></span>
    <span class="sync-indicator offline" id="syncBadge" style="display:none;">⬤</span>
    <a href="#" onclick="doLogout();return false;" class="tb-logout-btn" title="Déconnexion">🚪</a>
  </div>
</header>

<!-- TOOLBAR -->

function colDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function colDrop(e){
  e.preventDefault();
  var target=e.currentTarget;target.classList.remove('drag-over');
  if(!_dragSrc||target===_dragSrc)return;
  var srcId=_dragSrc.getAttribute('data-colid');
  var tgtId=target.getAttribute('data-colid');
  var cfg=getColCfg();
  var order=cfg.order.slice();
  var si=order.indexOf(srcId),ti=order.indexOf(tgtId);
  if(si<0||ti<0)return;
  order.splice(si,1);
  var newTi=order.indexOf(tgtId);
  order.splice(newTi,0,srcId);
  cfg.order=order;
  saveColCfg(cfg);_lastColSig='';
  openColPanel();
  renderTable();
}
function colDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.col-card').forEach(function(c){c.classList.remove('drag-over');});

function doLogin(ev){

  var btn=document.getElementById('loginBtn'),errEl=document.getElementById('loginError');
  var rem=document.getElementById('loginRemember');errEl.textContent='';
  if(!em||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){errEl.textContent='Email invalide';return;}
  if(!pw){errEl.textContent='Mot de passe requis';return;}
  btn.disabled=true;btn.textContent='Connexion...';
  var pers=rem&&rem.checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
  firebase.auth().setPersistence(pers).then(function(){return firebase.auth().signInWithEmailAndPassword(em,pw);})
  .catch(function(e){
    var m='Erreur';
    if(e.code==='auth/user-not-found')m='Compte introuvable.';
    else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')m='Email ou mot de passe incorrect.';
    else if(e.code==='auth/too-many-requests')m='Trop de tentatives.';
    else m=e.message;
    errEl.textContent=m;btn.disabled=false;btn.textContent='Se connecter';
  });
}

/* ═══ ENSURE 400 EMPTY ROWS ═══ */
function ensureRows(md){
  var rows=md.rows;
  var entryCount=0;
  for(var i=0;i<rows.length;i++){if(rows[i].type==='entry')entryCount++;}
  var need=EMPTY_ROWS-entryCount;
  if(need<=0)return false;
  for(var j=0;j<need;j++){
    rows.push({id:'e-'+Date.now()+'-'+j+'-'+Math.random().toString(36).substr(2,4),type:'entry',cmd:'',po:'',client:'',desc:'',item:'',qty:'',noboite:'',comment:''});
  }
  return true;
}

/* ═══ BACKUP SYSTEM ═══ */
var _lastBkTime=0;
var BK_KEY='_bk_'+LK;
function _autoBackup(){
  var now=Date.now();
  if(now-_lastBkTime<60000)return; // Max 1/min
  _lastBkTime=now;
  try{
    var raw=localStorage.getItem(LK);
    if(!raw)return;
    var data=JSON.parse(raw);
    var count=0;
    Object.keys(data).forEach(function(m){(data[m]||[]).forEach(function(r){if(r.type==='entry'&&(r.cmd||r.po||r.item))count++;});});
    if(count<1)return;
    // Slot localStorage
    localStorage.setItem(BK_KEY,raw);
    localStorage.setItem(BK_KEY+'_ts',new Date().toISOString());
    // Firebase backup toutes les 30 min
    var fbBkKey='_bk_inspfinale_fb_ts';
    var lastFbBk=parseInt(localStorage.getItem(fbBkKey))||0;
    if(now-lastFbBk>1800000&&fbDb&&fbUser){
      fbDb.ref('inspFinaleBackups/'+fbUser.email.replace(/\./g,'_')).set({
        data:data,
        timestamp:new Date().toISOString(),
        count:count
      }).then(function(){
        localStorage.setItem(fbBkKey,String(now));
        console.log('[BACKUP] ✅ Firebase backup: '+count+' entrées');
      }).catch(function(){});
    }
  }catch(e){}
}
function restoreBackup(){
  var bk=localStorage.getItem(BK_KEY);
  var ts=localStorage.getItem(BK_KEY+'_ts');
  if(!bk){toast('Aucun backup trouvé','err');return;}
  var data=JSON.parse(bk);
  var count=0;
  Object.keys(data).forEach(function(m){(data[m]||[]).forEach(function(r){if(r.type==='entry'&&(r.cmd||r.po||r.item))count++;});});
  if(!confirm('Restaurer backup du '+(ts||'?')+' ('+count+' entrées)?'))return;
  localStorage.setItem(LK,bk);
  debPush();renderTable();
  toast('✅ Backup restauré ('+count+' entrées)','ok');
}

/* ═══ FIREBASE SYNC ═══ */
function pushFB(){
  if(!fbUser){setSB('offline');return;}
  var data=load();
  var clean={};
  var totalEntries=0;
  Object.keys(data).forEach(function(m){
    var rows=data[m]||[];
    var filtered=rows.filter(function(r){
      if(r.type==='date')return true;
      if(r.type==='entry')return(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
      return false;
    });
    if(filtered.length>0){clean[m]=filtered;filtered.forEach(function(r){if(r.type==='entry')totalEntries++;});}
  });
  console.log('[PUSH] → Firebase: '+totalEntries+' entrées');
  // 🛡️ Vérifier qu'on n'efface pas tout
  _fbW=true;setSB('syncing');
  fbDb.ref(FB).once('value').then(function(snap){
    var fbData=snap.val();
    var fbCount=0;
    if(fbData)Object.keys(fbData).forEach(function(m){(fbData[m]||[]).forEach(function(r){if(r.type==='entry')fbCount++;});});
    if(fbCount>3&&totalEntries<fbCount*0.5){
      console.error('[PUSH] 🛡️ BLOQUÉ: réduction suspecte FB='+fbCount+' → Local='+totalEntries);
      _fbW=false;setSB('online');
      return;
    }
    fbDb.ref(FB).set(clean).then(function(){
      setTimeout(function(){_fbW=false;setSB('online');},1500);
      console.log('[PUSH] ✅ Sauvegardé');
    }).catch(function(e){_fbW=false;setSB('offline');console.error('FB err:',e.message);});
  }).catch(function(){
    // Firebase unreachable — push quand même si on a des données
    if(totalEntries>0){
      fbDb.ref(FB).set(clean).then(function(){
        setTimeout(function(){_fbW=false;setSB('online');},1500);
      }).catch(function(e){_fbW=false;setSB('offline');});
    }else{_fbW=false;setSB('offline');}
  });
}
function debPush(){clearTimeout(_syncT);_syncT=setTimeout(pushFB,800);}

/* Force push — bypass la protection anti-perte (pour les suppressions intentionnelles) */
function forcePushFB(){
  if(!fbUser)return;
  var data=load();
  var clean={};
  Object.keys(data).forEach(function(m){
    var rows=data[m]||[];
    var filtered=rows.filter(function(r){
      if(r.type==='date')return true;
      if(r.type==='entry')return(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
      return false;
    });
    if(filtered.length>0)clean[m]=filtered;
  });
  _fbW=true;setSB('syncing');
  fbDb.ref(FB).set(clean).then(function(){
    setTimeout(function(){_fbW=false;setSB('online');},1500);
    console.log('[FORCE PUSH] ✅ Suppression synchronisée');
  }).catch(function(e){_fbW=false;setSB('offline');console.error('[FORCE PUSH] ❌',e.message);});
}

function _merge(fb,loc){
  var m={};
  // Start with local as base (local wins for existing IDs — respects deletions)
  if(loc)Object.keys(loc).forEach(function(k){m[k]=(loc[k]||[]).slice();});
  // Add from Firebase only IDs that don't exist in local
  if(fb)Object.keys(fb).forEach(function(k){
    if(!m[k]){m[k]=(fb[k]||[]).slice();return;}
    var ids={};m[k].forEach(function(r){if(r.id)ids[r.id]=true;});
    (fb[k]||[]).forEach(function(r){if(r.id&&!ids[r.id])m[k].push(r);});
  });
  return m;
}

function startSync(){
  if(_syncPhase!=='idle')return;_syncPhase='syncing';
  fbDb.ref(FB).once('value').then(function(s){
    var fb=s.val(),loc=load();
    if(fb){var merged=_merge(fb,loc);localStorage.setItem(LK,JSON.stringify(merged));}
    _syncPhase='live';renderTable();
    setTimeout(listenFB,1500);
    loadSerieCards();
  }).catch(function(){_syncPhase='live';renderTable();});
  setTimeout(function(){if(_syncPhase==='syncing'){_syncPhase='live';renderTable();}},8000);
}
function listenFB(){
  if(_fbL)fbDb.ref(FB).off('value',_fbL);
  _fbL=fbDb.ref(FB).on('value',function(s){
    if(_fbW||_syncPhase==='syncing'){console.log('[LISTEN] Bloqué (_fbW='+_fbW+')');return;}
    var fb=s.val();
    if(!fb){console.log('[LISTEN] Firebase vide — ignoré');return;}
    var loc=load();
    var merged=_merge(fb,loc);
    // 🛡️ PROTECTION: ne jamais perdre de données — vérifier chaque mois
    var dominated=false;
    Object.keys(loc).forEach(function(m){
      var locCount=0;(loc[m]||[]).forEach(function(r){if(r.type==='entry'&&(r.cmd||r.po||r.item))locCount++;});
      var mergedCount=0;if(merged[m])(merged[m]||[]).forEach(function(r){if(r.type==='entry'&&(r.cmd||r.po||r.item))mergedCount++;});
      if(locCount>0&&mergedCount<locCount){
        console.warn('[LISTEN] 🛡️ Protection: '+m+' local='+locCount+' merged='+mergedCount+' — on garde le local');
        merged[m]=loc[m];
        dominated=true;
      }
    });
    console.log('[LISTEN] Merge OK'+(dominated?' (protégé)':''));
    localStorage.setItem(LK,JSON.stringify(merged));
    renderTable();
  });
}
function stopSync(){if(_fbL){fbDb.ref(FB).off('value',_fbL);_fbL=null;}_syncPhase='idle';}
function doRefresh(){
  if(!fbDb||!fbUser){renderTable();toast('🔄 Local','info');return;}
  setSB('syncing');
  fbDb.ref(FB).once('value').then(function(s){
    var fb=s.val();if(fb){var loc=load();var m=_merge(fb,loc);localStorage.setItem(LK,JSON.stringify(m));}
    renderTable();setSB('online');toast('🔄 OK','ok');
    loadSerieCards();
  }).catch(function(){renderTable();setSB('offline');toast('⚠️ Erreur','err');});
}

/* ═══ FULL CLASSEUR SYNC — vérifie tous les mois + Série+ ═══ */
function doFullSync(){
  if(!fbDb||!fbUser){toast('⚠️ Non connecté','err');return;}
  toast('📊 Vérification du classeur...','info');
  setSB('syncing');
  
  var stats={months:0,entries:0,serieLinked:0,serieUpdated:0,errors:0};
  
  // 1. Sync Firebase → local (tous les mois)
  fbDb.ref(FB).once('value').then(function(snap){
    var fb=snap.val();
    var loc=load();
    if(fb){
      var merged=_merge(fb,loc);
      // Compter les stats
      Object.keys(merged).forEach(function(m){
        stats.months++;
        (merged[m]||[]).forEach(function(r){
          if(r.type==='entry'&&(r.cmd||r.po||r.item))stats.entries++;
        });
      });
      localStorage.setItem(LK,JSON.stringify(merged));
    }
    
    // 2. Recharger toutes les cartes Série+ depuis Firebase
    fbDb.ref('serieCommandes').once('value').then(function(sSnap){
      var serieData=sSnap.val()||{};
      var localSerie=getSerieCards();
      
      // Sync complet des cartes Série+
      Object.keys(serieData).forEach(function(cid){
        var f=serieData[cid];
        if(!localSerie[cid]){localSerie[cid]=f;stats.serieUpdated++;return;}
        var l=localSerie[cid];
        if(f.client)l.client=f.client;
        if(f.order)l.order=f.order;
        if(f.numeroPO)l.numeroPO=f.numeroPO;
        if(f.targetColumn)l.targetColumn=f.targetColumn;
        if(f._typeManuel!==undefined)l._typeManuel=f._typeManuel;
        if(f._manualStatus)l._manualStatus=f._manualStatus;
        if(f.items){
          l.items=f.items; // Prendre la version Firebase complète
          stats.serieUpdated++;
        }
      });
      localStorage.setItem(SK,JSON.stringify(localSerie));
      _serieCache={};
      
      // 3. Vérifier les liens Série+ dans toutes les lignes d'inspection
      var allData=load();
      var updated=false;
      Object.keys(allData).forEach(function(month){
        (allData[month]||[]).forEach(function(row){
          if(row.type!=='entry'||!row.cmd)return;
          var match=findSerie(row.cmd);
          if(match){
            stats.serieLinked++;
            var card=match.card;
            // Mettre à jour client et PO depuis Série+
            if(card.client&&!row.client){row.client=getSerieAutoClient(card);updated=true;}
            if(card.numeroPO&&!row.po){row.po=card.numeroPO;updated=true;}
          }
        });
      });
      if(updated){
        localStorage.setItem(LK,JSON.stringify(allData));
        debPush();
      }
      
      renderTable();setSB('online');
      toast('📊 Classeur: '+stats.months+' mois, '+stats.entries+' entrées, '+stats.serieLinked+' liées à Série+','ok');
      
    }).catch(function(e){
      console.error('[FULL SYNC] Série+ error:',e.message);
      stats.errors++;
      renderTable();setSB('online');
      toast('📊 Classeur sync OK (Série+ indisponible)','info');
    });
    
  }).catch(function(e){
    console.error('[FULL SYNC] Firebase error:',e.message);
    setSB('offline');
    toast('⚠️ Erreur de connexion','err');
  });
}

/* ═══ SÉRIE+ LOOKUP ═══ */
var SK='physipro_serie_cards';
var _serieCache={};
function getSerieCards(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};}}
function findSerie(num){
  var cards=getSerieCards();var n=String(num).trim();if(!n)return null;
  var nStrip=n.replace(/^0+/,'');var nL6=nStrip.slice(-6);
  var cardCount=Object.keys(cards).length;
  console.log('[findSerie] Cherche "'+n+'" (strip="'+nStrip+'", L6="'+nL6+'") dans '+cardCount+' cartes');
  // Log les 3 premières cartes pour debug
  var sample=Object.keys(cards).slice(0,3);
  sample.forEach(function(id){
    var c=cards[id];
    console.log('[findSerie] Carte: id='+id+' order="'+(c.order||'')+'" numeroPO="'+(c.numeroPO||'')+'" client="'+(c.client||'')+'"');
  });
  for(var id in cards){
    var o=String(cards[id].order||'').trim();var p=String(cards[id].numeroPO||'').trim();
    var oS=o.replace(/^0+/,'');var pS=p.replace(/^0+/,'');
    if(o===n||p===n)return{cardId:id,card:cards[id]};
    if(oS===nStrip||pS===nStrip)return{cardId:id,card:cards[id]};
    if(oS.slice(-6)===nL6&&nL6.length>=4)return{cardId:id,card:cards[id]};
    if(pS.slice(-6)===nL6&&nL6.length>=4)return{cardId:id,card:cards[id]};
  }
  console.log('[findSerie] ❌ Aucun match');
  return null;
}
function _cachedFind(bon){var k=String(bon).trim();if(!k)return null;if(_serieCache.hasOwnProperty(k))return _serieCache[k];var r=findSerie(k);_serieCache[k]=r;return r;}
function _isClientCard(card){if(!card)return false;if(card._typeManuel==='client')return true;if(card._typeManuel==='serie')return false;var items=card.items||[];if(!items.length)return true;for(var i=0;i<items.length;i++){var gs=items[i].grandeurs||[];if(gs.length>1)return false;for(var g=0;g<gs.length;g++){if((parseInt(gs[g].qty)||0)>1)return false;}}return true;}
function getSerieAutoClient(card){
  if(!card)return'';var tc=card.targetColumn||'';var isCl=_isClientCard(card);var suf=isCl?' client':' série';
  if(tc==='serieCollapsableCards')return'Vermeiren série';if(tc==='serieBoList')return'Vermeiren client';
  if(tc==='serieFranceSerieList')return'France série';if(tc==='serieFranceClientList')return'France client';
  if(tc==='serieC1southList')return'C1South'+suf;if(tc==='serieHmeList')return'HME'+suf;
  if(tc==='serieCubroList')return(card._customColName||'Autre 1')+suf;if(tc==='serieAutreList')return(card._customColName||'Autre 2')+suf;
  var cl=(card.client||'').trim();if(!cl)return'';var clL=cl.toLowerCase().replace(/[^a-z0-9]/g,'');
  var nm={france:'France',vermeiren:'Vermeiren',hme:'HME',c1south:'C1South',cubro:'Cubro',inventaire:'Inventaire'};
  var dn=nm[clL]||cl;if(clL==='inventaire')return'Inventaire';return dn+suf;
}
var SERIE_DOT={serieCollapsableCards:'#4ade80',serieBoList:'#4ade80',serieFranceSerieList:'#facc15',serieFranceClientList:'#facc15',serieC1southList:'#c084fc',serieHmeList:'#E8B97A',serieCubroList:'#22d3ee',serieAutreList:'#fb7185'};
var CLIENT_DOT={france:'#facc15',vermeiren:'#4ade80',hme:'#E8B97A',c1south:'#c084fc',cubro:'#22d3ee',inventaire:'#f97316',serie:'#f97316',default:'#3b82f6'};
function getDotColor(card){if(!card)return CLIENT_DOT.default;var tc=card.targetColumn||'';if(tc&&SERIE_DOT[tc])return SERIE_DOT[tc];var cl=(card.client||'').toLowerCase().replace(/[^a-z0-9]/g,'');return CLIENT_DOT[cl]||CLIENT_DOT.default;}

/* ═══ LOAD SERIE CARDS FROM FIREBASE (at sync) ═══ */
function loadSerieCards(){
  if(!fbDb)return;
  fbDb.ref('serieCommandes').once('value').then(function(snap){
    var fb=snap.val();if(!fb)return;
    var local=getSerieCards();
    Object.keys(fb).forEach(function(cid){
      if(!local[cid]){local[cid]=fb[cid];return;}
      var l=local[cid],f=fb[cid];
      if(f.client)l.client=f.client;if(f.order)l.order=f.order;
      if(f.numeroPO)l.numeroPO=f.numeroPO;if(f.targetColumn)l.targetColumn=f.targetColumn;
      if(f._typeManuel!==undefined)l._typeManuel=f._typeManuel;
      if(f.items){if(!l.items)l.items=[];
        f.items.forEach(function(fi,ii){
          if(!l.items[ii]){l.items[ii]=fi;return;}
          if(fi.name)l.items[ii].name=fi.name;
          if(!l.items[ii].grandeurs)l.items[ii].grandeurs=[];
          (fi.grandeurs||[]).forEach(function(fg,gi){
            if(!l.items[ii].grandeurs[gi]){l.items[ii].grandeurs[gi]=fg;return;}
            var lg=l.items[ii].grandeurs[gi];if(fg.qty)lg.qty=fg.qty;if(fg.name)lg.name=fg.name;if(fg._status)lg._status=fg._status;
          });
        });
      }
    });
    localStorage.setItem(SK,JSON.stringify(local));
    _serieCache={};
    console.log('[SERIE] Loaded '+Object.keys(local).length+' cards');
  }).catch(function(e){console.warn('[SERIE] Load error:',e.message);});
}

  for(var i=0;i<data[m].length;i++){
    var r=data[m][i];
    if(r.type==='date')lastFilledIdx=i;
    else if(r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment))lastFilledIdx=i;
  }
  // Chercher la première ligne vide juste après
  var startSearch=lastFilledIdx+1;

    var r=data[m][i];

      r.cmd=bon;
      targetIdx=i;
      break;
    }
  }
  if(targetIdx<0){
    // Insérer juste après la dernière ligne remplie
    var insertAt=lastFilledIdx+1;

function confirmSerie(){
  var ctx=window._serieCtx;if(!ctx)return;
  var checked=[];
  document.querySelectorAll('[id^="gc_"]').forEach(function(chk){
    if(chk.checked){
      var parts=chk.id.replace('gc_','').split('-');
      checked.push({ii:parseInt(parts[0]),gi:parseInt(parts[1])});
    }
  });
  if(!checked.length){toast('Sélectionnez au moins un item','err');return;}
  var card=ctx.card;var cid=ctx.cid;
  var itemLines=[];var totalQty=0;
  checked.forEach(function(c){
    var item=card.items[c.ii];if(!item)return;
    var g=item.grandeurs[c.gi];if(!g)return;
    var tQ=parseInt(g.qty)||0;
    var gName=g.name||'STD';var iName=item.name||'';
    itemLines.push((iName?iName+'|':'')+gName+' '+tQ+'x');
    totalQty+=tQ;
  });

  // ═══ 1. Remplir la ligne dans l'inspection finale ═══
  var el=document.getElementById('insp-month');
  var m=el?el.value:gmk();
  var data=load();
  if(!data[m])data[m]=[];
  var rows=data[m];
  var targetIdx=window._serieTargetRow;
  window._serieTargetRow=null;

  if(targetIdx!=null&&rows[targetIdx]&&rows[targetIdx].type==='entry'){
    var row=rows[targetIdx];
    row.cmd=ctx.bon;row.po=card.numeroPO||'';row.client=ctx.clientLabel;
    row.item=itemLines.join('\n');row.qty=String(totalQty);row.serieLinked=true;
  }else{
    var filled=false;
    for(var ri=0;ri<rows.length;ri++){
      var rr=rows[ri];
      if(rr.type==='entry'&&!rr.cmd&&!rr.po&&!rr.client&&!rr.desc&&!rr.item&&!rr.qty&&!rr.noboite&&!rr.comment){
        rr.cmd=ctx.bon;rr.po=card.numeroPO||'';rr.client=ctx.clientLabel;
        rr.item=itemLines.join('\n');rr.qty=String(totalQty);rr.serieLinked=true;
        filled=true;break;
      }
    }
    if(!filled){
      rows.push({
        id:'e-'+Date.now()+'-'+Math.random().toString(36).substr(2,4),
        type:'entry',cmd:ctx.bon,po:card.numeroPO||'',
        client:ctx.clientLabel,desc:'',
        item:itemLines.join('\n'),qty:String(totalQty),
        noboite:'',comment:'',serieLinked:true
      });
    }
  }
  save(data);

  // ═══ 2. Mettre à jour Série+ dans Firebase → statut "emballé" ═══
  if(fbDb&&cid){
    fbDb.ref('serieCommandes/'+cid).once('value').then(function(snap){
      var fbCard=snap.val();
      if(!fbCard||!fbCard.items){console.warn('[EMBALLE] Carte introuvable dans Firebase');return;}

      // Mettre _status='emballe' sur chaque grandeur cochée
      checked.forEach(function(c){
        if(fbCard.items[c.ii]&&fbCard.items[c.ii].grandeurs&&fbCard.items[c.ii].grandeurs[c.gi]){
          fbCard.items[c.ii].grandeurs[c.gi]._status='emballe';
        }
      });

      // Recalculer _manualStatus de la carte
      var allStatuses=[];
      var showCouture=!(fbCard._itemSkipCouture===true);
      (fbCard.items||[]).forEach(function(item){
        (item.grandeurs||[]).forEach(function(g){
          var s=g._status||'produire';
          allStatuses.push(s);
        });
      });
      if(allStatuses.length>0){
        if(allStatuses.every(function(s){return s==='emballe';})){
          fbCard._manualStatus='emballe';
        }else if(allStatuses.every(function(s){return s==='complete'||s==='emballe';})){
          fbCard._manualStatus='complete';
        }else if(allStatuses.some(function(s){return s!=='produire';})){
          fbCard._manualStatus='partiel';
        }else{
          fbCard._manualStatus='produire';
        }
      }

      // Push vers Firebase
      fbDb.ref('serieCommandes/'+cid).update({
        items:fbCard.items,
        _manualStatus:fbCard._manualStatus
      }).then(function(){
        console.log('[EMBALLE] ✅ Carte '+cid+' → '+fbCard._manualStatus+' ('+checked.length+' grandeurs emballées)');
      }).catch(function(e){
        console.error('[EMBALLE] ❌ Erreur Firebase:',e.message);
      });

      // Aussi mettre à jour le localStorage des cartes Série+
      var local=getSerieCards();
      if(local[cid]){
        checked.forEach(function(c){
          if(local[cid].items&&local[cid].items[c.ii]&&local[cid].items[c.ii].grandeurs&&local[cid].items[c.ii].grandeurs[c.gi]){
            local[cid].items[c.ii].grandeurs[c.gi]._status='emballe';
          }
        });
        local[cid]._manualStatus=fbCard._manualStatus;
        localStorage.setItem(SK,JSON.stringify(local));
      }
    }).catch(function(e){console.error('[EMBALLE] Firebase read error:',e.message);});
  }

  closeModal();_serieCache={};renderTable();
  toast('✅ #'+ctx.bon+' Série+ emballé','ok');
}

/* ═══ REOPEN SERIE MODAL (clic étoile) ═══ */
function reopenSerie(bon,rowIdx){
  if(!bon)return;
  window._serieTargetRow=(rowIdx!=null)?rowIdx:null;
  toast('🔍 Chargement Série+ #'+bon+'...','info');
  if(fbDb){
    fbDb.ref('serieCommandes').once('value').then(function(snap){
      var fb=snap.val()||{};var local=getSerieCards();
      Object.keys(fb).forEach(function(cid){
        if(!local[cid]){local[cid]=fb[cid];return;}
        var l=local[cid],f=fb[cid];
        if(f.client)l.client=f.client;if(f.order)l.order=f.order;
        if(f.numeroPO)l.numeroPO=f.numeroPO;if(f.targetColumn)l.targetColumn=f.targetColumn;
        if(f._typeManuel!==undefined)l._typeManuel=f._typeManuel;
        if(f.items){if(!l.items)l.items=[];
          f.items.forEach(function(fi,ii){
            if(!l.items[ii]){l.items[ii]=fi;return;}if(fi.name)l.items[ii].name=fi.name;
            if(!l.items[ii].grandeurs)l.items[ii].grandeurs=[];
            (fi.grandeurs||[]).forEach(function(fg,gi){
              if(!l.items[ii].grandeurs[gi]){l.items[ii].grandeurs[gi]=fg;return;}
              var lg=l.items[ii].grandeurs[gi];if(fg.qty)lg.qty=fg.qty;if(fg.name)lg.name=fg.name;if(fg._status)lg._status=fg._status;
            });
          });
        }
      });
      localStorage.setItem(SK,JSON.stringify(local));_serieCache={};
      var found=findSerie(bon);
      if(found){openSerieModal(bon,found);}
      else{toast('⚠️ Carte Série+ introuvable pour #'+bon,'err');}
    }).catch(function(){
      var found=findSerie(bon);
      if(found){openSerieModal(bon,found);}
      else{toast('⚠️ Carte introuvable','err');}
    });
  }else{
    var found=findSerie(bon);
    if(found){openSerieModal(bon,found);}
    else{toast('⚠️ Carte introuvable','err');}
  }
}

  el.classList.add('selected');el.querySelector('input[type=radio]').checked=true;

function getPrintRows(){
  var el=document.getElementById('insp-month');
  var m=el?el.value:gmk();
  var data=load();
  var rows=data[m]||[];
  var mode=window._printMode||'all';

  if(mode==='all'){
    return rows.filter(function(r){
      if(r.type==='date')return true;
      return r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment);
    });
  }

  // Trouver les index des séparateurs de date
  if(mode==='day'){
    var dayIdx=parseInt(document.getElementById('printDay1').value);
    // Trouver la prochaine date ou la fin
    var nextDateIdx=rows.length;
    for(var i=dayIdx+1;i<rows.length;i++){
      if(rows[i].type==='date'){nextDateIdx=i;break;}
    }
    var result=[];
    for(var j=dayIdx;j<nextDateIdx;j++){
      var r=rows[j];
      if(r.type==='date')result.push(r);
      else if(r.type==='entry'&&(r.cmd||r.po||r.client||r.desc||r.item||r.qty||r.noboite||r.comment))result.push(r);
    }
    return result;
  }

  if(mode==='range'){
    var fromIdx=parseInt(document.getElementById('printFrom').value);
    var toIdx=parseInt(document.getElementById('printTo').value);
    if(fromIdx>toIdx){var tmp=fromIdx;fromIdx=toIdx;toIdx=tmp;}
    // Aller jusqu'à la prochaine date après toIdx ou la fin
    var endIdx=rows.length;
    for(var k=toIdx+1;k<rows.length;k++){
      if(rows[k].type==='date'){endIdx=k;break;}
    }
    var result2=[];
    for(var l=fromIdx;l<endIdx;l++){
      var r2=rows[l];
      if(r2.type==='date')result2.push(r2);
      else if(r2.type==='entry'&&(r2.cmd||r2.po||r2.client||r2.desc||r2.item||r2.qty||r2.comment))result2.push(r2);
    }
    return result2;
  }

  return [];
}

  var el=document.getElementById('printCount');

/* ═══ RENDER ITEM CELL — style Production Couture ═══ */
function parseItemLine(str){
  str=str.trim();
  var partial=false;
  if(str.charAt(0)==='~'){partial=true;str=str.substring(1);}
  // Format: "ItemName|Grandeur Qtéx" ou "ItemName Qtéx" ou "Grandeur Qtéx"
  var pipeIdx=str.indexOf('|');
  var iName='',rest=str;
  if(pipeIdx>=0){iName=str.substring(0,pipeIdx).trim();rest=str.substring(pipeIdx+1).trim();}
  // Parse qty
  var mx=rest.match(/^(.+?)\s+(\d+)x$/)||rest.match(/^(.+?)\s*x(\d+)$/);
  if(mx){
    var gName=mx[1].trim();
    var qty=parseInt(mx[2]);
    var displayName=iName?(iName+' '+gName):gName;
    return{name:displayName,qty:qty,partial:partial};
  }
  var displayName2=iName?(iName+' '+rest):rest;
  return{name:displayName2,qty:1,partial:partial};
}

function renderSerieItemCell(val){
  if(!val)return'';
  if(val.indexOf('|')<0&&!val.match(/\d+x/))return esc(val);

  // Splitter — supporter \n et ", "
  var lines;
  if(val.indexOf('\n')>=0){
    lines=val.split('\n').filter(function(x){return x.trim();});
  }else{
    lines=val.split(/,\s*(?=[A-ZÀ-Ü~])/i).filter(function(x){return x.trim();});
  }
  if(!lines.length)return esc(val);

  var parsed=lines.map(function(l){return parseItemLine(l);});
  // Trier alphabétiquement par nom
  parsed.sort(function(a,b){return a.name.localeCompare(b.name);});

  var h='<div style="display:flex;flex-direction:column;gap:0;width:100%;">';
  parsed.forEach(function(p){
    var badgeCls=p.partial?'si-badge part':'si-badge';
    h+='<div class="si-row">';
    h+='<span class="'+badgeCls+'">'+p.qty+'x</span>';
    h+='<span class="si-name">'+esc(p.name)+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ═══ COLUMN RESIZE ═══ */
var _resize=null;
var COL_W_KEY='physipro_inspfinale_colwidths';
function getColWidths(){try{return JSON.parse(localStorage.getItem(COL_W_KEY))||{};}catch(e){return {};}}
function saveColWidths(w){localStorage.setItem(COL_W_KEY,JSON.stringify(w));}
function applyColWidths(){/* called after buildHead */
  var w=getColWidths();var cg=document.getElementById('cg');if(!cg)return;
  Object.keys(w).forEach(function(id){
    var col=cg.querySelector('col[data-colid="'+id+'"]');if(col)col.style.width=w[id]+'px';
  });
}
function startResize(e,colId){
  e.preventDefault();e.stopPropagation();
  var cg=document.getElementById('cg');if(!cg)return;
  var col=cg.querySelector('col[data-colid="'+colId+'"]');if(!col)return;
  var curW=parseInt(col.style.width)||80;
  _resize={colId:colId,startX:e.clientX,startW:curW,col:col};
  e.target.classList.add('active');
  document.body.classList.add('col-resizing');
  document.addEventListener('mousemove',onResize);
  document.addEventListener('mouseup',stopResize);
}
function onResize(e){
  if(!_resize)return;
  var diff=e.clientX-_resize.startX;
  _resize.col.style.width=Math.max(30,_resize.startW+diff)+'px';
}
function stopResize(e){
  if(!_resize)return;
  var nw=Math.max(30,_resize.startW+(e.clientX-_resize.startX));
  _resize.col.style.width=nw+'px';
  var w=getColWidths();w[_resize.colId]=nw;saveColWidths(w);
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.resize-handle').forEach(function(h){h.classList.remove('active');});
  document.removeEventListener('mousemove',onResize);
  document.removeEventListener('mouseup',stopResize);
  _resize=null;
}

/* ═══ BUILD HEAD + COLGROUP (dynamic) ═══ */
var _lastColSig='';
function buildHead(){
  var vis=getVisCols();
  var sig=vis.map(function(c){return c.id;}).join(',');
  if(sig===_lastColSig)return vis;
  _lastColSig=sig;
  var cg=document.getElementById('cg');
  var thead=document.getElementById('thead');
  // Colgroup
  var cgH='';
  vis.forEach(function(c){
    var w=c.w||80;
    var saved=getColWidths();if(saved[c.id])w=saved[c.id];
    cgH+='<col data-colid="'+c.id+'" style="width:'+(c.id==='item'||c.id==='desc'||c.id==='comment'?'auto':w+'px')+';">';
  });
  cg.innerHTML=cgH;
  // Thead
  var thH='<tr>';
  vis.forEach(function(c){
    var align=(c.id==='desc'||c.id==='item'||c.id==='comment')?' style="text-align:left;padding-left:6px;"':'';
    var resizer=(!c.fixed)?'<div class="resize-handle" onmousedown="startResize(event,\''+c.id+'\')"></div>':'';
    thH+='<th'+align+'>'+c.label+resizer+'</th>';
  });
  thH+='</tr>';
  thead.innerHTML=thH;
  return vis;
}

function renderTable(){
  if(_syncPhase==='syncing')return;
  // TOUJOURS sauvegarder l'input actif avant de reconstruire le tableau
  saveActiveInput();
  // Mémoriser le mois courant pour saveActiveInput
  var el=document.getElementById('insp-month');
  _lastMonth=el?el.value:gmk();
  var md=gmd();
  var added=ensureRows(md);
  if(added){
    // Relire le localStorage FRAIS et ne modifier QUE le mois courant
    var freshData=load();
    freshData[md.month]=md.rows;
    localStorage.setItem(LK,JSON.stringify(freshData));
  }

  var vis=buildHead();
  var nc=vis.length+(_delMode?1:0);
  _serieCache={};
  var rows=md.rows;
  var f=getSF();
  var tb=document.getElementById('tbody');if(!tb)return;
  var h='';var num=0;

  for(var i=0;i<rows.length;i++){
    var r=rows[i];if(!r)continue;

    if(r.type==='date'){
      if(f)continue;
      h+='<tr class="date-row"><td colspan="'+nc+'"><div class="date-inner">';
      h+='<span class="date-lbl" onclick="editDateSep(event,'+i+')">📅 '+esc(r.dateLabel)+'</span>';
      h+='<span class="date-del" onclick="delRow('+i+')" title="Supprimer">✕</span>';
      h+='</div></td></tr>';
      continue;
    }

    if(r.type!=='entry')continue;

    if(f){
      var hay=((r.cmd||'')+(r.po||'')+(r.client||'')+(r.desc||'')+(r.item||'')+(r.qty||'')+(r.comment||'')).toLowerCase();
      if(hay.indexOf(f)<0)continue;
    }

    num++;
    var hasData=(r.cmd||'')+(r.po||'')+(r.client||'')+(r.desc||'')+(r.item||'')+(r.qty||'')+(r.noboite||'')+(r.comment||'');
    var isSerie=r.serieLinked||false;
    if(!isSerie&&r.cmd){var _sf=_cachedFind(r.cmd);if(_sf)isSerie=true;}
    var isDelSel=_delSelected[i]||false;

    h+='<tr data-idx="'+i+'"'+(isDelSel?' class="del-selected"':'')+'>';
    if(_delMode){
      h+='<td class="td-chk">'+(hasData?'<input type="checkbox" id="dchk_'+i+'"'+(isDelSel?' checked':'')+' onchange="toggleDelCheck('+i+')">':'')+'</td>';
    }
    vis.forEach(function(c){
      if(c.id==='num'){
        h+='<td style="color:#94a3b8;font-size:9px;">'+(isSerie?'<span class="serie-star" title="Cliquer pour ouvrir Série+" onclick="reopenSerie(\''+esc(r.cmd).replace(/'/g,"\\'")+'\','+i+')">⭐</span>':num)+'</td>';
      }else if(c.id==='del'){
        h+='<td>'+(hasData?'<span class="row-x" onclick="delRow('+i+')">✕</span>':'')+'</td>';
      }else if(c.id==='client'){
        var cv=r.client||'';
        if(!cv&&r.cmd){var _sc=_cachedFind(r.cmd);if(_sc){cv=getSerieAutoClient(_sc.card)||_sc.card.client||'';}}
        var clColor='';var cvL=(cv||'').toLowerCase();
        if(cvL.indexOf('france')>=0)clColor='#b45309';
        else if(cvL.indexOf('vermeiren')>=0)clColor='#15803d';
        else if(cvL.indexOf('hme')>=0)clColor='#92400e';
        else if(cvL.indexOf('c1south')>=0)clColor='#7c3aed';
        else if(cvL.indexOf('cubro')>=0)clColor='#0e7490';
        else if(cvL.indexOf('inventaire')>=0)clColor='#c2410c';
        var cStyle=clColor?'color:'+clColor+';font-weight:800;':'';
        h+='<td class="td-edit c-client'+(cv?'':' c-empty')+'" style="'+cStyle+'cursor:pointer;" data-field="client" data-idx="'+i+'">'+(cv?esc(cv):'')+'</td>';
      }else{
        var val=r[c.field]||'';
        var cls=c.cls||'c-item';
        var align=(c.align==='center')?'text-align:center;':'text-align:left;';
        // Pour la colonne item: utiliser le rendu structuré si format Série+
        var displayed='';
        if(val&&(c.field==='item'||c.field==='desc')&&(val.indexOf('|')>=0||val.match(/\d+x/))){
          displayed=renderSerieItemCell(val);
        }else{
          displayed=val?esc(val):'';
        }
        h+='<td class="td-edit '+cls+(val?'':' c-empty')+'" style="'+align+'cursor:pointer;" data-field="'+c.field+'" data-idx="'+i+'">'+displayed+'</td>';
      }
    });
    h+='</tr>';
  }

  tb.innerHTML=h;
}

/* ═══ EVENT DELEGATION — clic sur tout le td ═══ */
document.addEventListener('DOMContentLoaded',function(){
  var tb=document.getElementById('tbody');
  if(tb)tb.addEventListener('click',function(e){
    // Ignore si on clique sur un input déjà ouvert ou à l'intérieur d'un td qui en a un
    if(e.target.tagName==='INPUT')return;
    var td=e.target.closest('td[data-field][data-idx]');
    if(!td)return;
    // Si un input est déjà ouvert dans ce td, ne rien faire
    if(td.querySelector('input'))return;
    var idx=parseInt(td.getAttribute('data-idx'));
    var field=td.getAttribute('data-field');
    var colDef=ALL_COLS.find(function(c){return c.field===field;});
    editCell(idx,field,td,{ph:colDef?colDef.ph:'',align:colDef?colDef.align:''});
  });
});
