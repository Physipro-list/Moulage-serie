<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Permissions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:linear-gradient(135deg,#04152c,#1a3a5c);padding:20px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.header p{font-size:12px;opacity:.6;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 18px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-export{background:#22c55e;color:#fff}
.btn-export:hover{background:#16a34a}
.btn-reset{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-reset:hover{background:rgba(255,255,255,.2)}
.badge{background:rgba(250,204,21,.2);color:#eab308;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-left:8px}
.container{padding:16px;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
thead th{background:#1e293b;color:#fff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:10px 4px;position:sticky;top:0;z-index:10;white-space:nowrap}
thead th.name-col{text-align:left;padding-left:14px;min-width:150px;z-index:11;left:0}
thead th.dept-col{min-width:120px}
thead th.mod-group{border-bottom:none;padding-bottom:2px}
thead th.mod-sub{font-size:8px;font-weight:500;padding-top:0;letter-spacing:0;opacity:.7;background:#283548}
thead th.mod-sub.sub-v{color:#86efac}
thead th.mod-sub.sub-m{color:#fbbf24}
.mod-label{display:block;font-size:10px;line-height:1.2}
.mod-icon{font-size:14px;display:block;margin-bottom:1px}
tbody tr{transition:background .15s}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#f0f7ff}
td{padding:6px 4px;text-align:center;border-bottom:1px solid #f1f3f5;font-size:13px;vertical-align:middle}
td.name-cell{text-align:left;padding-left:14px;font-weight:600;color:#1e293b;position:sticky;left:0;background:inherit;z-index:5;white-space:nowrap}
tbody tr:nth-child(even) td.name-cell{background:#fafbfc}
tbody tr:hover td.name-cell{background:#f0f7ff}
td.dept-cell{padding:4px 6px}
td.dept-cell select{width:100%;padding:4px 6px;border-radius:6px;border:1px solid #e2e8f0;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;background:#fff;text-align:center;appearance:auto;color:#334155}
.cb-wrap{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;transition:all .15s;border:2px solid #d1d5db;background:#fff;position:relative;user-select:none}
.cb-wrap:hover{border-color:#94a3b8;transform:scale(1.08)}
.cb-wrap.checked{border-color:#16a34a;background:#dcfce7}
.cb-wrap.checked .cb-check{opacity:1;transform:scale(1)}
.cb-check{width:16px;height:16px;opacity:0;transform:scale(.5);transition:all .15s}
.cb-check path{stroke:#16a34a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.legend{display:flex;gap:20px;padding:12px 28px;font-size:11px;color:#64748b;flex-wrap:wrap;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:14px;height:14px;border-radius:4px;border:2px solid #16a34a;background:#dcfce7;display:flex;align-items:center;justify-content:center}
.legend-dot svg{width:10px;height:10px}
.legend-dot svg path{stroke:#16a34a;stroke-width:2.5;fill:none}
.legend-empty{width:14px;height:14px;border-radius:4px;border:2px solid #d1d5db;background:#fff}
.export-box{display:none;margin:12px 16px;background:#1e293b;border-radius:10px;overflow:hidden}
.export-box.show{display:block}
.export-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.export-header span{color:#94a3b8;font-size:12px;font-weight:600}
.btn-copy{background:#3b82f6;color:#fff;padding:5px 14px;border-radius:6px;border:none;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer}
.btn-copy:hover{background:#2563eb}
.export-box pre{color:#e2e8f0;font-size:11px;padding:12px 16px;overflow-x:auto;max-height:250px;line-height:1.6;font-family:'Fira Code',monospace}
.dept-atelier{background:#dbeafe;color:#1e40af}
.dept-couture{background:#f3e8ff;color:#6b21a8}
.dept-service{background:#fef3c7;color:#92400e}
.dept-gestion{background:#fce7f3;color:#9d174d}
.dept-cnc{background:#cffafe;color:#0e7490}
.dept-entrepot{background:#ede9fe;color:#5b21b6}
.dept-france{background:#fee2e2;color:#991b1b}
.dept-direction{background:#e0f2fe;color:#0369a1}
select option{font-weight:500}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>PhysiPro — Gestion des permissions</h1>
    <p>Cliquer sur les carrés pour activer/désactiver. V = Voir, M = Modifier.</p>
  </div>
  <div class="actions">
    <span class="badge" id="changeCount" style="display:none">0 modifications</span>
    <button class="btn btn-reset" onclick="resetAll()">Réinitialiser</button>
    <button class="btn btn-export" onclick="toggleExport()">Exporter le résumé</button>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot"><svg viewBox="0 0 16 16"><path d="M3 8.5L6.5 12L13 4"/></svg></div> Accès activé</div>
  <div class="legend-item"><div class="legend-empty"></div> Pas d'accès</div>
  <div class="legend-item" style="margin-left:12px;color:#86efac;font-weight:600">V = Voir</div>
  <div class="legend-item" style="color:#fbbf24;font-weight:600">M = Modifier</div>
</div>

<div class="export-box" id="exportBox">
  <div class="export-header">
    <span>Résumé des permissions</span>
    <button class="btn-copy" onclick="copyExport()">Copier</button>
  </div>
  <pre id="exportContent"></pre>
</div>

<div class="container">
  <table id="permTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
var MODULES = [
  {id:'moulage',label:'Moulage',icon:'🏭'},
  {id:'serie',label:'Série+',icon:'📋'},
  {id:'inspection',label:'Insp. Atelier',icon:'☑️'},
  {id:'inspcouture',label:'Prod. Couture',icon:'🧵'},
  {id:'inspfinale',label:'Insp. Finale',icon:'🔍'},
  {id:'psm',label:'Liste Matériaux Atelier',icon:'🔧'},
  {id:'jobs',label:'Service Client',icon:'🎧'},
  {id:'jobsattente',label:'Commandes en attente',icon:'⏳'}
];

var DEPTS = ['Atelier','Couture','Service','Gestion','CNC','Entrepôt','France','Direction'];
var DEPT_CLS = {
  'Atelier':'dept-atelier','Couture':'dept-couture','Service':'dept-service',
  'Gestion':'dept-gestion','CNC':'dept-cnc','Entrepôt':'dept-entrepot',
  'France':'dept-france','Direction':'dept-direction'
};

var USERS = [
  {name:'Daniel',email:'atelieratp@physipro.com',dept:'Gestion',access:{moulage:'VM',serie:'VM',inspection:'VM',inspcouture:'VM',inspfinale:'VM',psm:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Valérie',email:'valerie18@videotron.ca',dept:'Atelier',access:{moulage:'VM',serie:'VM',inspection:'VM',inspcouture:'VM',inspfinale:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Cassie',email:'simdut@physipro.com',dept:'Couture',access:{moulage:'VM',serie:'VM',inspection:'VM',inspcouture:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Michelle',email:'michelle.bouchard@physipro.com',dept:'Service',access:{moulage:'VM',serie:'VM',inspection:'VM',inspcouture:'VM',inspfinale:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Stéphanie',email:'sroy@physipro.com',dept:'Couture',access:{moulage:'VM',serie:'VM',inspection:'VM',inspcouture:'VM',inspfinale:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Sonia',email:'sonia.boulanger@physipro.com',dept:'Service',access:{moulage:'VM',serie:'VM',inspfinale:'V',jobs:'VM',jobsattente:'VM'}},
  {name:'Jacynthe',email:'service3@physipro.com',dept:'Service',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Jonathan',email:'service1@physipro.com',dept:'Service',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Nadia',email:'ngagne@physipro.com',dept:'Service',access:{moulage:'VM',serie:'VM',inspfinale:'V',jobs:'VM',jobsattente:'VM'}},
  {name:'Marie-Pier',email:'mplanguedoc@physipro.com',dept:'Service',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Marie-Soleil',email:'mariesoleilr@physipro.com',dept:'Service',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Fabrys',email:'fabrys.frechette@physipro.com',dept:'Service',access:{moulage:'V',serie:'V',jobs:'V',jobsattente:'VM'}},
  {name:'Sina',email:'cncatp@physipro.com',dept:'CNC',access:{moulage:'VM',inspfinale:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Pierre',email:'peterbass76@gmail.com',dept:'Atelier',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Mario J.',email:'mario.jacques@physipro.com',dept:'CNC',access:{moulage:'VM',jobs:'VM',jobsattente:'VM'}},
  {name:'Mario O.',email:'marioouellette@physipro.com',dept:'Direction',access:{moulage:'V',jobsattente:'VM'}},
  {name:'Sylvain',email:'magasinatp2@physipro.com',dept:'Entrepôt',access:{jobsattente:'VM'}},
  {name:'Stéphane Del.',email:'magasinatp3@physipro.com',dept:'Entrepôt',access:{jobsattente:'VM'}},
  {name:'Roxanne',email:'rh@physipro.com',dept:'Gestion',access:{moulage:'V',serie:'V',inspection:'V',inspcouture:'V',inspfinale:'V',jobs:'V',jobsattente:'VM'}},
  {name:'Patrick C.',email:'coordo.mag.atp@physipro.com',dept:'Entrepôt',access:{jobsattente:'V'}},
  {name:'Élyse',email:'elyse.bolduc@physipro.com',dept:'Gestion',access:{jobsattente:'V'}},
  {name:'Éric',email:'eric.poirier@physipro.com',dept:'Gestion',access:{jobsattente:'V'}},
  {name:'France',email:'contact@physipro.fr',dept:'France',access:{jobsattente:'VM'}},
  {name:'Jean-Christophe',email:'jeanchristophedanjou@physipro.com',dept:'Direction',access:{moulage:'V',serie:'V',inspection:'V',inspcouture:'V',inspfinale:'V',jobs:'V',jobsattente:'V'}}
];

var state = JSON.parse(JSON.stringify(USERS));
var initialJSON = JSON.stringify(USERS);
var checkSVG = '<svg class="cb-check" viewBox="0 0 16 16"><path d="M3 8.5L6.5 12L13 4"/></svg>';

function render(){
  var head = document.getElementById('tableHead');
  var h1 = '<tr><th class="name-col" rowspan="2">Nom</th><th class="dept-col" rowspan="2">Département</th>';
  MODULES.forEach(function(m){
    h1 += '<th class="mod-group" colspan="2"><span class="mod-icon">'+m.icon+'</span><span class="mod-label">'+m.label+'</span></th>';
  });
  h1 += '</tr><tr>';
  MODULES.forEach(function(){
    h1 += '<th class="mod-sub sub-v">V</th><th class="mod-sub sub-m">M</th>';
  });
  h1 += '</tr>';
  head.innerHTML = h1;

  var body = document.getElementById('tableBody');
  var html = '';
  state.forEach(function(u, ui){
    html += '<tr>';
    html += '<td class="name-cell">'+esc(u.name)+'</td>';
    html += '<td class="dept-cell"><select onchange="changeDept('+ui+',this.value)" class="'+(DEPT_CLS[u.dept]||'')+'">';
    DEPTS.forEach(function(d){
      html += '<option value="'+d+'"'+(d===u.dept?' selected':'')+'>'+d+'</option>';
    });
    html += '</select></td>';
    MODULES.forEach(function(m){
      var acc = u.access[m.id] || '';
      var vOn = acc.indexOf('V') !== -1;
      var mOn = acc.indexOf('M') !== -1;
      html += '<td><div class="cb-wrap'+(vOn?' checked':'')+'" onclick="toggle('+ui+',\''+m.id+'\',\'V\',this)" title="Voir">'+checkSVG+'</div></td>';
      html += '<td><div class="cb-wrap'+(mOn?' checked':'')+'" onclick="toggle('+ui+',\''+m.id+'\',\'M\',this)" title="Modifier">'+checkSVG+'</div></td>';
    });
    html += '</tr>';
  });
  body.innerHTML = html;
  updateBadge();
}

function toggle(ui, modId, perm, el){
  var acc = state[ui].access[modId] || '';
  var has = acc.indexOf(perm) !== -1;
  if(has){
    acc = acc.replace(perm, '');
    // If removing V, also remove M
    if(perm === 'V') acc = '';
  } else {
    // If adding M, also add V
    if(perm === 'M' && acc.indexOf('V') === -1) acc = 'V' + acc;
    acc += perm;
  }
  // Normalize order
  var norm = '';
  if(acc.indexOf('V') !== -1) norm += 'V';
  if(acc.indexOf('M') !== -1) norm += 'M';
  if(norm) state[ui].access[modId] = norm;
  else delete state[ui].access[modId];
  
  // Re-render just this row for performance
  render();
}

function changeDept(ui, val){
  state[ui].dept = val;
  render();
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function updateBadge(){
  var changes = 0;
  var init = JSON.parse(initialJSON);
  state.forEach(function(u,i){
    if(u.dept !== init[i].dept) changes++;
    MODULES.forEach(function(m){
      var a = u.access[m.id] || '';
      var b = init[i].access[m.id] || '';
      if(a !== b) changes++;
    });
  });
  var badge = document.getElementById('changeCount');
  if(changes > 0){
    badge.style.display = '';
    badge.textContent = changes + ' modification' + (changes>1?'s':'');
  } else {
    badge.style.display = 'none';
  }
}

function resetAll(){
  if(!confirm('Réinitialiser toutes les permissions aux valeurs originales?')) return;
  state = JSON.parse(initialJSON);
  render();
}

function toggleExport(){
  var box = document.getElementById('exportBox');
  box.classList.toggle('show');
  if(box.classList.contains('show')) generateExport();
}

function generateExport(){
  var lines = [];
  lines.push('RÉSUMÉ DES PERMISSIONS — ' + new Date().toLocaleDateString('fr-CA'));
  lines.push('═'.repeat(70));
  lines.push('');
  state.forEach(function(u){
    var mods = [];
    MODULES.forEach(function(m){
      var a = u.access[m.id];
      if(a){
        mods.push(m.label + ' (' + a + ')');
      }
    });
    var line = u.name + ' [' + u.dept + ']';
    if(u.email) line += ' <' + u.email + '>';
    lines.push(line);
    if(mods.length) lines.push('  → ' + mods.join(', '));
    else lines.push('  → Aucun accès');
    lines.push('');
  });
  document.getElementById('exportContent').textContent = lines.join('\n');
}

function copyExport(){
  generateExport();
  var text = document.getElementById('exportContent').textContent;
  navigator.clipboard.writeText(text).then(function(){
    var btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copié !';
    btn.style.background = '#16a34a';
    setTimeout(function(){ btn.textContent='Copier'; btn.style.background=''; }, 1500);
  });
}

render();
</script>
</body>
</html>
