<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhysiPro ⚡ Ajout rapide</title>
<!-- Ajout rapide v4 (retour : ecrit dans moulages/<id>/historique + affiche historique recent ; pas de chat ni photo) — fix: actions personnalisées lues correctement, tableau OU objet) : page téléphone — entrer le numéro de moulage, le nom se confirme
     automatiquement, choisir une action (liste modifiable), note optionnelle, Confirmer.
     Écrit dans moulages/<cardId>/historique. Pas de login qui clignote (écran Ouverture…). -->
<meta name="theme-color" content="#04152c">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button { transition: transform .12s ease, filter .12s ease, box-shadow .12s ease; }
  button:active { transform: scale(0.95) translateY(2px); filter: brightness(0.88); }
  :root {
    --bg: #eef2f7; --bg2: #ffffff; --bg3: #f3f6fa;
    --blue: #2563eb; --blue-light: #1d4ed8; --green: #16a34a; --red: #dc2626;
    --amber: #f59e0b;
    --text: #16243b; --text-dim: #64748b; --border: rgba(30,58,95,0.16);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  html, body { height:100%; width:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:15px;
    -webkit-tap-highlight-color:transparent; }
  body { overflow-x:hidden; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg);
    padding-top:var(--safe-top); padding-bottom:var(--safe-bot); }
  .screen.hidden { display:none; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    background:linear-gradient(180deg,#04152c 0%,var(--bg2) 100%); border-bottom:1px solid var(--border); flex-shrink:0; }
  .topbar-title { font-size:17px; font-weight:800; color:var(--blue-light); letter-spacing:-0.2px; }
  .back-btn { background:rgba(59,130,246,0.12); border:1.5px solid rgba(59,130,246,0.4); border-radius:10px;
    color:var(--blue-light); font-size:14px; font-weight:700; padding:8px 14px; text-decoration:none;
    display:inline-flex; align-items:center; gap:5px; }
  .back-btn:active { background:rgba(59,130,246,0.25); transform:scale(0.97); }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--red); display:inline-block; }
  .status-dot.connected { background:var(--green); }

  .body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 14px calc(20px + var(--safe-bot)); }

  .label { font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin:2px 2px 7px; }
  .num-input { width:100%; padding:16px 16px; border:2px solid var(--border); border-radius:14px;
    background:var(--bg3); color:var(--text); font-size:22px; font-weight:700; letter-spacing:1px; outline:none; text-align:center; }
  .num-input:focus { border-color:var(--blue); }
  .num-input::placeholder { color:var(--text-dim); font-weight:500; letter-spacing:0; }

  .confirm-line { margin:10px 2px 0; min-height:24px; font-size:15px; font-weight:700; text-align:center; }
  .confirm-line.ok { color:var(--green); }
  .confirm-line.bad { color:var(--red); }
  .confirm-line.dim { color:var(--text-dim); font-weight:500; }

  .section { margin-top:22px; }
  .section.locked { opacity:0.4; pointer-events:none; filter:grayscale(0.5); }

  .big-btn { width:100%; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; border:none; border-radius:18px; cursor:pointer; padding:16px;
    background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff;
    box-shadow:0 10px 26px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.25); transition:transform .12s, filter .12s; }
  .big-btn:active { transform:scale(0.98); filter:brightness(0.95); }
  .big-btn .ic { font-size:30px; line-height:1; }
  .big-btn .tx { font-size:16px; font-weight:800; }

  .chosen-action { width:100%; border:1.5px solid rgba(34,197,94,0.5); background:rgba(34,197,94,0.1);
    border-radius:14px; padding:14px 16px; display:flex; align-items:flex-start; gap:10px; }
  .chosen-action .ca-txt { flex:1; font-size:14.5px; font-weight:600; color:#fff; line-height:1.35; }
  .chosen-action .ca-change { background:rgba(59,130,246,0.18); border:1px solid rgba(59,130,246,0.4); color:var(--blue-light);
    border-radius:8px; font-size:11px; font-weight:700; padding:6px 10px; cursor:pointer; flex-shrink:0; white-space:nowrap; }

  .note-area { width:100%; margin-top:14px; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px;
    background:var(--bg3); color:var(--text); font-size:15px; font-family:inherit; resize:none; outline:none; min-height:64px; }
  .note-area:focus { border-color:var(--blue); }
  .note-area::placeholder { color:var(--text-dim); }

  .send-btn { width:100%; margin-top:18px; min-height:60px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(145deg,#22c55e,#16a34a); color:#fff; font-size:18px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 10px 26px rgba(34,197,94,0.4), inset 0 1px 0 rgba(255,255,255,0.25); transition:transform .12s, filter .12s; }
  .send-btn:active { transform:scale(0.98); filter:brightness(0.95); }
  .send-btn:disabled { background:rgba(255,255,255,0.08); color:var(--text-dim); box-shadow:none; cursor:default; }

  /* Historique récent */
  .hist-title { font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin:26px 2px 8px; }
  .hist-item { background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--blue); border-radius:10px;
    padding:10px 12px; margin-bottom:8px; }
  .hist-item .hi-action { font-size:14px; font-weight:600; color:#fff; line-height:1.35; }
  .hist-item .hi-note { font-size:13px; color:var(--text-dim); margin-top:3px; line-height:1.35; }
  .hist-item .hi-meta { font-size:11px; color:var(--text-dim); margin-top:5px; }
  .hist-item .hi-meta strong { color:var(--blue-light); }
  .hist-empty { color:var(--text-dim); font-size:13px; text-align:center; padding:14px; }

  /* Overlays */
  .overlay { position:fixed; inset:0; z-index:1000; background:var(--bg); display:none;
    flex-direction:column; padding:0; }
  .overlay.active { display:flex; }
  .ov-head { display:flex; align-items:center; justify-content:space-between; padding:16px 14px calc(16px); padding-top:calc(16px + var(--safe-top));
    background:var(--bg2); border-bottom:1px solid var(--border); }
  .ov-title { font-size:16px; font-weight:800; color:var(--text); }
  .ov-x { background:rgba(239,68,68,0.85); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:17px; font-weight:700; cursor:pointer; }
  .ov-edit { background:rgba(245,158,11,0.18); border:1px solid rgba(245,158,11,0.5); color:var(--amber);
    border-radius:8px; font-size:12px; font-weight:700; padding:7px 12px; cursor:pointer; }
  .ov-body { flex:1; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }

  .action-choice { width:100%; text-align:left; border:1.5px solid var(--border); background:var(--bg2); color:var(--text);
    border-radius:14px; padding:16px; margin-bottom:10px; font-size:15px; font-weight:600; line-height:1.4; cursor:pointer; }
  .action-choice:active { background:rgba(59,130,246,0.18); border-color:var(--blue); transform:scale(0.99); }

  /* Edit actions */
  .edit-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .edit-row input { flex:1; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--bg3);
    color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .edit-row input:focus { border-color:var(--blue); }
  .edit-del { background:rgba(239,68,68,0.85); border:none; color:#fff; width:38px; height:40px; border-radius:9px; font-size:15px; cursor:pointer; flex-shrink:0; }
  .edit-add { width:100%; padding:12px; border:1.5px dashed rgba(59,130,246,0.5); background:rgba(59,130,246,0.08);
    color:var(--blue-light); border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px; }
  .edit-save { width:100%; margin-top:16px; padding:15px; border:none; border-radius:14px; background:linear-gradient(145deg,#22c55e,#16a34a);
    color:#fff; font-size:16px; font-weight:800; cursor:pointer; }

  /* Login + loading */
  .center-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:14px; text-align:center; }
  .center-icon { font-size:60px; filter:drop-shadow(0 0 18px rgba(59,130,246,0.45)); }
  .center-title { font-size:21px; font-weight:800; }
  .center-sub { font-size:13px; color:var(--text-dim); max-width:280px; line-height:1.5; }
  .login-field { width:100%; max-width:320px; text-align:left; }
  .login-field label { font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:5px; }
  .login-field input { width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:12px; background:var(--bg3); color:var(--text); font-size:15px; outline:none; }
  .login-field input:focus { border-color:var(--blue); }
  .login-btn { width:100%; max-width:320px; padding:16px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--blue),#2563eb); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  .login-err { font-size:12px; color:var(--red); min-height:16px; }
  .spinner { width:22px; height:22px; border-radius:50%; border:3px solid rgba(30,58,95,0.18); border-top-color:var(--blue); animation:spin 0.7s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .toast { position:fixed; left:50%; bottom:calc(24px + var(--safe-bot)); transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; padding:13px 22px; border-radius:30px; font-size:15px; font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,0.5); opacity:0; transition:all .25s; z-index:2000; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err { background:linear-gradient(135deg,#dc2626,#991b1b); }
  .photo-btn { width:100%; margin-top:14px; padding:13px; border:1.5px solid var(--border); border-radius:12px; background:var(--bg3); color:var(--blue-light); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .photo-btn:active { background:rgba(59,130,246,0.15); }
  .photo-preview { margin-top:12px; position:relative; display:inline-block; }
  .photo-preview img { max-width:100%; max-height:220px; border-radius:12px; border:1.5px solid var(--border); display:block; }
  .photo-remove { position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%; background:rgba(220,38,38,0.92); color:#fff; border:2px solid rgba(255,255,255,0.3); font-size:16px; font-weight:700; cursor:pointer; }
  .hist-row { display:flex; align-items:flex-start; gap:8px; justify-content:space-between; }
  .hist-row .hi-action { flex:1; }
  .hist-thumb { width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:zoom-in; flex-shrink:0; }
  .hist-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:3000; align-items:center; justify-content:center; cursor:zoom-out; padding:16px; }
  .hist-lightbox.show { display:flex; }
  .hist-lightbox img { max-width:96vw; max-height:96vh; border-radius:8px; }
  /* ===== Redesign Ajout rapide (industriel / atelier) ===== */
  #screenMain { background:
      radial-gradient(120% 70% at 90% -10%, rgba(245,158,11,0.10), transparent 55%),
      radial-gradient(110% 70% at -10% 112%, rgba(37,99,235,0.07), transparent 55%),
      linear-gradient(180deg,#f7fafd 0%,#eef3f8 100%) !important; }
  @keyframes arIn { from{ transform:translateY(16px); } to{ transform:translateY(0); } }
  .ar-card { animation:arIn .45s cubic-bezier(.2,.8,.2,1) both; }
  #actionSection { animation-delay:.07s; }
  #recentWrap { animation:arIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:.14s; }
  .ar-top { display:flex; align-items:center; gap:12px; padding:calc(var(--safe-top) + 12px) 16px 12px; background:#ffffff; border-bottom:1px solid var(--border); box-shadow:0 2px 10px rgba(30,58,95,0.06); flex-shrink:0; }
  .ar-back { width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:11px; background:rgba(37,99,235,0.10); border:1px solid rgba(37,99,235,0.3); color:var(--blue); font-size:28px; line-height:1; text-decoration:none; font-weight:700; }
  .ar-back:active { background:rgba(37,99,235,0.2); }
  .ar-title { font-family:'Outfit',sans-serif; font-size:19px; font-weight:800; letter-spacing:0.3px; color:var(--text); display:flex; align-items:center; gap:7px; }
  .ar-bolt { filter:drop-shadow(0 0 6px rgba(250,204,21,0.7)); }
  .ar-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 14px calc(24px + var(--safe-bot)); display:flex; flex-direction:column; gap:14px; }

  .ar-card { background:#ffffff; border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:0 10px 28px rgba(30,58,95,0.10), inset 0 1px 0 rgba(255,255,255,0.6); }
  .ar-card.ar-locked { opacity:0.92; }

  .ar-steptitle { display:flex; align-items:center; gap:9px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.9px; color:var(--text-dim); margin-bottom:13px; }
  .ar-num { width:25px; height:25px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:linear-gradient(145deg,#fbbf24,#f59e0b); color:#3a2606; font-size:13px; font-weight:900; box-shadow:0 2px 9px rgba(245,158,11,0.6); }

  .ar-numinput { width:100%; padding:14px; border:2.5px solid #000; border-radius:14px; background:#f6f9fc; color:var(--text); font-family:'Outfit',sans-serif; font-size:30px; font-weight:800; letter-spacing:3px; text-align:center; outline:none; }
  .ar-step1row { display:flex; gap:12px; align-items:stretch; }
  .ar-step1row .ar-numinput { flex:1; width:auto; min-width:0; min-height:110px; }
  .ar-result { flex-shrink:0; width:178px; min-height:110px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:3px; padding:11px 14px; border-radius:15px; background:#f6f9fc; border:2.5px solid #000; transition:all .18s; }
  .ar-result.filled { align-items:center; text-align:center; gap:5px; border:2.5px solid #000; box-shadow:0 7px 20px rgba(0,0,0,0.25); }
  .ar-result.filled.region-qc { background:linear-gradient(135deg,#1a3a5a 0%,#3a6a9a 50%,#5a9acf 100%); }
  .ar-result.filled.region-on { background:linear-gradient(135deg,#704414 0%,#a66a2a 50%,#E8B97A 100%); }
  .ar-result.filled.region-ma { background:linear-gradient(135deg,#451238 0%,#8D2E6A 50%,#C7458C 100%); }
  .ar-result-order { order:2; font-size:13px; font-weight:800; color:#9aa7b6; letter-spacing:0.3px; }
  .ar-result-order:empty { display:none; }
  .ar-result.filled .ar-result-order { color:#fff; background:rgba(0,0,0,0.30); border:1px solid rgba(255,255,255,0.22); border-radius:11px; padding:2px 11px; text-shadow:none; }
  .ar-result-name { order:1; font-family:'Outfit',sans-serif; font-size:18px; font-weight:800; color:#9aa7b6; line-height:1.12; }
  .ar-result.filled .ar-result-name { color:#fff; -webkit-text-stroke:0.4px #000; paint-order:stroke fill; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
  .ar-result-item { order:3; font-size:12.5px; font-weight:700; color:var(--text-dim); line-height:1.2; }
  .ar-dropdown { display:none; margin-top:12px; border:1.5px solid var(--border); border-radius:13px; overflow:hidden; background:#fff; box-shadow:0 10px 26px rgba(30,58,95,0.14); }
  .ar-dd-item { display:flex; align-items:center; gap:12px; padding:13px 15px; cursor:pointer; border-bottom:1px solid var(--border); }
  .ar-dd-item:last-child { border-bottom:none; }
  .ar-dd-item:active { background:#eef3f9; }
  .ar-dd-num { font-family:'Outfit',sans-serif; font-weight:800; color:var(--blue); font-size:15px; flex-shrink:0; min-width:66px; }
  .ar-dd-name { font-weight:700; color:var(--text); font-size:15px; }
  .ar-dd-more { padding:9px 15px; font-size:12px; color:var(--text-dim); text-align:center; background:#f6f9fc; }
  .ar-result.filled .ar-result-item { color:#fff; background:rgba(255,255,255,0.18); border-radius:9px; padding:3px 9px; -webkit-text-stroke:0.4px #000; paint-order:stroke fill; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
  .ar-numinput:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(37,99,235,0.14); }
  .ar-numinput::placeholder { color:#aab6c6; }
  .ar-confirm { margin-top:10px; min-height:22px; text-align:center; font-size:16px; font-weight:700; }
  .ar-confirm.dim { color:var(--text-dim); font-weight:500; font-size:13px; }
  .ar-confirm.ok { color:var(--green); }
  .ar-confirm.bad { color:var(--red); }

  .ar-row { display:flex; gap:12px; align-items:stretch; }
  .ar-actioncol { flex:1; min-width:0; display:flex; flex-direction:column; }
  .ar-actionbtn { flex:1; min-height:104px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:2.5px solid #000; border-radius:16px; background:rgba(59,130,246,0.12); color:#1d4ed8; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; padding:12px; text-align:center; }
  .ar-actionbtn:active { background:rgba(59,130,246,0.22); }
  .ar-plus { font-size:28px; line-height:1; }
  .ar-chosen { min-height:104px; display:flex; flex-direction:column; justify-content:center; gap:9px; border:1.5px solid rgba(34,197,94,0.6); border-radius:16px; background:linear-gradient(160deg,rgba(34,197,94,0.18),rgba(22,163,74,0.1)); padding:12px 14px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.08); }
  .ar-chosen-txt { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; }
  .ar-chosen-change { align-self:flex-start; background:rgba(59,130,246,0.18); border:1px solid rgba(59,130,246,0.4); color:var(--blue-light); border-radius:8px; font-size:10.5px; font-weight:700; padding:4px 10px; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; }

  .ar-camcol { width:100%; }
  .ar-cambtn { width:100%; min-height:112px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:16px; border:2.5px solid #000; border-radius:18px; background:linear-gradient(145deg,#fde047,#f59e0b); color:#3a2606; cursor:pointer; box-shadow:0 10px 26px rgba(245,158,11,0.55), inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 8px rgba(180,83,9,0.35); animation:camPulse 2.4s ease-in-out infinite; margin-bottom:12px; }
  .ar-cambtn:active { filter:brightness(0.95); transform:scale(0.98); }
  @keyframes camPulse { 0%,100%{ box-shadow:0 10px 26px rgba(245,158,11,0.5), inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 8px rgba(180,83,9,0.35); } 50%{ box-shadow:0 14px 36px rgba(245,158,11,0.85), inset 0 2px 0 rgba(255,255,255,0.55), inset 0 -3px 8px rgba(180,83,9,0.35); } }
  .ar-cam-ic { font-size:60px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
  .ar-cam-lbl { font-size:24px; font-weight:900; letter-spacing:0.5px; }
  .ar-campreview { width:100%; height:104px; position:relative; border-radius:18px; overflow:hidden; border:2px solid rgba(245,158,11,0.75); box-shadow:0 8px 22px rgba(245,158,11,0.35); margin-bottom:12px; }
  .ar-campreview img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block; }

<script>
// ═══ FIREBASE ═══
const _k = ['AIza','SyCk','7bqV','nx08','Kz1f','Vq1W','24Au','W854','KY9j','Pno'];
const FIREBASE_CONFIG = {

};

const TEAM_NAMES = {

  'sroy@physipro.com':'Stéphanie','service3@physipro.com':'Jacynthe','service1@physipro.com':'Jonathan',
  'ngagne@physipro.com':'Nadia','orders@physipro.com':'Sonia','mplanguedoc@physipro.com':'Marie-Pier',
  'mariesoleilr@physipro.com':'Marie-Soleil','fabrys.frechette@physipro.com':'Fabrys',
  'marioouellette@physipro.com':'Mario','michelle.bouchard@physipro.com':'Michelle','rh@physipro.com':'Roxanne',
  'pbouchard@physipro.com':'Pierre','peterbass76@gmail.com':'Pierre','cncatp@physipro.com':'Sina'
};

// Actions par défaut (modifiables ensuite, stockées dans Firebase)
const DEFAULT_ACTIONS = [
  "J'ai averti Marie qu'on avait un problème technique et j'attends sa réponse",
  "Le moulage sera transféré en attente — en attente de réponse",
  "Les mesures ne fonctionnent pas",
  "Le moulage ne peut pas être encastré — pas assez d'espace",
  "La mesure ne peut être respectée — pas assez de viande",
  "Les thoraciques vont être posés à l'extérieur"
];

let db = null, currentUser = null, currentUserName = '';
let _moulIndex = null, _moulLoading = false;     // map: numéro normalisé -> {cardId, name}
let _actions = DEFAULT_ACTIONS.slice();
let _selectedCardId = null, _selectedName = '', _selectedAction = null;
let _quickPhoto = null;
let _recentRef = null;

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUser = user;
    const email = (user.email||'').toLowerCase();
    currentUserName = TEAM_NAMES[email] || email.split('@')[0];
    db = firebase.database();
    db.ref('.info/connected').on('value', s => setDots(!!s.val()));
    loadActions();
    loadMoulIndex();
    showScreen('screenMain');
    document.getElementById('numInput').focus();
  } else {
    currentUser = null;
    showScreen('screenLogin');
  }
});

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); var el=document.getElementById(id); if(el) el.classList.remove('hidden'); }
function setDots(c){ document.querySelectorAll('.status-dot').forEach(d=>d.classList.toggle('connected', c)); }

async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim(), pwd=document.getElementById('loginPassword').value;
  var btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr'); err.textContent='';
  if(!email||!pwd){ err.textContent='Remplissez tous les champs.'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try { await auth.signInWithEmailAndPassword(email,pwd); }
  catch(e){ err.textContent='Courriel ou mot de passe incorrect.'; btn.disabled=false; btn.textContent='Se connecter'; }
}

// ═══ INDEX DES MOULAGES (numéro -> nom) ═══
function loadMoulIndex(){
  if(_moulLoading || _moulIndex) return;
  _moulLoading = true;
  // Chargé une fois par session ; on n'en garde que id/numéro/nom (léger).
  db.ref('moulages').once('value').then(function(snap){
    var all = snap.val() || {}, map = {};
    Object.keys(all).forEach(function(cardId){
      var c = all[cardId]; if(!c) return;
      var key = normNum(c.order);
      if(key) map[key] = { cardId: cardId, name: c.name || '(sans nom)', order: c.order, item: c.item || '', region: c.region || '' };
    });
    _moulIndex = map; _moulLoading = false;
    // Re-tester si un numéro est déjà entré
    var v = document.getElementById('numInput').value;
    if(v) onNumInput(v);
  }).catch(function(){ _moulLoading=false; });
}

function normNum(x){ return (x===undefined||x===null) ? '' : String(x).trim().replace(/\s+/g,'').replace(/^0+/,''); }

let _numTimer = null;
function onNumInput(val){
  if(_numTimer) clearTimeout(_numTimer);
  var line = document.getElementById('confirmLine');
  var key = normNum(val);
  if(!key){ setMoulage(null); line.style.display='none'; hideDropdown(); return; }
  if(!_moulIndex){ setMoulage(null); line.style.display=''; line.className='ar-confirm dim'; line.textContent='Recherche en cours…'; loadMoulIndex(); _numTimer=setTimeout(function(){onNumInput(val);},500); return; }
  _numTimer = setTimeout(function(){
    var exact = _moulIndex[key];
    // Recherche par préfixe (la liste se raccourcit à mesure qu'on tape)
    var matches = [];
    for(var k in _moulIndex){ if(_moulIndex.hasOwnProperty(k) && k.indexOf(key)===0){ matches.push(_moulIndex[k]); } }
    matches.sort(function(a,b){ return String(a.order).localeCompare(String(b.order), undefined, {numeric:true}); });
    renderDropdown(matches, key);
    if(exact){ line.style.display='none'; setMoulage(exact); }
    else if(matches.length){ line.style.display='none'; setMoulage(null); }
    else { setMoulage(null); line.style.display=''; line.className='ar-confirm bad'; line.textContent='✗ Moulage introuvable'; }
  }, 180);
}

function renderDropdown(matches, key){
  var dd = document.getElementById('moulDropdown');
  if(!dd) return;
  // Cacher si rien, ou si un seul résultat déjà exactement entré
  if(!matches.length || (matches.length===1 && normNum(matches[0].order)===key)){ dd.style.display='none'; dd.innerHTML=''; return; }
  var html = matches.slice(0,8).map(function(m){
    return '<div class="ar-dd-item" onclick="pickMoulage(\''+normNum(m.order)+'\')">'
      + '<span class="ar-dd-num">#'+esc(String(m.order))+'</span>'
      + '<span class="ar-dd-name">'+esc(m.name||'')+'</span></div>';
  }).join('');
  if(matches.length>8) html += '<div class="ar-dd-more">+ '+(matches.length-8)+' autres… continuez à taper</div>';
  dd.innerHTML = html; dd.style.display='block';
}
function pickMoulage(k){
  var hit = _moulIndex[k]; if(!hit) return;
  document.getElementById('numInput').value = hit.order;
  hideDropdown();
  document.getElementById('confirmLine').style.display='none';
  setMoulage(hit);
}
function hideDropdown(){ var dd=document.getElementById('moulDropdown'); if(dd){ dd.style.display='none'; dd.innerHTML=''; } }
window.pickMoulage = pickMoulage;

// Formate l'item comme les cartes : "Siège+Dossier+Plaque velcro" → "Siège + Dossier" / "Plaque velcro"
function formatItem(raw){
  var s = (raw==null?'':String(raw)).trim();
  if(!s) return '';
  var parts = s.split('+').map(function(p){return p.trim();}).filter(function(p){return p;});
  if(parts.length<=2) return parts.map(esc).join(' + ');
  return esc(parts[0]) + ' + ' + esc(parts[1]) + '<br>' + parts.slice(2).map(esc).join(' + ');
}
// Couleur de région (comme le Moulage) : qc=bleu, on=brun, ma=magenta
function getRegionCls(region){
  var m={'QC':'qc','qc':'qc','Québec':'qc','québec':'qc','ON':'on','on':'on','Ontario':'on','ontario':'on','MA':'ma','ma':'ma','Maritime':'ma','maritime':'ma','Maritimes':'ma','maritimes':'ma'};
  return m[region] || 'qc';
}

function setMoulage(hit){
  var sec = document.getElementById('actionSection');
  var recentWrap = document.getElementById('recentWrap');
  var res = document.getElementById('moulageResult');
  if(_recentRef){ _recentRef.off(); _recentRef = null; }
  if(hit){
    _selectedCardId = hit.cardId; _selectedName = hit.name;
    sec.classList.remove('ar-locked');
    if(res){ res.className = 'ar-result filled region-' + getRegionCls(hit.region);
      document.getElementById('moulageResultOrder').textContent = '#' + (hit.order || '');
      document.getElementById('moulageResultName').textContent = hit.name || '—';
      document.getElementById('moulageResultItem').innerHTML = formatItem(hit.item);
    }
    recentWrap.style.display = 'block';
    listenRecent(hit.cardId);
  } else {
    _selectedCardId = null; _selectedName = '';
    sec.classList.add('ar-locked');
    if(res){ res.className = 'ar-result';
      document.getElementById('moulageResultOrder').textContent = '';
      document.getElementById('moulageResultName').textContent = 'Moulage';
      document.getElementById('moulageResultItem').textContent = '';
    }
    recentWrap.style.display = 'none';
    document.getElementById('recentList').innerHTML = '';
  }
  refreshConfirmBtn();
}

// ═══ ACTIONS ═══
function toActionArray(v){
  if (Array.isArray(v)) return v.filter(function(x){ return typeof x==='string' && x.trim(); });
  if (v && typeof v==='object') return Object.keys(v).sort(function(a,b){ return (parseInt(a,10)||0)-(parseInt(b,10)||0); }).map(function(k){ return v[k]; }).filter(function(x){ return typeof x==='string' && x.trim(); });
  return [];
}
function loadActions(){
  db.ref('appSettings/historiqueActions').on('value', function(snap){
    var v = snap.val();
    var arr = toActionArray(v);
    if(arr.length){ _actions = arr; }
    else if(v == null){ db.ref('appSettings/historiqueActions').set(DEFAULT_ACTIONS).catch(function(){}); _actions = DEFAULT_ACTIONS.slice(); }
    renderPicker();
  });
}

function openActionPicker(){ renderPicker(); document.getElementById('pickerOverlay').classList.add('active'); }
function closeActionPicker(){ document.getElementById('pickerOverlay').classList.remove('active'); }
function renderPicker(){
  var list = document.getElementById('pickerList');
  list.innerHTML = _actions.map(function(a, i){
    return '<button class="action-choice" onclick="chooseAction('+i+')">'+esc(a)+'</button>';
  }).join('');
}
function chooseAction(i){
  _selectedAction = _actions[i];
  document.getElementById('chosenTxt').textContent = _selectedAction;
  document.getElementById('chosenWrap').style.display = 'block';
  document.getElementById('pickActionBtn').style.display = 'none';
  closeActionPicker();
  refreshConfirmBtn();
}

function refreshConfirmBtn(){
  document.getElementById('confirmBtn').disabled = !(_selectedCardId && _selectedAction);
}

// ═══ MODIFIER LES ACTIONS ═══
function openEditActions(){
  var box = document.getElementById('editList'); box.innerHTML='';
  _actions.forEach(function(a){ addEditRow(a); });
  if(!_actions.length) addEditRow('');
  document.getElementById('editOverlay').classList.add('active');
}
function closeEditActions(){ document.getElementById('editOverlay').classList.remove('active'); }
function addEditRow(val){
  var box = document.getElementById('editList');
  var row = document.createElement('div'); row.className='edit-row';
  row.innerHTML = '<input type="text" value="'+esc(val)+'" placeholder="Texte de l\'action…"><button class="edit-del" onclick="this.parentNode.remove()">🗑️</button>';
  box.appendChild(row);
}
function saveActions(){
  var inputs = document.querySelectorAll('#editList .edit-row input');
  var arr = [];
  inputs.forEach(function(inp){ var t=(inp.value||'').trim(); if(t) arr.push(t); });
  if(!arr.length){ showToast('Ajoutez au moins une action', true); return; }
  db.ref('appSettings/historiqueActions').set(arr).then(function(){
    _actions = arr.slice(); renderPicker(); closeEditActions(); showToast('Actions enregistrées');
  }).catch(function(){ showToast('Erreur d\'enregistrement', true); });
}

// ═══ PHOTO (optionnelle) ═══
function onPhotoPicked(files){
  if(!files || !files.length) return;
  var file = files[0];
  if(!file.type || file.type.indexOf('image/')!==0) return;
  showToast('⏳ Traitement de la photo…');
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxSize=1300, w=img.width, h=img.height;
      if(w>maxSize||h>maxSize){ if(w>h){h=Math.round(h*maxSize/w);w=maxSize;} else {w=Math.round(w*maxSize/h);h=maxSize;} }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var q=0.82, out=c.toDataURL('image/jpeg',q);
      while(out.length>220000 && q>0.4){ q-=0.07; out=c.toDataURL('image/jpeg',q); }
      _quickPhoto = out;
      document.getElementById('photoPreviewImg').src = out;
      document.getElementById('photoPreview').style.display='block';
      document.getElementById('photoBtn').style.display='none';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeQuickPhoto(){
  _quickPhoto = null;
  var p=document.getElementById('photoPreview'); if(p) p.style.display='none';
  var pi=document.getElementById('photoInput'); if(pi) pi.value='';
  var b=document.getElementById('photoBtn'); if(b) b.style.display='';
}

// ═══ ENVOI (historique) ═══
function submitEntry(){
  if(!_selectedCardId || !_selectedAction || !db) return;
  var btn = document.getElementById('confirmBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  var note = (document.getElementById('noteInput').value||'').trim();
  var entry = {
    action: _selectedAction,
    note: note || null,
    parNom: currentUserName,
    parEmail: (currentUser.email||'').toLowerCase(),
    timestamp: Date.now(),
    createdAt: firebase.database.ServerValue.TIMESTAMP
  };
  if(_quickPhoto) entry.photo = _quickPhoto;
  db.ref('moulages/'+_selectedCardId+'/historique').push().set(entry).then(function(){
    // Réinitialiser pour une nouvelle entrée (on garde le numéro du moulage)
    _selectedAction = null;
    document.getElementById('chosenWrap').style.display='none';
    document.getElementById('pickActionBtn').style.display='flex';
    document.getElementById('noteInput').value='';
    removeQuickPhoto();
    btn.innerHTML='✓ Confirmer et envoyer'; refreshConfirmBtn();
    showToast('✓ Action ajoutée à l\'historique');
  }).catch(function(e){
    btn.disabled=false; btn.innerHTML='⚠️ Erreur — réessayer'; console.error(e);
  });
}

// ═══ HISTORIQUE RÉCENT ═══
function listenRecent(cardId){
  _recentRef = db.ref('moulages/'+cardId+'/historique').orderByChild('timestamp').limitToLast(20);
  _recentRef.on('value', function(snap){
    var v = snap.val() || {};
    var arr = Object.keys(v).map(function(k){ return v[k]; }).sort(function(a,b){ return (b.timestamp||0)-(a.timestamp||0); });
    var list = document.getElementById('recentList');
    if(!arr.length){ list.innerHTML = '<div class="hist-empty">Aucune action pour ce moulage encore.</div>'; return; }
    list.innerHTML = arr.map(function(e){
      var thumb = e.photo ? '<img class="hist-thumb" src="'+e.photo+'" onclick="openHistPhoto(this.src)">' : '';
      return '<div class="hist-item"><div class="hist-row"><div class="hi-action">'+esc(e.action||'')+'</div>'+thumb+'</div>'+
        (e.note ? '<div class="hi-note">'+esc(e.note)+'</div>' : '')+
        '<div class="hi-meta">Par <strong>'+esc(e.parNom||'?')+'</strong> · '+fmtTime(e.timestamp)+'</div></div>';
    }).join('');
  });
}
function openHistPhoto(src){ var o=document.getElementById('histLightbox'); document.getElementById('histLightboxImg').src=src; o.classList.add('show'); }
function closeHistPhoto(){ var o=document.getElementById('histLightbox'); o.classList.remove('show'); document.getElementById('histLightboxImg').src=''; }
window.openHistPhoto=openHistPhoto; window.closeHistPhoto=closeHistPhoto;

// ═══ UTILS ═══
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date();
  var hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  var sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return "aujourd'hui " + hh+':'+mm;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+hh+':'+mm;
}
let _toastTimer=null;
function showToast(msg, isErr){
  var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){ t.className='toast'+(isErr?' err':''); }, 2600);
}
</script>
