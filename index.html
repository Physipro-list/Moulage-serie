<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro v_hub24</title>
<meta name="theme-color" content="#04152c">
<!-- v_hub24 (2026-10-14) : accueil réduit à DEUX programmes, Moulage et
     Inspection Atelier. Pas de Firebase ici (rien à télécharger) : chaque
     programme demande lui-même la connexion et applique ses propres droits.
     - Téléphone : ouvre directement Moulage (l'atelier n'était pas offert
       sur téléphone).
     - Adresse avec ?paramètres ou #ancre (ex. ?vue=calendrier) : ouvre
       directement Moulage en les gardant. -->
<script>
  (function(){
    var mobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||window.innerWidth<=768;
    if(mobile||location.search||location.hash){
      location.replace('Physipro_moulage.html'+location.search+location.hash);
    }
  })();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(to bottom,#04152c,#4a8ef5);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;}
  .logo{height:80px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .sous{font-size:13px;color:rgba(255,255,255,.75);margin-top:-16px;}
  .tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:20px;width:100%;justify-content:center;}
  .tuile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 16px;border-radius:16px;
    background:rgba(4,21,44,.55);border:1.5px solid rgba(255,255,255,.18);text-decoration:none;color:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .15s,background .15s,border-color .15s;}
  .tuile:hover{transform:translateY(-3px);background:rgba(4,21,44,.75);border-color:#fff;}
  .ic{font-size:44px;line-height:1;}
  .nom{font-size:17px;font-weight:700;}
  .desc{font-size:11px;color:rgba(255,255,255,.65);text-align:center;}
  @media(max-width:520px){.tuiles{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <img class="logo" src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro">
  <div class="sous">Outil de gestion simplifiée — par Daniel Charest</div>
  <div class="tuiles">
    <a class="tuile" href="Physipro_moulage.html">
      <span class="ic">🏭</span><span class="nom">Moulage</span><span class="desc">Gestion des moulages</span>
    </a>
    <a class="tuile" href="PhysiPro_Inspection_Atelier.html">
      <span class="ic">☑️</span><span class="nom">Inspection Atelier</span><span class="desc">Inspection et suivi des commandes</span>
    </a>
  </div>
</body>
</html>
