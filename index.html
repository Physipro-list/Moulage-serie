<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PhysiPro — Accueil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
/* ═══ LOGIN ═══ */
.login-overlay{position:fixed;inset:0;background:#0a0f1e;z-index:9999;display:flex;align-items:center;justify-content:center;}
.login-overlay.hidden{display:none;}
.login-box{background:#111827;border:2px solid #d4a017;border-radius:14px;padding:34px;width:90%;max-width:380px;text-align:center;}
.login-box h2{color:#fbbf24;font-size:22px;margin-bottom:2px;}
.login-box .sub{color:#64748b;font-size:11px;margin-bottom:20px;}
.login-box input{width:100%;padding:11px 14px;margin-bottom:10px;background:rgba(255,255,255,.06);border:1px solid #334155;color:#e2e8f0;border-radius:8px;font-size:13px;outline:none;transition:border .2s;}
.login-box input:focus{border-color:#d4a017;}
.login-btn{width:100%;padding:11px;background:linear-gradient(to bottom,#d4a017,#a68520);color:#fff;font-weight:800;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;}
.login-btn:hover{filter:brightness(1.2);}
.login-err{color:#f87171;font-size:11px;margin-top:10px;min-height:16px;}
.login-status{color:#22c55e;font-size:11px;margin-top:4px;}
/* ═══ HUB ═══ */
.hub{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.hub.active{display:flex;}
.hub-header{text-align:center;margin-bottom:30px;}
.hub-logo{font-size:28px;font-weight:800;color:#fbbf24;}
.hub-sub{font-size:12px;color:#64748b;margin-top:4px;}
.hub-user{font-size:11px;color:#94a3b8;margin-top:8px;}
.hub-user a{color:#ef4444;cursor:pointer;margin-left:8px;text-decoration:none;font-weight:600;}
.hub-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:520px;}
.hub-tile{width:150px;height:130px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:2px solid transparent;transition:all .25s;text-decoration:none;}
.hub-tile:hover{transform:scale(1.08);filter:brightness(1.2);}
.hub-tile .icon{font-size:42px;}
.hub-tile .label{font-size:14px;font-weight:700;color:#fff;letter-spacing:.3px;}
.t-moulage{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-color:#3b82f6;}
.t-inspection{background:linear-gradient(135deg,#14532d,#16a34a);border-color:#22c55e;}
.t-serie{background:linear-gradient(135deg,#7c2d12,#ea580c);border-color:#f97316;}
.t-inventaire{background:linear-gradient(135deg,#581c87,#9333ea);border-color:#a855f7;}
.hub-denied{text-align:center;margin-top:30px;}
.hub-denied .msg{font-size:14px;color:#f87171;margin-bottom:12px;}
.hub-denied a{color:#60a5fa;cursor:pointer;font-size:12px;}
/* ═══ LOADING ═══ */
.loading{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:40px;}
.loading.active{display:flex;}
.spinner{width:32px;height:32px;border:3px solid #334155;border-top:3px solid #fbbf24;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:12px;color:#64748b;}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>⚕️ PhysiPro</h2>
    <div class="sub">Système de gestion — Connexion</div>
    <input type="email" id="loginEmail" placeholder="Courriel" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <input type="password" id="loginPass" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">🔐 Connexion</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-status" id="loginStatus"></div>
  </div>
</div>

<!-- HUB -->
<div class="hub" id="hubScreen">
  <div class="hub-header">
    <div class="hub-logo">⚕️ PhysiPro</div>
    <div class="hub-sub">Choisissez un module</div>
    <div class="hub-user"><span id="hubEmail"></span> <a onclick="doLogout()">🚪 Déconnexion</a></div>
  </div>
  <div class="hub-grid" id="hubGrid"></div>
  <div class="hub-denied" id="hubDenied" style="display:none;">
    <div class="msg">⛔ Aucun module assigné à votre compte.</div>
    <a onclick="doLogout()">Se déconnecter</a>
  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Redirection...</div>
</div>

<script>
/* ═══ FIREBASE ═══ */
firebase.initializeApp({
  apiKey:"AIzaSyCk7bqVnx08Kz1fVq1W24AuW854KY9jPno",
  authDomain:"liste-des-moulages-physipro.firebaseapp.com",
  projectId:"liste-des-moulages-physipro"
});
var fbAuth = firebase.auth();

/* ═══ HUB ACCESS (base64 encoded) ═══ */
var H = {
  'YXRlbGllcmF0cEBwaHlzaXByby5jb20=':['moulage','inspection','serie','inventaire'],
  'dmFsZXJpZTE4QHZpZGVvdHJvbi5jYQ==':['moulage','inspection','serie','inventaire'],
  'cGV0ZXJiYXNzNzZAZ21haWwuY29t':['moulage'],
  'bWFyaW8uamFjcXVlc0BwaHlzaXByby5jb20=':['moulage'],
  'Y25jYXRwQHBoeXNpcHJvLmNvbQ==':['moulage'],
  'c2ltZHV0QHBoeXNpcHJvLmNvbQ==':['moulage','inspection','serie','inventaire'],
  'bWljaGVsbGUuYm91Y2hhcmRAcGh5c2lwcm8uY29t':['moulage'],
  'c3JveUBwaHlzaXByby5jb20=':['moulage','inspection','serie','inventaire'],
  'bWFnYXNpbmF0cDNAcGh5c2lwcm8uY29t':[],
  'bWFnYXNpbmF0cDFAcGh5c2lwcm8uY29t':[],
  'bWFnYXNpbmF0cDJAcGh5c2lwcm8uY29t':['inventaire'],
  'c2VydmljZTNAcGh5c2lwcm8uY29t':['moulage'],
  'c2VydmljZTFAcGh5c2lwcm8uY29t':['moulage'],
  'bmdhZ25lQHBoeXNpcHJvLmNvbQ==':['moulage'],
  'c29uaWEuYm91bGFuZ2VyQHBoeXNpcHJvLmNvbQ==':['moulage'],
  'bXBsYW5ndWVkb2NAcGh5c2lwcm8uY29t':['moulage'],
  'bWFyaWVzb2xlaWxyQHBoeXNpcHJvLmNvbQ==':['moulage'],
  'ZmFicnlzLmZyZWNoZXR0ZUBwaHlzaXByby5jb20=':['moulage'],
  'bWFyaW9vdWVsbGV0dGVAcGh5c2lwcm8uY29t':['moulage'],
  'cmhAcGh5c2lwcm8uY29t':['moulage'],
  'ZWx5c2UuYm9sZHVjQHBoeXNpcHJvLmNvbQ==':[],
  'ZXJpYy5wb2lyaWVyQHBoeXNpcHJvLmNvbQ==':[],
  'cGJvdWNoYXJkQHBoeXNpcHJvLmNvbQ==':[]
};

var MODULES = {
  moulage:    { icon:'🏭', label:'Moulage',    file:'Physipro_moulage.html', cls:'t-moulage' },
  inspection: { icon:'☑️', label:'Inspection',  file:'PhysiPro_Inspection.html', cls:'t-inspection' },
  serie:      { icon:'📋', label:'Série+',      file:'PhysiPro_Serie_.html', cls:'t-serie' },
  inventaire: { icon:'📦', label:'Inventaire',  file:'PhysiPro_Inventaire.html', cls:'t-inventaire' }
};

function getAccess(email) {
  if (!email) return [];
  try { return H[btoa(email)] || []; } catch(e) { return []; }
}

/* ═══ LOGIN ═══ */
function doLogin() {
  var em = document.getElementById('loginEmail').value.trim();
  var pw = document.getElementById('loginPass').value;
  var err = document.getElementById('loginErr');
  var stat = document.getElementById('loginStatus');
  if (!em || !pw) { err.textContent = 'Entrez courriel et mot de passe'; return; }
  localStorage.setItem('physipro_last_email', em);
  err.textContent = ''; stat.textContent = 'Connexion...';
  fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function() {
    return fbAuth.signInWithEmailAndPassword(em, pw);
  }).catch(function(e) {
    stat.textContent = '';
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential')
      err.textContent = 'Courriel ou mot de passe invalide';
    else if (e.code === 'auth/too-many-requests')
      err.textContent = 'Trop de tentatives, réessayez plus tard';
    else err.textContent = e.message;
  });
}

function doLogout() {
  fbAuth.signOut().then(function() { location.reload(); });
}

/* ═══ AUTH STATE ═══ */
fbAuth.onAuthStateChanged(function(user) {
  if (!user) {
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('hubScreen').classList.remove('active');
    document.getElementById('loadingScreen').classList.remove('active');
    // Pre-fill email
    var saved = localStorage.getItem('physipro_last_email');
    if (saved) { var el = document.getElementById('loginEmail'); if (el && !el.value) el.value = saved; }
    return;
  }

  // Authenticated
  document.getElementById('loginOverlay').classList.add('hidden');
  var access = getAccess(user.email);

  // Aucun accès
  if (!access || access.length === 0) {
    document.getElementById('hubScreen').classList.add('active');
    document.getElementById('hubEmail').textContent = user.email;
    document.getElementById('hubGrid').style.display = 'none';
    document.getElementById('hubDenied').style.display = 'block';
    return;
  }

  // Accès à un seul module → redirection directe
  if (access.length === 1) {
    var mod = MODULES[access[0]];
    if (mod) {
      document.getElementById('loadingScreen').classList.add('active');
      window.location.href = mod.file;
    }
    return;
  }

  // Multi-accès → afficher les pastilles
  document.getElementById('hubScreen').classList.add('active');
  document.getElementById('hubEmail').textContent = user.email;
  var grid = document.getElementById('hubGrid');
  grid.innerHTML = '';
  access.forEach(function(key) {
    var m = MODULES[key];
    if (!m) return;
    var tile = document.createElement('a');
    tile.className = 'hub-tile ' + m.cls;
    tile.href = m.file;
    tile.innerHTML = '<span class="icon">' + m.icon + '</span><span class="label">' + m.label + '</span>';
    grid.appendChild(tile);
  });
});
</script>
</body>
</html>
