/* ============================================================
   SECTION 28d — COURRIEL MIS EN FORME
   Reconstruit le questionnement en HTML, avec le même bandeau, les
   mêmes cartouches et les photos incrustées, puis le dépose dans le
   presse-papiers. Un simple Ctrl+V dans Outlook colle le tout.
   ============================================================ */
/* ============================================================
   COURRIEL MIS EN FORME (v83 : proportions lettre, tout aligné)
   Tableaux et bgcolor seulement — pas de dégradé, pas de flex, que
   les messageries ne rendent pas. Largeur 816 px = 8,5 po à 96 ppp,
   marges de 40 px, contenu de 736 px, tout aligné sur les mêmes bords.
   ============================================================ */
function ech(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Outlook ignore white-space:pre-wrap : on convertit donc les retours à la
   ligne en <br> et les espaces multiples en espaces insécables, sinon
   l'indentation et les lignes vides disparaissent au collage. */
function texteHTML(t){
  var e = ech(t).replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
  e = e.replace(/ {2,}/g, function(m){ return '&nbsp;'.repeat(m.length - 1) + ' '; });
  e = e.replace(/^ /gm, '&nbsp;');
  return e.split('\n').map(function(l){ return l === '' ? '&nbsp;' : l; }).join('<br>');
}

/* v121 : BOUTON_GIF, BOUTON_L, BOUTON_H et imageBouton() retirés — le bouton
   vert du courriel n'existe plus, ces éléments ne servaient qu'à lui. */

function courrielHTML(){
  var info = {
    centre:   centreChoisi(),
    commande: $('fCommande').value.trim(),
    po:       $('fPO').value.trim(),
    soum:     $('fSoum').value.trim(),
    benef:    $('fBenef').value.trim(),
    interv:   $('fInterv').value.trim(),
    acheteur: $('fAcheteur').value.trim(),
    agente:   $('fAgente').value.trim(),
    repr:     $('fRepr').value.trim(),
    dest:     $('fDest').value.trim(),
    date:     dateDuJour(),
    rafraich: $('fRafr').checked,                                   // v145
    origine:  $('fRafr').checked ? ($('fOrigine').value || '') : '' // v145
  };
  var texte = $('fTexte').value.trim();
  var r = remplies();

  var POLICE = "Segoe UI,Helvetica,Arial,sans-serif";
  /* cale transparente : un pixel étiré, pour tenir une colonne ouverte */
  var CALE = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  var LARG = 1020, MARGE = 50;           // 816 x 1,25 : un quart plus large
  var CONTENU = LARG - 2 * MARGE;                       // 736 px
  var ESPACE = 14;
  var LARG3 = Math.floor((CONTENU - 2 * ESPACE) / 3);   // 297 px
  var H = [];

  H.push('<table cellpadding="0" cellspacing="0" border="0" width="' + LARG + '" ' +
         'style="width:' + LARG + 'px;max-width:100%;border-collapse:collapse;' +
         'font-family:' + POLICE + ';color:#11243a;background:#ffffff">');

  /* bandeau, exactement la largeur du contenu */
  H.push('<tr><td style="padding:22px ' + MARGE + 'px 0">' +
    '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
    'style="width:' + CONTENU + 'px;border-collapse:collapse">' +
    /* Le titre est centré sur toute la largeur du bandeau ; le logo est
       posé dans une rangée à part, sans rogner l'espace du titre. C'est
       la seule mise en page qu'Outlook centre vraiment. */
    /* Logo et titre sur une seule ligne. La colonne de droite porte une
       cale transparente de la largeur du logo : sans elle, Outlook fait
       s'effondrer la cellule vide et le titre part vers la gauche. */
    '<tr><td bgcolor="#04152c" style="padding:9px 14px">' +
      '<table cellpadding="0" cellspacing="0" border="0" width="100%"><tr>' +
      '<td width="150" align="left" valign="middle" style="width:150px">' +
      '<img src="' + _pdfLogo.data + '" height="24" alt="PhysiPro" ' +
      'style="display:block;border:0"></td>' +
      '<td align="center" valign="middle" style="font-family:' + POLICE + ';' +
      'font-size:20px;font-weight:bold;color:#ffffff">QUESTIONNEMENT</td>' +
      '<td width="150" align="right" valign="middle" style="width:150px">' +
      '<img src="' + CALE + '" width="150" height="1" alt="" ' +
      'style="display:block;border:0;width:150px;height:1px"></td>' +
      '</tr></table></td></tr>' +
    /* le filet doré devient la barre de section : plus de bandeau séparé */
    '<tr><td bgcolor="#c9a14a" align="center" ' +
      'style="padding:4px 12px;font-family:' + POLICE + ';font-size:12px;' +
      'font-weight:bold;color:#04152c;letter-spacing:1.4px">IDENTIFICATION</td></tr>' +
    '</table></td></tr>');

  /* bandeau de section : marine, titre centré, filet doré */
  function bandeau(titre){
    return '<tr><td style="padding:11px ' + MARGE + 'px 5px">' +
      '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
      'style="width:' + CONTENU + 'px;border-collapse:collapse">' +
        '<tr><td bgcolor="#04152c" align="center" ' +
        'style="padding:5px 12px;font-family:' + POLICE + ';font-size:13px;' +
        'font-weight:bold;color:#ffffff;letter-spacing:1px">' + titre + '</td></tr>' +
        '<tr><td bgcolor="#c9a14a" style="font-size:0;line-height:0;height:2px">&nbsp;</td></tr>' +
      '</table></td></tr>';
  }

  /* cartouche : filet d'accent, étiquette puis valeur, largeur imposée */
  function cart(lbl, val, accent, larg, centre){
    return '<table cellpadding="0" cellspacing="0" border="0" width="' + larg + '" ' +
      'style="width:' + larg + 'px;border-collapse:collapse;table-layout:fixed"><tr>' +
      '<td width="4" bgcolor="' + accent + '" style="width:4px;font-size:0;line-height:0">&nbsp;</td>' +
      '<td bgcolor="#f4f7fb" align="' + (centre ? 'center' : 'left') + '" height="30" ' +
      'style="height:30px;border:1px solid #dfe7f2;border-left:0;padding:5px 12px;' +
      'overflow:hidden">' +
      '<span style="font-family:' + POLICE + ';font-size:13px;font-weight:bold;color:#96a5b9">' +
      lbl + '</span> ' +
      '<span style="font-family:' + POLICE + ';font-size:' + (centre ? '20' : '16') + 'px;' +
      'font-weight:bold;color:#11243a">' + (ech(val) || '&#8212;') + '</span>' +
      '</td></tr></table>';
  }
  function rangee(cells){
    var o = '<tr><td style="padding:0 ' + MARGE + 'px 6px">' +
            '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
            'style="width:' + CONTENU + 'px;border-collapse:collapse;table-layout:fixed"><tr>';
    cells.forEach(function(c, k){
      if (k) o += '<td width="' + ESPACE + '" style="width:' + ESPACE +
                  'px;font-size:0;line-height:0">&nbsp;</td>';
      o += '<td width="' + LARG3 + '" valign="top" style="width:' + LARG3 + 'px">' +
           (c || '&nbsp;') + '</td>';
    });
    return o + '</tr></table></td></tr>';
  }

  var LARG_DATE = LARG3, LARG_CENTRE = LARG3 * 2 + ESPACE;   // aligné sur les rangées
  H.push('<tr><td style="padding:7px ' + MARGE + 'px 6px">' +
    '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
    'style="width:' + CONTENU + 'px;border-collapse:collapse;table-layout:fixed"><tr>' +
      '<td width="' + LARG_CENTRE + '" valign="top" style="width:' + LARG_CENTRE + 'px">' +
      cart('Centre :', String(info.centre || '').toUpperCase(), '#c9a14a', LARG_CENTRE, true) +
      '</td>' +
      '<td width="' + ESPACE + '" style="width:' + ESPACE +
      'px;font-size:0;line-height:0">&nbsp;</td>' +
      '<td width="' + LARG_DATE + '" valign="top" style="width:' + LARG_DATE + 'px">' +
      cart('Date :', info.date, '#4a8ef5', LARG_DATE) + '</td>' +
    '</tr></table></td></tr>');

  H.push(rangee([ cart('N&deg; commande :', info.commande, '#4a8ef5', LARG3),
                  cart('N&deg; de PO :', info.po, '#4a8ef5', LARG3),
                  cart('N&deg; soumission :', info.soum, '#4a8ef5', LARG3) ]));
  H.push(rangee([ cart('B&eacute;n&eacute;ficiaire :', info.benef, '#c9a14a', LARG3),
                  cart('Intervenant :', info.interv, '#c9a14a', LARG3),
                  cart('Acheteur :', info.acheteur, '#c9a14a', LARG3) ]));
  H.push(rangee([ cart('Service client :', info.agente, '#c9a14a', LARG3),
                  cart('Rep :', info.repr, '#c9a14a', LARG3),
                  cart('Destinataire :', info.dest, '#c9a14a', LARG3) ]));

  H.push(bandeau('DESCRIPTION'));
  H.push('<tr><td style="padding:0 ' + MARGE + 'px 0">' +
    '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
    'style="width:' + CONTENU + 'px;border-collapse:collapse"><tr>' +
      '<td bgcolor="#ffffff" style="border:1px solid #dfe7f2;padding:15px 18px;' +
      'font-family:' + POLICE + ';font-size:15px;line-height:1.6;color:#11243a;' +
      'line-height:1.6">' + (texteHTML(texte) || '&#8212;') + '</td>' +
    '</tr></table></td></tr>');

  /* photos : deux par rangée, 360 px chacune */
  if (r.length){
    H.push(bandeau('PHOTOS'));
    function cellPhoto(idx){
      if (idx === null) return '<td width="450">&nbsp;</td>';
      var p = PHOTOS[idx];
      return '<td width="450" valign="top">' +
        '<div style="font-family:' + POLICE + ';font-size:14px;font-weight:bold;' +
        'color:#04152c">Photo ' + (idx + 1) + '</div>' +
        (COMMS[idx] ? '<div style="font-family:' + POLICE + ';font-size:13px;color:#5d6f83;' +
          'padding:2px 0 5px;line-height:1.35">' + ech(COMMS[idx]) + '</div>'
                    : '<div style="height:5px;font-size:0">&nbsp;</div>') +
        '<img src="' + (p.apercu || p.data) + '" width="450" alt="Photo ' + (idx + 1) + '" ' +
        'style="display:block;width:450px;max-width:100%;height:auto;border:1px solid #dfe7f2">' +
        '</td>';
    }
    for (var k = 0; k < r.length; k += 2){
      H.push('<tr><td style="padding:' + (k ? 14 : 4) + 'px ' + MARGE + 'px 0">' +
        '<table cellpadding="0" cellspacing="0" border="0" width="' + CONTENU + '" ' +
        'style="width:' + CONTENU + 'px;table-layout:fixed"><tr>' +
          cellPhoto(r[k]) +
          '<td width="20" style="width:20px;font-size:0;line-height:0">&nbsp;</td>' +
          cellPhoto(k + 1 < r.length ? r[k + 1] : null) +
        '</tr></table></td></tr>');
    }
  }

  /* v121 : bouton vert « CONFIRMER RÉCEPTION » retiré du courriel — personne ne cliquait dessus */

  H.push('<tr><td style="height:18px;font-size:0;line-height:0">&nbsp;</td></tr>');

  H.push('</table>');
  return { html: H.join(''), info: info, texte: texte, photos: r.length };
}

function courrielTexte(c){
  var i = c.info, L = ['QUESTIONNEMENT', ''];
  if (i.centre)   L.push('Centre : ' + i.centre);
  if (i.commande) L.push('N° de commande : ' + i.commande);
  if (i.po)       L.push('N° de PO : ' + i.po);
  if (i.soum)     L.push('N° de soumission : ' + i.soum);
  if (i.agente)   L.push('Agente service client : ' + i.agente);
  if (i.repr)     L.push('Représentante : ' + i.repr);
  if (i.dest)     L.push('Destinataire : ' + i.dest);
  L.push('Date : ' + i.date);
  if (c.texte){ L.push(''); L.push('Questionnement :'); L.push(c.texte); }
  L.push(''); L.push('PhysiPro — Atelier orthopédique · Sherbrooke (Québec)');
  return L.join('\n');
}

/* Un clic fait les deux : la mise en forme (avec les photos) est copiée
   dans le presse-papiers, PUIS la messagerie s'ouvre, adressée et titrée.
   Il ne reste qu'un Ctrl+V dans le message. */
$('btnHTML').addEventListener('click', function(){
  var c = courrielHTML(), i = c.info, b = this;

  var sujet = 'Questionnement atelier' + (i.centre ? ' \u2014 ' + i.centre : '') +
              (i.commande ? ' \u2014 commande ' + i.commande : '');
  var dest = adresseDe(i.dest) || adresseDe(i.agente) || '';
  var cc   = (inclureRepr() && i.repr && i.repr !== i.dest) ? adresseDe(i.repr) : '';
  var url  = 'mailto:' + dest +
             '?subject=' + encodeURIComponent(sujet) +
             (cc ? '&cc=' + cc : '');

  /* v131 : le courriel s'ouvre, PUIS les deux fichiers sont enregistrés --
     le PDF et sa copie modifiable .questionnement.json -- exactement comme
     le bouton « Générer le PDF ». Chrome les range dans le dossier réglé
     dans chrome://settings/downloads.
     (Le commentaire d'origine parlait d'un « dossier d'archives » à choisir :
      ce mécanisme a été retiré en v116, la note ne correspondait plus au code.) */
  function ouvrirMessagerie(){
    var a = document.createElement('a');
    a.href = url; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();

    /* v136 : la fiche de suivi part en même temps que le courriel */
    noterSuivi(i);

    var pdf = construirePDF();
    if (!pdf){
      b.textContent = '\u2713 Copié — fais Ctrl+V dans le courriel';
      setTimeout(function(){ b.textContent = '✉ Copier + ouvrir le courriel'; }, 2600);
      return;
    }
    archiver(pdf).then(function(){
      b.textContent = '\u2713 Copié + PDF enregistré — Ctrl+V dans le courriel';
      setTimeout(function(){ b.textContent = '✉ Copier + ouvrir le courriel'; }, 3200);
    });
  }

  function secours(){
    var d = document.createElement('div');
    d.innerHTML = c.html;
    d.style.cssText = 'position:fixed;left:-99999px;top:0';
    document.body.appendChild(d);
    var sel = window.getSelection(), rg = document.createRange();
    rg.selectNodeContents(d); sel.removeAllRanges(); sel.addRange(rg);
    try { document.execCommand('copy'); } catch(e){}
    sel.removeAllRanges(); d.remove();
    ouvrirMessagerie();
  }

  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    try {
      navigator.clipboard.write([ new ClipboardItem({
        'text/html':  new Blob([c.html], { type: 'text/html' }),
        'text/plain': new Blob([courrielTexte(c)], { type: 'text/plain' })
      })]).then(ouvrirMessagerie, secours);
      return;
    } catch(e){}
  }
  secours();
});

/* ============================================================
   SECTION 28e — ENREGISTREMENT DU PDF (v116)
   Plus de dossier à choisir : le PDF part en téléchargement et
   Chrome le range dans le dossier réglé une fois pour toutes dans
   chrome://settings/downloads (ex. Bureau\\historique questionnement).
   ============================================================ */
function archiver(r){
  try {
    r.doc.save(r.nom);
    return Promise.resolve('telecharge');
  } catch(e){
    console.error('Enregistrement PDF :', e);
    return Promise.resolve('erreur');
  }
}
/* ============================================================
   SECTION 28g — SUIVI DES QUESTIONNEMENTS ACTIFS (v136)
   À chaque envoi du courriel, une fiche TEXTE est écrite dans
   Firebase, nœud « questSuivis ». Elle alimente la page
   PhysiPro_Questionnements_Actifs.html, que tout le monde consulte.
   Aucune photo, aucune description, aucun bénéficiaire : rien que
   les repères qu'on peut afficher sur un écran d'atelier.
   La clé est « commande + date » : renvoyer le même questionnement
   la même journée met la fiche à jour au lieu de la dédoubler.
   ============================================================ */
function cleSuivi(commande, date){
  var c = String(commande || '').replace(/[.#$\[\]\/]/g, '-').replace(/\s+/g, '_').slice(0, 40);
  return c + '__' + String(date || '').replace(/[^0-9\-]/g, '');
}

function noterSuivi(info){
  if (!fbDb || !telUser || !info || !info.commande) return;
  var fiche = {
    commande: info.commande,
    date:     info.date   || aujourdhui(),
    ts:       Date.now(),
    centre:   info.centre || '',
    po:       info.po     || '',
    soum:     info.soum   || '',
    agente:   info.agente || '',
    dest:     info.dest   || '',
    rafraich: !!info.rafraich,          // v145
    origine:  info.origine || '',       // v145
    etat:     'attente',
    creePar:  telUser.email || ''
  };
  var cle = cleSuivi(fiche.commande, fiche.date);
  try {
    fbDb.ref('questSuivis/' + cle).set(fiche);
    noterDetail(cle, info);
  } catch(e){ console.error('Suivi :', e); }
}

/* ============================================================
   SECTION 28h — QUESTIONNEMENT COMPLET POUR LA PAGE ACTIFS (v146)
   TROIS NOEUDS SEPARES, pour que chaque clic ne telecharge que ce qu'il
   faut et rien de plus :
     questSuivis         la barre (n° de commande, date, centre...)  ~300 o
                         -> lu au chargement de la page, pour toutes les fiches
     questSuivisDetail   le texte du questionnement et les identites  ~1 a 3 ko
                         -> lu seulement quand on clique sur une barre
     questSuivisPhotos   les photos                                   ~50 ko/photo
                         -> lu seulement si on demande a les voir
   Autrement dit : ouvrir la page coute exactement ce que ca coutait avant,
   deplier une barre coute des poussieres, et seules les photos reellement
   regardees sont telechargees.
   Les photos sont re-encodees a 640 px, qualite 0,5, plafonnees a 70 ko
   chacune : lisible a l'ecran de l'atelier, environ le cinquieme du poids
   des photos du courriel.
   ============================================================ */
var DET_PX = 640, DET_Q = 0.5, DET_MAX = 72000;

function vignetteDetail(src){
  return new Promise(function(res){
    if (!src) { res(''); return; }
    var im = new Image();
    im.onload = function(){
      try {
        var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
        var k = Math.min(1, DET_PX / Math.max(w, h));
        w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        var q = DET_Q, d = c.toDataURL('image/jpeg', q);
        while (d.length > DET_MAX && q > 0.28){ q -= 0.07; d = c.toDataURL('image/jpeg', q); }
        res(d.length > DET_MAX ? '' : d);
      } catch(e){ res(''); }
    };
    im.onerror = function(){ res(''); };
    im.src = src;
  });
}

function noterDetail(cle, info){
  var idx = remplies();
  var travaux = idx.map(function(i){
    return vignetteDetail(PHOTOS[i].apercu || PHOTOS[i].data).then(function(d){
      return { comm: COMMS[i] || '', img: d };
    });
  });
  Promise.all(travaux).then(function(ph){
    ph = ph.filter(function(x){ return x.img; });

    /* poids reel des photos, calcule ici une fois pour toutes : la page
       Actifs peut ainsi annoncer « 3 photos (152 ko) » AVANT de les lire,
       sans rien telecharger. */
    var poids = 0;
    ph.forEach(function(x){ poids += Math.round(x.img.length * 0.75); });

    var det = {
      commande: info.commande || '',
      date:     info.date     || '',
      centre:   info.centre   || '',
      po:       info.po       || '',
      soum:     info.soum     || '',
      benef:    info.benef    || '',
      interv:   info.interv   || '',
      acheteur: info.acheteur || '',
      agente:   info.agente   || '',
      repr:     info.repr     || '',
      dest:     info.dest     || '',
      rafraich: !!info.rafraich,
      origine:  info.origine  || '',
      texte:    $('fTexte').value.trim(),
      nbPhotos: ph.length,
      poids:    poids,
      ts:       Date.now()
    };

    /* le texte d'abord -- c'est lui qui doit arriver vite au clic */
    return fbDb.ref('questSuivisDetail/' + cle).set(det).then(function(){
      if (!ph.length) return fbDb.ref('questSuivisPhotos/' + cle).remove();
      return fbDb.ref('questSuivisPhotos/' + cle).set({ photos: ph, ts: Date.now() });
    });
  }).catch(function(e){ console.error('Detail :', e); });
}

/* ============================================================
   SECTION 30 — DÉMO (TEMPORAIRE)
   Remplit tout l'outil pour tester rapidement le PDF et l'envoi.
   POUR RETIRER : supprimer cette section, le bouton #btnDemo dans
   la barre du haut, et la règle CSS .btnDemo.
   ============================================================ */
function imageDemo(no, titre){
  var w = 1200, h = 900;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#12354f'); g.addColorStop(1, '#4a8ef5');
  x.fillStyle = g; x.fillRect(0, 0, w, h);

  x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 2;
  for (var i = 100; i < w; i += 100){ x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (var j = 100; j < h; j += 100){ x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }

  x.fillStyle = 'rgba(201,161,74,.9)';
  x.beginPath(); x.arc(w / 2, h / 2 - 40, 150, 0, Math.PI * 2); x.fill();

  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = 'bold 130px Segoe UI, Arial'; x.fillText(no, w / 2, h / 2 + 10);
  x.font = 'bold 54px Segoe UI, Arial'; x.fillText(titre, w / 2, h / 2 + 200);
  x.font = '34px Segoe UI, Arial'; x.fillStyle = 'rgba(255,255,255,.85)';
  x.fillText('image de test — ' + w + ' x ' + h, w / 2, h / 2 + 260);

  var d = c.toDataURL('image/jpeg', 0.72);
  return { data: d, orig: d, ow: w, oh: h, w: w, h: h, rot: 0, annots: [], apercu: d, aw: w, ah: h };
}

})();
