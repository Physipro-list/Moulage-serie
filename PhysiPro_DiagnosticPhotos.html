<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Diagnostic Photos</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:18px;line-height:1.5}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:20px;color:#fff;margin-bottom:2px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:18px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px;margin-bottom:14px}
  input{width:100%;padding:11px 13px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;font-size:14px;margin-bottom:10px}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{background:#2563eb}
  button:disabled{opacity:.6;cursor:default}
  .verdict{border-radius:12px;padding:16px 18px;margin-bottom:14px;font-size:15px;font-weight:700}
  .verdict.ok{background:linear-gradient(135deg,#064e3b,#065f46);border:1px solid #22c55e;color:#d1fae5}
  .verdict.warn{background:linear-gradient(135deg,#78350f,#92400e);border:1px solid #f59e0b;color:#fef3c7}
  .verdict .big{font-size:22px;display:block;margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{border:1px solid #334155;padding:8px 11px;text-align:left}
  th{background:#0b1220;color:#93c5fd;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.n{text-align:right;font-weight:700}
  td.good{color:#4ade80}
  td.bad{color:#fbbf24}
  .lbl{font-size:12px;color:#93c5fd;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
  .samples{display:flex;flex-wrap:wrap;gap:10px}
  .samp{background:#0b1220;border:1px solid #334155;border-radius:8px;padding:8px;width:150px;font-size:10px;color:#94a3b8;word-break:break-all}
  .samp img{width:100%;height:90px;object-fit:cover;border-radius:5px;margin-bottom:5px;background:#000}
  .samp b{color:#e2e8f0}
  .tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-bottom:4px}
  .tag.thumb{background:#16a34a;color:#fff}
  .tag.full{background:#475569;color:#fff}
  .tag.b64{background:#dc2626;color:#fff}
  .err{color:#fca5a5;font-size:13px}
  .muted{color:#64748b;font-size:12px;margin-top:8px}
  a{color:#60a5fa}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 PhysiPro — Diagnostic des photos</h1>
  <div class="sub">Vérifie si la migration des photos a fonctionné et si ce sont des miniatures.</div>

  <div class="card" id="loginCard">
    <div class="lbl" style="margin-top:0">Connexion (ton courriel PhysiPro)</div>
    <input type="email" id="email" placeholder="courriel@physipro.com" autocomplete="username">
    <input type="password" id="pwd" placeholder="mot de passe" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">Se connecter et analyser</button>
    <div class="err" id="loginErr" style="margin-top:8px;display:none"></div>
  </div>

  <div id="result"></div>
</div>

<script>
var _k = ['AIza','SyCk','7bqV','nx08','Kz1f','Vq1W','24Au','W854','KY9j','Pno'];
var FIREBASE_CONFIG = {
  apiKey: _k.join(''),
  authDomain: "liste-des-moulages-physipro.firebaseapp.com",
  databaseURL: "https://liste-des-moulages-physipro-default-rtdb.firebaseio.com",
  projectId: "liste-des-moulages-physipro",
  storageBucket: "liste-des-moulages-physipro.firebasestorage.app",
  messagingSenderId: "24566847562",
  appId: "1:24566847562:web:db492bdd33116373e0eeb3"
};
firebase.initializeApp(FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.database();

function doLogin(){
  var em=(document.getElementById('email').value||'').trim();
  var pw=document.getElementById('pwd').value||'';
  var btn=document.getElementById('loginBtn'); var err=document.getElementById('loginErr');
  err.style.display='none';
  btn.disabled=true; btn.textContent='Connexion…';
  auth.signInWithEmailAndPassword(em,pw).then(function(){
    btn.textContent='Analyse en cours…';
    analyze();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Se connecter et analyser';
    err.style.display='block'; err.textContent='❌ '+e.message;
  });
}

function isB64(s){ return typeof s==='string' && s.indexOf('data:')===0; }
function isUrl(s){ return typeof s==='string' && /^https?:/i.test(s); }

function analyze(){
  db.ref('moulages').once('value').then(function(snap){
    var data=snap.val()||{};
    var cards=Object.keys(data);
    var histB64=0,histUrl=0,histThumb=0,chatB64=0,chatUrl=0,cardsWithPhoto=0;
    var thumbSamples=[],fullSamples=[],b64Samples=[];
    cards.forEach(function(cid){
      var c=data[cid]||{}; var had=false;
      // Historique
      if(c.historique && typeof c.historique==='object'){
        Object.keys(c.historique).forEach(function(k){
          var e=c.historique[k]; if(!e||!e.photo) return; had=true;
          if(isB64(e.photo)){ histB64++; if(b64Samples.length<4) b64Samples.push({src:e.photo,where:'historique'}); }
          else if(isUrl(e.photo)){ histUrl++; if(e.photoThumb){ histThumb++; if(thumbSamples.length<6) thumbSamples.push({thumb:e.photoThumb,full:e.photo}); } else { if(fullSamples.length<4) fullSamples.push({src:e.photo,where:'historique (sans miniature)'}); } }
        });
      }
      // Chat
      if(Array.isArray(c.messages)){
        c.messages.forEach(function(m){
          if(!m||!m.image) return; had=true;
          if(isB64(m.image)){ chatB64++; if(b64Samples.length<4) b64Samples.push({src:m.image,where:'chat'}); }
          else if(isUrl(m.image)){ chatUrl++; if(fullSamples.length<4) fullSamples.push({src:m.image,where:'chat (pleine grandeur)'}); }
        });
      }
      if(had) cardsWithPhoto++;
    });

    var totB64=histB64+chatB64;
    var html='';
    if(totB64===0){
      html+='<div class="verdict ok"><span class="big">✅ Migration complète</span>Aucune photo en base64 dans le nœud synchronisé. Tout est rangé dans Storage (URL). Le re-téléchargement en boucle est éliminé.</div>';
    } else {
      html+='<div class="verdict warn"><span class="big">⚠️ Migration incomplète</span>Il reste <b>'+totB64+' photo(s) en base64</b> ('+histB64+' historique, '+chatB64+' chat). Reclique le bouton « Migrer » dans Moulage → ⚙️ Réglages et laisse-le finir.</div>';
    }

    html+='<div class="card"><table>';
    html+='<tr><th>Élément</th><th>Quantité</th><th>État</th></tr>';
    html+='<tr><td>Cartes analysées</td><td class="n">'+cards.length+'</td><td>—</td></tr>';
    html+='<tr><td>Cartes avec photos</td><td class="n">'+cardsWithPhoto+'</td><td>—</td></tr>';
    html+='<tr><td>Photos historique — base64 (à migrer)</td><td class="n '+(histB64?'bad':'good')+'">'+histB64+'</td><td>'+(histB64?'⚠️ à migrer':'✅ ok')+'</td></tr>';
    html+='<tr><td>Photos historique — URL Storage</td><td class="n good">'+histUrl+'</td><td>✅ migrées</td></tr>';
    html+='<tr><td>Photos historique — avec MINIATURE</td><td class="n '+(histThumb===histUrl&&histUrl>0?'good':'')+'">'+histThumb+' / '+histUrl+'</td><td>'+(histUrl===0?'—':(histThumb===histUrl?'✅ miniatures':'partiel'))+'</td></tr>';
    html+='<tr><td>Photos chat — base64 (à migrer)</td><td class="n '+(chatB64?'bad':'good')+'">'+chatB64+'</td><td>'+(chatB64?'⚠️ à migrer':'✅ ok')+'</td></tr>';
    html+='<tr><td>Photos chat — URL Storage</td><td class="n good">'+chatUrl+'</td><td>✅ ok</td></tr>';
    html+='</table>';
    html+='<div class="muted">Note : les photos « sidebar » (galerie principale) sont stockées séparément dans Storage et listées par dossier — elles n\'apparaissent pas dans ce nœud, donc pas comptées ici. Elles sont déjà des URLs (en cache, pas de re-sync).</div>';
    html+='</div>';

    if(thumbSamples.length){
      html+='<div class="lbl">🟢 Exemples de MINIATURES (historique) — petites, et l\'URL contient « _thumb »</div><div class="samples">';
      thumbSamples.forEach(function(s){ html+='<div class="samp"><span class="tag thumb">MINIATURE</span><img src="'+s.thumb+'" onerror="this.style.opacity=.3"><b>thumb :</b> '+shortUrl(s.thumb)+'</div>'; });
      html+='</div>';
    }
    if(fullSamples.length){
      html+='<div class="lbl">⚪ Exemples de photos PLEINE GRANDEUR (URL, sans miniature)</div><div class="samples">';
      fullSamples.forEach(function(s){ html+='<div class="samp"><span class="tag full">PLEINE</span><img src="'+s.src+'" onerror="this.style.opacity=.3"><b>'+s.where+'</b><br>'+shortUrl(s.src)+'</div>'; });
      html+='</div>';
    }
    if(b64Samples.length){
      html+='<div class="lbl">🔴 Photos encore en BASE64 (à migrer)</div><div class="samples">';
      b64Samples.forEach(function(s){ html+='<div class="samp"><span class="tag b64">BASE64</span><img src="'+s.src+'" onerror="this.style.opacity=.3"><b>'+s.where+'</b><br>('+Math.round(s.src.length/1024)+' Ko)</div>'; });
      html+='</div>';
    }

    html+='<div class="muted">✅ Si les images ci-dessus s\'affichent, ça confirme aussi que l\'accès à Firebase Storage fonctionne (utile pour les fiches OneDrive).</div>';

    document.getElementById('loginCard').style.display='none';
    document.getElementById('result').innerHTML=html;
  }).catch(function(e){
    document.getElementById('result').innerHTML='<div class="verdict warn"><span class="big">❌ Erreur de lecture</span>'+e.message+'</div>';
    var btn=document.getElementById('loginBtn'); btn.disabled=false; btn.textContent='Réessayer';
  });
}

function shortUrl(u){
  try{ var m=decodeURIComponent(u).match(/\/o\/(.+?)\?/); return m?m[1].split('/').pop():u.substring(0,40); }catch(e){ return u.substring(0,40); }
}

// Si déjà connecté
auth.onAuthStateChanged(function(user){
  if(user){ document.getElementById('loginBtn').textContent='Analyse en cours…'; analyze(); }
});
</script>
</body>
</html>
