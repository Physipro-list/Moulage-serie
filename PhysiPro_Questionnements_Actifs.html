<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysiPro — Questionnements actifs v8</title>

<!-- ============================================================
     SECTION 1 — RESET / BASE
     ============================================================ -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --fond:#eef2f6; --carte:#ffffff; --trait:#d3dde5; --texte:#1c2b36; --gris:#6a7c89;
  --navy:#04152c; --azur:#4a8ef5; --or:#c9a14a;
  --vert2:#1e7d42; --ambre:#b07d12; --rouge:#b3261e;
}
html,body{height:100%}
body{
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--fond); color:var(--texte); font-size:15px; line-height:1.45;
  padding-bottom:30px;
}

/* ============================================================
   SECTION 2 — BARRE DU HAUT
   ============================================================ */
/* v139 / v5 : COPIE CONFORME de la barre du haut de Physipro_moulage.html.
   Mêmes valeurs exactes : hauteur 75 px, dégradé vertical #04152c -> #4a8ef5,
   ombre intérieure, logo 40 px avec le mot du module en dessous, titre 30 px.
   Seule différence assumée : « position:sticky » au lieu de « relative »,
   parce que ces pages défilent alors que Moulage tient dans un écran. */
.topbar {
  height: 75px; min-height: 75px;
  background: linear-gradient(to bottom, #04152c 0%, #4a8ef5 100%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.16), 0 2px 6px rgba(0,0,0,0.45);
  position: sticky; top: 0; z-index: 50; flex-shrink: 0;
  padding: 0 16px;
}
.tb-left { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 2; }
.tb-right { position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 2; }
.logo-flip-container{position:relative;cursor:pointer;z-index:99995;}
.logo-main{display:flex;flex-direction:column;align-items:center;}
.logo-top-fixed img{height:40px;width:auto;filter:brightness(1.1) drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.logo-bottom-text{font-size:15px;font-weight:600;color:#fff;text-shadow:1px 1px 3px rgba(0,0,0,.6);margin-top:-4px;}
.tb-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 1; pointer-events: none; max-width: calc(100% - 420px);
  overflow: hidden; text-overflow: ellipsis; }
.top-title { font-size: 30px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: #fdfdfd; text-shadow: 0 2px 3px rgba(0,0,0,0.85); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; display: block; }
@media (max-width: 1600px) { .top-title { font-size: 26px; letter-spacing: 0.06em; } }
@media (max-width: 1400px) { .top-title { font-size: 22px; letter-spacing: 0.04em; }
  .tb-center { max-width: calc(100% - 400px); } }
@media (max-width: 1200px) { .top-title { font-size: 18px; letter-spacing: 0.03em; }
  .tb-center { max-width: calc(100% - 360px); } }
@media (max-width: 1000px) { .top-title { font-size: 14px; letter-spacing: 0.02em; }
  .tb-center { max-width: calc(100% - 300px); } }
@media (max-width: 620px)  { .top-title { font-size: 12px; letter-spacing: 0.02em; }
  .tb-center { max-width: calc(100% - 230px); }
  .logo-top-fixed img { height: 32px; }
  .logo-bottom-text { font-size: 12px; } }
/* v141 / v8 : FLÈCHE DE RETOUR — obligatoire sur toute page ouverte au
   téléphone. Sans elle on reste coincé dans la page. Visible partout. */
.tb-back{
  display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:10px; flex-shrink:0;
  background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28);
  color:#fff; font-size:24px; font-weight:700; line-height:1;
  text-decoration:none; margin-right:10px;
  transition:background .15s, transform .12s;
}
.tb-back:hover{background:rgba(255,255,255,0.3)}
.tb-back:active{transform:scale(.92)}
@media (max-width: 620px){ .tb-back{width:36px; height:36px; font-size:21px; margin-right:7px} }

.topbar .ver{font-size:11px; color:rgba(255,255,255,0.75); font-weight:600;
  background:rgba(255,255,255,0.14); padding:3px 9px; border-radius:20px}

/* ============================================================
   SECTION 3 — BARRE D'OUTILS
   ============================================================ */
.wrap{max-width:1080px; margin:0 auto; padding:16px 14px 0}

.outils{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--carte); border:1px solid var(--trait); border-radius:10px;
  padding:10px 12px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.compteur{font-size:15px; font-weight:800; color:var(--navy); white-space:nowrap}
.compteur small{display:block; font-size:11px; font-weight:600; color:var(--gris);
  text-transform:uppercase; letter-spacing:.5px}
.outils input.rech{
  flex:1; min-width:170px; border:1px solid var(--trait); border-radius:8px;
  padding:8px 11px; font-size:14px; font-family:inherit; color:var(--texte);
}
.outils input.rech:focus{outline:none; border-color:var(--azur); box-shadow:0 0 0 2px rgba(74,142,245,.15)}

.btn{
  border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700;
  font-family:inherit; cursor:pointer; white-space:nowrap;
}
.btn-gris{background:#e6ecf2; color:var(--navy)}
.btn-gris:hover{background:#d8e2ea}
.btn-navy{background:var(--navy); color:#fff}
.btn-navy:hover{background:#0a2748}
.btn-or{background:var(--or); color:#2b2107}
.btn-or:hover{background:#d8b158}
.btn-sup{background:#fdf0ef; color:var(--rouge); border:1px solid #eec3c0}
.btn-sup:hover{background:#fbe2e0}

/* ============================================================
   SECTION 4 — FICHES
   ============================================================ */
.liste{display:flex; flex-direction:column; gap:6px}

/* v6 : fiche compactée de moitié (environ 100 px -> 50 px).
   Ligne 1 : n° de commande, date, crayon, délai et croix, tout aligné.
   Ligne 2 : les informations, en petites puces sur une seule ligne. */
.fiche{
  background:var(--carte); border:1px solid var(--trait); border-left:4px solid var(--azur);
  border-radius:8px; padding:6px 10px; box-shadow:0 1px 2px rgba(0,0,0,.05);
  display:flex; flex-direction:column; gap:3px;
}
.fiche.j3{border-left-color:var(--or)}
.fiche.j6{border-left-color:var(--rouge)}

/* --- ligne 1 --- */
.frang{display:flex; align-items:center; gap:8px; min-width:0}
.fcommande{font-size:15px; font-weight:800; color:var(--navy); letter-spacing:.3px;
  line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42%}
.fdate{font-size:11.5px; color:var(--gris); font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.fespace{flex:1}

.delai{
  border-radius:20px; padding:2px 10px; white-space:nowrap; flex-shrink:0;
  font-size:11.5px; font-weight:800; line-height:1.5;
  background:#e8f5ec; border:1px solid #bfe0ca; color:var(--vert2);
}
.delai.j3{background:#fdf4e0; border-color:#ecd7a3; color:var(--ambre)}
.delai.j6{background:#fbeaea; border-color:#eec3c0; color:var(--rouge)}

.mini{
  border:1px solid var(--trait); background:#fff; border-radius:6px; cursor:pointer;
  padding:1px 7px; font-size:12px; font-weight:700; color:var(--navy); font-family:inherit;
  flex-shrink:0; line-height:1.5;
}
.mini:hover{background:#f1f5f9}

/* La croix garde une zone de touche confortable sans faire grandir la ligne */
.croix{
  width:26px; height:26px; flex-shrink:0; border-radius:50%; cursor:pointer;
  border:1.5px solid #bfe0ca; background:#f2fbf5; color:var(--vert2);
  font-size:16px; font-weight:700; line-height:1; font-family:inherit;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, transform .12s;
}
.croix:hover{background:#d9f2e3; transform:scale(1.1)}
.croix:active{transform:scale(.9)}

/* --- ligne 2 : les informations --- */
.finfos{display:flex; gap:5px; min-width:0; overflow:hidden}
.puce{
  background:#f1f5f9; border:1px solid var(--trait); border-radius:5px;
  padding:0 6px; font-size:10.5px; line-height:1.6; color:var(--texte);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;
}
.puce.centre{flex-shrink:1; min-width:0}
.puce b{color:var(--gris); font-weight:700; text-transform:uppercase; font-size:9px;
  letter-spacing:.4px; margin-right:4px}

.vide{
  background:var(--carte); border:1px dashed var(--trait); border-radius:10px;
  padding:42px 18px; text-align:center; color:var(--gris);
}
.vide .g{font-size:34px; display:block; margin-bottom:8px}
.vide b{display:block; color:var(--navy); font-size:16px; margin-bottom:4px}

@media(max-width:560px){
  .fcommande{font-size:14px; max-width:none}
  .fdate{font-size:11px}
  .finfos{flex-wrap:nowrap}
}

/* ============================================================
   SECTION 5 — FENÊTRE D'AJOUT / MODIFICATION
   ============================================================ */
.voile{
  position:fixed; inset:0; background:rgba(4,21,44,.55); z-index:80;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.voile.on{display:flex}
.boite{
  background:var(--carte); border-radius:12px; width:100%; max-width:520px;
  max-height:92vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.boiteTete{
  background:linear-gradient(90deg,var(--navy) 0%, var(--azur) 100%);
  border-bottom:2px solid var(--or); color:#fff; padding:10px 14px;
  font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:space-between;
}
.boiteTete button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.boiteCorps{padding:14px}
.champ{margin-bottom:11px}
.champ label{display:block; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.5px; color:var(--gris); margin-bottom:3px}
.champ input{
  width:100%; border:1px solid var(--trait); border-radius:8px; padding:8px 11px;
  font-size:14px; font-family:inherit; color:var(--texte);
}
.champ input:focus{outline:none; border-color:var(--azur); box-shadow:0 0 0 2px rgba(74,142,245,.15)}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* v7 : boîte cliquable qui ouvre le sélecteur, comme dans le module
   Questionnement. Même allure qu'un champ texte pour ne pas dérouter. */
.choix{
  width:100%; border:1px solid var(--trait); border-radius:8px; padding:8px 11px;
  font-size:14px; background:#fff; cursor:pointer; color:var(--texte);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.choix:hover{border-color:var(--azur); background:#f7fbff}
.choix.vide{color:#9aa9b6}

/* Fenêtre du sélecteur — reprise telle quelle du module Questionnement */
.pick{position:fixed; inset:0; background:rgba(10,20,28,.55); z-index:150; display:none;
  align-items:center; justify-content:center; padding:16px}
.pick.ouvert{display:flex}
.pickBoite{background:#fff; border-radius:11px; width:100%; max-width:560px; max-height:82vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pickTete{display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:linear-gradient(90deg,var(--navy) 0%, var(--azur) 100%); border-bottom:2px solid var(--or)}
.pickTete .t{color:#fff; font-weight:700; font-size:15px; white-space:nowrap; flex:1}
.pickTete input{flex:1; min-width:0; border:0; border-radius:6px; padding:9px 11px;
  font-size:15px; font-family:inherit}
.pickTete input:focus{outline:none}
.pickTete button{background:rgba(255,255,255,.2); color:#fff; border:0; width:34px; height:34px;
  border-radius:50%; font-size:19px; cursor:pointer; line-height:1}
.pickListe{overflow:auto; -webkit-overflow-scrolling:touch}
.pickListe .it{padding:11px 14px; border-bottom:1px solid #eef2f6; cursor:pointer; font-size:15px}
.pickListe .it:hover{background:#eaf4fb}
.pickListe .it.on{background:#e0edf6; font-weight:600; color:var(--navy)}
.pickListe .rien{padding:16px; color:var(--gris); font-size:14px; text-align:center}
.pickPied{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--trait); background:#f7fafc}
.pickPied button{flex:1; background:#fff; border:1px solid var(--trait); border-radius:7px;
  padding:10px; font-size:14px; font-family:inherit; cursor:pointer; color:var(--texte)}
.pickPied button:hover{background:#eaf4fb}
.boitePied{display:flex; gap:8px; justify-content:flex-end; padding:0 14px 14px}
.msgErr{color:var(--rouge); font-size:13px; font-weight:600; min-height:18px; margin-bottom:8px}

/* ============================================================
   SECTION 6 — ÉCRAN DE CONNEXION
   ============================================================ */
.loginOverlay{
  position:fixed; inset:0; background:linear-gradient(135deg,var(--navy) 0%, #0d3563 100%);
  z-index:200; display:flex; align-items:center; justify-content:center; padding:18px;
}
.loginOverlay.hidden{display:none}
.loginBoite{
  background:#fff; border-radius:14px; padding:26px 22px; width:100%; max-width:360px;
  box-shadow:0 14px 44px rgba(0,0,0,.35); border-top:3px solid var(--or);
}
.loginBoite h2{font-size:17px; color:var(--navy); margin-bottom:4px; text-align:center}
.loginBoite p.s{font-size:12.5px; color:var(--gris); text-align:center; margin-bottom:16px}
.loginBoite input{
  width:100%; border:1px solid var(--trait); border-radius:8px; padding:10px 12px;
  font-size:14px; font-family:inherit; margin-bottom:10px;
}
.loginBoite input:focus{outline:none; border-color:var(--azur); box-shadow:0 0 0 2px rgba(74,142,245,.15)}
.loginBoite button{width:100%; background:var(--navy); color:#fff; border:none; border-radius:8px;
  padding:11px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer}
.loginBoite button:hover{background:#0a2748}
.loginErr{color:var(--rouge); font-size:13px; font-weight:600; min-height:18px; margin-bottom:6px}
.loginRappel{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--gris); margin-bottom:12px}
</style>
</head>
<body>

<!-- ============================================================
     SECTION 11 — EN-TÊTE
     ============================================================ -->
<header class="topbar" id="mainTopbar">
  <div class="tb-left" style="display:flex;align-items:center">
    <a class="tb-back" href="index.html" title="Retour à l'accueil" aria-label="Retour">←</a>
    <div class="logo-flip-container" id="logoFlipContainer">
      <div class="logo-main">
        <div class="logo-top-fixed"><img src="https://raw.githubusercontent.com/Physipro-list/Physipro-serie/main/logo-physiprodemi1.png" alt="PhysiPro"></div>
        <div class="logo-bottom-text">Quest. actifs</div>
      </div>
    </div>
  </div>
  <div class="tb-center"><span class="top-title">Questionnements actifs</span></div>
  <div class="tb-right"><span class="ver">v8</span></div>
</header>

<div class="wrap">

<!-- ============================================================
     SECTION 12 — BARRE D'OUTILS
     ============================================================ -->
<div class="outils">
  <div class="compteur"><span id="cpt">—</span><small>en attente</small></div>
  <input type="text" class="rech" id="rech" placeholder="Rechercher une commande, un centre, une agente…" autocomplete="off">
  <button class="btn btn-gris" type="button" id="btnMaj">↻ Actualiser</button>
  <button class="btn btn-or" type="button" id="btnAjout" style="display:none">+ Ajouter</button>
</div>

<!-- ============================================================
     SECTION 13 — LISTE
     ============================================================ -->
<div class="liste" id="liste"></div>

</div><!-- /wrap -->

<!-- ============================================================
     SECTION 14 — FENÊTRE D'AJOUT / MODIFICATION
     ============================================================ -->
<div class="voile" id="voile">
  <div class="boite">
    <div class="boiteTete"><span id="boiteTitre">Ajouter un questionnement</span>
      <button type="button" id="boiteFermer">×</button></div>
    <div class="boiteCorps">
      <div class="msgErr" id="fErr"></div>
      <div class="duo">
        <div class="champ"><label>N° de commande *</label><input type="text" id="aCommande" autocomplete="off"></div>
        <div class="champ"><label>Date d'envoi *</label><input type="date" id="aDate"></div>
      </div>
      <div class="champ"><label>Centre</label>
        <div class="choix vide" id="boxCentre">— Choisir un centre —</div>
        <input type="hidden" id="aCentre"></div>
      <div class="duo">
        <div class="champ"><label>N° de PO</label><input type="text" id="aPO" autocomplete="off"></div>
        <div class="champ"><label>N° de soumission</label><input type="text" id="aSoum" autocomplete="off"></div>
      </div>
      <div class="duo">
        <div class="champ"><label>Agente</label>
          <div class="choix vide" id="boxAgente">— Choisir —</div>
          <input type="hidden" id="aAgente"></div>
        <div class="champ"><label>Destinataire</label>
          <div class="choix vide" id="boxDest">— Choisir —</div>
          <input type="hidden" id="aDest"></div>
      </div>
    </div>
    <div class="boitePied">
      <button class="btn btn-sup" type="button" id="boiteSuppr" style="display:none">Supprimer</button>
      <span style="flex:1"></span>
      <button class="btn btn-gris" type="button" id="boiteAnnuler">Annuler</button>
      <button class="btn btn-navy" type="button" id="boiteOK">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ============================================================
     SECTION 14b — SÉLECTEUR (centres, agentes, destinataires)
     ============================================================ -->
<div class="pick" id="pick">
  <div class="pickBoite">
    <div class="pickTete">
      <span class="t" id="pickTitre">Centre</span>
      <input type="text" id="pickRech" placeholder="Rechercher…" autocomplete="off">
      <button type="button" id="pickFermer">×</button>
    </div>
    <div class="pickListe" id="pickListe"></div>
    <div class="pickPied">
      <button type="button" id="pickLibre">Saisir un autre nom…</button>
      <button type="button" id="pickVider">Effacer le choix</button>
    </div>
  </div>
</div>

<!-- ============================================================
     SECTION 15 — CONNEXION
     ============================================================ -->
<div class="loginOverlay" id="loginOverlay">
  <div class="loginBoite">
    <h2>PhysiPro</h2>
    <p class="s">Questionnements actifs</p>
    <div class="loginErr" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Adresse courriel" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password">
    <label class="loginRappel"><input type="checkbox" id="loginRemember" checked style="width:auto;margin:0">Rester connecté</label>
    <button type="button" id="loginBtn">Se connecter</button>
  </div>
</div>

<script src="PhysiPro_Nav.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
/* ============================================================
   SECTION 21 — FIREBASE ET CONNEXION
   Même projet et même compte que le reste de la suite.
   ============================================================ */
function $(id){ return document.getElementById(id); }

var firebaseConfig = {
  apiKey: "AIzaSyCk7bqVnx08Kz1fVq1W24AuW854KY9jPno",
  authDomain: "liste-des-moulages-physipro.firebaseapp.com",
  databaseURL: "https://liste-des-moulages-physipro-default-rtdb.firebaseio.com",
  projectId: "liste-des-moulages-physipro",
  storageBucket: "liste-des-moulages-physipro.appspot.com"
};
try { firebase.initializeApp(firebaseConfig); } catch(e){ console.error(e); }
var fbAuth = null, fbDb = null;
try { fbAuth = firebase.auth(); fbDb = firebase.database(); } catch(e){ console.error(e); }
if (fbAuth) { try { fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch(e){} }

var USER = null, ADMIN = false;

/* Comptes qui peuvent régler, ajouter, modifier et supprimer.
   Tous les autres voient la liste, sans aucun bouton. */
var ADMINS = [
  'atelieratp@physipro.com',   // Daniel
  'orders@physipro.com',       // Jacynthe, Sonia, Nadia
  'contact@physipro.fr'        // France
];
function estAdmin(email){
  return ADMINS.indexOf(String(email || '').trim().toLowerCase()) !== -1;
}

function doLogin(){
  var email = $('loginEmail').value.trim();
  var pass  = $('loginPassword').value;
  var b = $('loginBtn'), err = $('loginError');
  err.textContent = '';

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = 'Adresse courriel invalide.'; return; }
  if (!pass){ err.textContent = 'Entre ton mot de passe.'; return; }
  if (!fbAuth){ err.textContent = 'Firebase indisponible.'; return; }

  b.disabled = true; b.textContent = 'Connexion…';
  var pers = $('loginRemember').checked
    ? firebase.auth.Auth.Persistence.LOCAL
    : firebase.auth.Auth.Persistence.SESSION;
  try { fbAuth.setPersistence(pers).catch(function(){}); } catch(e){}

  fbAuth.signInWithEmailAndPassword(email, pass).catch(function(e){
    var msg = 'Une erreur est survenue.';
    switch (e.code){
      case 'auth/user-not-found':        msg = 'Aucun compte ne correspond à cette adresse.'; break;
      case 'auth/wrong-password':        msg = 'Mot de passe incorrect.'; break;
      case 'auth/invalid-credential':    msg = 'Courriel ou mot de passe incorrect.'; break;
      case 'auth/too-many-requests':     msg = 'Trop de tentatives. Réessaie plus tard.'; break;
      case 'auth/invalid-email':         msg = 'Adresse courriel invalide.'; break;
      case 'auth/network-request-failed':msg = 'Erreur réseau. Vérifie la connexion.'; break;
      default: msg = e.message;
    }
    err.textContent = msg;
    b.disabled = false; b.textContent = 'Se connecter';
  });
}

/* ============================================================
   SECTION 22 — LECTURE DES FICHES
   Le nœud « questSuivis » ne contient QUE les questionnements en
   attente : quand une fiche est réglée, elle est déplacée dans
   « questSuiviRegles ». La lecture reste donc minuscule, même
   après des années. Aucune écoute permanente : une lecture au
   chargement, plus le bouton Actualiser.
   ============================================================ */
var FICHES = [];

function charger(){
  if (!fbDb || !USER) return;
  var b = $('btnMaj');
  b.disabled = true; b.textContent = '…';
  fbDb.ref('questSuivis').once('value').then(function(snap){
    var v = snap.val() || {};
    FICHES = Object.keys(v).map(function(k){
      var f = v[k] || {}; f._cle = k; return f;
    }).filter(function(f){ return f.etat !== 'regle'; });
    FICHES.sort(function(a, b2){
      return String(a.date || '').localeCompare(String(b2.date || ''));   // le plus vieux en premier
    });
    rendre();
    b.disabled = false; b.textContent = '↻ Actualiser';
  }).catch(function(e){
    console.error(e);
    $('liste').innerHTML = '<div class="vide"><b>Lecture impossible</b>' +
      'Vérifie la connexion, ou les règles Firebase du nœud questSuivis.</div>';
    b.disabled = false; b.textContent = '↻ Actualiser';
  });
}

/* ============================================================
   SECTION 23 — AFFICHAGE
   ============================================================ */
function aujourdhui(){
  var d = new Date(), m = ('0' + (d.getMonth() + 1)).slice(-2), j = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + j;
}
function joursDepuis(dateISO){
  if (!dateISO) return 0;
  var p = String(dateISO).split('-');
  if (p.length !== 3) return 0;
  var d0 = new Date(+p[0], +p[1] - 1, +p[2]);
  var au = new Date(); au = new Date(au.getFullYear(), au.getMonth(), au.getDate());
  var n = Math.round((au - d0) / 86400000);
  return n < 0 ? 0 : n;
}
function niveau(n){ return n >= 6 ? 'j6' : (n >= 3 ? 'j3' : ''); }
function ech(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function sansAccent(t){
  return String(t).normalize ? String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
                             : String(t).toLowerCase();
}

function rendre(){
  var q = sansAccent($('rech').value.trim());
  var vues = FICHES.filter(function(f){
    if (!q) return true;
    return sansAccent([f.commande, f.centre, f.po, f.soum, f.agente, f.dest].join(' ')).indexOf(q) !== -1;
  });

  $('cpt').textContent = vues.length;

  if (!vues.length){
    $('liste').innerHTML = q
      ? '<div class="vide"><span class="g">🔍</span><b>Aucun résultat</b>Aucun questionnement en attente ne correspond à cette recherche.</div>'
      : '<div class="vide"><span class="g">✓</span><b>Aucun questionnement en attente</b>Tout est réglé.</div>';
    return;
  }

  var H = vues.map(function(f){
    var n = joursDepuis(f.date), niv = niveau(n);
    var puces = [];
    if (f.centre) puces.push('<span class="puce centre" title="' + ech(f.centre) + '"><b>Centre</b>' + ech(f.centre) + '</span>');
    if (f.po)     puces.push('<span class="puce"><b>PO</b>' + ech(f.po) + '</span>');
    if (f.soum)   puces.push('<span class="puce"><b>Soum.</b>' + ech(f.soum) + '</span>');
    if (f.agente) puces.push('<span class="puce"><b>Agente</b>' + ech(f.agente) + '</span>');
    if (f.dest && f.dest !== f.agente) puces.push('<span class="puce"><b>Envoy\u00e9 \u00e0</b>' + ech(f.dest) + '</span>');

    /* v6 : crayon et croix sur la ligne 1, réservés aux comptes autorisés */
    var crayon = ADMIN
      ? '<button class="mini" type="button" data-act="modif" data-cle="' + ech(f._cle) + '" ' +
        'title="Modifier cette fiche">\u270e</button>'
      : '';
    var croix = ADMIN
      ? '<button class="croix" type="button" data-act="regler" data-cle="' + ech(f._cle) + '" ' +
        'title="R\u00e9gl\u00e9 — retirer de la liste">\u00D7</button>'
      : '';

    var texteDelai = (n === 0) ? 'aujourd\u2019hui'
                               : n + ' ' + (n === 1 ? 'jour' : 'jours') + ' d\u2019attente';

    return '<div class="fiche ' + niv + '">' +
      '<div class="frang">' +
        '<span class="fcommande">' + (ech(f.commande) || 'Sans num\u00e9ro') + '</span>' +
        '<span class="fdate">Envoy\u00e9 le ' + ech(f.date || '\u2014') + '</span>' +
        crayon +
        '<span class="fespace"></span>' +
        '<span class="delai ' + niv + '">' + texteDelai + '</span>' +
        croix +
      '</div>' +
      (puces.length ? '<div class="finfos">' + puces.join('') + '</div>' : '') +
    '</div>';
  }).join('');

  $('liste').innerHTML = H;
}

$('rech').addEventListener('input', rendre);

/* ============================================================
   SECTION 24 — ACTIONS (réservées aux comptes autorisés)
   ============================================================ */
$('liste').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-act]') : null;
  if (!b || !ADMIN) return;
  var cle = b.getAttribute('data-cle'), act = b.getAttribute('data-act');
  var f = FICHES.filter(function(x){ return x._cle === cle; })[0];
  if (!f) return;

  if (act === 'regler'){
    if (!confirm('Marquer le questionnement « ' + (f.commande || cle) + ' » comme réglé ?\n\n' +
                 'Il disparaît de la liste et est classé dans les questionnements réglés.')) return;
    var copie = {};
    for (var k in f){ if (k !== '_cle') copie[k] = f[k]; }
    copie.etat = 'regle';
    copie.regleLe = aujourdhui();
    copie.reglePar = (USER && USER.email) || '';
    copie.joursAttente = joursDepuis(f.date);
    fbDb.ref('questSuiviRegles/' + cle).set(copie).then(function(){
      return fbDb.ref('questSuivis/' + cle).remove();
    }).then(charger).catch(function(err){ alert('Erreur : ' + err.message); });

  } else if (act === 'modif'){
    ouvrirBoite(f);
  }
});

}
function majBoites(){
  majBoite($('boxCentre'), $('aCentre'), '— Choisir un centre —');
  majBoite($('boxAgente'), $('aAgente'), '— Choisir —');
  majBoite($('boxDest'),   $('aDest'),   '— Choisir —');
}

function ouvrirPick(titre, liste, input, box, vide){
  PK.liste = liste; PK.cible = input; PK.box = box; PK.vide = vide;
  $('pickTitre').textContent = titre;
  $('pickRech').value = '';
  $('pickRech').style.display = (liste.length > 12) ? '' : 'none';
  remplirPick('');
  $('pick').classList.add('ouvert');
  if (liste.length > 12) setTimeout(function(){ $('pickRech').focus(); }, 60);
}
function fermerPick(){ $('pick').classList.remove('ouvert'); }

function remplirPick(filtre){
  var z = $('pickListe'), f = sansAccent(filtre.trim()), courant = (PK.cible.value || '').trim();
  z.innerHTML = '';
  var res = PK.liste.filter(function(c){ return !f || sansAccent(c).indexOf(f) !== -1; });
  if (!res.length){
    var r = document.createElement('div'); r.className = 'rien';
    r.textContent = 'Aucun résultat';
    z.appendChild(r); return;
  }
  res.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'it' + (c === courant ? ' on' : '');
    d.textContent = c;
    d.onclick = function(){
      PK.cible.value = c;
      majBoite(PK.box, PK.cible, PK.vide);
      fermerPick();
    };
    z.appendChild(d);
  });
  z.scrollTop = 0;
}

$('pickRech').addEventListener('input', function(){ remplirPick(this.value); });
$('pickFermer').addEventListener('click', fermerPick);
$('pick').addEventListener('click', function(e){ if (e.target === this) fermerPick(); });
$('pickVider').addEventListener('click', function(){
  PK.cible.value = ''; majBoite(PK.box, PK.cible, PK.vide); fermerPick();
});
$('pickLibre').addEventListener('click', function(){
  var v = prompt('Nom à inscrire :', PK.cible.value || '');
  if (v === null) return;
  PK.cible.value = v.trim();
  majBoite(PK.box, PK.cible, PK.vide);
  fermerPick();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && $('pick').classList.contains('ouvert')) fermerPick();
});

$('boxCentre').addEventListener('click', function(){
  ouvrirPick('Centre', CENTRES, $('aCentre'), $('boxCentre'), '— Choisir un centre —');
});
$('boxAgente').addEventListener('click', function(){
  ouvrirPick('Agente du service client', AGENTES, $('aAgente'), $('boxAgente'), '— Choisir —');
});
$('boxDest').addEventListener('click', function(){
  ouvrirPick('Destinataire', DESTINATAIRES, $('aDest'), $('boxDest'), '— Choisir —');
});

/* ============================================================
   SECTION 25 — AJOUT ET MODIFICATION
   ============================================================ */
var CLE_EN_COURS = null;

function cleSuivi(commande, date){
  var c = String(commande || '').replace(/[.#$\[\]\/]/g, '-').replace(/\s+/g, '_').slice(0, 40);
  return c + '__' + String(date || '').replace(/[^0-9\-]/g, '');
}

function ouvrirBoite(f){
  CLE_EN_COURS = f ? f._cle : null;
  $('boiteTitre').textContent = f ? 'Modifier le questionnement' : 'Ajouter un questionnement';
  $('fErr').textContent = '';
  $('aCommande').value = f ? (f.commande || '') : '';
  $('aDate').value     = f ? (f.date || '') : aujourdhui();
  $('aCentre').value   = f ? (f.centre || '') : '';
  $('aPO').value       = f ? (f.po || '') : '';
  $('aSoum').value     = f ? (f.soum || '') : '';
  $('aAgente').value   = f ? (f.agente || '') : '';
  $('aDest').value     = f ? (f.dest || '') : '';
  majBoites();                       // v7 : les menus déroulants suivent la fiche
  $('boiteSuppr').style.display = f ? '' : 'none';
  $('voile').classList.add('on');
  $('aCommande').focus();
}
function fermerBoite(){ $('voile').classList.remove('on'); CLE_EN_COURS = null; }

/* Suppression définitive — pour une fiche entrée par erreur seulement.
   Rien n'est conservé, contrairement au X qui classe dans les réglés. */
$('boiteSuppr').addEventListener('click', function(){
  if (!ADMIN || !fbDb || !CLE_EN_COURS) return;
  var cle = CLE_EN_COURS;
  if (!confirm('Supprimer définitivement cette fiche ?\n\n' +
               'Rien n\u2019est conservé. Pour un questionnement réglé, utilise plutôt\n' +
               'le X au bout de la ligne : il le classe dans les réglés.')) return;
  fbDb.ref('questSuivis/' + cle).remove().then(function(){
    fermerBoite(); charger();
  }).catch(function(err){ $('fErr').textContent = 'Erreur : ' + err.message; });
});

$('btnAjout').addEventListener('click', function(){ ouvrirBoite(null); });
$('boiteFermer').addEventListener('click', fermerBoite);
$('boiteAnnuler').addEventListener('click', fermerBoite);
$('voile').addEventListener('click', function(e){ if (e.target === this) fermerBoite(); });

$('boiteOK').addEventListener('click', function(){
  if (!ADMIN || !fbDb) return;
  var commande = $('aCommande').value.trim();
  var date     = $('aDate').value;
  if (!commande){ $('fErr').textContent = 'Le numéro de commande est obligatoire.'; return; }
  if (!date){ $('fErr').textContent = 'La date d\u2019envoi est obligatoire.'; return; }

  var fiche = {
    commande: commande,
    date:     date,
    ts:       Date.now(),
    centre:   $('aCentre').value.trim(),
    po:       $('aPO').value.trim(),
    soum:     $('aSoum').value.trim(),
    agente:   $('aAgente').value.trim(),
    dest:     $('aDest').value.trim(),
    etat:     'attente',
    creePar:  (USER && USER.email) || ''
  };

  var nouvelleCle = cleSuivi(commande, date);
  var b = this; b.disabled = true; b.textContent = 'Enregistrement…';

  var p = fbDb.ref('questSuivis/' + nouvelleCle).set(fiche);
  if (CLE_EN_COURS && CLE_EN_COURS !== nouvelleCle){
    var vieille = CLE_EN_COURS;
    p = p.then(function(){ return fbDb.ref('questSuivis/' + vieille).remove(); });
  }
  p.then(function(){
    b.disabled = false; b.textContent = 'Enregistrer';
    fermerBoite(); charger();
  }).catch(function(err){
    b.disabled = false; b.textContent = 'Enregistrer';
    $('fErr').textContent = 'Erreur : ' + err.message;
  });
});

/* ============================================================
   SECTION 26 — DÉMARRAGE
   La liste se rafraîchit toute seule aux 10 minutes — assez pour
   un écran laissé ouvert dans l'atelier, assez rare pour que le
   trafic Firebase reste négligeable.
   ============================================================ */
setInterval(function(){ if (USER) charger(); }, 600000);
</script>
