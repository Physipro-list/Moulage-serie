<style>
/* ============================================================
   SECTION 1 — BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bleu:#0d4f75; --bleu-clair:#127bb5; --fond:#eef2f6; --trait:#d3dde5;
  --texte:#1c2b36; --gris:#6a7c89; --rouge:#b3261e; --vert:#1a8a4a;
  --navy:#04152c; --azur:#4a8ef5; --or:#c9a14a;
}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--fond);
  color:var(--texte); font-size:16px; line-height:1.45}

/* ============================================================
   SECTION 2 — EN-TÊTE ET RECHERCHE
   ============================================================ */
.haut{position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.12)}
.topbar{background:linear-gradient(90deg,var(--navy) 0%, var(--azur) 100%);
  border-bottom:3px solid var(--or); color:#fff; padding:9px 18px; text-align:center}
.topbar h1{font-size:19px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; line-height:1.15}
@media(max-width:520px){.topbar h1{font-size:15px; letter-spacing:.4px}}
/* v22 — logo cliquable (ouvre le menu de PhysiPro_Nav.js) + identité */
.topbar{display:flex; align-items:center; gap:12px; text-align:left}
.topbar h1{flex:1; text-align:center}
#logoFlipContainer{flex:0 0 auto; cursor:pointer; line-height:0}
#logoFlipContainer img{height:40px; width:auto; display:block}
.topbar .qui{flex:0 0 auto; font-size:11.5px; font-weight:600; opacity:.75; white-space:nowrap}
@media(max-width:600px){.topbar .qui{display:none} #logoFlipContainer img{height:32px}}
/* v23 — flèche de retour, visible seulement sur téléphone/tablette */
#retourAccueil{display:none; flex:0 0 auto; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:10px; text-decoration:none; color:#fff;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
  font-size:20px; line-height:1}
#retourAccueil:active{background:rgba(255,255,255,.30)}
@media(max-width:980px){#retourAccueil{display:flex}}
/* écran affiché tant que Firebase n'a pas confirmé la session */
#garde{position:fixed; inset:0; z-index:900; background:var(--fond); display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  color:var(--gris); font-size:14px}
#garde.parti{display:none}
#garde .roue{width:34px; height:34px; border:3px solid var(--trait);
  border-top-color:var(--bleu-clair); border-radius:50%; animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
/* recherche logée dans l'en-tête du panneau Matériaux */
.champRech{position:relative; flex:1; max-width:340px; margin-left:auto}
.champRech input{width:100%; padding:6px 30px 6px 29px; font-size:13.5px; font-family:inherit;
  color:var(--texte); border:1px solid var(--trait); border-radius:7px; background:#fff}
.champRech input:focus{outline:none; border-color:var(--bleu-clair); box-shadow:0 0 0 3px rgba(18,123,181,.14)}
.champRech .loupe{position:absolute; left:9px; top:50%; transform:translateY(-50%);
  font-size:12px; color:var(--gris); pointer-events:none}
.champRech .vider{position:absolute; right:5px; top:50%; transform:translateY(-50%);
  background:#eef2f6; border:0; width:20px; height:20px; border-radius:50%; font-size:13px;
  color:var(--gris); cursor:pointer; line-height:1; display:none}
.champRech .vider.on{display:block}
.compte{font-size:11.5px; color:var(--gris); font-weight:600; white-space:nowrap}

/* ============================================================
   SECTION 3 — DEUX COLONNES
   ============================================================ */
.wrap{max-width:1220px; margin:0 auto; padding:10px 12px 12px;
  display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.panneau{background:#fff; border:1px solid var(--trait); border-radius:10px;
  display:flex; flex-direction:column; overflow:hidden}
.panneau>h2{flex:0 0 auto; font-size:12px; text-transform:uppercase; letter-spacing:.7px;
  font-weight:700; color:var(--bleu); background:#f4f8fb; padding:6px 10px;
  border-bottom:1px solid var(--trait); display:flex; align-items:center; gap:9px}
.panneau>h2 .n{font-size:11px; background:#e0edf6; border-radius:20px; padding:1px 8px}

/* chaque colonne a sa propre barre de défilement */
.colG, .colD{position:sticky; top:56px; height:calc(100vh - 72px);
  display:flex; flex-direction:column; min-height:0}
/* la piste reste visible en tout temps, liste vide ou non */
.defile{flex:1; min-height:0; overflow-y:scroll; -webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable; scrollbar-width:thin; scrollbar-color:#c2d2de #f4f7fa}
.defile::-webkit-scrollbar{width:11px; background:#f4f7fa}
.defile::-webkit-scrollbar-track{background:#f4f7fa; border-left:1px solid #e6edf3}
.defile::-webkit-scrollbar-thumb{background:#c2d2de; border-radius:20px;
  border:2px solid #f4f7fa; min-height:40px}
.defile::-webkit-scrollbar-thumb:hover{background:#a8bdcd}
@media(max-width:980px){
  .colG, .colD{position:static; height:auto; display:block}
  .defile{overflow:visible; scrollbar-gutter:auto}
}

/* ============================================================
   SECTION 4 — LISTE DES MATÉRIAUX
   ============================================================ */
.ligne{display:grid; grid-template-columns:96px 1fr 74px 92px; align-items:stretch;
  border-bottom:1px solid #eef2f6; cursor:pointer}
.ligne>*{border-right:1px solid #eef2f6; display:flex; align-items:center}
.ligne>*:last-child{border-right:0}
.ligne:last-child{border-bottom:0}
.ligne:hover{background:#f5fafd}
.ligne.sel{background:#e6f2fb; box-shadow:inset 4px 0 0 var(--bleu-clair)}
.ligne .code{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; font-weight:700;
  color:var(--bleu); padding:5px 9px}
.ligne .desc{font-size:12.5px; padding:5px 10px; min-width:0; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:22px}
.fam{color:var(--bleu-clair); font-weight:600; font-size:11px; padding:5px 9px;
  white-space:nowrap; justify-content:center}
.dims{color:var(--gris); font-family:ui-monospace,Consolas,monospace;
  font-size:11px; font-weight:600; white-space:nowrap;
  padding:5px 10px; justify-content:flex-end}
.ligne mark{background:#ffe680; color:inherit; border-radius:3px; padding:0 1px}
.rien{padding:34px 18px; text-align:center; color:var(--gris); font-size:15px}
@media(max-width:600px){
  .ligne{grid-template-columns:82px 1fr 72px}
  .ligne .code{font-size:11px; padding:5px 7px}
  .ligne .desc{font-size:12px; padding:5px 8px}
  .fam{display:none}
  .dims{font-size:10.5px; padding:5px 8px}
}

/* ============================================================
   SECTION 5 — LISTE CHOISIE (panier)
   ============================================================ */
.panier{min-height:0}
.pLigne{display:grid; grid-template-columns:96px 1fr 74px 92px auto 24px; align-items:stretch;
  border-bottom:1px solid #eef2f6}
.pLigne>*{border-right:1px solid #eef2f6; display:flex; align-items:center}
.pLigne>*:last-child{border-right:0}
.pLigne:last-child{border-bottom:0}
.pLigne:hover{background:#f5fafd}
.pLigne .c{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; font-weight:700;
  color:var(--bleu); padding:5px 9px}
.pLigne .d{font-size:12.5px; padding:5px 10px; min-width:0; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:22px}
.pLigne .qte{white-space:nowrap; padding:5px 7px; justify-content:center}
.pLigne .qte .val{display:inline-flex; align-items:baseline; gap:5px;
  font-family:ui-monospace,Consolas,monospace; font-size:12px; font-weight:700;
  color:var(--bleu); background:#e8f2f9; border:1px solid #c5ddec; border-radius:4px;
  padding:2px 8px; cursor:pointer}
.pLigne .qte .val .etq{font-family:"Segoe UI",Roboto,Arial,sans-serif; font-size:10px;
  font-weight:700; letter-spacing:.4px; color:var(--gris)}
.pLigne .qte .val:hover{background:#d8e9f5; border-color:var(--bleu-clair)}
.pLigne .qte .val.creux{color:#9fb2c0; background:#f4f7fa; border-color:var(--trait)}
.pLigne .x{background:none; border:0; color:var(--rouge); font-size:17px;
  cursor:pointer; line-height:1; padding:0; justify-content:center}
@media(max-width:600px){
  .pLigne{grid-template-columns:82px 1fr auto 24px}
  .pLigne .c{font-size:11px; padding:5px 7px}
  .pLigne .d{font-size:12px; padding:5px 8px}
  .pLigne .fam, .pLigne .dims{display:none}
}
.pVide{padding:22px 14px; text-align:center; color:#9fb2c0; font-size:13.5px}
.pPied{flex:0 0 auto; display:flex; gap:7px; padding:10px 11px;
  border-top:1px solid var(--trait); background:#f7fafc}
.pPied button{flex:1; border:0; border-radius:7px; padding:10px; font-size:14px;
  font-weight:600; font-family:inherit; cursor:pointer}
.bCopier{color:#fff; background:linear-gradient(90deg,var(--navy) 0%, var(--azur) 100%);
  border-top:2px solid var(--or)}
.bVider{background:#fff; color:var(--rouge); border:1px solid #e0c4c1; flex:0 0 auto}

/* ============================================================
   SECTION 6 — CALCULATEUR DE FEUILLE
   ============================================================ */
.ovl{position:fixed; inset:0; background:rgba(10,20,28,.55); z-index:150; display:none;
  align-items:center; justify-content:center; padding:16px}
.ovl.ouvert{display:flex}
.ovlBoite{background:#fff; border-radius:12px; width:100%; max-width:430px; max-height:88vh;
  overflow:auto; box-shadow:0 14px 44px rgba(0,0,0,.32)}
.ovlTete{display:flex; align-items:center; gap:8px; padding:11px 13px;
  background:linear-gradient(90deg,var(--navy) 0%, var(--azur) 100%); border-bottom:2px solid var(--or)}
.ovlTete .t{color:#fff; font-weight:700; font-size:15px; flex:1}
.ovlTete button{background:rgba(255,255,255,.2); color:#fff; border:0; width:32px; height:32px;
  border-radius:50%; font-size:19px; cursor:pointer; line-height:1}
.calc{padding:16px}
.calc .mat{font-family:ui-monospace,Consolas,monospace; font-size:15px; font-weight:700;
  color:var(--bleu); margin-bottom:3px}
.calc .nom{font-size:13.5px; color:var(--texte); line-height:1.35; margin-bottom:4px}
.calc .dim{font-size:12.5px; color:var(--gris); padding-bottom:13px;
  border-bottom:1px solid var(--trait); margin-bottom:14px}
.calc .dim b{color:var(--bleu)}

  text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px}
.saisie{position:relative}
.saisie input{width:100%; padding:14px 52px 14px 14px; font-size:22px; font-weight:700;
  font-family:ui-monospace,Consolas,monospace; border:2px solid var(--trait); border-radius:9px}
.saisie input:focus{outline:none; border-color:var(--bleu-clair); box-shadow:0 0 0 4px rgba(18,123,181,.14)}
.saisie .u{position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:14px; font-weight:700; color:var(--gris)}
.jauge{height:12px; background:#eef2f6; border-radius:20px; overflow:hidden; margin:14px 0 6px}

.calc .det{display:flex; justify-content:space-between; font-size:12px; color:var(--gris)}
.res{margin-top:14px; background:#f4f8fb; border:1px solid var(--trait); border-radius:9px; padding:13px}
.res .lbl{font-size:11px; font-weight:700; color:var(--gris); text-transform:uppercase;
  letter-spacing:.5px; text-align:center}
.res .val{font-size:30px; font-weight:800; color:var(--navy);
  font-family:ui-monospace,Consolas,monospace; text-align:center; line-height:1.25}
.res .sous{font-size:12px; color:var(--gris); text-align:center; margin-bottom:10px}
.bascule{display:flex; gap:6px}
.bascule button{flex:1; background:#fff; color:var(--gris); border:1px solid var(--trait);
  border-radius:7px; padding:8px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer}
.bascule button.on{background:var(--bleu); color:#fff; border-color:var(--bleu)}
.ovlPied{display:flex; gap:8px; padding:12px 16px 16px}
.ovlPied button{border:0; border-radius:8px; padding:13px; font-size:15px; font-weight:600;
  font-family:inherit; cursor:pointer}
.ovlPied .ok{flex:1; color:#fff; background:var(--vert)}
.ovlPied .ok:hover{background:#146b39}
.ovlPied .annul{background:#fff; color:var(--gris); border:1px solid var(--trait)}
.ovlPied .annul:hover{background:#f0f4f8}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(14px);
  background:#12354f; color:#fff; padding:11px 20px; border-radius:9px; font-size:14.5px;
  box-shadow:0 6px 22px rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:.2s; z-index:200}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
</style>

/* ============================================================
   SECTION 21 — PRÉPARATION
   ============================================================ */
function $(id){ return document.getElementById(id); }

/* toutes les lignes URÉTHANE portent la mention (Néocor) */
function famille(desc){
  return /URÉTHANE/i.test(desc) ? 'Néocor' : '';
}

function decouper(s, dep){
  var i = s.indexOf(' - ');
  var code = (i === -1) ? s.trim() : s.slice(0, i).trim();
  var desc = (i === -1) ? ''       : s.slice(i + 3).trim();
  var fam  = famille(desc);
  return { code: code, desc: desc, dep: dep, fam: fam,
           rech: (code + ' ' + desc + ' ' + fam).toLowerCase(),
           feuille: FEUILLES[code] || null };
}
var TOUT = MAT_ATELIER.map(function(m){ return decouper(m, 'atelier'); });

var PANIER = [];            // {code, desc, qte}
var CALC = null;            // matériau en cours de calcul
var MODE_FRAC = false;

function toast(t){
  var z = $('toast');
  z.textContent = t; z.classList.add('on');
  clearTimeout(z._t);
  z._t = setTimeout(function(){ z.classList.remove('on'); }, 1700);
}

/* ============================================================
   SECTION 22 — LISTE ET SURLIGNAGE
   ============================================================ */
function echapper(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function surligner(texte, f){
  var t = echapper(texte);
  if (!f) return t;
  var i = texte.toLowerCase().indexOf(f);
  if (i === -1) return t;
  return echapper(texte.slice(0, i)) + '<mark>' + echapper(texte.slice(i, i + f.length)) +
         '</mark>' + echapper(texte.slice(i + f.length));
}

/* « URÉTHANE VF-40 ¼ [22×24] » → nom + dimensions séparées */
function fendre(desc){
  var m = desc.match(/^(.*?)\s*(\[[^\]]*\])\s*$/);
  return m ? { nom: m[1], dims: m[2] } : { nom: desc, dims: '' };
}
function descHTML(desc, f){ return surligner(fendre(desc).nom, f); }
function famHTML(desc, f){
  var fam = famille(desc);
  return fam ? '(' + surligner(fam, f) + ')' : '';
}
function dimsHTML(desc, f){
  var d = fendre(desc);
  return d.dims ? surligner(d.dims, f) : '';
}

function afficher(){
  var f = $('rech').value.trim().toLowerCase();
  var z = $('liste');
  z.innerHTML = '';

  var res = TOUT.filter(function(m){ return !f || m.rech.indexOf(f) !== -1; });

  $('compte').textContent = res.length + ' / ' + TOUT.length;
  $('vider').classList.toggle('on', !!f);

  if (!res.length){
    z.innerHTML = '<div class="rien">Aucun matériau ne correspond à cette recherche.</div>';
    return;
  }

  res.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'ligne';

    var c = document.createElement('span');
    c.className = 'code'; c.innerHTML = surligner(m.code, f);

    var t = document.createElement('span');
    t.className = 'desc'; t.innerHTML = descHTML(m.desc, f); t.title = m.desc;

    var fm = document.createElement('span');
    fm.className = 'fam'; fm.innerHTML = famHTML(m.desc, f);

    var dm = document.createElement('span');
    dm.className = 'dims'; dm.innerHTML = dimsHTML(m.desc, f);

    d.appendChild(c); d.appendChild(t); d.appendChild(fm); d.appendChild(dm);
    d.onclick = function(){
      if (m.feuille){                       // feuille : la fenêtre de calcul s'ouvre
        ouvrirCalc(m);
      } else {                              // sans feuille : ajout direct
        ajouter(m.code, m.desc, '');
        d.classList.add('sel');
        setTimeout(function(){ d.classList.remove('sel'); }, 450);
      }
    };
    z.appendChild(d);
  });
}

/* ============================================================
   SECTION 23 — MA LISTE
   ============================================================ */
function ajouter(code, desc, qte, pi2){
  for (var i = 0; i < PANIER.length; i++){
    if (PANIER[i].code === code){
      if (qte) {
        PANIER[i].qte = qte; PANIER[i].pi2 = pi2 || 0;
        rendrePanier(); toast('Quantité mise à jour : ' + code); return;
      }
      toast(code + ' est déjà dans la liste'); return;
    }
  }
  PANIER.push({ code: code, desc: desc, qte: qte || '', pi2: pi2 || 0 });
  rendrePanier();
  toast('Ajouté : ' + code);
}

function trouverMat(code){
  for (var i = 0; i < TOUT.length; i++) if (TOUT[i].code === code) return TOUT[i];
  return null;
}

function rendrePanier(){
  var z = $('panier');
  z.innerHTML = '';
  $('nPanier').textContent = PANIER.length;

  if (!PANIER.length){
    z.innerHTML = '<div class="pVide">Touche un matériau à gauche pour l\'ajouter ici.</div>';
    return;
  }
  PANIER.forEach(function(m, i){
    var src = trouverMat(m.code);
    var r = document.createElement('div'); r.className = 'pLigne';

    var c = document.createElement('span');
    c.className = 'c'; c.textContent = m.code;

    var d = document.createElement('span');
    d.className = 'd'; d.innerHTML = descHTML(m.desc, ''); d.title = m.desc;

    var fm = document.createElement('span');
    fm.className = 'fam'; fm.innerHTML = famHTML(m.desc, '');

    var dm = document.createElement('span');
    dm.className = 'dims'; dm.innerHTML = dimsHTML(m.desc, '');

    var q = document.createElement('span');
    q.className = 'qte';
    var val = document.createElement('span');
    val.className = 'val' + (m.qte ? '' : ' creux');
    val.innerHTML = '<span class="etq">QTÉ&nbsp;:</span>' + echapper(m.qte || '—');
    if (src && src.feuille){
      val.title = 'Quantité de feuille — cliquer pour modifier';
      val.onclick = function(){ ouvrirCalc(src, i); };
    } else {
      val.style.cursor = 'default';
    }
    q.appendChild(val);

    var x = document.createElement('button');
    x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.title = 'Retirer';
    x.onclick = function(){ PANIER.splice(i, 1); rendrePanier(); };

    r.appendChild(c); r.appendChild(d); r.appendChild(fm); r.appendChild(dm);
    r.appendChild(q); r.appendChild(x);
    z.appendChild(r);
  });
}

function texteListe(){
  return PANIER.map(function(m){
    return m.code + '\t' + m.desc + (m.qte ? '\tQTÉ : ' + m.qte : '');
  }).join('\n');
}

$('copier').addEventListener('click', function(){
  if (!PANIER.length){ toast('La liste est vide'); return; }
  var t = texteListe(), b = this;
  function fini(){
    b.textContent = '✓ Copié'; toast(PANIER.length + ' matériau(x) copié(s)');
    setTimeout(function(){ b.textContent = 'Copier la liste'; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fini).catch(secours);
  } else secours();
  function secours(){
    var a = document.createElement('textarea');
    a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); fini(); } catch(e){ alert(t); }
    a.remove();
  }
});
$('viderPanier').addEventListener('click', function(){
  if (!PANIER.length) return;
  if (!confirm('Vider la liste ?')) return;
  PANIER = []; rendrePanier();
  if (CALC_IDX >= 0) fermerCalc();
});

   ============================================================ */
function trouverFrac(dec){
  if (dec <= 0.01) return '0';
  var fracs = [[1,8],[1,6],[1,5],[1,4],[1,3],[3,8],[2,5],[1,2],[3,5],[5,8],[2,3],[3,4],[4,5],[5,6],[7,8]];
  for (var i = 0; i < fracs.length; i++){
    if (Math.abs(dec - fracs[i][0] / fracs[i][1]) < 0.02) return fracs[i][0] + '/' + fracs[i][1];
  }
  var bn = 1, bd = 2, best = 999;
  for (var d = 2; d <= 16; d++){
    var n = Math.round(dec * d);
    if (n > 0 && n < d){
      var diff = Math.abs(dec - n / d);
      if (diff < best){ best = diff; bn = n; bd = d; }
    }
  }
  return (best < 0.03) ? bn + '/' + bd : dec.toFixed(2);
}
function decEnFrac(dec){
  if (dec <= 0) return '0';
  var ent = Math.floor(dec), reste = dec - ent;
  if (reste < 0.01) return ent.toString();
  var f = trouverFrac(reste);
  return ent > 0 ? ent + ' ' + f : f;
}

var CALC_IDX = -1;        // >= 0 : on modifie une ligne déjà dans la liste

function ouvrirCalc(m, idx){
  CALC = m;
  CALC_IDX = (typeof idx === 'number') ? idx : -1;
  var f = m.feuille, tot = f[0] * f[1];
  var depart = 0;
  if (CALC_IDX >= 0){                       // repartir de la quantité déjà inscrite
    var q = parseFloat(PANIER[CALC_IDX].pi2);
    if (!isNaN(q)) depart = q;
  }
  $('calc').innerHTML =
    '<div class="calc">' +
      '<div class="mat">' + echapper(m.code) + '</div>' +
      '<div class="nom">' + echapper(m.desc) + '</div>' +
      '<div class="dim">Feuille <b>' + f[0] + '″ × ' + f[1] + '″</b> · ' + tot + ' po² · ' +
        (tot / 144).toFixed(2) + ' pi² au total</div>' +
      '<label>Pieds carrés à utiliser</label>' +
      '<div class="saisie">' +
        '<input type="number" id="cIn" step="0.01" min="0" value="' + depart + '">' +
        '<span class="u">pi²</span>' +
      '</div>' +
      '<div class="jauge"><i id="cBar"></i></div>' +
      '<div class="det"><span id="cUse">—</span><span id="cPct">0 %</span><span id="cRest">—</span></div>' +
      '<div class="res">' +
        '<div class="lbl">Quantité de feuille</div>' +
        '<div class="val" id="cQte">—</div>' +
        '<div class="sous" id="cSous">&nbsp;</div>' +
        '<div class="bascule">' +
          '<button type="button" id="cDec">Décimal</button>' +
          '<button type="button" id="cFrac">Fraction</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="ovlPied">' +
      '<button type="button" class="annul" id="cAnnul">Annuler</button>' +
      '<button type="button" class="ok" id="cAdd">' +
        (CALC_IDX >= 0 ? 'Mettre à jour' : 'OK — ajouter à ma liste') + '</button>' +
    '</div>';

  $('cIn').addEventListener('input', calculer);
  $('cIn').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); $('cAdd').click(); }
  });
  $('cAnnul').addEventListener('click', fermerCalc);
  $('cDec').addEventListener('click', function(){ MODE_FRAC = false; calculer(); });
  $('cFrac').addEventListener('click', function(){ MODE_FRAC = true; calculer(); });
  $('cAdd').addEventListener('click', function(){
    var q = quantite(), pi2 = parseFloat($('cIn').value) || 0;
    if (!q.val){ toast('Entre les pieds carrés d\'abord'); return; }
    if (CALC_IDX >= 0 && PANIER[CALC_IDX]){
      PANIER[CALC_IDX].qte = q.txt;
      PANIER[CALC_IDX].pi2 = pi2;
      rendrePanier();
      toast('Quantité mise à jour : ' + CALC.code);
    } else {
      ajouter(CALC.code, CALC.desc, q.txt, pi2);
    }
    fermerCalc();
  });
  calculer();
  $('ovl').classList.add('ouvert');
  setTimeout(function(){ $('cIn').focus(); $('cIn').select(); }, 80);
}

function fermerCalc(){
  $('ovl').classList.remove('ouvert');
  CALC = null; CALC_IDX = -1;
}
$('ovlFermer').addEventListener('click', fermerCalc);
$('ovl').addEventListener('click', function(e){ if (e.target === this) fermerCalc(); });

function quantite(){
  if (!CALC) return { val: 0, txt: '—' };
  var pi2 = parseFloat($('cIn').value) || 0;
  var tot = CALC.feuille[0] * CALC.feuille[1];
  var frac = (pi2 * 144) / tot;
  return { val: frac, txt: MODE_FRAC ? decEnFrac(frac) : (Math.round(frac * 100) / 100).toFixed(2) };
}

function calculer(){
  if (!CALC) return;
  var pi2 = parseFloat($('cIn').value) || 0;
  var tot = CALC.feuille[0] * CALC.feuille[1];
  var util = pi2 * 144, reste = Math.max(0, tot - util);
  var pct = Math.min(100, (util / tot) * 100);

  var bar = $('cBar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 90 ? 'linear-gradient(90deg,#ef4444,#dc2626)'
                       : pct > 70 ? 'linear-gradient(90deg,#f59e0b,#f97316)'
                                  : 'linear-gradient(90deg,#22c55e,#3b82f6)';
  $('cPct').textContent  = pct.toFixed(1) + ' %';
  $('cUse').textContent  = util.toFixed(0) + ' po² utilisés';
  $('cRest').textContent = reste.toFixed(0) + ' po² restants';

  var q = quantite();
  $('cQte').textContent = q.val > 0 ? q.txt : '—';
  $('cSous').textContent = q.val > 0
    ? (MODE_FRAC ? 'de feuille (fraction)' : 'de feuille (décimal)') : '\u00a0';
  $('cDec').classList.toggle('on', !MODE_FRAC);
  $('cFrac').classList.toggle('on', MODE_FRAC);
}
