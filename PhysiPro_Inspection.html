<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysiPro — Inspection & Couture</title>
<style>
:root{--bg-main:#0f172a;--bg-card:#1e293b;--bg-input:#0f172a;--border:#334155;--gold:#c9a227;--gold-light:#fbbf24;--text:#e2e8f0;--text-muted:#94a3b8;--success:#22c55e;--danger:#ef4444;--info:#3b82f6;--purple:#a855f7;--teal:#14b8a6;--tbl-zoom:11px;}
*{margin:0;padding:0;box-sizing:border-box;}
/* Force ALL selects and options to be dark bg + bright text */
select:not(.tbl-select){color-scheme:dark;background-color:#1e293b !important;color:#e2e8f0 !important;}
select.tbl-select{color-scheme:dark;}
select option{background:#1e293b !important;color:#e2e8f0 !important;font-size:12px;padding:4px 8px;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg-main);color:var(--text);min-height:100vh;font-size:12px;}
.topbar{width:100%;min-height:60px;padding:4px 16px 6px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,#04152c 0%,#4a8ef5 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.45);position:sticky;top:0;z-index:100;}
.tb-left{display:flex;align-items:center;gap:10px;}
.logo-main{display:flex;flex-direction:column;align-items:center;}
.logo-top-fixed img{height:34px;width:auto;filter:brightness(1.1) drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.logo-bottom-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 3px rgba(0,0,0,.6);margin-top:-3px;letter-spacing:.5px;}
.tb-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
.top-title{font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fdfdfd;text-shadow:0 2px 3px rgba(0,0,0,.85);white-space:nowrap;}
.tb-right{display:flex;align-items:center;gap:6px;}
.tb-right a,.tb-right span.tb-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:10px;padding:3px 8px;border:1px solid rgba(255,255,255,.2);border-radius:4px;transition:all .2s;cursor:pointer;}
.tb-right a:hover,.tb-right span.tb-link:hover{background:rgba(255,255,255,.15);color:#fff;}
.user-status{display:flex;align-items:center;gap:5px;}
.status-dot{width:8px;height:8px;border-radius:50%;}
.user-name{font-size:10px;color:rgba(255,255,255,.9);font-weight:600;}
.header-links a:hover{color:var(--gold-light);border-color:var(--gold);}
.tabs{display:flex;align-items:center;border-bottom:2px solid var(--border);background:var(--bg-card);}
.tabs-left{display:flex;gap:0;} .tabs-right{margin-left:auto;padding:0 10px;}
.tabs-right input{background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;width:180px;}
.tabs-right input:focus{outline:none;border-color:var(--gold);}
.tab{padding:5px 12px;cursor:pointer;font-size:11px;font-weight:700;color:rgba(255,255,255,.6);border-bottom:2px solid transparent;transition:all .2s;user-select:none;}
.tab:hover{color:#fff;background:rgba(255,255,255,.08);}
.tab.active-insp{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1);}
.tab.active-cout{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1);}
.tab.active-stats{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1);}
.content{display:none;padding:6px 8px 8px;} .content.active{display:block;}
.entry-bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:linear-gradient(to bottom,#04152c 0%,#4a8ef5 100%);border:none;border-radius:6px 6px 0 0;flex-wrap:wrap;box-shadow:inset 0 1px 2px rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.45);}
.entry-bar label{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}
.entry-bar input[type="text"]{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;width:160px;}
.entry-bar input[type="text"]::placeholder{color:rgba(255,255,255,.5);}
.entry-bar input[type="text"]:focus{outline:none;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18);}
.entry-bar .divider{width:1px;height:20px;background:rgba(255,255,255,.2);flex-shrink:0;}
.entry-bar .count{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap;} .entry-bar .count strong{color:#fff;}
.date-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.month-select{background:rgba(255,255,255,.12) !important;border:1px solid rgba(255,255,255,.2) !important;color:#fff !important;font-weight:700;font-size:10px;padding:2px 6px;border-radius:4px;cursor:pointer;}
.month-select:focus{outline:1px solid rgba(255,255,255,.4);}
.month-select option{background:#0f172a !important;color:#fbbf24 !important;font-weight:700;font-size:11px;padding:4px 8px;}
.btn{padding:4px 10px;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-add{background:linear-gradient(to bottom,#22c55e,#15803d);color:white;}
.btn-danger{background:linear-gradient(to bottom,#ef4444,#dc2626);color:white;}
.btn-info{background:linear-gradient(to bottom,#3b82f6,#2563eb);color:white;}
.btn-sm{padding:2px 6px;font-size:9px;}
.col-gear-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:3px 7px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:700;transition:all .2s;white-space:nowrap;}
.col-gear-btn:hover{border-color:#fff;background:rgba(255,255,255,.2);}
.zoom-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:9px;font-weight:700;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);border-radius:3px;cursor:pointer;transition:all .2s;user-select:none;}
.zoom-btn:hover{border-color:var(--gold);color:var(--gold-light);background:rgba(255,255,255,.06);}
.btn-sep{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:3px 8px;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-sep:hover{border-color:var(--gold);color:var(--gold-light);}
.data-table-wrap{border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;overflow:auto;max-height:calc(100vh - 140px);}
.data-table{border-collapse:collapse;font-size:var(--tbl-zoom);table-layout:fixed;}
.data-table thead{position:sticky;top:0;z-index:5;}
.data-table th{background:linear-gradient(to bottom,#04152c,#4a8ef5);color:var(--gold-light);padding:4px 3px;text-align:left;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--gold);border-right:1px solid rgba(255,255,255,.12);white-space:nowrap;overflow:hidden;user-select:none;position:relative;}
.data-table th:last-child{border-right:none;}
.resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:6;background:rgba(59,130,246,.25);transition:background .15s;border-radius:1px;}
.resize-handle:hover,.resize-handle.active{background:rgba(59,130,246,.7);}
body.col-resizing{cursor:col-resize!important;user-select:none!important;}
body.col-resizing *{cursor:col-resize!important;}

.data-table td{padding:3px 3px;border-bottom:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.08);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--tbl-zoom);}
.data-table td:last-child{border-right:none;}
.data-table tr:hover{background:rgba(255,255,255,.03);}
.data-table tr.date-row{background:rgba(251,191,36,.08);}
.data-table tr.date-row td{color:var(--gold-light);font-weight:700;font-size:var(--tbl-zoom);padding:2px 3px;}
.data-table tr.error-row{background:rgba(239,68,68,.06);}
.cell-bon{font-weight:700;color:var(--info);font-family:'Consolas',monospace;font-size:var(--tbl-zoom);text-align:center;}
.cell-nom{font-weight:600;} .cell-qty{text-align:center;font-weight:700;}
.cell-item{color:var(--purple);font-weight:600;text-align:center;} .cell-client{color:var(--teal);font-weight:600;text-align:center;}
.cell-insp{color:var(--gold-light);text-align:center;} .cell-err{text-align:center;}
.tbl-select{background-color:inherit !important;background:inherit !important;border:none;color:inherit;font-size:var(--tbl-zoom);cursor:pointer;max-width:100%;padding:0 2px;width:100%;font-weight:600;font-family:inherit;-webkit-appearance:none;-moz-appearance:none;appearance:none;outline:none;box-shadow:none;-webkit-text-fill-color:inherit;}
.tbl-select:focus{outline:none;background:inherit !important;}
.tbl-select option{background:#1e293b;color:#e2e8f0;font-size:11px;padding:3px;}
.tbl-input{width:100%;background:inherit;border:none;color:inherit;font-size:var(--tbl-zoom);padding:0;border-radius:0;outline:none;box-shadow:none;}
.tbl-input:focus{outline:none;background:inherit;}
.th-gear{cursor:pointer;font-size:9px;opacity:.4;transition:opacity .2s;margin-left:1px;} .th-gear:hover{opacity:1;}
.gear-icon{cursor:pointer;font-size:11px;opacity:.4;transition:opacity .2s;display:inline-block;margin-left:2px;vertical-align:middle;} .gear-icon:hover{opacity:1;}
.err-badge{display:inline-block;padding:1px 4px;border-radius:3px;font-size:var(--tbl-zoom);font-weight:800;cursor:pointer;user-select:none;}
.err-badge.err-oui{background:rgba(239,68,68,.2);color:var(--danger);border:1px solid var(--danger);}
.err-badge.err-non{background:rgba(255,255,255,.03);color:var(--text-muted);border:1px solid transparent;}
.err-badge:hover{filter:brightness(1.3);}
.status-badge{font-size:var(--tbl-zoom);padding:2px 4px;border-radius:3px;cursor:pointer;font-weight:700;color:white;display:inline-block;}
/* Column panel */
.col-panel{display:none;position:absolute;top:100%;right:0;background:var(--bg-card);border:2px solid var(--teal);border-radius:6px;padding:0;min-width:220px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.5);animation:modalIn .15s ease;}
.col-panel.show{display:block;}
.col-panel-h{padding:6px 10px;font-size:10px;font-weight:800;color:var(--teal);background:rgba(20,184,166,.08);border-bottom:1px solid rgba(20,184,166,.2);display:flex;justify-content:space-between;align-items:center;}
.col-panel-body{padding:4px 0;max-height:300px;overflow-y:auto;}
.col-row{display:flex;align-items:center;gap:4px;padding:3px 10px;transition:background .15s;font-size:11px;}
.col-row:hover{background:rgba(255,255,255,.04);}


.col-row label{flex:1;cursor:pointer;display:flex;align-items:center;gap:4px;}
.col-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--teal);cursor:pointer;}
.col-row .col-lbl{font-weight:600;}
.col-panel-f{padding:4px 10px;border-top:1px solid var(--border);text-align:right;}
@keyframes modalIn{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
/* Stats */
.stats-toggle{display:flex;gap:0;margin-bottom:6px;}
.stats-toggle-btn{padding:7px 20px;font-size:11px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:var(--bg-card);color:var(--text-muted);transition:all .2s;user-select:none;}
.stats-toggle-btn:first-child{border-radius:6px 0 0 6px;}
.stats-toggle-btn:last-child{border-radius:0 6px 6px 0;}
.stats-toggle-btn.active-atelier{background:rgba(20,184,166,.15);border-color:var(--teal);color:var(--teal);}
.stats-toggle-btn.active-couture{background:rgba(168,85,247,.15);border-color:var(--purple);color:var(--purple);}
.stats-bar{display:flex;gap:6px;align-items:center;padding:5px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;margin-bottom:6px;flex-wrap:wrap;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:700px;}@media(max-width:900px){.stats-grid{grid-template-columns:1fr;}}
.c-card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.c-card-h{padding:4px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;}
.c-card-h.gold{background:rgba(251,191,36,.08);color:var(--gold-light);border-color:rgba(251,191,36,.2);}
.c-card-h.red{background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.2);}
.c-card-h.purple{background:rgba(168,85,247,.08);color:var(--purple);border-color:rgba(168,85,247,.2);}
.c-card-h.blue{background:rgba(59,130,246,.08);color:var(--info);border-color:rgba(59,130,246,.2);}
.resume-split{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:700px;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--bg-card);margin-top:6px;}
.resume-split .resume-weeks{border-right:1px solid var(--border);}
.resume-split .resume-days{min-width:0;}
.resume-split .c-tbl tr.week-clickable{cursor:pointer;transition:background .15s;}
.resume-split .c-tbl tr.week-clickable:hover{background:rgba(59,130,246,.12);}
.resume-split .c-tbl tr.week-clickable.selected{background:rgba(59,130,246,.18);}
.c-tbl{width:100%;border-collapse:collapse;font-size:10px;}
.c-tbl th{padding:2px 6px;text-align:left;font-weight:700;color:var(--text-muted);font-size:9px;background:rgba(0,0,0,.15);border-bottom:1px solid rgba(255,255,255,.05);}
.c-tbl td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.02);}
.c-tbl tr:last-child{background:rgba(251,191,36,.08);font-weight:700;}
.c-tbl tr:last-child td{border-top:1px solid var(--gold);}
.c-tbl .n{text-align:center;font-weight:700;} .c-tbl .p{text-align:center;font-size:9px;}
.err-filter-bar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:rgba(239,68,68,.04);border-bottom:1px solid rgba(239,68,68,.1);}
.err-filter-bar label{font-size:9px;font-weight:700;color:var(--danger);}
.err-filter-bar select{background:#1e293b;border:1px solid rgba(239,68,68,.3);color:#e2e8f0;padding:3px 8px;border-radius:3px;font-size:11px;min-width:130px;font-weight:600;}
.err-filter-bar select option{background:#1e293b;color:#e2e8f0;font-size:11px;}
.err-filter-bar .ct{font-size:9px;color:var(--text-muted);margin-left:auto;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg-card);border:2px solid var(--gold);border-radius:10px;padding:0;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;animation:modalIn .2s ease;}
.modal-header{background:linear-gradient(to right,#334155,#1e293b);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gold);border-radius:8px 8px 0 0;}
.modal-header h3{font-size:13px;color:var(--gold-light);}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;} .modal-close:hover{color:var(--danger);}
.modal-body{padding:14px;}
.modal-bon-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.modal-bon-num{color:var(--info);font-family:Consolas,monospace;font-size:15px;font-weight:800;}
.modal-chk{display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:700;padding:2px 6px;border:1px solid var(--border);border-radius:3px;user-select:none;}
.modal-chk input{width:14px;height:14px;cursor:pointer;}
.modal-chk.chk-moulage{color:var(--purple);} .modal-chk.chk-moulage input{accent-color:var(--purple);}
.modal-chk.chk-inventaire{color:var(--teal);} .modal-chk.chk-inventaire input{accent-color:var(--teal);}
.modal-chk.chk-serie{color:var(--info);} .modal-chk.chk-serie input{accent-color:var(--info);}
.modal-field{margin-bottom:8px;}
.modal-field-label{font-size:9px;font-weight:700;color:var(--gold-light);margin-bottom:2px;}
.modal-field select,.modal-field input{width:100%;padding:8px 10px;background:#0f172a;border:1px solid var(--border);color:#e2e8f0;border-radius:4px;font-size:12px;font-weight:600;}
.modal-field select option{background:#1e293b;color:#e2e8f0;font-size:12px;padding:4px;}
.modal-field select:focus,.modal-field input:focus{outline:none;border-color:var(--gold);}
.modal-err-section{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:4px;padding:8px;margin-top:4px;}
.modal-err-section .modal-field-label{color:var(--danger);}
.serie-match-info{background:rgba(168,85,247,.1);border:1px solid var(--purple);border-radius:6px;padding:8px;margin-bottom:10px;}
.serie-match-info .label{font-size:9px;color:var(--purple);font-weight:700;} .serie-match-info .value{font-size:12px;font-weight:700;}
.item-choice{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
.item-btn{padding:6px 12px;border:2px solid var(--border);background:var(--bg-input);color:var(--text);border-radius:4px;cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;}
.item-btn:hover{border-color:var(--purple);} .item-btn.selected{border-color:var(--success);background:rgba(34,197,94,.15);color:var(--success);}
.grandeur-list{margin:8px 0;}
.grandeur-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;margin-bottom:4px;background:rgba(15,23,42,.6);}
.grandeur-row.checked{background:rgba(34,197,94,.15);border-color:var(--success);}
.grandeur-row .g-name{font-weight:700;font-size:12px;min-width:60px;color:#e2e8f0;}
.grandeur-row .g-qty-total{font-size:10px;color:var(--text-muted);min-width:45px;}
.grandeur-row .g-qty-input{width:44px;padding:2px 4px;font-size:12px;font-weight:700;text-align:center;background:#0f172a;border:1px solid var(--border);border-radius:3px;color:#e2e8f0;}
.grandeur-row .g-qty-input:focus{border-color:var(--gold);outline:none;}
.grandeur-row .g-btn-complet{padding:2px 8px;font-size:9px;font-weight:700;border:1px solid var(--success);border-radius:3px;cursor:pointer;background:rgba(34,197,94,.15);color:var(--success);transition:all .15s;}
.grandeur-row .g-btn-complet:hover{background:var(--success);color:#fff;}
.grandeur-row .g-btn-complet.active{background:var(--success);color:#fff;}
.grandeur-row .g-status-label{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;}
.grandeur-row .g-status-label.pending{background:rgba(251,191,36,.2);color:var(--gold-light);}
.grandeur-row .g-status-label.done{background:rgba(34,197,94,.2);color:var(--success);}
.grandeur-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--success);}
.modal-select-all{display:flex;gap:6px;margin-bottom:6px;}
.modal-select-all button{padding:3px 10px;font-size:10px;font-weight:700;border-radius:4px;cursor:pointer;border:1px solid;}
.modal-btn-all{background:rgba(34,197,94,.15);color:var(--success);border-color:var(--success);}
.modal-btn-all:hover{background:var(--success);color:#fff;}
.modal-btn-none{background:rgba(239,68,68,.1);color:var(--danger);border-color:var(--danger);}
.modal-btn-none:hover{background:var(--danger);color:#fff;}
.list-manager-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.list-manager-overlay.show{display:flex;}
.list-manager{background:var(--bg-card);border:2px solid var(--teal);border-radius:8px;width:90%;max-width:360px;max-height:70vh;overflow:hidden;animation:modalIn .2s ease;}
.list-manager-header{background:linear-gradient(to right,#0f4c6e,#1e293b);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--teal);}
.list-manager-header h4{font-size:12px;color:var(--teal);}
.list-manager-body{padding:10px;}
.list-item-row{display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.04);}
.list-item-row span{flex:1;font-size:11px;}
.list-items-wrap{max-height:280px;overflow-y:auto;margin-top:6px;border:1px solid var(--border);border-radius:4px;}
.toast-container{position:fixed;top:8px;right:8px;z-index:300;}
.toast{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;margin-bottom:4px;animation:toastIn .3s ease;}
.toast.success{background:var(--success);color:white;} .toast.info{background:var(--info);color:white;} .toast.error{background:var(--danger);color:white;}
@keyframes toastIn{from{transform:translateX(80px);opacity:0;}to{transform:translateX(0);opacity:1;}}

function setSyncBadge(state){
  var b=document.getElementById('syncBadge');if(!b)return;
  if(state==='online'){b.className='sync-indicator online';b.textContent='⬤ Firebase';}
  else if(state==='syncing'){b.className='sync-indicator syncing';b.textContent='⟳ Sync...';}

function doLogin(){
  var em=document.getElementById('login-email').value.trim();
  var pw=document.getElementById('login-pass').value;
  var errEl=document.getElementById('login-err');
  var statEl=document.getElementById('login-status');
  if(!em||!pw){errEl.textContent='Entrez courriel et mot de passe';return;}
  // Save email immediately so it's remembered even if login fails
  localStorage.setItem('physipro_last_email',em);
  errEl.textContent='';statEl.textContent='Connexion...';
  fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function(){
    return fbAuth.signInWithEmailAndPassword(em,pw);
  }).then(function(cred){
    statEl.textContent='✅ Connecté!';
  }).catch(function(err){
    statEl.textContent='';
    if(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')errEl.textContent='Courriel ou mot de passe invalide';
    else if(err.code==='auth/too-many-requests')errEl.textContent='Trop de tentatives, réessayez plus tard';
    else errEl.textContent=err.message;
  });
}
function doLogout(){

});

/* ═══ FIREBASE SYNC ═══ */
var FB_PATHS={inspection:'inspectionData',couture:'coutureData',lists:'inspectionLists',colCfg:'inspectionColCfg',colWidths:'inspectionColWidths'};
var _fbWriting={};

function startFirebaseSync(){
  initApp(); // Always init first so tables are visible
  // Load serie cards from Firebase (shared path with Serie+)
  fbDb.ref('serieCommandes').once('value').then(function(snap){
    var fbCards=snap.val();
    if(fbCards){
      var local=getSerieCards();
      var merged=Object.assign({},local,fbCards);
      localStorage.setItem(SK,JSON.stringify(merged));
      console.log('[FB] Serie cards loaded: '+Object.keys(merged).length+' cards');
    }
    // Listen for real-time updates from Serie+
    listenSerieCards();
  }).catch(function(e){console.error('[FB] Serie load error:',e);listenSerieCards();});
  // Load from Firebase, merge with local, push if needed
  ['inspection','couture'].forEach(function(dept){
    var path=FB_PATHS[dept];
    fbDb.ref(path).once('value').then(function(snap){
      var fbData=snap.val();
      var lk=dept==='inspection'?IK:CK;
      var localData=loadDLocal(dept);
      if(fbData){
        // Merge: Firebase wins but keep local-only months
        var merged=Object.assign({},localData,fbData);
        localStorage.setItem(lk,JSON.stringify(merged));
        renderTable(dept);
      }else if(localData&&Object.keys(localData).length>0){
        // Firebase empty but local has data — push local up
        pushToFB(dept);
      }
      listenFB(dept);
    }).catch(function(){
      listenFB(dept);
      renderTable(dept);
    });
  });
  // Sync lists
  fbDb.ref(FB_PATHS.lists).once('value').then(function(snap){
    var d=snap.val();if(!d)return;
    Object.keys(d).forEach(function(k){localStorage.setItem('physipro_list_'+k,JSON.stringify(d[k]));});
  });
  // Sync col config
  ['inspection','couture'].forEach(function(dept){
    fbDb.ref(FB_PATHS.colCfg+'/'+dept).once('value').then(function(snap){
      var d=snap.val();if(d)localStorage.setItem('physipro_colcfg_'+dept,JSON.stringify(d));
    });
    fbDb.ref(FB_PATHS.colWidths+'/'+dept).once('value').then(function(snap){
      var d=snap.val();if(d)localStorage.setItem('physipro_colwidths_'+dept,JSON.stringify(d));
    });
  });
  initApp();
}
var _serieListener=null;
function listenSerieCards(){
  if(_serieListener||!fbDb)return;
  _serieListener=fbDb.ref('serieCommandes').on('value',function(snap){
    var fbCards=snap.val();if(!fbCards)return;
    var local=getSerieCards();var changed=false;
    Object.keys(fbCards).forEach(function(id){
      if(!local[id]){local[id]=fbCards[id];changed=true;}
      else{
        var fbCard=fbCards[id],lCard=local[id];
        if(fbCard.items&&lCard.items){
          fbCard.items.forEach(function(fItem,ii){
            if(!lCard.items[ii])return;
            (fItem.grandeurs||[]).forEach(function(fG,gi){
              if(!lCard.items[ii].grandeurs||!lCard.items[ii].grandeurs[gi])return;
              var lG=lCard.items[ii].grandeurs[gi];
              // Sync new grandeurs from Serie+
              if(fG.qty&&fG.qty!==lG.qty){lG.qty=fG.qty;changed=true;}
              if(fG.name&&fG.name!==lG.name){lG.name=fG.name;changed=true;}
            });
          });
        }
        // Sync card-level fields
        if(fbCard.client)lCard.client=fbCard.client;
        if(fbCard.order)lCard.order=fbCard.order;
        if(fbCard.numeroPO)lCard.numeroPO=fbCard.numeroPO;
      }
    });
    if(changed)localStorage.setItem(SK,JSON.stringify(local));
  });
}
function listenFB(dept){
  var path=FB_PATHS[dept];
  if(fbListeners[dept])fbDb.ref(path).off('value',fbListeners[dept]);
  fbListeners[dept]=fbDb.ref(path).on('value',function(snap){
    if(_fbWriting[dept])return; // Ignore our own writes
    var fbData=snap.val();
    if(fbData){
      var lk=dept==='inspection'?IK:CK;
      localStorage.setItem(lk,JSON.stringify(fbData));
      renderTable(dept);
    }
  });
}
function stopFirebaseSync(){
  Object.keys(fbListeners).forEach(function(k){
    fbDb.ref(FB_PATHS[k]).off('value',fbListeners[k]);
    delete fbListeners[k];
  });
  if(_serieListener){fbDb.ref('serieCommandes').off('value',_serieListener);_serieListener=null;}
  initApp();
}
function pushToFB(dept){
  if(!fbUser){setSyncBadge('offline');return;}
  var lk=dept==='inspection'?IK:CK;
  var data;try{data=JSON.parse(localStorage.getItem(lk))||{};}catch(e){return;}
  _fbWriting[dept]=true;
  setSyncBadge('syncing');
  fbDb.ref(FB_PATHS[dept]).set(data).then(function(){
    _fbWriting[dept]=false;
    setSyncBadge('online');
    console.log('✅ Firebase saved:',dept);
  }).catch(function(err){
    _fbWriting[dept]=false;
    setSyncBadge('offline');
    console.error('❌ Firebase error:',dept,err.message);
    showToast('⚠️ Firebase: '+err.message,'error');
  });
}
function debouncePush(dept){
  clearTimeout(_syncTimeout[dept]);
  _syncTimeout[dept]=setTimeout(function(){pushToFB(dept);},800);
}
function pushListToFB(k,v){
  if(!fbUser)return;
  fbDb.ref(FB_PATHS.lists+'/'+k).set(v);
}
function pushColCfgToFB(dept){
  if(!fbUser)return;
  var cfg=getColCfg(dept);if(cfg)fbDb.ref(FB_PATHS.colCfg+'/'+dept).set(cfg);
  var w=getColWidths(dept);if(w&&Object.keys(w).length)fbDb.ref(FB_PATHS.colWidths+'/'+dept).set(w);
}

function getList(k){var s=localStorage.getItem('physipro_list_'+k);if(s)try{return JSON.parse(s);}catch(e){}return DEFAULT_LISTS[k].slice();}
function saveList(k,v){localStorage.setItem('physipro_list_'+k,JSON.stringify(v));pushListToFB(k,v);}
var curLK=null,curLN='';
function openListManager(lk,dn){curLK=lk;curLN=dn;var vals=getList(lk);var h='<div style="display:flex;gap:4px;margin-bottom:8px;"><input type="text" id="lm-new" placeholder="Nouvelle..." style="flex:1;padding:5px 7px;background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:3px;font-size:11px;" onkeydown="if(event.key===\'Enter\')addLV()"><button class="btn btn-add btn-sm" onclick="addLV()">+</button></div><div class="list-items-wrap">';for(var i=0;i<vals.length;i++)h+='<div class="list-item-row"><span>'+esc(vals[i])+'</span><button class="btn btn-danger btn-sm" onclick="rmLV('+i+')" style="padding:1px 5px;font-size:8px;">✕</button></div>';if(!vals.length)h+='<div style="padding:10px;text-align:center;color:var(--text-muted);font-size:10px;">Vide</div>';h+='</div><div style="margin-top:6px;text-align:right;"><button class="btn btn-info btn-sm" onclick="resetLV()">↻ Défaut</button></div>';document.getElementById('listManagerTitle').textContent='⚙️ '+dn;document.getElementById('listManagerBody').innerHTML=h;document.getElementById('listManagerOverlay').classList.add('show');setTimeout(function(){var e=document.getElementById('lm-new');if(e)e.focus();},100);}

var SK='physipro_serie_cards',IK='physipro_inspection_data',CK='physipro_couture_data';
function gmk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function gml(k){var p=k.split('-'),ms=['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];return ms[parseInt(p[1])]+' '+p[0];}
function todayStr(){var t=new Date();return String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear();}
function loadDLocal(d){try{return JSON.parse(localStorage.getItem(d==='inspection'?IK:CK))||{};}catch(e){return {};}}
function loadD(d){return loadDLocal(d);}
function saveD(d,data){
  localStorage.setItem(d==='inspection'?IK:CK,JSON.stringify(data));
  debouncePush(d);
  // Visual save confirmation
  var wrap=document.getElementById(d==='inspection'?'tab-inspection':'tab-couture');
  if(wrap){wrap.classList.remove('save-flash');void wrap.offsetWidth;wrap.classList.add('save-flash');}
}
function gmd(d){var data=loadD(d);var m=document.getElementById(d==='inspection'?'insp-month':'cout-month').value;if(!data[m])data[m]=[];return{data:data,month:m,rows:data[m]};}
function updateDates(){var t=todayStr();var e1=document.getElementById('insp-date-display');if(e1)e1.textContent=t;var e2=document.getElementById('cout-date-display');if(e2)e2.textContent=t;}
function lastDateInRows(rows){for(var i=rows.length-1;i>=0;i--){if(rows[i].type==='date')return rows[i].dateLabel;if(rows[i].type==='entry'&&rows[i].entryDate)return rows[i].entryDate;}return null;}
function autoDateSep(rows){var today=todayStr();if(lastDateInRows(rows)!==today)rows.push({id:'date-'+Date.now(),type:'date',dateLabel:today});}
var currentZoom=11;
function zoomTable(dir){currentZoom=Math.max(8,Math.min(18,currentZoom+dir));document.documentElement.style.setProperty('--tbl-zoom',currentZoom+'px');}
function addDateSep(dept){var md=gmd(dept);var rows=md.rows;rows.push({id:'date-'+Date.now(),type:'date',dateLabel:todayStr()});md.data[md.month]=rows;saveD(dept,md.data);renderTable(dept);showToast('📅 Séparation ajoutée','success');}
function onSearchInput(){var t=document.querySelector('.content.active');if(t){var n=t.id.replace('tab-','');if(n==='inspection'||n==='couture')renderTable(n);}}
function getSF(){return(document.getElementById('global-search').value||'').toLowerCase();}

var COUT_COLS=[
  {id:'num',label:'#',w:'28px',fixed:true},

  {id:'nom',label:'Nom',w:'130px',gear:'employes_atelier|Techniciens'},
  {id:'qty',label:'Qté',w:'36px'},
  {id:'item',label:'Item',w:'120px',gear:'items|Items'},
  {id:'client',label:'Client',w:'100px',gear:'clients|Clients'},
  {id:'cout',label:'Couturière',w:'100px',gear:'coutureuses|Couturières'},
  {id:'statut',label:'Statut',w:'60px'},
  {id:'actions',label:'✕',w:'28px',fixed:true}
];
function getDefs(dept){return dept==='inspection'?INSP_COLS:COUT_COLS;}
function getColCfg(dept){var s=localStorage.getItem('physipro_colcfg_'+dept);if(s)try{return JSON.parse(s);}catch(e){}return null;}
function saveColCfg(dept,cfg){localStorage.setItem('physipro_colcfg_'+dept,JSON.stringify(cfg));pushColCfgToFB(dept);}
function getOrderedCols(dept){
  var defs=getDefs(dept);var cfg=getColCfg(dept);
  if(!cfg)return defs.map(function(d){return{id:d.id,visible:true};});
  var res=[];
  cfg.order.forEach(function(id){var d=defs.find(function(x){return x.id===id;});if(d)res.push({id:id,visible:(cfg.hidden||[]).indexOf(id)<0});});
  defs.forEach(function(d){if(!res.find(function(r){return r.id===d.id;}))res.push({id:d.id,visible:true});});
  return res;
}
function getVisCols(dept){return getOrderedCols(dept).filter(function(c){return c.visible;});}
function getColDef(dept,id){return getDefs(dept).find(function(d){return d.id===id;});}
function saveCols(dept,ordered){
  var hidden=ordered.filter(function(c){return !c.visible;}).map(function(c){return c.id;});
  var order=ordered.map(function(c){return c.id;});
  saveColCfg(dept,{order:order,hidden:hidden});
}

/* ═══ COLUMN PANEL ═══ */
function toggleColPanel(dept){
  var el=document.getElementById('colPanel-'+dept);
  if(el.classList.contains('show')){el.classList.remove('show');return;}
  document.querySelectorAll('.col-panel').forEach(function(p){p.classList.remove('show');});
  var ordered=getOrderedCols(dept);
  var h='<div class="col-panel-h"><span>⚙️ Colonnes</span><button class="btn btn-sm" style="background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:8px;" onclick="resetCols(\''+dept+'\')">↻ Défaut</button></div><div class="col-panel-body">';
  ordered.forEach(function(c){
    var def=getColDef(dept,c.id);if(!def)return;
    var isFixed=def.fixed;
    h+='<div class="col-row">';
    h+='<label><input type="checkbox" '+(c.visible?'checked':'')+' '+(isFixed?'disabled':'')+' onchange="cpToggle(\''+dept+'\',\''+c.id+'\',this.checked)"><span class="col-lbl">'+def.label+'</span></label></div>';
  });
  h+='</div>';
  el.innerHTML=h;el.classList.add('show');
}
function cpToggle(dept,colId,vis){
  var ordered=getOrderedCols(dept);
  ordered.forEach(function(c){if(c.id===colId)c.visible=vis;});
  saveCols(dept,ordered);renderTable(dept);
}
function resetCols(dept){localStorage.removeItem('physipro_colcfg_'+dept);localStorage.removeItem('physipro_colwidths_'+dept);renderTable(dept);toggleColPanel(dept);showToast('↻ Colonnes réinitialisées','info');}

/* ═══ COLUMN WIDTHS (resize via colgroup) ═══ */
function getColWidths(dept){var s=localStorage.getItem('physipro_colwidths_'+dept);if(s)try{return JSON.parse(s);}catch(e){}return {};}
function saveColWidths(dept,w){localStorage.setItem('physipro_colwidths_'+dept,JSON.stringify(w));pushColCfgToFB(dept);}
function getColPx(dept,colId){
  var saved=getColWidths(dept);
  if(saved[colId])return parseInt(saved[colId]);
  var def=getColDef(dept,colId);
  return def?parseInt(def.w):80;
}
function buildColgroup(dept,vis){
  var cgId=dept==='inspection'?'insp-colgroup':'cout-colgroup';
  var cg=document.getElementById(cgId);if(!cg)return;
  var html='';
  vis.forEach(function(vc){
    var px=getColPx(dept,vc.id);
    html+='<col data-colid="'+vc.id+'" style="width:'+px+'px;">';
  });
  cg.innerHTML=html;
}
function setColWidth(dept,colId,px){
  var cgId=dept==='inspection'?'insp-colgroup':'cout-colgroup';
  var cg=document.getElementById(cgId);if(!cg)return;
  var col=cg.querySelector('col[data-colid="'+colId+'"]');
  if(col)col.style.width=px+'px';
}
var _resize=null;
function startResize(e,dept,colId){
  e.preventDefault();e.stopPropagation();
  var curW=getColPx(dept,colId);
  // Check saved or current col element width
  var cgId=dept==='inspection'?'insp-colgroup':'cout-colgroup';
  var colEl=document.getElementById(cgId).querySelector('col[data-colid="'+colId+'"]');
  if(colEl)curW=parseInt(colEl.style.width)||curW;
  _resize={dept:dept,colId:colId,startX:e.clientX,startW:curW};
  e.target.classList.add('active');
  document.body.classList.add('col-resizing');
  document.addEventListener('mousemove',onResize);
  document.addEventListener('mouseup',stopResize);
}
function onResize(e){
  if(!_resize)return;
  var diff=e.clientX-_resize.startX;
  var newW=Math.max(24,_resize.startW+diff);
  setColWidth(_resize.dept,_resize.colId,newW);
}
function stopResize(e){
  if(!_resize)return;
  var diff=e.clientX-_resize.startX;
  var newW=Math.max(24,_resize.startW+diff);
  setColWidth(_resize.dept,_resize.colId,newW);
  var w=getColWidths(_resize.dept);
  w[_resize.colId]=newW+'px';
  saveColWidths(_resize.dept,w);
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.resize-handle').forEach(function(h){h.classList.remove('active');});
  document.removeEventListener('mousemove',onResize);
  document.removeEventListener('mouseup',stopResize);
  _resize=null;
}



/* ═══ RENDER TABLE (column-aware) ═══ */
function renderTable(dept){
  var md=gmd(dept);var rows=md.rows;var month=md.month;
  var vis=getVisCols(dept);var defs=getDefs(dept);
  var theadId=dept==='inspection'?'insp-thead':'cout-thead';
  var tbodyId=dept==='inspection'?'insp-body':'cout-body';
  var cntId=dept==='inspection'?'insp-count':'cout-count';
  var f=getSF();
  // COLGROUP (controls widths independently)
  buildColgroup(dept,vis);
  // THEAD (no width on th — colgroup handles it)
  var th='<tr>';
  vis.forEach(function(vc,ci){
    var def=getColDef(dept,vc.id);if(!def)return;
    var gear='';
    if(def.gear){var g=def.gear.split('|');gear=' <span class="th-gear" onclick="event.stopPropagation();openListManager(\''+g[0]+'\',\''+g[1]+'\')">⚙️</span>';}
    var resizer='<div class="resize-handle" onmousedown="startResize(event,\''+dept+'\',\''+vc.id+'\')"></div>';
    th+='<th data-colid="'+vc.id+'">'+def.label+gear+resizer+'</th>';
  });
  th+='</tr>';
  document.getElementById(theadId).innerHTML=th;
  // TBODY
  var html='',count=0,nc=vis.length;
  if(!rows||!rows.length){
    html='<tr><td colspan="'+nc+'"><div class="empty-state"><div class="icon">'+(dept==='inspection'?'☑️':'🧵')+'</div><p>Aucune entrée — '+gml(month)+'</p></div></td></tr>';
  }else{
    for(var idx=0;idx<rows.length;idx++){
      var row=rows[idx];
      if(row.type==='date'){html+='<tr class="date-row"><td colspan="'+nc+'">📅 '+esc(row.dateLabel)+'</td></tr>';continue;}
      var ss=[row.bon,row.nom,row.item,row.client,row.description,row.errorReason].join(' ').toLowerCase();
      if(f&&ss.indexOf(f)<0)continue;
      count++;
      var hasErr=row.hasError!==undefined?row.hasError:((row.errQty||0)>0);
      html+='<tr class="'+(hasErr?'error-row':'')+'">';
      vis.forEach(function(vc){html+='<td>'+cellHTML(dept,vc.id,row,idx,count,hasErr)+'</td>';});
      html+='</tr>';
    }
  }
  document.getElementById(tbodyId).innerHTML=html;
  var cntEl=document.getElementById(cntId);if(cntEl)cntEl.innerHTML='<strong>'+count+'</strong> — '+gml(month);
}
function cellHTML(dept,colId,row,idx,count,hasErr){
  var isI=dept==='inspection';
  switch(colId){
    case 'num':return'<span style="color:var(--text-muted);font-size:8px;">'+count+'</span>';
    case 'bon':return'<span class="cell-bon">'+esc(row.bon)+'</span>';
    case 'nom':return mkSel(dept,idx,'nom',row.nom,getList('employes_atelier'));
    case 'qty':return'<span class="cell-qty">'+row.qty+'</span>';
    case 'item':return mkSel(dept,idx,'item',row.item,getList('items'));
    case 'client':return mkSel(dept,idx,'client',row.client,getList('clients'));
    case 'insp':return mkSel(dept,idx,'inspecteur',row.inspecteur,getList('inspecteurs'));
    case 'cout':return mkSel(dept,idx,'inspecteur',row.inspecteur,getList('coutureuses'));
    case 'err':return mkErr(dept,idx,hasErr);
    case 'raison':return mkReason(dept,idx,row.errorReason||'');
    case 'statut':return mkStat(dept,idx,row);
    case 'actions':return'<button class="btn btn-danger btn-sm" onclick="delRow(\''+dept+'\','+idx+')" style="padding:1px 4px;font-size:8px;">✕</button>';
    default:return'';
  }
}
function mkSel(dept,idx,field,cur,opts){var o=opts.slice();if(cur&&o.indexOf(cur)<0)o.unshift(cur);var h='<select class="tbl-select" onchange="uf(\''+dept+'\','+idx+',\''+field+'\',this.value)"><option value=""'+(!cur?' selected':'')+'>—</option>';for(var i=0;i<o.length;i++){if(!o[i])continue;h+='<option value="'+esc(o[i])+'"'+(o[i]===cur?' selected':'')+'>'+esc(o[i])+'</option>';}return h+'</select>';}
function mkErr(d,i,has){return'<span class="err-badge '+(has?'err-oui':'err-non')+'" onclick="tgErr(\''+d+'\','+i+')">'+(has?'1':'—')+'</span>';}
function mkReason(d,i,r){var errs=getList('erreurs');var o=errs.slice();if(r&&o.indexOf(r)<0)o.unshift(r);var h='<select class="tbl-select" style="color:'+(r?'var(--danger)':'var(--text-muted)')+';font-size:10px;" onchange="setReason(\''+d+'\','+i+',this.value)"><option value="">—</option>';for(var j=0;j<o.length;j++){if(!o[j])continue;h+='<option value="'+esc(o[j])+'"'+(o[j]===r?' selected':'')+'>'+esc(o[j])+'</option>';}return h+'</select>';}
function mkStat(d,i,r){var st=r.coutureStatus||'recu';var c={recu:'var(--info)',enCours:'var(--gold-light)',complet:'var(--success)'};var l={recu:'Reçu',enCours:'En cours',complet:'Complet'};return'<span class="status-badge" style="background:'+c[st]+'" onclick="cyc(\''+d+'\','+i+')">'+l[st]+'</span>';}

/* ═══ SAVE ON EVERY CHANGE ═══ */
function uf(d,i,f,v){var md=gmd(d);if(md.rows[i]&&md.rows[i].type==='entry'){md.rows[i][f]=v;md.data[md.month]=md.rows;saveD(d,md.data);}}
function setReason(d,i,v){var md=gmd(d);var r=md.rows[i];if(!r||r.type!=='entry')return;r.errorReason=v;r.hasError=!!v;r.errQty=v?1:0;md.data[md.month]=md.rows;saveD(d,md.data);renderTable(d);}
function tgErr(d,i){var md=gmd(d);var r=md.rows[i];if(!r||r.type!=='entry')return;var c=r.hasError!==undefined?r.hasError:((r.errQty||0)>0);r.hasError=!c;r.errQty=!c?1:0;if(c)r.errorReason='';md.data[md.month]=md.rows;saveD(d,md.data);renderTable(d);}
function cyc(d,i){var md=gmd(d);var r=md.rows[i];if(!r)return;var o=['recu','enCours','complet'];var c=r.coutureStatus||'recu';r.coutureStatus=o[(o.indexOf(c)+1)%o.length];md.data[md.month]=md.rows;saveD(d,md.data);renderTable(d);}
function delRow(d,i){if(!confirm('Supprimer?'))return;var md=gmd(d);md.rows.splice(i,1);md.data[md.month]=md.rows;saveD(d,md.data);renderTable(d);showToast('🗑️','info');}

/* ═══ SÉRIE+ ═══ */
function getSerieCards(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};}}
function findSerie(num){var cards=getSerieCards();var n=String(num).trim();for(var id in cards)if(cards[id].order===n||cards[id].numeroPO===n)return{cardId:id,card:cards[id]};return null;}
function getUnfinished(card,dept){var res=[];(card.items||[]).forEach(function(item,ii){var pend=[];(item.grandeurs||[]).forEach(function(g,gi){if(dept==='inspection'){var done=(g.atelier&&g.atelier.inspected)||false;if(!done)pend.push({gi:gi,name:g.name,qty:g.qty});}else{var s2=(g.couture&&g.couture.status)||'attente';if(s2!=='expedie')pend.push({gi:gi,name:g.name,qty:g.qty});}});if(pend.length)res.push({ii:ii,name:item.name,pending:pend});});return res;}
function scanBon(dept){var id=dept==='inspection'?'insp-bon':'cout-bon';var bon=document.getElementById(id).value.trim();if(!bon){showToast('#?','error');return;}var m=findSerie(bon);if(m)openSerieModal(bon,m,dept);else openManualModal(bon,dept);document.getElementById(id).value='';document.getElementById(id).focus();}
function openSerieModal(bon,match,dept){var cid=match.cardId,card=match.card,items=getUnfinished(card,dept);var h='<div class="serie-match-info"><div class="label">🔗 Série+</div><div class="value">'+esc(card.client||'')+' — '+esc(card.order||bon)+'</div></div>';if(!items.length){h+='<p style="color:var(--success);font-weight:700;">✅ Complété!</p>';}else{h+='<div class="item-choice">';items.forEach(function(item,idx){h+='<button class="item-btn" onclick="selSI('+idx+')" data-idx="'+idx+'">'+esc(item.name)+' ('+item.pending.length+')</button>';});h+='</div><div id="grandeurArea"></div><div style="display:none;text-align:right;margin-top:10px;" id="confirmArea"><button class="btn btn-add" onclick="confirmSI()">✅ Confirmer</button></div>';}window._ctx={bon:bon,cid:cid,card:card,items:items,dept:dept,si:null,cg:[]};document.getElementById('modalTitle').textContent=(dept==='inspection'?'☑️':'🧵')+' Série+';document.getElementById('modalBody').innerHTML=h;document.getElementById('modalOverlay').classList.add('show');}
function selSI(idx){var ctx=window._ctx;ctx.si=idx;ctx.cg=[];ctx.cqty={};document.querySelectorAll('.item-btn').forEach(function(b){b.classList.remove('selected');});document.querySelector('.item-btn[data-idx="'+idx+'"]').classList.add('selected');var item=ctx.items[idx];var h='<div class="modal-select-all"><button class="modal-btn-all" onclick="selAllG(true)">✅ Tout complet</button><button class="modal-btn-none" onclick="selAllG(false)">✖ Aucun</button></div><div class="grandeur-list">';item.pending.forEach(function(g,pi){var q=parseInt(g.qty)||0;h+='<div class="grandeur-row" id="grow_'+pi+'"><input type="checkbox" id="gchk_'+pi+'" onchange="tgGC('+pi+')"><span class="g-name">'+esc(g.name)+'</span><span class="g-qty-total">(Total:'+q+')</span><input type="number" class="g-qty-input" id="gqty_'+pi+'" value="'+q+'" min="0" max="'+q+'" onchange="updGQ('+pi+','+q+')" onfocus="this.select()"><button class="g-btn-complet" id="gbtn_'+pi+'" onclick="setGComplet('+pi+','+q+')">Complet</button><span class="g-status-label pending" id="gstat_'+pi+'">Attente</span></div>';});h+='</div>';document.getElementById('grandeurArea').innerHTML=h;document.getElementById('confirmArea').style.display='block';}
function setGComplet(pi,total){var ctx=window._ctx;var chk=document.getElementById('gchk_'+pi);var inp=document.getElementById('gqty_'+pi);var btn=document.getElementById('gbtn_'+pi);var stat=document.getElementById('gstat_'+pi);var row=document.getElementById('grow_'+pi);inp.value=total;chk.checked=true;btn.classList.add('active');row.classList.add('checked');stat.className='g-status-label done';stat.textContent=total+'/'+total;ctx.cqty[pi]=total;if(ctx.cg.indexOf(pi)<0)ctx.cg.push(pi);}
function updGQ(pi,total){var ctx=window._ctx;var inp=document.getElementById('gqty_'+pi);var chk=document.getElementById('gchk_'+pi);var btn=document.getElementById('gbtn_'+pi);var stat=document.getElementById('gstat_'+pi);var row=document.getElementById('grow_'+pi);var v=Math.min(Math.max(0,parseInt(inp.value)||0),total);inp.value=v;ctx.cqty[pi]=v;if(v>0){chk.checked=true;row.classList.add('checked');if(ctx.cg.indexOf(pi)<0)ctx.cg.push(pi);if(v>=total){btn.classList.add('active');stat.className='g-status-label done';stat.textContent=v+'/'+total;}else{btn.classList.remove('active');stat.className='g-status-label done';stat.textContent=v+'/'+total+' partiel';}}else{chk.checked=false;row.classList.remove('checked');btn.classList.remove('active');stat.className='g-status-label pending';stat.textContent='Attente';ctx.cg=ctx.cg.filter(function(x){return x!==pi;});delete ctx.cqty[pi];}}
function selAllG(on){var ctx=window._ctx;if(!ctx||ctx.si===null)return;var item=ctx.items[ctx.si];item.pending.forEach(function(g,pi){var total=parseInt(g.qty)||0;if(on&&total>0){setGComplet(pi,total);}else{var inp=document.getElementById('gqty_'+pi);inp.value=0;updGQ(pi,total);}});}
function tgGC(pi){var ctx=window._ctx;var c=document.getElementById('gchk_'+pi).checked;var inp=document.getElementById('gqty_'+pi);var item=ctx.items[ctx.si];var total=parseInt(item.pending[pi].qty)||0;if(c){if(!ctx.cqty[pi])setGComplet(pi,total);}else{inp.value=0;updGQ(pi,total);}}
function confirmSI(){var ctx=window._ctx;if(ctx.si===null||!ctx.cg.length){showToast('Sélectionnez','error');return;}var item=ctx.items[ctx.si];var cards=getSerieCards();var card=cards[ctx.cid];var tq=0;ctx.cg.forEach(function(pi){var gI=item.pending[pi];var userQty=parseInt(ctx.cqty[pi])||0;if(userQty<=0)return;var totalQty=parseInt(gI.qty)||0;var g=card.items[item.ii].grandeurs[gI.gi];if(ctx.dept==='inspection'){/* ATELIER ONLY - do NOT touch g.inspection (that's for Inspection Finale) */g.atelier=g.atelier||{};g.atelier.qtyFait=userQty;if(userQty>=totalQty){g.atelier.inspected=true;g.atelier.sentToCouture=true;}else{g.atelier.inspected=false;g.atelier.sentToCouture=false;}g.atelier.inspectedBy=fbUser?fbUser.email:'';g.atelier.inspectedAt=new Date().toISOString();}else{g.couture=g.couture||{};g.couture.qtyFait=userQty;g.couture.status=(userQty>=totalQty)?'pret':'partiel';}tq+=userQty;});if(tq<=0){showToast('Quantité = 0','error');return;}localStorage.setItem(SK,JSON.stringify(cards));if(fbDb){fbDb.ref('serieCommandes/'+ctx.cid).set(card).then(function(){console.log('[FB] Serie card '+ctx.cid+' updated');}).catch(function(e){console.error('[FB] Serie push error:',e);showToast('⚠️ Sync Série+ échouée','error');});}addRow(ctx.bon,'',String(tq),item.name,ctx.dept,card.client||'','','');closeModal();showToast('✅ Inspecté + sync Série+','success');}
function openManualModal(bon,dept){var emps=getList('employes_atelier'),items=getList('items'),cls=getList('clients'),errs=getList('erreurs');var isI=dept==='inspection';var h='<div class="modal-bon-line"><span style="font-size:11px;color:var(--text-muted);">Bon:</span> <span class="modal-bon-num">'+esc(bon)+'</span><label class="modal-chk chk-moulage"><input type="checkbox" id="man-moulage" onchange="tgMoul()">Moulage</label><label class="modal-chk chk-inventaire"><input type="checkbox" id="man-inv" onchange="tgInv()">Inv.</label><label class="modal-chk chk-serie"><input type="checkbox" id="man-serie" onchange="tgSerie()">Série</label></div>';h+='<div class="modal-field"><div class="modal-field-label">Technicien</div><select id="man-nom"><option value="">—</option>';emps.forEach(function(e){h+='<option>'+esc(e)+'</option>';});h+='</select></div><div class="modal-field"><div class="modal-field-label">Client</div><select id="man-client"><option value="">—</option>';cls.forEach(function(c){h+='<option>'+esc(c)+'</option>';});h+='</select></div><div class="modal-field"><div class="modal-field-label">Quantité</div><input type="number" id="man-qty" value="1" min="1"></div><div class="modal-field"><div class="modal-field-label">Item</div><select id="man-item"><option value="">—</option>';items.forEach(function(i){h+='<option>'+esc(i)+'</option>';});h+='</select></div>';if(isI){h+='<div class="modal-err-section"><div class="modal-field-label" style="color:var(--danger);">⚠️ Raison erreur</div><select id="man-reason"><option value="">— Aucune —</option>';errs.forEach(function(e){h+='<option>'+esc(e)+'</option>';});h+='</select></div>';}h+='<div style="text-align:right;margin-top:10px;"><button class="btn btn-add" onclick="submitMan(\''+esc(bon).replace(/'/g,"\\'")+'\',\''+dept+'\')" style="padding:6px 20px;font-size:12px;">✅ Ajouter</button></div>';document.getElementById('modalTitle').textContent=isI?'☑️ Inspection':'🧵 Couture';document.getElementById('modalBody').innerHTML=h;document.getElementById('modalOverlay').classList.add('show');}
function tgMoul(){var m=document.getElementById('man-moulage'),inv=document.getElementById('man-inv'),ser=document.getElementById('man-serie'),it=document.getElementById('man-item');if(m.checked){inv.checked=false;ser.checked=false;it.value='MOULAGE';}else if(it.value==='MOULAGE')it.value='';}
function tgInv(){var m=document.getElementById('man-moulage'),inv=document.getElementById('man-inv'),ser=document.getElementById('man-serie'),it=document.getElementById('man-item');if(inv.checked){m.checked=false;ser.checked=false;it.value='INVENTAIRE';}else if(it.value==='INVENTAIRE')it.value='';}
function tgSerie(){var m=document.getElementById('man-moulage'),inv=document.getElementById('man-inv'),ser=document.getElementById('man-serie'),it=document.getElementById('man-item');if(ser.checked){m.checked=false;inv.checked=false;it.value='SÉRIE';}else if(it.value==='SÉRIE')it.value='';}
function submitMan(bon,dept){var nom=document.getElementById('man-nom').value;var qty=document.getElementById('man-qty').value||'1';var item=document.getElementById('man-item').value;var client=document.getElementById('man-client').value;var reason='';if(dept==='inspection'){var sel=document.getElementById('man-reason');if(sel)reason=sel.value;}addRow(bon,nom,qty,item,dept,client,'',reason);closeModal();showToast('✅','success');}
function addRow(bon,nom,qty,item,dept,client,notes,errorReason){var md=gmd(dept);var rows=md.rows;autoDateSep(rows);var il=dept==='inspection'?getList('inspecteurs'):getList('coutureuses');var hasErr=!!errorReason;rows.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,5),type:'entry',bon:bon,nom:nom||'',qty:parseInt(qty)||1,item:item||'',client:client||'',inspecteur:il[0]||'',hasError:hasErr,errorReason:errorReason||'',errQty:hasErr?1:0,description:notes||'',entryDate:todayStr(),timestamp:new Date().toISOString(),coutureStatus:'recu'});md.data[md.month]=rows;saveD(dept,md.data);renderTable(dept);showToast('✅ #'+bon+' sauvegardé','success');}

/* ═══ STATS ═══ */
var statsView='atelier';
function switchStatsView(v){statsView=v;document.getElementById('stoggle-atelier').className='stats-toggle-btn'+(v==='atelier'?' active-atelier':'');document.getElementById('stoggle-couture').className='stats-toggle-btn'+(v==='couture'?' active-couture':'');renderStats();}
function renderStats(){var month=document.getElementById('stats-month').value;var html='';if(statsView==='atelier')html=renderAtelierStats(month);else html=renderCoutureStats(month);if(!html)html='<div class="empty-state"><div class="icon">📊</div><p>Aucune donnée</p></div>';document.getElementById('stats-content').innerHTML=html;}

function parseDate(ds){if(!ds)return null;var p=ds.split('/');if(p.length!==3)return null;return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
function getWeeksOfMonth(mk){var p=mk.split('-');var y=parseInt(p[0]),mo=parseInt(p[1])-1;var first=new Date(y,mo,1),last=new Date(y,mo+1,0);var weeks=[],wn=1,ws=new Date(first);while(ws<=last){var we=new Date(ws);var dts=7-we.getDay();if(we.getDay()===0)dts=0;we.setDate(we.getDate()+dts);if(we>last)we=new Date(last);weeks.push({wn:wn,s:new Date(ws),e:new Date(we)});wn++;ws=new Date(we);ws.setDate(ws.getDate()+1);}return weeks;}
function getWeekIdx(ed,weeks){var d=parseDate(ed);if(!d)return -1;for(var i=0;i<weeks.length;i++)if(d>=weeks[i].s&&d<=weeks[i].e)return i;return -1;}

function buildResumeSummary(entries,month){
  var mp=month.split('-');var mYear=parseInt(mp[0]),mMon=parseInt(mp[1])-1;
  var weeks=getWeeksOfMonth(month);
  var totalQty=0;entries.forEach(function(r){totalQty+=parseInt(r.qty)||1;});
  /* par jour */
  var byDay={};
  entries.forEach(function(r){var d=r.entryDate||'';if(!byDay[d])byDay[d]={jobs:0,qty:0};byDay[d].jobs++;byDay[d].qty+=parseInt(r.qty)||1;});
  /* par semaine + jours par semaine */
  var byWeek=weeks.map(function(){return{jobs:0,qty:0,days:{}};});
  entries.forEach(function(r){var wi=getWeekIdx(r.entryDate,weeks);if(wi>=0){byWeek[wi].jobs++;byWeek[wi].qty+=parseInt(r.qty)||1;var d=r.entryDate||'';if(!byWeek[wi].days[d])byWeek[wi].days[d]={jobs:0,qty:0};byWeek[wi].days[d].jobs++;byWeek[wi].days[d].qty+=parseInt(r.qty)||1;}});
  /* Stocker les données globalement pour le onclick */
  window._resumeWeeks=byWeek;window._resumeWeeksMeta=weeks;
  var html='<div class="resume-split"><div class="resume-weeks">';
  html+='<div class="c-card-h blue">📅 '+gml(month)+' — '+entries.length+' jobs — '+totalQty+' qté</div>';
  html+='<table class="c-tbl">';
  weeks.forEach(function(w,wi){
    html+='<tr class="week-clickable" onclick="showWeekDays('+wi+')" id="week-row-'+wi+'"><td style="font-size:9px;font-weight:700;">S'+w.wn+' <span style="color:var(--text-muted);font-weight:400;">('+w.s.getDate()+'–'+w.e.getDate()+')</span></td><td class="n">'+byWeek[wi].jobs+'</td><td class="n">'+byWeek[wi].qty+'</td></tr>';
  });
  html+='<tr><td><strong>Total</strong></td><td class="n"><strong>'+entries.length+'</strong></td><td class="n"><strong>'+totalQty+'</strong></td></tr>';
  html+='</table></div>';
  html+='<div class="resume-days" id="resume-days-panel"><div style="padding:12px;text-align:center;color:var(--text-muted);font-size:10px;">← Cliquer une semaine</div></div>';
  html+='</div>';
  return html;
}
function showWeekDays(wi){
  var bw=window._resumeWeeks;var wm=window._resumeWeeksMeta;if(!bw||!wm)return;
  var w=bw[wi];var meta=wm[wi];
  /* highlight row */
  document.querySelectorAll('.week-clickable').forEach(function(r){r.classList.remove('selected');});
  var row=document.getElementById('week-row-'+wi);if(row)row.classList.add('selected');
  /* build days table */
  var days=w.days;var dayKeys=Object.keys(days).sort(function(a,b){var pa=a.split('/'),pb=b.split('/');return parseInt(pa[0])-parseInt(pb[0]);});
  var html='<div class="c-card-h blue">S'+(wi+1)+' — '+meta.s.getDate()+'/'+String(meta.s.getMonth()+1).padStart(2,'0')+' au '+meta.e.getDate()+'/'+String(meta.e.getMonth()+1).padStart(2,'0')+'</div>';
  if(!dayKeys.length){html+='<div style="padding:8px;text-align:center;color:var(--text-muted);font-size:10px;">Aucune entrée</div>';}
  else{
    html+='<table class="c-tbl"><tr><th>Jour</th><th class="n">Jobs</th><th class="n">Qté</th></tr>';
    dayKeys.forEach(function(d){html+='<tr><td style="font-size:9px;">'+d+'</td><td class="n">'+days[d].jobs+'</td><td class="n">'+days[d].qty+'</td></tr>';});
    html+='<tr><td><strong>Total S'+(wi+1)+'</strong></td><td class="n"><strong>'+w.jobs+'</strong></td><td class="n"><strong>'+w.qty+'</strong></td></tr>';
    html+='</table>';
  }
  document.getElementById('resume-days-panel').innerHTML=html;
}

function renderAtelierStats(month){
  var iD=loadD('inspection');var iR=(iD[month]||[]).filter(function(r){return r.type==='entry';});if(!iR.length)return '';
  var totalQty=0;
  var empI={};iR.forEach(function(r){var n=r.nom||'Inconnu';if(!empI[n])empI[n]={cmds:0,qty:0,moulage:0,serie:0,inv:0,err:0};empI[n].cmds++;var q=parseInt(r.qty)||1;empI[n].qty+=q;totalQty+=q;var it=(r.item||'').toUpperCase();if(it.indexOf('MOULAGE')>=0)empI[n].moulage++;if(it==='SÉRIE')empI[n].serie++;if(it==='INVENTAIRE')empI[n].inv++;if(r.hasError)empI[n].err++;});
  var errEntries=iR.filter(function(r){return r.hasError;});
  var html='<div class="stats-grid">';
  /* Tableau employés */
  html+='<div class="c-card"><div class="c-card-h gold">🔧 Atelier — '+gml(month)+' — '+iR.length+' jobs — '+totalQty+' unités</div><table class="c-tbl"><tr><th>Employé</th><th class="n">Jobs</th><th class="n">Qté</th><th class="n">Moul.</th><th class="n">Sér.</th><th class="n">Inv.</th><th class="n" style="color:var(--danger)">Err</th></tr>';
  var tot={c:0,q:0,m:0,s:0,i:0,e:0};Object.entries(empI).sort(function(a,b){return b[1].cmds-a[1].cmds;}).forEach(function(x){var n=x[0],s=x[1];tot.c+=s.cmds;tot.q+=s.qty;tot.m+=s.moulage;tot.s+=s.serie;tot.i+=s.inv;tot.e+=s.err;html+='<tr><td style="font-weight:600;">'+esc(n)+'</td><td class="n">'+s.cmds+'</td><td class="n">'+s.qty+'</td><td class="n">'+s.moulage+'</td><td class="n">'+s.serie+'</td><td class="n">'+s.inv+'</td><td class="n" style="color:'+(s.err?'var(--danger)':'inherit')+'">'+s.err+'</td></tr>';});
  html+='<tr><td><strong>Total</strong></td><td class="n"><strong>'+tot.c+'</strong></td><td class="n"><strong>'+tot.q+'</strong></td><td class="n"><strong>'+tot.m+'</strong></td><td class="n"><strong>'+tot.s+'</strong></td><td class="n"><strong>'+tot.i+'</strong></td><td class="n"><strong style="color:var(--danger)">'+tot.e+'</strong></td></tr></table></div>';
  /* Erreurs */
  html+='<div class="c-card"><div class="c-card-h red">⚠️ Erreurs ('+errEntries.length+')</div>';
  if(errEntries.length){
    var errEmps={};errEntries.forEach(function(r){var n=r.nom||'?';errEmps[n]=(errEmps[n]||0)+1;});
    html+='<div class="err-filter-bar"><label>👤</label><select id="err-filter-emp" onchange="filterErrTable()"><option value="">Tous</option>';Object.entries(errEmps).sort(function(a,b){return b[1]-a[1];}).forEach(function(x){html+='<option value="'+esc(x[0])+'">'+esc(x[0])+' ('+x[1]+')</option>';});
    html+='</select><span class="ct" id="err-count-display">'+errEntries.length+'</span></div><div style="max-height:180px;overflow-y:auto;"><table class="c-tbl" id="err-detail-tbl"><tr><th>Nom</th><th>Date</th><th>Bon</th><th>Raison</th></tr>';
    errEntries.forEach(function(r){html+='<tr data-emp="'+esc(r.nom||'?')+'"><td style="font-weight:600;font-size:9px;">'+esc(r.nom||'?')+'</td><td style="color:var(--text-muted);font-size:9px;">'+esc(r.entryDate||'')+'</td><td style="color:var(--info);font-family:Consolas;font-size:9px;">'+esc(r.bon)+'</td><td style="color:var(--danger);font-size:9px;">'+esc(r.errorReason||'?')+'</td></tr>';});
    html+='</table></div>';
    /* Raisons */
    var byR={};errEntries.forEach(function(r){var re=r.errorReason||'?';byR[re]=(byR[re]||0)+1;});
    html+='<div style="padding:3px 6px;border-top:1px solid rgba(239,68,68,.1);"><table class="c-tbl"><tr><th>Raison</th><th class="n">Nb</th></tr>';
    Object.entries(byR).sort(function(a,b){return b[1]-a[1];}).forEach(function(x){html+='<tr><td style="color:var(--danger);font-size:9px;">'+esc(x[0])+'</td><td class="n">'+x[1]+'</td></tr>';});
    html+='</table></div>';
  }else html+='<div style="padding:10px;text-align:center;color:var(--success);font-size:11px;">✅ Aucune</div>';
  html+='</div>';
  /* Résumé par jour/semaine/mois — en dehors du grid */
  html+='</div>';
  html+=buildResumeSummary(iR,month);
  return html;
}
function renderCoutureStats(month){
  var cD=loadD('couture');var cR=(cD[month]||[]).filter(function(r){return r.type==='entry';});if(!cR.length)return '';
  var totalQty=0;
  var empC={};cR.forEach(function(r){var n=r.nom||'Inconnu';if(!empC[n])empC[n]={t:0,qty:0,recu:0,enCours:0,complet:0,moulage:0,serie:0,inv:0};empC[n].t++;var q=parseInt(r.qty)||1;empC[n].qty+=q;totalQty+=q;var st=r.coutureStatus||'recu';empC[n][st]++;var it=(r.item||'').toUpperCase();if(it.indexOf('MOULAGE')>=0)empC[n].moulage++;if(it==='SÉRIE')empC[n].serie++;if(it==='INVENTAIRE')empC[n].inv++;});
  var html='<div class="c-card"><div class="c-card-h purple">🧵 Couture — '+gml(month)+' — '+cR.length+' jobs — '+totalQty+' unités</div><table class="c-tbl"><tr><th>Employé</th><th class="n">Jobs</th><th class="n">Qté</th><th class="n">Moul.</th><th class="n">Sér.</th><th class="n">Inv.</th><th class="n" style="color:var(--info)">Reçu</th><th class="n" style="color:var(--gold-light)">En cours</th><th class="n" style="color:var(--success)">Complet</th></tr>';
  var tot={t:0,q:0,m:0,s:0,i:0,r:0,ec:0,co:0};Object.entries(empC).sort(function(a,b){return b[1].t-a[1].t;}).forEach(function(x){var n=x[0],s=x[1];tot.t+=s.t;tot.q+=s.qty;tot.m+=s.moulage;tot.s+=s.serie;tot.i+=s.inv;tot.r+=s.recu;tot.ec+=s.enCours;tot.co+=s.complet;html+='<tr><td>'+esc(n)+'</td><td class="n">'+s.t+'</td><td class="n">'+s.qty+'</td><td class="n">'+s.moulage+'</td><td class="n">'+s.serie+'</td><td class="n">'+s.inv+'</td><td class="n" style="color:var(--info)">'+s.recu+'</td><td class="n" style="color:var(--gold-light)">'+s.enCours+'</td><td class="n" style="color:var(--success)">'+s.complet+'</td></tr>';});
  html+='<tr><td><strong>Total</strong></td><td class="n"><strong>'+tot.t+'</strong></td><td class="n"><strong>'+tot.q+'</strong></td><td class="n"><strong>'+tot.m+'</strong></td><td class="n"><strong>'+tot.s+'</strong></td><td class="n"><strong>'+tot.i+'</strong></td><td class="n"><strong>'+tot.r+'</strong></td><td class="n"><strong>'+tot.ec+'</strong></td><td class="n"><strong>'+tot.co+'</strong></td></tr></table></div>';
  html+=buildResumeSummary(cR,month);
  return html;
}
function filterErrTable(){var sel=document.getElementById('err-filter-emp');if(!sel)return;var v=sel.value;var tbl=document.getElementById('err-detail-tbl');if(!tbl)return;var rows=tbl.querySelectorAll('tr[data-emp]');var n=0;rows.forEach(function(tr){if(!v||tr.getAttribute('data-emp')===v){tr.style.display='';n++;}else tr.style.display='none';});var cd=document.getElementById('err-count-display');if(cd)cd.textContent=n;}

function initMonths(){var now=new Date(),ms=[];for(var i=12;i>=-3;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(gmk(d));}var cur=gmk(now);['insp-month','cout-month','stats-month'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=ms.map(function(m){return'<option value="'+m+'"'+(m===cur?' selected':'')+'>'+gml(m)+'</option>';}).join('');});}
function switchTab(tab){document.querySelectorAll('.content').forEach(function(c){c.classList.remove('active');});document.querySelectorAll('.tab').forEach(function(t){t.className='tab';});document.getElementById('tab-'+tab).classList.add('active');document.querySelectorAll('.tab[data-tab="'+tab+'"]').forEach(function(el){if(tab==='inspection')el.classList.add('active-insp');else if(tab==='couture')el.classList.add('active-cout');else if(tab==='stats')el.classList.add('active-stats');});if(tab==='stats')renderStats();else renderTable(tab);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):'';}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'info');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove();},2500);}
function exportCSV(){var tab=document.querySelector('.content.active').id.replace('tab-','');if(tab==='stats'||tab==='resume'){showToast('Inspection/Couture','info');return;}var md=gmd(tab);var entries=(md.rows||[]).filter(function(r){return r.type==='entry';});if(!entries.length){showToast('Vide','info');return;}var isI=tab==='inspection';var hdrs=isI?['Bon','Nom','Qté','Item','Client','Inspecteur','Erreur','Raison','Notes']:['Bon','Nom','Qté','Item','Client','Couturière','Statut','Notes'];var lines=[hdrs.join(',')];entries.forEach(function(e){if(isI)lines.push([e.bon,e.nom,e.qty,e.item,e.client,e.inspecteur,e.hasError?'Oui':'Non','"'+(e.errorReason||'')+'"','"'+(e.description||'')+'"'].join(','));else lines.push([e.bon,e.nom,e.qty,e.item,e.client,e.inspecteur,e.coutureStatus||'recu','"'+(e.description||'')+'"'].join(','));});var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='physipro_'+tab+'_'+gmk()+'.csv';a.click();URL.revokeObjectURL(url);showToast('📊','success');}
